repos:
  # Python linting and formatting
  # Must track the `ruff` pin in uv.lock. Dependabot manages `uv`, `github-actions` and
  # `terraform` only, so THIS rev is unmanaged and will drift unless bumped by hand. When the
  # two disagree, `uv run ruff` and the commit hook give different verdicts on the same file —
  # measured 2026-08-12, where 0.16.1 accepted 9 handlers that 0.15.22 rejected under BLE001.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Terraform formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt

  # YAML linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
        exclude: ^workflow-cards/  # YAML frontmatter + Markdown body (not pure YAML)
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^src/tests/fixtures/action_context/  # AC-1 hexagon's IDSSE anchor fixtures (frames.parquet 2.5MB) -- intentionally committed for local-runnability + differential vs legacy oracles (ADR-028)
      - id: check-merge-conflict

  # Secret scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # SQL linting (dbt models)
  # Disabled: sqlfluff requires dbt templater context to parse jinja macros.
  # - repo: https://github.com/sqlfluff/sqlfluff
  #   rev: 3.3.1
  #   hooks:
  #     - id: sqlfluff-lint
  #       files: ^dbt_project/models/
