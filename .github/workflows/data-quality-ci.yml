name: Data Quality CI

# Live-warehouse data quality tests that validate schema parity, FK resolution
# rates, cross-reference invariants, and model prediction bounds. These tests
# hit the real Databricks SQL warehouse and are deliberately excluded from
# python-ci.yml (which tests code, not data state).
#
# Includes the former bronze-live-schema.yml scope (Mode 1 + Mode 4 gates)
# plus Kimball contract, xref invariant, xg bounds, and PAUSA compliance tests.

on:
  push:
    branches: [main]
    paths:
      - "src/ingestion/**"
      - "dbt_project/models/**"
      - "tests/data_quality/**"
      - "src/tests/coverage_utils.py"
      - ".github/workflows/data-quality-ci.yml"
  schedule:
    # Daily at 08:00 UTC — after lakebase-grants.yml runs at 07:00 UTC so
    # any index / grant drift is self-healed before the parity check runs.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> Databricks SP token exchange (replaces the retired PAT)

concurrency:
  group: data-quality-ci
  cancel-in-progress: false

jobs:
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Live github-oidc credential, re-minted by the SDK per request — no token is
      # materialised (ADR-071 amendment). This job only ever passed because it finishes
      # in ~4m50s, inside the ~5-minute life of the bearer the old mint step snapshotted;
      # its sibling workflows, which run longer, failed daily from 2026-07-22.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dbt packages (force-include prerequisite)
        env:
          DATABRICKS_HOST: https://example.databricks.com
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummywarehouseid0
          DATABRICKS_TOKEN: dummy
        run: uvx --from "dbt-core==1.11.14" dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: Install dependencies
        run: uv sync --frozen --extra analytics

      # databricks-sql-connector is deliberately NOT in pyproject extras
      # (test-only dep). Install ad-hoc so pytest.importorskip passes.
      # databricks-sdk is added here so the OIDC token-mint step below can run
      # via `uv run` (this workflow syncs only --extra analytics).
      - name: Install databricks-sql-connector (ad-hoc, not in pyproject)
        run: uv pip install databricks-sql-connector databricks-sdk

      - name: Run data quality tests
        env:
          DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
          # DATABRICKS_HOST + github-oidc come from the job env; no token is materialised.
          BRONZE_SCHEMA: soccer_analytics.bronze
          STAGING_SCHEMA: soccer_analytics.dev_silver
        run: |
          uv run pytest \
            tests/data_quality/ \
            -v --tb=short --no-header

      - name: Report
        if: always()
        run: echo "::notice::Data quality CI completed. Check pytest output above for violations."
