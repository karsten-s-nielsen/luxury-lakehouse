name: Terraform Apply

# Auto-apply on push to main when terraform/ files change.
# The plan was already reviewed during the PR (terraform-plan.yml);
# this workflow executes the approved changes.

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/patch_job_retries.py"
      - ".github/workflows/terraform-apply.yml"

env:
  TF_WORKING_DIR: terraform/environments/dev
  AWS_REGION: us-east-1
  TF_VAR_databricks_host: ${{ vars.DATABRICKS_HOST }}
  TF_VAR_databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
  TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
  DATABRICKS_AUTH_TYPE: github-oidc

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      # ── Synced-table state-drift guard ──────────────────────────────────
      # Synced tables are UI-created and imported into state. The Databricks
      # provider occasionally drops them during refresh (transient API 404),
      # which causes TF to plan a "create" that fails with "Database instance
      # is not found" (Autoscaling projects don't support the create API).
      # This guard catches the symptom and aborts with a clear re-import hint
      # instead of auto-approving a doomed create.
      - name: Terraform Plan (synced-table drift guard)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.log
          if grep -q 'synced_database_table.*will be created' plan.log; then
            echo "::error::Synced table(s) dropped from TF state during refresh. Re-import required — see terraform/modules/synced_tables/main.tf header."
            grep 'synced_database_table.*will be created' plan.log
            exit 1
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -no-color tfplan

      # ── Post-apply: enforce max_retries via REST API ──────────────────────
      # The Databricks TF provider (Go omitempty) silently drops max_retries=0.
      # This step patches compute tasks to 0 retries while keeping ingestion
      # tasks at 1 retry (transient external failures benefit from retry).
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Acquire Databricks token via OIDC
        id: databricks_token
        run: |
          set -euo pipefail
          pip install -q databricks-sdk
          TOKEN=$(python -c "
          import os
          from databricks.sdk import WorkspaceClient
          ws = WorkspaceClient(
              host=os.environ['DATABRICKS_HOST'],
              client_id=os.environ['DATABRICKS_CLIENT_ID'],
              auth_type='github-oidc',
          )
          auth = ws.config.authenticate()
          print(auth['Authorization'].replace('Bearer ', ''))
          ")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Patch job retry settings
        env:
          DATABRICKS_TOKEN: ${{ steps.databricks_token.outputs.token }}
        run: |
          pip install -q requests
          python scripts/patch_job_retries.py
