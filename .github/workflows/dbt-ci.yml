name: dbt CI

on:
  pull_request:
    paths:
      - "dbt_project/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: dbt deps
        working-directory: dbt_project
        run: uv run dbt deps

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run dbt parse
        env:
          DBT_PROFILES_DIR: .
          # CI target uses in-memory DuckDB for syntax validation only
          # Full build against Databricks happens in staging/prod
