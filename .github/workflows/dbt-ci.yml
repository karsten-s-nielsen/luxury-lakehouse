name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dbt

      - name: Create CI profiles.yml
        working-directory: dbt_project
        run: |
          cat > profiles.yml << 'PROFILES'
          databricks:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: soccer_analytics
                schema: ci
                host: "ci-placeholder.cloud.databricks.com"
                http_path: "/sql/1.0/warehouses/ci-placeholder"
                token: "dapi-ci-placeholder"
                threads: 1
          PROFILES

      - name: dbt deps
        working-directory: dbt_project
        run: uv run dbt deps --profiles-dir .

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run dbt parse --profiles-dir .
