name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fetch main branch for dbt state comparison on PRs
      - name: Fetch main branch for slim CI
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dbt

      - name: Create CI profiles.yml
        working-directory: dbt_project
        run: |
          cat > profiles.yml << 'PROFILES'
          databricks:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: soccer_analytics
                schema: ci
                host: "ci-placeholder.cloud.databricks.com"
                http_path: "/sql/1.0/warehouses/ci-placeholder"
                token: "__CI_PLACEHOLDER__"
                threads: 1
          PROFILES

      - name: dbt deps
        working-directory: dbt_project
        run: uv run dbt deps --profiles-dir .

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run dbt parse --profiles-dir .

      # Generate manifest from main branch for state comparison on PRs
      - name: Generate main branch manifest (PR only)
        if: github.event_name == 'pull_request'
        working-directory: dbt_project
        run: |
          git stash --include-untracked
          git checkout origin/main -- .
          uv run dbt deps --profiles-dir .
          uv run dbt parse --profiles-dir .
          mkdir -p target-main
          cp target/manifest.json target-main/manifest.json
          git checkout - -- .
          git stash pop || true

      # Schema-only validation of modified models (zero-cost DDL check)
      - name: dbt build --empty (modified models, PR only)
        if: github.event_name == 'pull_request'
        working-directory: dbt_project
        run: uv run dbt build --empty --select state:modified+ --defer --state target-main --profiles-dir .
