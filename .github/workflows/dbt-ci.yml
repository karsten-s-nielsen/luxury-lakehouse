name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"

permissions:
  contents: read

# Cancel superseded runs on the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Databricks connection for dbt — used by env_var() in profiles.yml.
      # dbt parse needs NO live connection, but dbt-databricks HANGS (6h CI timeout)
      # when the token is EMPTY: it falls through to `authenticate_with_external_browser`
      # and blocks waiting for a browser. A non-empty PLACEHOLDER keeps it on the PAT
      # path, so `dbt parse` runs fully offline (verified: parse succeeds with a fake
      # token + http_path, no connection made). The real PAT was retired workspace-wide
      # (2026-07-21) and was never used here anyway — `dbt build --empty` (the only step
      # needing a live connection) is not run in CI (see NOTE at the end of this file);
      # the live build runs via OIDC in dbt-live-ci.yml. So a constant placeholder is
      # correct on every event (push / PR / dependabot / fork).
      # Hostname is a public URL, not sensitive — lives in repo vars.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH || '/sql/1.0/warehouses/ci-parse-placeholder' }}
      DATABRICKS_TOKEN: dbt-ci-parse-placeholder  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch main branch for dbt state comparison on PRs
      - name: Fetch main branch for slim CI
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python 3.12
        run: uv python install 3.12

      # D59: --no-install-project skips the editable install of luxury-lakehouse
      # itself. The wheel force-include bundles dbt_project/dbt_packages/ (gitignored)
      # which fails at build time if absent. dbt-ci only needs dbt-core from the
      # extra, not luxury-lakehouse's Python code, so skipping the project install
      # sidesteps the force-include entirely.
      - name: Install dependencies
        run: uv sync --frozen --extra dbt --no-install-project

      - name: dbt deps
        working-directory: dbt_project
        run: uv run --no-sync dbt deps --profiles-dir .

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run --no-sync dbt parse --profiles-dir .

      # Generate manifest from main branch for state comparison on PRs
      - name: Generate main branch manifest (PR only)
        if: github.event_name == 'pull_request'
        working-directory: dbt_project
        run: |
          # Switch to main's content for a baseline parse. `git checkout
          # origin/main -- .` only restores files that exist in main, so
          # PR-added files (new staging models, new source YAML entries)
          # remain in the working tree and cause parse failures when they
          # reference sources/refs that main doesn't have yet. Explicitly
          # remove the PR-added files before parse. `git diff --name-only`
          # emits repo-root-relative paths, so we run the rm from the repo
          # root via a subshell that doesn't leak to the outer cwd.
          git stash --include-untracked
          ( cd "$(git rev-parse --show-toplevel)" && \
            git diff --name-only --diff-filter=A origin/main..HEAD | xargs -r rm -f )
          git checkout origin/main -- .
          uv run --no-sync dbt deps --profiles-dir .
          uv run --no-sync dbt parse --profiles-dir .
          mkdir -p target-main
          cp target/manifest.json target-main/manifest.json
          git checkout ${{ github.sha }} -- .
          git stash pop || true

      # NOTE: dbt build --empty (schema contract validation via DDL) is NOT run
      # in CI. The Databricks serverless SQL warehouse Thrift endpoint is not
      # reachable from GitHub Actions runners — the databricks-sql-connector
      # hangs on OpenSession for 900s then times out. Investigated 2026-04-03:
      # IP allowlists are disabled (feature unavailable on this pricing tier),
      # workspace is publicly accessible (REST API works), but the Thrift
      # transport layer cannot establish a session. Schema contracts are
      # validated locally via `dbt build --empty` before every commit.
      # Revisit when: self-hosted runner available, or Databricks fixes
      # serverless Thrift connectivity from public CI runners.
