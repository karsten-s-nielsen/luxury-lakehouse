name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dbt

      - name: Create CI profiles.yml
        working-directory: dbt_project
        run: |
          cat > profiles.yml << 'PROFILES'
          databricks:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: soccer_analytics
                schema: ci
                host: "ci-placeholder.cloud.databricks.com"
                http_path: "/sql/1.0/warehouses/ci-placeholder"
                token: "dapi-ci-placeholder"
                threads: 1
          PROFILES

      - name: dbt deps
        working-directory: dbt_project
        run: uv run dbt deps --profiles-dir .

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run dbt parse --profiles-dir .
