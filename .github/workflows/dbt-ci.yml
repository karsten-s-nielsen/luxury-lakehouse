name: dbt CI

on:
  pull_request:
    paths:
      - "dbt_project/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: dbt deps
        working-directory: dbt_project
        run: uv run dbt deps

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run dbt parse
        env:
          DBT_PROFILES_DIR: .
          # CI target uses in-memory DuckDB for syntax validation only
          # Full build against Databricks happens in staging/prod
