name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "dbt_project/**"
      - ".github/workflows/dbt-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Databricks connection for dbt — used by env_var() in profiles.yml.
      # Empty when secrets are unavailable (forks, external PRs); dbt parse
      # still works (no connection needed).
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fetch main branch for dbt state comparison on PRs
      - name: Fetch main branch for slim CI
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dbt

      - name: dbt deps
        working-directory: dbt_project
        run: uv run dbt deps --profiles-dir .

      - name: dbt parse (validate SQL)
        working-directory: dbt_project
        run: uv run dbt parse --profiles-dir .

      # Generate manifest from main branch for state comparison on PRs
      - name: Generate main branch manifest (PR only)
        if: github.event_name == 'pull_request'
        working-directory: dbt_project
        run: |
          git stash --include-untracked
          git checkout origin/main -- .
          uv run dbt deps --profiles-dir .
          uv run dbt parse --profiles-dir .
          mkdir -p target-main
          cp target/manifest.json target-main/manifest.json
          git checkout ${{ github.sha }} -- .
          git stash pop || true

      # NOTE: dbt build --empty (schema contract validation via DDL) is NOT run
      # in CI. The Databricks serverless SQL warehouse Thrift endpoint is not
      # reachable from GitHub Actions runners — the databricks-sql-connector
      # hangs on OpenSession for 900s then times out. Investigated 2026-04-03:
      # IP allowlists are disabled (feature unavailable on this pricing tier),
      # workspace is publicly accessible (REST API works), but the Thrift
      # transport layer cannot establish a session. Schema contracts are
      # validated locally via `dbt build --empty` before every commit.
      # Revisit when: self-hosted runner available, or Databricks fixes
      # serverless Thrift connectivity from public CI runners.
