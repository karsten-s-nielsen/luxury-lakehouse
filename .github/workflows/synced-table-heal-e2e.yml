name: Synced-Table Heal E2E (serverless)

# The ONLY test that exercises the live destructive self-heal path (PG ghost drop, CDF ensure, real
# checkpoint reset). The deterministic offline unit suite + the real-event classifier fixture are the
# merge gates; this proves the destructive path end-to-end on a schedule.
#
# NOT a PR gate: it drives live Databricks DLT + Lakebase, mutates real infra, and takes ~6-30 min
# (the 2026-06-10 Databricks rollout made post-CREATE-OR-REPLACE reconciliation sit in
# ONLINE_UPDATING_PIPELINE_RESOURCES for 10+ min). That makes it a poor per-PR blocking check.
# It runs nightly to catch drift and on-demand via workflow_dispatch (run it manually on
# heal-core changes).
#
# T-mechanism semantics (2026-06-10, twice re-designed same day): the CREATE-OR-REPLACE test
# asserts CONVERGE-OR-HEAL — the platform now STRANDS a plain create-or-replace (XXKST; proven
# live + on production fct_pausa_values), so the test runs the REAL heal on the strand signal,
# asserts HEALED, and passes on PG row convergence (deadline 1800s). If it ever converges
# WITHOUT the heal, the platform reverted to strand-free — the test passes but logs loudly to
# re-characterise ADR-043 amendment 2.
#
# Re-characterised 2026-06-07: the checkpoint-mismatch strand reproduces only when the synced table
# already has a COMMITTED streaming offset (the test does one incremental CDF sync before recreating
# the source); an initial-snapshot-only table is re-snapshotted cleanly on a source-id change. The
# test detects the strand via is_checkpoint_mismatch_failure (the heal's own preflight signal), not by
# waiting for SYNCED_TABLE_ONLINE_PIPELINE_FAILED — that status lags ~13 min behind the first update
# failure (DLT retries with backoff). A red here means the strand stopped reproducing despite the
# committed offset (a genuine DLT behaviour change to re-characterise), NOT a heal-code regression.
#
# Triggers:
#   - nightly 04:00 UTC (well clear of the 06:00 ingestion job / 07:00 maintenance)
#   - manual dispatch (run after a heal-core change to prove the live path)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> Databricks SP token exchange (replaces the retired PAT)

concurrency:
  group: synced-table-heal-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      RUN_SERVERLESS_TESTS: "1"
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      # Live github-oidc credential, re-minted by the SDK per request. This job is the
      # reason the old "mint once into $GITHUB_ENV" pattern had to go: `Run heal e2e` is a
      # SINGLE step polling for 12-15 min, so no per-step re-mint could have bounded it --
      # the bearer died mid-poll and wait_until_online logged 403 Invalid Token every cycle
      # until the timeout. An explicit github-oidc also disambiguates the oauth-vs-pat pair
      # (#489) that the old `pat` pin existed to resolve.
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      # Lakebase host is derived from the Databricks REST API (ADR-041) — no LAKEBASE_HOST var needed.
      # HEAL_E2E_SCHEMA is the ONLY operator input: a disposable UC schema for the throwaway synced
      # table this test creates/breaks/heals. Recommended value: heal_e2e (see docs/engineering/conventions.md).
      HEAL_E2E_SCHEMA: ${{ vars.HEAL_E2E_SCHEMA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required config
        run: |
          for v in DATABRICKS_HOST DATABRICKS_CLIENT_ID DATABRICKS_HTTP_PATH HEAL_E2E_SCHEMA; do
            if [ -z "${!v}" ]; then echo "::error::$v is required for the heal e2e"; exit 1; fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Materialize dbt packages (required before uv sync)
        env:
          DATABRICKS_HOST: https://example.databricks.com
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummywarehouseid0
          DATABRICKS_TOKEN: dummy  # pragma: allowlist secret
        run: uvx --from "dbt-core==1.11.12" dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: Install sdk dependencies
        run: uv sync --frozen --extra sdk

      # No mint step: the job-level DATABRICKS_AUTH_TYPE=github-oidc gives this long
      # single-step poll a live, self-refreshing credential.

      - name: Run heal e2e
        run: uv run pytest src/tests/test_synced_table_heal_e2e.py -v --tb=short --no-header

      # Token-freshness regression. Asserts the SDK actually REFRESHED -- not merely that a
      # later call succeeded, which would pass vacuously on a frozen bearer if Databricks
      # ever lengthened the token lifetime. Also logs the measured lifetime, which is the
      # number the 2026-07-27 investigation could only bound to (4:12, 5:13].
      # Hosted here because this is the only workflow already running longer than the sleep.
      #
      # if: always() -- credential lifetime is an INDEPENDENT invariant from whether DLT
      # reconciles a synced table in time. Gating this on `Run heal e2e` made the one
      # measurement that closes the lifetime question hostage to platform weather: the
      # 2026-07-28 run skipped it because the e2e hit a leaked-pipeline repro poisoning,
      # which has nothing to do with auth.
      - name: Token-freshness regression (must outlive the token lifetime)
        if: always()
        run: |
          uv run python -c "
          from datetime import datetime
          import time
          from databricks.sdk import WorkspaceClient

          ws = WorkspaceClient()
          t0 = ws.config.oauth_token()
          ttl = (t0.expiry - datetime.now(tz=t0.expiry.tzinfo)).total_seconds()
          print(f'::notice::measured OIDC bearer lifetime: {ttl:.0f}s')
          ws.current_user.me()
          time.sleep(420)
          t1 = ws.config.oauth_token()
          assert t1.expiry > t0.expiry, 'token did not refresh -- the SDK returned a frozen bearer'
          ws.current_user.me()
          print('::notice::token refreshed and remained usable after 420s')
          "
