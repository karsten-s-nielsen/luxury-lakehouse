name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra analytics --extra app --extra embeddings --extra mlflow

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Format check with ruff
        run: uv run ruff format --check src/

      - name: Type check with pyright
        run: uv run pyright src/

      - name: Run tests
        run: uv run pytest

      - name: Scan for secrets
        run: uv run pip install detect-secrets && uv run detect-secrets scan --baseline .secrets.baseline

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Generate SBOM (CycloneDX)
        run: uv run pip-audit --format cyclonedx-json -o sbom.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
