name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "workflow-cards/**"
      - "hf_taipy_app/**"
      - "dbt_project/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "workflow-cards/**"
      - "hf_taipy_app/**"
      - "dbt_project/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read
  id-token: write # GitHub OIDC -> Databricks SP token exchange (replaces the retired PAT)

# Cancel superseded runs on the same PR when a new commit is pushed. Main-branch
# pushes keep running to completion so the wheel upload + Databricks deploy
# steps don't get cut off mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Backstop against a hung step holding the main-branch concurrency lock for
    # GitHub's 6h default. A transient Databricks Files API stall in the deploy
    # step (2026-07-22) hung this job ~4.5h and, because main uses
    # cancel-in-progress: false, deadlocked every subsequent main Python CI run
    # behind it. The job normally finishes in ~8-10 min.
    timeout-minutes: 30
    env:
      # SK3-MIG (2026-05-02): silly-kicks 3.0.0+ raises on input-convention mismatches
      # under this flag instead of warning. Production-posture: same as Databricks
      # job env (terraform/modules/workflows/main.tf) — fail-loud on any regression.
      SILLY_KICKS_ASSERT_INVARIANTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      # D59: the luxury-lakehouse wheel's hatchling force-include bundles
      # dbt_project/dbt_packages/ which is gitignored, so it must be materialized
      # BEFORE `uv sync` — because `uv sync` builds an editable install of the
      # current project, which exercises the same force-include and fails with
      # FileNotFoundError if dbt_packages/ is absent. We use `uvx --from` to run
      # dbt-core from a fully isolated uv tool environment that never touches
      # the luxury-lakehouse project (so the failing editable build is bypassed).
      # Placeholder Databricks env vars satisfy profiles.yml env_var() rendering;
      # `dbt deps` itself never contacts the warehouse.
      - name: Install dbt packages (for wheel force-include, must precede uv sync)
        env:
          DATABRICKS_HOST: https://example.databricks.com
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummywarehouseid0
          DATABRICKS_TOKEN: dummy
        run: uvx --from "dbt-core>=1.10.0,<1.12.0" dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: Install dependencies
        run: uv sync --frozen --extra analytics --extra embeddings --extra mlflow --extra jax

      - name: Lint with ruff
        run: uv run ruff check src/ scripts/

      - name: Format check with ruff
        run: uv run ruff format --check src/ scripts/

      - name: Type check with pyright
        run: uv run pyright src/ hf_taipy_app/src/

      - name: Import boundary check
        run: uv run lint-imports

      # Mint a short-lived workspace token via GitHub OIDC (reuses the repo-wide
      # terraform_ci SP federation policy — terraform/modules/service_principals/main.tf)
      # and export it as DATABRICKS_TOKEN for the live tests + wheel deploy below.
      # Replaces the retired stored PAT (workspace moved off PATs 2026-07-21).
      # Same-repo PRs get id-token: write (proven by terraform-plan.yml on PR);
      # fork PRs get neither and are auto-closed by close-fork-prs.yml.
      - name: Acquire Databricks token via OIDC
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_AUTH_TYPE: github-oidc
        run: |
          set -euo pipefail
          TOKEN=$(uv run python -c "
          import os
          from databricks.sdk import WorkspaceClient
          ws = WorkspaceClient(
              host=os.environ['DATABRICKS_HOST'],
              client_id=os.environ['DATABRICKS_CLIENT_ID'],
              auth_type='github-oidc',
          )
          print(ws.config.authenticate()['Authorization'].replace('Bearer ', ''))
          ")
          if [ -z "$TOKEN" ]; then echo "::error::OIDC token mint returned empty"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "DATABRICKS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
          # DATABRICKS_TOKEN inherited from $GITHUB_ENV (OIDC mint step above).
        run: uv run pytest

      - name: Validate workflow cards
        run: uv run validate_workflow_cards workflow-cards/

      - name: Build wheel
        run: uv build --wheel

      - name: Check wheel version consistency
        run: uv run python scripts/bump_wheel.py --check

      - name: Upload wheel to HF Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run python -c "
          import hashlib, json
          from pathlib import Path
          from huggingface_hub import HfApi
          from shared.wheel import WHEEL_FILENAME, WHEEL_REPO

          api = HfApi()
          repo_id = WHEEL_REPO
          repo_type = 'model'
          wheel_path = Path('dist') / WHEEL_FILENAME

          if not wheel_path.exists():
              raise FileNotFoundError(f'Expected {wheel_path} — is pyproject.toml version in sync with shared/wheel.py?')

          # Upload wheel
          api.upload_file(path_or_fileobj=str(wheel_path), path_in_repo=WHEEL_FILENAME, repo_id=repo_id, repo_type=repo_type)
          print(f'Uploaded {WHEEL_FILENAME}')

          # Compute and upload SHA-256 sidecar
          sha256 = hashlib.sha256(wheel_path.read_bytes()).hexdigest()
          manifest = json.dumps({'filename': WHEEL_FILENAME, 'sha256': sha256}, indent=2)
          api.upload_file(path_or_fileobj=manifest.encode(), path_in_repo='sha256sums.json', repo_id=repo_id, repo_type=repo_type, commit_message=f'Update SHA-256 for {WHEEL_FILENAME}')
          print(f'SHA-256: {sha256}')

          # Clean up old-version wheels (keep only current)
          all_files = api.list_repo_files(repo_id=repo_id, repo_type=repo_type)
          stale = [f for f in all_files if f.startswith('luxury_lakehouse-') and f.endswith('.whl') and f != WHEEL_FILENAME]
          for old in stale:
              api.delete_file(path_in_repo=old, repo_id=repo_id, repo_type=repo_type, commit_message=f'Remove stale wheel {old}')
              print(f'Deleted stale: {old}')
          "

      # Deploy wheel to Databricks UC Volume so jobs pick up the latest code.
      # Uses the Databricks SDK Files API (REST) — not Thrift, so it works
      # from GitHub Actions runners. Only runs on main pushes (not PRs).
      - name: Deploy wheel to Databricks
        # The Files API upload/get_metadata calls carry no client-side timeout,
        # so a transient network stall (observed 2026-07-22) hangs the step
        # indefinitely. Fail fast instead — deploy normally takes ~1 min.
        timeout-minutes: 8
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Hostname is a public URL, not sensitive — repo var (see dbt-ci.yml note).
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          # DATABRICKS_TOKEN inherited from $GITHUB_ENV (OIDC mint step above).
        run: uv run python scripts/deploy_wheel.py

      - name: Scan for secrets
        run: uv run pip install detect-secrets && uv run detect-secrets scan --baseline .secrets.baseline

      - name: Audit dependencies
        # CVE-2026-4539 (pygments), CVE-2026-0545 (mlflow), CVE-2026-33866 (?)  — no upstream fix yet.
        # CVE-2026-28684 (python-dotenv 1.0.1): taipy-gui>=4.1 pins python-dotenv>=1.0.0,<=1.0.1; cannot upgrade to 1.2.2 without breaking taipy-app. Track upstream; revisit when taipy-gui 4.2+ lands with a relaxed pin.
        # CVE-2026-3219 (pip 26.0.1, GHSA-58qw-9mgm-455v, medium): pip interpretation conflict handling both concatenated tar and ZIP files as ZIP. No patched version as of 2026-04-24. Not exploitable in this pipeline — we only install from trusted PyPI via uv; no attacker-controlled package sources. Revisit when pip ships a fix.
        # CVE-2026-6357 (pip 26.0.1): fix in 26.1. pip is uv-managed build tool, not a runtime dependency. Not exploitable — uv manages all installs. Revisit when uv ships pip 26.1+.
        # CVE-2026-44307 (mako 1.3.10): fix in 1.3.12. Transitive dep via dbt-core/alembic. Not directly exploitable — mako templates are developer-authored, not user-supplied. Revisit when dbt-core bumps alembic.
        # PYSEC-2024-271 (flask-cors 6.0.2): transitive dep via mlflow. Not directly exploitable — no user-facing CORS in this pipeline. Revisit when mlflow bumps flask-cors.
        # PYSEC-2024-277 (joblib 1.5.3): transitive dep via scikit-learn. Not exploitable — no untrusted pickle loading. Revisit when scikit-learn bumps joblib.
        # PYSEC-2026-113 (pyarrow 19.0.1): fix in 23.0.1. Pinned by databricks-connect/pyspark compatibility. Not exploitable — all Parquet files are self-authored via bronze writers. Revisit when databricks-connect supports pyarrow 23+.
        # PYSEC-2025-183 (pyjwt 2.12.1): transitive dep. Not exploitable — no JWT validation in pipeline code; only Databricks SDK uses it for auth. Revisit when upstream bumps.
        # PYSEC-2026-161 (starlette 0.52.1): transitive dep via Gradio/Taipy. Fix in 1.0.1. Not exploitable — starlette is not used directly; only as ASGI server inside HF Spaces. Revisit when Gradio bumps starlette.
        # CVE-2025-58367 + CVE-2026-33155 (deepdiff 7.0.1): transitive dep via taipy-common, which caps deepdiff <8 (fix is 8.6.2), so it cannot be floored without dropping Taipy 4.1.1. Not exploitable — deepdiff only diffs Taipy-internal config/state, never untrusted input. Revisit when Taipy bumps deepdiff. (Listed by CVE alias; the advisory's PYSEC alias may also appear depending on the DB snapshot.)
        # PYSEC-2026-3447 (setuptools 81.0.0): fix in 83.0.0. Transitive dep via torch/sympy. Cannot be floored to >=83 without downgrading torch 2.11.0 -> 2.10.0 (hard conflict; pinning torch makes the resolution unsatisfiable). Not exploitable — this is a package-BUILD-path vuln and the lakehouse wheel builds via hatchling, so setuptools never builds untrusted packages at runtime. Revisit when torch 2.11+ accepts setuptools 83.
        run: >-
          uv run pip-audit
          --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-0545 --ignore-vuln CVE-2026-33866
          --ignore-vuln CVE-2026-28684 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357
          --ignore-vuln CVE-2026-44307
          --ignore-vuln PYSEC-2024-271 --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-113 --ignore-vuln PYSEC-2025-183
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln CVE-2025-58367 --ignore-vuln CVE-2026-33155
          --ignore-vuln PYSEC-2026-3447

      - name: Generate SBOM (CycloneDX)
        run: >-
          uv run pip-audit --format cyclonedx-json
          --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-0545 --ignore-vuln CVE-2026-33866
          --ignore-vuln CVE-2026-28684 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357
          --ignore-vuln CVE-2026-44307
          --ignore-vuln PYSEC-2024-271 --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-113 --ignore-vuln PYSEC-2025-183
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln CVE-2025-58367 --ignore-vuln CVE-2026-33155
          --ignore-vuln PYSEC-2026-3447
          -o sbom.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
