name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "workflow-cards/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "workflow-cards/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra analytics --extra app --extra embeddings --extra mlflow

      - name: Lint with ruff
        run: uv run ruff check src/ scripts/

      - name: Format check with ruff
        run: uv run ruff format --check src/ scripts/

      - name: Type check with pyright
        run: uv run pyright src/

      - name: Run tests
        run: uv run pytest

      - name: Validate workflow cards
        run: uv run python -m workflows.loader --validate workflow-cards/

      - name: Build wheel
        run: uv build

      - name: Upload wheel to HF Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run pip install huggingface_hub
          uv run python -c "
          from huggingface_hub import HfApi
          import glob
          api = HfApi()
          wheels = glob.glob('dist/luxury_lakehouse-*.whl')
          for whl in wheels:
              api.upload_file(path_or_fileobj=whl, path_in_repo=whl.split('/')[-1], repo_id='luxury-lakehouse/build-artifacts', repo_type='model')
              print(f'Uploaded {whl}')
          "

      - name: Scan for secrets
        run: uv run pip install detect-secrets && uv run detect-secrets scan --baseline .secrets.baseline

      - name: Audit dependencies
        run: uv run pip-audit --ignore-vuln CVE-2026-4539  # pygments 2.19.2 — no fix available yet

      - name: Generate SBOM (CycloneDX)
        run: uv run pip-audit --format cyclonedx-json --ignore-vuln CVE-2026-4539 -o sbom.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
