name: v2 CI

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

# A feature branch is validated by its PR (pull_request); main is validated on merge (push on main only). This stops
# the duplicate run a branch push + its PR produced for the same commit. The concurrency group then cancels a
# superseded run when a new commit lands on the same PR or branch.
concurrency:
  group: v2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: v2 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: v2
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync the locked environment
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports
      - name: pytest (default tier)
        run: uv run pytest -m "not live and not hf and not bench"
        env:
          # the OS tests install and remove a real user-level task of this runner's OS (plan Task 24)
          LAKEHOUSE_OS_TESTS: "1"
      - name: pip-audit
        run: uv run python scripts/pip_audit.py
