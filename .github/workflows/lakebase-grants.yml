name: Lakebase Maintenance (Ownership + Grants + Indexes)

# Self-healing Lakebase synced-table maintenance. Runs FOUR idempotent
# passes in sequence — all four are the canonical hooks for any synced
# table added to `ingestion.refresh_synced_tables.SYNCED_TABLES`:
#
#   1. `fix_event_log_ownership.py --skip-trigger-refresh` — re-sets
#      pipeline `event_log_*` table ownership to `dbt-owners-{env}` after
#      a UI recreation transfers it to whoever performed the recreate.
#      Without this, the ingestion SP cannot trigger pipeline refreshes.
#      Idempotent (already_correct entries are no-op).
#   2. `run_lakebase_grants.py` — re-applies PG SELECT grants. See
#      docs/superpowers/adrs/ADR-005-lakebase-synced-table-grants.md for why
#      auto-inherit via pg_default_acl is structurally unavailable and this
#      scheduled re-apply is the canonical compensating control.
#   3. `grant_synced_table_permissions.py` — re-applies workspace-API CAN_RUN
#      on each synced table's backing pipeline (and CAN_USE on the database
#      project). Closes the same drift class as step 2 but on the workspace
#      ACL surface, not the PG schema surface. After UI recreation,
#      pipeline_ids change AND ownership transfers — both reset workspace
#      ACLs to default. The daily Databricks job's `refresh_synced_tables`
#      task and the Taipy admin endpoint's pipeline-refresh path both
#      require CAN_RUN. Without this step, those tasks 403 silently after
#      every UI recreation. See docs/superpowers/adrs/ADR-020-lakebase-canrun-autoheal.md.
#   4. `create_indexes.py --verify` — re-applies PG indexes (IF NOT EXISTS)
#      and EXPLAIN-ANALYZE-verifies Index Scan plans. Synced-table
#      recreation drops custom indexes; a daily rebuild restores them
#      before the first dashboard query hits Seq Scan.
#
# Coverage invariant: any new synced table added to
# `ingestion.refresh_synced_tables.SYNCED_TABLES` is auto-covered by all
# three steps on the next daily run — no hand-wiring required.
#
# Triggers (all three by design — coverage before blame):
#   1. schedule: daily 07:00 UTC — one hour after the 06:00 UTC
#      `data_ingestion` job starts, giving its `dbt_build` + `refresh_synced_tables`
#      tasks time to finish. Catches drift from dbt table-materialization drops.
#   2. workflow_run: chained after "Terraform Apply" on main — any TF change
#      touching the synced_tables module can recreate PG tables and drop
#      their grants + indexes. Only runs when the upstream workflow succeeded.
#   3. workflow_dispatch: manual trigger for incident response.
#
# Required repo configuration (one-time):
#   - secrets.DATABRICKS_TOKEN        Admin PAT with Lakebase admin role
#   - vars.DATABRICKS_HOST            Workspace hostname (with https://)
#   - vars.HF_APP_SP_APPLICATION_ID   = terraform output -raw hf_app_sp_application_id
#                                       (Taipy app SP UUID — single source of truth)

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Verify drift without applying grants"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply_grants:
    # Skip on failed upstream runs — if Terraform Apply failed, there may
    # be no tables to grant against, and we shouldn't mask the upstream
    # failure with grant-apply noise.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}  # pragma: allowlist secret
      HF_APP_SP_APPLICATION_ID: ${{ vars.HF_APP_SP_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate required config
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::DATABRICKS_HOST (var) and DATABRICKS_TOKEN (secret) are required"
            exit 1
          fi
          if [ -z "$HF_APP_SP_APPLICATION_ID" ]; then
            echo "::error::vars.HF_APP_SP_APPLICATION_ID is required — set it from \`terraform output -raw hf_app_sp_application_id\`"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      # The luxury-lakehouse wheel's hatchling force-include bundles
      # dbt_project/dbt_packages/ which is gitignored. `uv sync` builds an
      # editable install of the current project and fails with
      # "Forced include not found" unless dbt_packages/ is materialized first.
      # Same pattern as python-ci.yml — uvx runs dbt-core from an isolated
      # environment that never touches this project. Placeholder Databricks
      # env vars satisfy profiles.yml env_var() rendering; `dbt deps` itself
      # never contacts the warehouse.
      - name: Materialize dbt packages (required before uv sync)
        env:
          DATABRICKS_HOST: https://example.databricks.com
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/dummywarehouseid0
          DATABRICKS_TOKEN: dummy  # pragma: allowlist secret
        run: uvx --from "dbt-core>=1.10.0,<1.12.0" dbt deps --project-dir dbt_project --profiles-dir dbt_project

      - name: Install sdk dependencies
        run: uv sync --frozen --extra sdk

      # Step 1: Fix event_log_* pipeline-metadata ownership drift. When a
      # synced table is recreated via the Databricks UI, the pipeline's
      # `event_log_*` table gets owned by the user who recreated it
      # instead of the `dbt-owners-{env}` group. The ingestion SP then
      # cannot trigger refreshes. Idempotent — already_correct = no-op.
      # `--skip-trigger-refresh` because refresh is handled by the daily
      # Databricks ingestion job (starts 06:00 UTC, finishes well before
      # this 07:00 UTC cron).
      - name: Fix event log ownership
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          uv run python scripts/fix_event_log_ownership.py \
              --skip-trigger-refresh

      - name: Apply Lakebase grants
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          uv run python scripts/run_lakebase_grants.py \
              --sp-uuid "$HF_APP_SP_APPLICATION_ID"

      # Step 3: Re-apply workspace-API CAN_RUN on each synced table's backing
      # pipeline (and CAN_USE on the database project). Step 2 (above) handles
      # the PG-side SELECT grants; this step handles the workspace-side ACL
      # surface that the Lakebase Refresh API checks. Both surfaces drift after
      # a UI recreation. Idempotent — granting an existing permission is a
      # no-op; the script's --status mode is the way to verify state.
      # ADR-020 (PR-Cycle-C PR-β, 2026-05-02) — empirical motivation: 2026-05-01
      # 403s on UI-recreated career + season embedding synced tables.
      - name: Apply synced-table workspace permissions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          uv run python scripts/grant_synced_table_permissions.py

      - name: Verify grant coverage
        run: |
          uv run python scripts/run_lakebase_grants.py \
              --verify \
              --sp-uuid "$HF_APP_SP_APPLICATION_ID"

      # Index maintenance runs idempotently: `CREATE INDEX IF NOT EXISTS` on
      # every entry in scripts/create_indexes.py:INDEXES. --verify runs
      # EXPLAIN ANALYZE on a representative query per table and reports
      # drift (Seq Scan where an Index Scan is expected). Like grants, this
      # self-heals after synced-table recreation drops the custom indexes.
      - name: Apply Lakebase indexes
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_only != true }}
        run: |
          uv run python scripts/create_indexes.py --verify

      - name: Verify index coverage (verify_only mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only == true }}
        run: |
          uv run python scripts/create_indexes.py --verify

      # PR-Cycle-B (2026-05-01): asserts every entry in
      # ingestion.refresh_synced_tables.SYNCED_TABLES is in
      # SYNCED_TABLE_ONLINE_NO_PENDING_UPDATE state. Catches the
      # OFFLINE_FAILED class that hit career/season embedding tables in
      # session 17 / session 43-44 / session 69 — each time discovered
      # via dashboard staleness instead of at deploy time.
      - name: Verify all synced tables online
        run: |
          uv run pytest tests/data_quality/test_synced_tables_online.py -v --tb=short --no-header
