name: Terraform Plan

on:
  # Plan is a PR-review tool only. On push-to-main, terraform-apply.yml runs
  # and publishes its own plan inline, so a parallel Plan job adds no new
  # signal AND races Apply for the S3 state lock (412 PreconditionFailed).
  # See the merge of PR #131 where the post-merge Plan job failed with a
  # state-lock error while Apply succeeded.
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

env:
  TF_WORKING_DIR: terraform/environments/dev
  AWS_REGION: us-east-1
  TF_VAR_databricks_host: ${{ vars.DATABRICKS_HOST }}
  TF_VAR_databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
  TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  # No TF_VAR_databricks_client_secret — empty default triggers OIDC fallback
  DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
  DATABRICKS_AUTH_TYPE: github-oidc

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Cancel superseded PR runs. This workflow is PR-only, so no main-branch
# carve-out is needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.10"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: Comment Plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan', {
              cwd: '${{ env.TF_WORKING_DIR }}'
            }).toString();

            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan\n<details>\n<summary>Show plan output</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n</details>`
            });
