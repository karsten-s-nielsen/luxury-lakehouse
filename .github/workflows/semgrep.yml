name: Semgrep SAST

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "hf_taipy_app/**"
      - ".github/workflows/semgrep.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "hf_taipy_app/**"
      - ".github/workflows/semgrep.yml"

permissions:
  contents: read

# Cancel superseded runs on the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Semgrep
        run: pip install semgrep==1.156.0

      - name: Run Semgrep (Python security + general audit)
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --error \
            --metrics=off \
            src/ scripts/ hf_taipy_app/
