name: dbt live CI

# Live dbt build via a Databricks one-shot Job. Complements dbt-ci.yml (parse-only).
# Closes the gap where runtime SQL errors merged to main undetected in PR 3.
# See docs/superpowers/plans/2026-04-23-kimball-pr4-live-ci.md for design.
#
# Cost note (2026-05-07): moved from per-PR trigger to daily schedule to reduce
# SQL Warehouse costs. Each run wakes the serverless warehouse for 10-30 min at
# $0.70/DBU (4 DBU/hr) — 50+ CI runs in one week drove $15-25 of unnecessary
# spend. Parse-only dbt-ci.yml still runs on every PR for syntax/ref safety.
# Use workflow_dispatch for on-demand pre-merge live validation when needed.

on:
  schedule:
    - cron: "0 9 * * *"            # Daily 09:00 UTC — after lakebase-grants (07:00)
  workflow_dispatch:
    inputs:
      select_override:
        description: "Override --select arg (e.g. 'state:modified+' or '+all')"
        type: string
        default: "+all"

permissions:
  contents: read
  id-token: write                   # GitHub OIDC -> Databricks SP token exchange

# Only one live build at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  live-build:
    runs-on: ubuntu-latest
    # Workflow-level ceiling. trigger_dbt_job.py enforces its own 30-minute poll
    # budget (120 * 15s); the extra 10 minutes covers checkout, uv sync, tarball
    # packaging, OIDC exchange, and the failure-comment path.
    timeout-minutes: 40
    env:
      # Non-secret public workspace host lives in repo vars; OIDC client id too.
      # Same pattern as terraform-apply.yml.
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_AUTH_TYPE: github-oidc
      # Required by dbt-databricks profiles.yml env_var() calls at parse time.
      # The Databricks trigger step uses OIDC (via DATABRICKS_AUTH_TYPE), so this
      # static token is consumed ONLY by dbt parse on the runner (no live connection).
      # A non-empty placeholder is required (empty -> browser-auth hang); the real PAT
      # was retired workspace-wide (2026-07-21) and was never used here.
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: dbt-live-ci-parse-placeholder  # pragma: allowlist secret
      # SK3-MIG (2026-05-02): silly-kicks 3.0.0+ raises on input-convention mismatches
      # under this flag instead of warning. Production-posture: same as Databricks
      # job env (terraform/modules/workflows/main.tf) — fail-loud on any regression.
      SILLY_KICKS_ASSERT_INVARIANTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      # The `dbt` extra already pulls databricks-sdk>=0.102.0 (see pyproject.toml),
      # so no separate SDK install is required. --no-install-project skips the
      # editable install of luxury-lakehouse itself, matching dbt-ci.yml.
      - name: Install dependencies
        run: uv sync --frozen --extra dbt --no-install-project

      - name: Generate manifest
        working-directory: dbt_project
        run: |
          uv run --no-sync dbt deps --profiles-dir .
          uv run --no-sync dbt parse --profiles-dir .

      # target/, target-main/, and dbt_packages/ are regenerated inside the
      # Databricks shim; excluding them keeps the tarball small.
      - name: Package dbt_project
        run: |
          tar -czf /tmp/dbt_project.tar.gz \
            --exclude='dbt_project/target' \
            --exclude='dbt_project/target-main' \
            --exclude='dbt_project/dbt_packages' \
            dbt_project/
          ls -la /tmp/dbt_project.tar.gz

      # The job that runs on Databricks executes a COPY of scripts/ci/run_dbt_in_databricks.py
      # living at /Workspace/Shared/luxury-lakehouse-ci/, not the file in this checkout.
      # That copy was uploaded once by hand (2026-04-23) and then drifted for three months:
      # the 2026-07-28 nightly still ran the retired `install_dbt()`, resolving dbt 1.11.8
      # from a range while the manifest above was written by 1.11.12 -- the exact producer/
      # consumer skew that ADR-046's dbt lockstep exists to prevent, failing with
      # `Field "macros" ... in WritableManifest has invalid value`.
      #
      # Uploading here makes the deployed shim a function of the commit, so editing the
      # repo file is sufficient to change job behaviour. The uploader is idempotent
      # (overwrite=True) and takes no arguments.
      - name: Deploy dbt shim to Workspace Files
        run: uv run --no-sync python scripts/upload_ci_shim.py

      # No token step: DATABRICKS_AUTH_TYPE=github-oidc at job level gives every
      # WorkspaceClient a live, self-refreshing credential. The retired step minted a
      # bearer into $GITHUB_OUTPUT and passed it as --token; that bearer lives ~299s
      # (measured 2026-07-27) and the poll below runs up to 30 min.

      # Daily scheduled run: full build (+all) validates the entire graph.
      # Manual dispatch: use select_override input for targeted validation.
      - name: Trigger Databricks dbt run
        id: trigger
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SELECT_ARG="${{ inputs.select_override || '+all' }}"
          echo "select_arg=${SELECT_ARG}"
          uv run --no-sync python scripts/trigger_dbt_job.py \
            --pr-number 0 \
            --commit-sha "${SHORT_SHA:0:7}" \
            --tarball /tmp/dbt_project.tar.gz \
            --manifest dbt_project/target/manifest.json \
            --select-arg "${SELECT_ARG}" \
            --host "${{ vars.DATABRICKS_HOST }}" \
            --volume-prefix "/Volumes/soccer_analytics/dev_gold/ci_dbt/daily-${SHORT_SHA:0:7}" \
            > /tmp/trigger_result.json
          cat /tmp/trigger_result.json
