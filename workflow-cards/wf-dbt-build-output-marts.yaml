## Overview

Stage 3 of the three-stage dbt_build topology introduced by ADR-019. Builds
the output marts plus every staging/intermediate model not already built by
stages 1+2. Selector (ADR-019 amended 2026-06-04): `--select +tag:output_mart
path:models/staging path:models/intermediate --exclude +tag:input_mart
+tag:dimension +tag:intermediate_mart`. The original `tag:output_mart` (no `+`,
no staging/intermediate paths) orphaned staging VIEWS that feed only an output
mart (e.g. `stg_action_context__values`) or have no dbt consumer but are read
externally (e.g. `stg_pitch_control__values`) — they were selected by no stage,
never rebuilt, and went schema-stale. Full coverage is now enforced by
`src/tests/test_dbt_stage_selector_coverage.py`.

`refresh_synced_tables` and `run_model_validation` are SIBLINGS depending on
this stage — both children of `dbt_build_output_marts`. A validation
regression cannot transitively block today's synced-table refresh, preserving
ADR-017's "signal not gate" intent via topology rather than via stale reads
(supplants ADR-017's pre-three-stage yesterday-gold workaround).

See `docs/superpowers/adrs/ADR-019-three-stage-dbt-build.md`.
