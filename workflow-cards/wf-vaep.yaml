## Overview

VAEP (Valuing Actions by Estimating Probabilities) converts raw event data into the SPADL
action representation, then trains gradient-boosted classifiers to predict scoring and
conceding probabilities. Each action's value is the change in expected outcome it produces.

## Algorithm

Events are first converted to SPADL (Soccer Player Action Description Language), a
unified action format. Two XGBoost models predict P(score in next 10 actions) and
P(concede in next 10 actions). An action's offensive value is the delta in scoring
probability; defensive value is the delta in conceding probability. Training runs on
HF Jobs; inference processes games sequentially on the Databricks driver.
