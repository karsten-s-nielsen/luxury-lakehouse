## Overview

Shot Stopping is the goalkeeper's Goals Prevented (== GSAA — Goals Saved Above Average): the sum of
Post-Shot xG faced minus goals conceded, per `(match, defending keeper)`, reported with and without
in-play penalties. It covers every provider whose shots carry a Post-Shot xG (the tracking providers via
the trajectory model, StatsBomb via the freeze-frame model — both unified in `fct_shot_psxg`).

This is a **methodology / governance card** for the silly-kicks 4.120.0 `shot_stopping.compute_shot_stopping`
family (TF-59). The materialising ADR-013 writer (`src/ingestion/shot_stopping_writer.py`) reads
`bronze.spadl_actions`, LEFT-joins the gold Post-Shot xG fact `fct_shot_psxg` per shot, derives the
defending keeper's team from a per-match `player_id -> team_id_native` map, computes the metric per keeper,
and lands it in `bronze.shot_stopping` for dbt to re-source the three GK marts. It is scheduled into the
daily job via the `inference` execution phase above (entry point `shot_stopping_writer`, `analytics`
environment), running after the SPADL/VAEP + PSxG producers.

## Algorithm

`compute_shot_stopping` gates shots on Post-Shot xG presence (the on-target gate), excludes own goals /
blocked shots / the penalty shootout, and groups on the CANONICAL keeper id (fixing cross-provider
keeper-id fragmentation where a keeper's id appears in mixed dtypes). Goals Prevented = `psxg_faced -
goals_conceded`; the `_excl_penalties` companions re-run the aggregate excluding in-play penalties. Native
`(match_id, player_id, team_id)` are emitted and resolved to Kimball surrogates (`match_key` / `player_key`)
in dbt. The computation is deterministic — no trained weights of its own (the Post-Shot xG it consumes is
governed under `wf-goalkeeper`).

## Governance

Shot Stopping is **per-keeper evaluative**; per [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 it is in
scope as a goalkeeper-valuation family, not-high-risk under the current operating posture. The HONEST
LIMIT: GSAA is low-sample per match (avg ~1 on-target shot faced), so the per-match mart is a drill-down
detail — the evaluative surface is the pooled layer (`fct_gk_shot_stopping_pooled`), which ships raw
Goals Prevented with a closed-form Poisson-binomial band and DEFERS the percentile leaderboard until the
cohort clears the ranking floor (currently false everywhere).
