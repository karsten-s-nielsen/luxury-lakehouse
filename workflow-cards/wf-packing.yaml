## Overview

Packing quantifies the number of opposing defenders a pass or carry takes out of the
game ("bypasses") between the ball's origin and destination. It is a per-action
attacking-progression metric that originated commercially as **Packing** at IMPECT GmbH
(Reinartz & Hegeler, c. 2015) and was formalized academically by Goes, Kempe, Meerhoff &
Lemmink (2019), whose peer-reviewed model measures pass effectiveness via the longitudinal
outplayed-defender inequality this implementation realizes.

This is a **methodology / governance card**. Packing is a deterministic column emitted
by the silly-kicks action-context drain (governed operationally by
[`wf-action-context`](wf-action-context.yaml)), not by a separate scheduled task — this
card exists to carry the family's academic provenance and EU-AI-Act posture per the
AI governance chain, in the same way `wf-obso-pausa`/`wf-defcon` govern their
drain-adjacent families.

## Algorithm

For each on-ball action, the defenders positioned in the geometric region between the
ball's start and end locations (relative to the defending goal) are counted; `packing_net`
is the net count of defenders taken out of play. The computation is deterministic and
frame-geometry-based — no trained weights.

## Governance

Packing is **per-player evaluative** (it credits the passer and, by extension, the
receiver). See [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 for the full risk
classification and the not-high-risk-under-current-posture determination.
