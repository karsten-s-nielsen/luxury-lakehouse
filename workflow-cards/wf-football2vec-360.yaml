## Overview

Football2Vec 360-Enriched extends the v2 transformer architecture with a Deep Sets
encoder (Zaheer et al. 2017) that processes StatsBomb 360 freeze-frame context — the
spatial positions of all visible opponents and teammates at the moment of each action.
The resulting 144-dimensional embedding (128d transformer + 16d Deep Sets) captures
both a player's individual action sequences and their spatial relationship to surrounding
players, providing richer representations than event-only models.

Training covers 323 StatsBomb 360 matches (the full open-data 360 corpus). Adversarial
team debiasing via gradient reversal (Ganin et al. 2016) removes team-identity confounds,
producing style representations that generalize across teams. This model occupies a
separate embedding space from Football2Vec v2 and is not directly comparable to v2
vectors.

## Architecture

- Token embedding: 23 SPADL action types → 128d
- Spatial encoding: MLP(x) + MLP(y) → 128d each, summed with token embedding
- 4-layer transformer encoder, 4 attention heads, GELU activation
- Mean pooling over valid tokens → 128d player-match embedding (transformer stream)
- Deep Sets encoder on freeze-frame coordinates → 16d context embedding
- Concatenation: [128d transformer || 16d Deep Sets] → 144d output
- Stage 2: gradient reversal layer with team classifier head (lambda=0.2)
