## Overview

Expected Threat (xT) quantifies the goal-scoring threat of possessing the ball at any
pitch location. This workflow computes transition probability matrices from SPADL actions
and iteratively solves for the xT value at each grid cell.

## Algorithm

The pitch is discretized into a 16x12 grid. Move transition probabilities and shot
probabilities are estimated from SPADL actions. The xT surface is solved via iterative
value propagation: each cell's value is the weighted sum of shooting value and the
expected value of moving to adjacent cells. Convergence typically occurs within 10
iterations.
