## Overview

The Freshness Gate is a centralized skip guard orchestrator that runs as the root task
in the Databricks ingestion job. It calls all 29 SkipGuard adapters via the guard
registry, determines which workflows have new data to process, and emits SKIPPED
records for idle workflows. Per-guard timing is logged for performance monitoring.

## Algorithm

For each registered guard, the gate calls `check(spark, catalog, schema)` which
returns a `FilterResult(workflow_id, count, chunks, metadata)`. Guards with `count=0`
get a SKIPPED record merged into `workflow_cost_live`. Results are written as
Databricks task values for downstream consumption. The gate runs in the `default`
environment (wheel only) since guards use only Spark SQL.
