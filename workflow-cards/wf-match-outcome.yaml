## Overview

Match Outcome is the per-`(match, team)` win-probability simulation: from the injected per-shot xG it
computes `p_win` / `p_draw` / `p_loss`, `xpoints` (expected league points), and `expected_goals` via an
exact Poisson-binomial core, with two orthogonal honesty corrections — possession-collapse and
Dixon-Coles team dependence — both ON by default. It is event-only across every event provider.

This is a **methodology card** for the silly-kicks 4.120.0 `match_outcome.compute_match_outcome` family
(TF-53). The materialising ADR-013 writer (`src/ingestion/match_outcome_writer.py`) reads
`bronze.spadl_actions`, LEFT-joins per-shot xG from `bronze.xg_shot_predictions`, simulates the outcome
per team, and lands it in bronze for dbt to join into the wide-by-granularity team-match mart
`fct_team_metrics`. It is scheduled into the daily job via the `inference` execution phase above (entry
point `match_outcome_writer`, `analytics` environment), running after the SPADL/VAEP + xG producers.

## Algorithm

`compute_match_outcome` integrates the per-shot xG into a goal-count Poisson-binomial PMF per team, then
computes the win/draw/loss simplex + xPoints. The Dixon-Coles dependence correction (Dixon & Coles 1997)
adjusts low-scoreline joint probabilities. Native `(match_id, team_id)` are emitted and resolved to
Kimball surrogates in dbt. Deterministic given the input xG — no trained weights of its own.

## Governance

Match Outcome is **per-team**, not per-player-evaluative: the win probabilities describe the team's
match result, never an individual player. It is therefore excluded from the
`PER_PLAYER_EVALUATIVE_CARDS` inventory and carries no EU-AI-Act model card
(see [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6).
