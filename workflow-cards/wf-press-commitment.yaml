## Overview

Press Commitment measures how hard the nearest defending player commits to pressing the
ball carrier, as a signed projection of the defender's velocity onto the axis toward the
carrier. Positive values are a defender closing down; a retreating defender is
legitimately negative, so the physical invariant is a bounded magnitude
(`|press_commitment_closing_speed| ≤ 15 m/s`), not non-negativity.

This is a **methodology / governance card**. Press commitment is a deterministic column
emitted by the silly-kicks action-context drain (governed operationally by
[`wf-action-context`](wf-action-context.yaml)), not by a separate scheduled task — this
card carries the family's EU-AI-Act posture per the AI governance chain.

## Algorithm

For each on-ball action with tracking, the nearest defending player to the ball carrier is
identified, and their velocity vector is projected onto the unit axis pointing from the
defender to the carrier: `v_close = vx·axis[0] + vy·axis[1]`. The computation is
deterministic and frame-geometry-based — no trained weights.

## Governance

Press commitment is **per-player evaluative** (it evaluates the pressing defender). See
[`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 for the full risk classification and the
not-high-risk-under-current-posture determination.
