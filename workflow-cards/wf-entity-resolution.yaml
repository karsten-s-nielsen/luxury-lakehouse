## Overview

Entity Resolution matches player identities across StatsBomb and Wyscout data sources,
producing a cross-reference table that enables unified player analytics. This is a
prerequisite for any cross-source model (e.g., Football2Vec embeddings).

## Algorithm

Players are matched using fuzzy string matching on names, combined with exact matching on
shared match participation. The algorithm first identifies overlapping competitions, then
resolves players within those competitions using a weighted scoring system that considers
name similarity, birth date proximity, and positional consistency.
