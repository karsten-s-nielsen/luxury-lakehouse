## Overview

xT-GK v2 values a goalkeeper's distribution (passes and throws) as the change in expected
possession value it produces, netted against the empirical cost of a turnover. It replaces
the retired in-repo v1 `add_xt_gk` metric (16 columns + 5 philosophy presets) with a
fitted three-part model:

1. **MarkovPossessionValue** — a possession-value surface fit on the gold action corpus.
2. **EmpiricalTurnoverValue** — an empirically-fit turnover cost.
3. **GkRetentionModel** — a bundled retention model (per-provider variant), shipped in the
   wheel.

The possession-value surface and turnover cost are **fitted** by
`scripts/train_xt_gk_v2_hf.py` (ADR-012, HF Jobs) and delivered to a UC Volume as a single
JSON envelope; the ADR-013 writer `src/ingestion/xt_gk_v2_writer.py` loads the fitted
bundle and scores `xt_gk_v2` per GK-distribution action into bronze, which dbt joins into
`fct_action_context` as a mart-join column set (six columns registered in the mart
contract only — the AC drain never emits them, per the ADR-013 / xG-style two-tier split).

## Algorithm

For each GK-distribution action the writer pre-filters to `is_gk_distribution` rows,
overrides coordinates with the resolved keeper geometry (`apply_resolved_gk_geometry`),
extracts retention features, and calls `compute_xt_gk_v2` with the pooled possession-value
and turnover surfaces plus the per-provider retention model. Coordinate coherence
(resolve → features → score) is enforced by the metric's internal guard. The fitted
surfaces are never refit at score time — `pressure_levels` round-trips in the envelope so
the terciles match the corpus the surface was fit on.

## Governance

xT-GK v2 is **per-player evaluative** (per-goalkeeper distribution value). Accepted
consequences at adoption: the five v1 philosophy presets have no v2 successor (a capability
regression documented in the adoption spec), and the v2 possession-value surface is not
independently construct-validated. See [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 for
the full risk classification and the not-high-risk-under-current-posture determination.
