## Overview

Expected Goals v1 trains a logistic regression classifier with isotonic calibration on
StatsBomb and Wyscout shot data, then applies the model to all competitions via
Databricks serverless. The model predicts the probability that a shot results in a goal
based on spatial and contextual features.

## Algorithm

Features include shot distance, angle, body part, and play pattern. The classifier uses
isotonic calibration (Platt scaling variant) to produce well-calibrated probability
estimates. Training uses the HuggingFace Hub dataset for reproducibility; inference
distributes across executors via `applyInPandas` grouped by competition.
