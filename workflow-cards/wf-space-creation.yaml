## Overview

Space Creation quantifies each player's contribution to opening valuable space for
teammates through off-ball movement. It uses pitch control surfaces and EPV grids to
measure the counterfactual value of a player's spatial influence.

## Algorithm

For each tracking frame, pitch control is computed with and without each off-ball player.
The difference in EPV-weighted controlled space measures how much valuable territory each
player creates through their positioning and movement. GPU acceleration on HF Jobs
enables batch processing of entire matches in under a minute.
