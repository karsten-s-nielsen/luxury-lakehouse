## Overview

Pitch Control computes probability surfaces indicating which team controls each location
on the pitch at every tracking frame. It is a foundational model consumed by OBSO, PAUSA,
space creation, and off-ball xT workflows.

## Algorithm

The physics-based model uses player positions, velocities, and a time-to-intercept function
to estimate each player's influence over every grid cell. The probability that a team
controls a cell is the sum of its players' influence values divided by the total influence.
Computation is distributed via `applyInPandas` with synthetic `frame_batch_id` partitions
to stay within the 1 GB UDF memory limit.
