## Overview

Model & Pipeline Validation runs daily after all upstream workflows complete, checking
model predictions against baseline metrics for drift detection. It validates xG
calibration, VAEP distributions, and PAUSA value ranges, writing structured validation
results to Delta for monitoring.

## Algorithm

For each model, the validator computes key metrics (Brier score, ROC-AUC, mean predictions)
and compares them against stored baselines. Warn and alert thresholds trigger notifications
when metrics drift beyond acceptable ranges. The validation run itself is idempotent via
upsert on run_id, allowing safe re-execution.
