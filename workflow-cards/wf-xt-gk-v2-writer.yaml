## Overview

`xt_gk_v2_writer` turns the fitted xT-GK v2 model into the consumable per-action fact
`bronze.xt_gk_v2_predictions`. It reads the v2-free corpus `bronze.spadl_action_context`,
pre-filters to `is_gk_distribution` rows, overrides coordinates with the persisted resolved
keeper geometry (`apply_resolved_gk_geometry`), extracts retention features, and calls
`compute_xt_gk_v2` with the pooled MarkovPossessionValue + EmpiricalTurnoverValue surfaces
(loaded from the UC Volume envelope) plus the per-provider bundled `GkRetentionModel`. It
writes one row per GK-distribution action; dbt joins the six v2 columns into
`fct_action_context` via `stg_xt_gk_v2` (a mart-join column set — the AC drain never emits
them, per the ADR-013 / xG-style two-tier split).

## Governance split

This is the **inference-materialization** card. The xT-GK v2 methodology, model card, HF
Jobs trainer (`scripts/train_xt_gk_v2_hf.py`), and EU-AI-Act posture are consolidated under
[`wf-xt-gk-v2`](wf-xt-gk-v2.yaml) (`governed_by`), mirroring the
`wf-xg-v2` / `wf-shot-xg-scorer` split. Because it materialises rather than introduces
methodology, this card is deliberately **not** a member of `PER_PLAYER_EVALUATIVE_CARDS` and
carries no separate HuggingFace model card. The fitted bundle is an artifact dependency
delivered out-of-band to the UC Volume (like `xg_model_v3`); the only orchestration edge is
the action-context drain that produces the geometry columns.
