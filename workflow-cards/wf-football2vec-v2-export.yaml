## Overview

Reads per-player-match SPADL action sequences from `fct_action_values`, joins
`dim_players` to resolve `canonical_player_id` and `position_group`, serializes
action tuples as a struct array in Parquet, writes to a UC Volume staging path,
and publishes the dataset to HF Hub as `luxury-lakehouse/football2vec-training-data`.

This export is the upstream dependency of the Football2Vec v2 transformer training
job (`wf-football2vec-v2`). It must be re-run whenever action-value data is updated
or a new data source is added to the pipeline.

## Output Schema

One row per player-match:

| Column | Type | Description |
|--------|------|-------------|
| `canonical_player_id` | string | Resolved player identity |
| `match_id` | string | Match identifier |
| `competition_id` | int | Competition identifier |
| `season_id` | int | Season identifier |
| `position_group` | string (nullable) | Positional role (FW/MF/DF/GK) |
| `actions` | array\<struct\> | Ordered SPADL tuples: action_type (0–22), x (0–1), y (0–1), result (0/1) |

Action types use the standard SPADL 23-type vocabulary. Coordinates are normalized
to [0, 1]. Result is binary (1 = success, 0 = otherwise).
