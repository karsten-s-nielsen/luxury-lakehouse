  drain:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: compute_tracking_marts_drain_worker
    module: ingestion.tracking_marts_drain
    distribution: fan-out
    schedule: "daily 06:00 UTC"
    timeout: "28800s"
    environment: analytics
  # The fan-in completeness gate (run_if = ALL_DONE): reads the work queue + the per-unit event log + all
