    - match_id
    - period_id
  description: >-
    CROSS-RUN, succeeded-only skip-guard: a unit is "done" when it has a `succeeded` terminal in
    tracking_marts_unit_events under ANY run_id. A failed / timed_out / never-run unit stays OPEN.
    N3 OPERATOR FOOT-GUN: because "done" is a cross-run event (NOT output-left_anti), truncating or
    dropping any of the four output bronze tables leaves its units marked done — daily incremental runs
