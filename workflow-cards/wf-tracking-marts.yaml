  verification:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: verify_tracking_marts_drain
    module: ingestion.tracking_marts_gate
    distribution: driver-bound
    schedule: "daily 06:00 UTC"
    timeout: "3600s"
    environment: analytics
  # The single-driver gkdv pooling reduce (runs AFTER the gate). gkdv pooling is cross-game — a keeper's
  # deltas are pooled over every game they played — so it CANNOT run per-unit inside the drain. Reads
  # bronze.gkdv_observations, pools per keeper x (competition, season), writes bronze.gkdv_keeper_pooled.
  pooling:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: compute_gkdv_pool
    module: ingestion.tracking_marts_drain
    distribution: driver-bound
    schedule: "daily 06:00 UTC"
    timeout: "3600s"
    environment: analytics

dbt_model: fct_off_ball_runs

idempotency:
  strategy: skip-guard
  key:
