execution:
  # The 8-way for_each worker-drain (ADR-037/068 fan-out reuse via drain_name-generalized adapters).
  # Each worker drains its slice of observability.tracking_marts_work_queue: per unit it builds oriented
  # (actions, frames, xt) ONCE and runs all three scorers (off-ball runs / defensive credit / gkdv) with
