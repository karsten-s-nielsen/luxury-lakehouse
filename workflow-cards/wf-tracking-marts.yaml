## Overview

The **tracking-marts drain** consolidates the three formerly driver-sequential tracking-grain
writers — off-ball runs (`off_ball_runs_writer`), defensive credit (`defensive_credit_writer`),
and GKDV (`gkdv_writer`) — into ONE worker-drain that reuses the proven AC-1 fan-out core
(ADR-037 worker-drain + ADR-068 unit-events completeness gate) through the `drain_name`-generalized
adapters in `ingestion.action_context_queue`.

Each of the three writers used to reconstruct the oriented `(actions, frames, xt)` per tracking
work unit independently and run driver-side to completion, so they chronically timed out and
shipped empty. The drain builds those inputs ONCE per unit and runs all three scorers, writing
each output with a per-unit `replaceWhere`, so the work parallelises across `_N_TRACKING_MARTS_WORKERS`
(8) persistent workers and completes within budget.

## Phases

1. **`preflight_tracking_marts`** (pure orchestration, no card) — discovers OPEN units via the
   CROSS-RUN `succeeded`-only skip-guard, LPT-bin-packs them into the work queue, and emits the
   constant worker-id list + run_id as task values.
2. **`drain`** (`compute_tracking_marts` for_each) — the 8-way worker-drain; `TrackingMartsProcessor.process(unit)`
   builds inputs once and runs the three scorers per unit.
3. **`verification`** (`verify_tracking_marts_drain`) — the ADR-068 completeness gate over the work
   queue + per-unit event log + all four output bronze tables.
4. **`pooling`** (`compute_gkdv_pool`) — the single-driver, cross-game gkdv `pool_keepers` reduce.

## Governance

Off-ball runs, defensive credit, and GKDV are all **per-player evaluative** metrics. See
[`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 for the risk classification and the
not-high-risk-under-current-posture determination.
