## Overview

Cross-cutting **detect-and-alert** backstop (ADR-063 H4). For every workflow that records a
Delta-version watermark in `observability.workflow_watermarks`, the monitor compares the recorded
watermark against the upstream table's *current* data version and emits an ERROR-level alert when a
workflow's output lags its upstream — i.e. a derived artifact has gone stale.

This is the safety net that would have caught the 2-month-stale `global` xT grid (the negative-DZV
root cause) in week 1. It covers all freshness tiers, including the deferred Tier B (expensive model
retrains) and the Tier C per-id pipelines that otherwise rely on a human remembering to wipe-and-
recompute after an upstream re-derivation.

## Behaviour

Read-only: scans the watermarks table, reads `DESCRIBE HISTORY` for each distinct upstream, and logs
one ERROR per stale `(workflow, upstream)` pair. No table is written and nothing is rebuilt —
alerting is orthogonal to any auto-rebuild trigger. ERROR-level logging is the alert sink per
CLAUDE.md (warning-level telemetry is invisible to error-log queries).
