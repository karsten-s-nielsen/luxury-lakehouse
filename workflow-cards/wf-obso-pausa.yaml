## Overview

This workflow computes Off-Ball Scoring Opportunity (OBSO) surfaces on GPU via HF Jobs,
then runs PAUSA (Pass Timing) inference on Databricks. OBSO quantifies the value of
space not currently occupied by the ball; PAUSA measures the optimal timing of passes
by comparing actual pass moments to counterfactual alternatives.

## Algorithm

OBSO combines pitch control surfaces with EPV grids to estimate the scoring opportunity
at every pitch location. The GPU computation vectorizes across all frames in a match.
PAUSA extends OBSO by evaluating pass timing: for each actual pass, it computes OBSO
values at surrounding frames to determine whether the passer waited optimally or
released too early/late.
