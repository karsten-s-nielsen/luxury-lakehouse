references:
  - citation: "Metrica Sports Open Data. https://github.com/metrica-sports/sample-data"
    role: dataset

inputs:
  datasets:
    - id: "Metrica Sports GitHub Open Data"
      source: huggingface
      description: "Metrica Sports sample tracking and event data (3 games)"

