## Overview

Downloads and ingests Metrica Sports sample tracking and event data for 3 games
from the Metrica open-data GitHub repository. Games 1-2 use CSV format; Game 3
uses FIFA EPTS format. Tracking data is reshaped from wide to narrow format.
