  tables:
    - id: "{catalog}.bronze.metrica_tracking"
      destination: delta-table
    - id: "{catalog}.bronze.metrica_events"
      destination: delta-table

execution:
  ingestion:
    trigger: manual
    runtime: databricks-workflow
    entry_point: ingest_metrica
    module: ingestion.metrica
    distribution: driver-bound
    timeout: "900s"
    environment: analytics

