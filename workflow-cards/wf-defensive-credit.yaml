## Overview

Defensive Credit attributes xG-weighted defensive value to individual defenders for the
actions that suppress a scoring opportunity — blocks, interceptions, and pressure on
shot- or cross-resulting-in-shot events. It produces two grains: a per-action
defending-team aggregate (`fct_action_defensive`) and a long-form per-(action, player,
rule) attribution table (`fct_defensive_credit_attributions`).

This is a **methodology / governance card** for the silly-kicks 4.87.0 defensive-credit
family. The materialising ADR-013 writer (`src/ingestion/defensive_credit_writer.py`)
reads bronze action-context + `bronze.xg_shot_predictions`, applies the deterministic
credit rules, and writes bronze → dbt staging → the two contract-enforced gold marts.
It is scheduled into the daily job via the `inference` execution phase above (entry point
`defensive_credit_writer`, `analytics` environment), running after the action-context drain
and the xG scorer.

## Algorithm

`add_defensive_credit` scores the defending team's credit per action from the resolved
frame geometry, the shot outcome (`shot_blocked` / `shot_on_target_derived`), and the
per-shot xG of the shot the action prevented or contested. `compute_defensive_credits`
emits the same signal in long form, one row per (action, credited player, rule), with an
`anchor_type` / `sizing` / `resolution` vocabulary. The rules are deterministic — no
trained weights.

The per-event rules engine is silly-kicks-native (TF-51), anchored to a practitioner source
(Sumpter, *Soccermatics Pro*, module 16.3). Its published component is the xT(origin)
turnover-sizing precedent — Bischofberger, Bauer & Baca (2026), *"Blame is easier than
praise"* (arXiv:2606.19931) — which derives `xDT = -dxT → +xT(origin)` for a failed pass and
validates the fault/contribution metrics against player market value and FIFA
defensive-awareness ratings. This is distinct from the DEFCON counterfactual estimator
(Kim et al. 2025), which is a comparator, not this engine.

## Governance

Defensive credit is **per-player evaluative** (per-defender attribution). See
[`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 for the full risk classification and the
not-high-risk-under-current-posture determination.
