## Overview

Ground Duels is the per-`(match, player)` Glicko-2 rating of a player's ground-duel win/loss record. It is
an event-only metric covering every event provider (StatsBomb / Wyscout / IDSSE / Metrica / SkillCorner /
GradientSports).

This is a **methodology / governance card** for the silly-kicks 4.120.0 `duels.compute_duel_ratings` family
(TF-55). The materialising ADR-013 writer (`src/ingestion/duels_writer.py`) reads `bronze.spadl_actions`
and runs `compute_duel_ratings` as a **stateful single-driver ordered pass** — ratings carry forward across
matches in ascending `game_id` (each match is one Glicko rating period), so it is deliberately NOT a
per-match `applyInPandas` (whose groups are unordered and would reset the seed each match). It lands the
per-`(match, player)` ratings in `bronze.duels` for dbt to join into the wide-by-granularity player-match
mart `fct_player_match_metrics` (shared with `territory`). It is scheduled into the daily job via the
`inference` execution phase above (entry point `duels_writer`, `analytics` environment), running after the
SPADL/VAEP producer.

## Algorithm

`compute_duel_ratings` extracts ground duels — from the native sportec `tackle_winner/loser` columns where
present, else the derived `tackle`/`take_on` adjacency (a cross-team pair within 5s where exactly one action
succeeds; both-succeed / both-fail is indeterminate and excluded) — and runs the Glicko-2 rating system over
them in `game_id` order. Each match is one rating period: `duel_rating` / `duel_rating_deviation` /
`duel_volatility` carry forward, while `duels_contested` / `duels_won` / `duels_lost` are the per-match
counts; `duel_winner_source` records the labeling provenance. Native `(match_id, player_id, team_id)` are
emitted and resolved to Kimball surrogates (`match_key` / `player_key`) in dbt. The computation is
deterministic — no trained weights.

## Governance

Duels is **per-player evaluative**; per [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 it is in scope as a
player-valuation family, not-high-risk under the current operating posture. HONEST LIMIT: it rates GROUND
duels only (the SPADL taxonomy has no aerial-duel type), and where native winner/loser labels are absent it
falls back to the derived tackle/take_on adjacency (~11 candidate duels per match) — a lower-signal proxy
than a native duel outcome, recorded in `duel_winner_source` so consumers can filter on labeling provenance.
