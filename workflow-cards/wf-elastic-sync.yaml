## Overview

ELASTIC synchronizes event and tracking data streams that lack annotated event locations.
It aligns temporally disjoint event logs with positional tracking data from IDSSE
(Bundesliga) matches, enabling downstream models that require both event semantics and
spatial context.

## Algorithm

The algorithm uses a dynamic time warping variant to align event timestamps with tracking
frame sequences. It matches events to tracking frames by minimizing the temporal and
spatial distance between event descriptions and observed player/ball states. No annotated
event coordinates are required, making it applicable to data sources that provide events
and tracking separately.
