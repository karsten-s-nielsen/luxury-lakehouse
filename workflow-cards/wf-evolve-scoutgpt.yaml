## Overview

Evolve ScoutGPT is an LLM-guided evolutionary architecture search that applies the MAP-Elites
algorithm (Romera-Paredes et al. 2025, AlphaEvolve) to discover improved ScoutGPT conditioning
architectures. Starting from the baseline FiLM + cross-attention seed pool, the engine mutates
model configurations via an LLM, trains each candidate on the 894K SPADL episode dataset,
and selects survivors by Spearman rho on the counterfactual ranking task. The goal is to push
the baseline rho (0.094) above the 0.15 target threshold.

## Architecture

The engine consists of three layers: the search space (candidate configs encoding conditioning
mechanism, hidden size, depth, and attention variants), the evaluator bridge (which validates
each candidate via a typed `CandidateConfig` model and delegates to a compute backend), and the
MAP-Elites population manager (which maintains a quality-diversity grid keyed on model size
and conditioning type). LLM mutations are issued via OpenRouter against the seed program
pool, with each generation evaluated in parallel across a `BackendPool` (RTX 5070 Ti + DGX Spark).
The pool dispatches via a thread-safe queue — faster backends naturally handle more candidates.
The best-performing program is written to `results/evolve/scoutgpt/{timestamp}/best_program.py`.

## Evaluation

Candidate fitness is measured by Spearman rank correlation (rho) on 200 counterfactual episodes
with 50 player swaps each (reduced budget for evolution speed). Secondary metrics
include next-action top-1 accuracy and cross-source validation gap (StatsBomb vs Wyscout).
A typical search run of 150 LLM iterations with 5-epoch trials per candidate costs approximately
$12 in LLM API calls and runs in ~8 hours on the dual-GPU pool (RTX 5070 Ti + DGX Spark).
