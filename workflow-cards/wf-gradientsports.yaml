## Overview

Ingests Gradient Sports match data (events and 25fps tracking) from the
pining-for-the-data REST API. API-driven match discovery via `updatedSince`
filter. Two bronze tables written with `replaceWhere` idempotency per
match_id. License gate: data approved for internal calibration/training
only (TC-3 Optuna sweep). Not published downstream until Gradient Sports confirms
license in writing.
