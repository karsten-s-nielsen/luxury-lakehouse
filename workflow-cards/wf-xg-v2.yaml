## Overview

Expected Goals v2 uses a Deep Sets architecture to model shot probability with
permutation-invariant freeze-frame context (defender and goalkeeper positions). MC Dropout
provides calibrated uncertainty estimates at inference time.

## Algorithm

The Deep Sets encoder processes each freeze-frame player as an independent element through
a shared MLP, then pools via summation before concatenating with the shooter's own features.
A final MLP produces the xG estimate. Dropout is retained at inference for Bayesian
uncertainty quantification via multiple forward passes.
