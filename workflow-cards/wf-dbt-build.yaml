## Overview

D59: programmatic dbt invocation inside the daily Databricks ingestion job.
After the 9 leaf compute tasks complete, this task runs ``dbt build`` against
the SQL warehouse to materialize the 33 gold mart tables (29 fact + 4 dim)
from the bronze layer. The wheel-bundled ``dbt_project/`` directory is
resolved at runtime via ``importlib.resources``. Authentication:
``ingestion.dbt_runner._ensure_databricks_env_vars()`` calls
``WorkspaceClient.config.authenticate()`` to exchange the runtime SP identity
for a short-lived OAuth M2M bearer token, writes it to ``DATABRICKS_TOKEN``,
and the ``serverless`` profile consumes it via ``env_var('DATABRICKS_TOKEN')``.
This explicit exchange is required because dbt-databricks otherwise falls
through to ``authenticate_with_external_browser`` and hangs indefinitely on
a headless serverless task.

Replaces the previous flow where ``dbt build`` only ran from developer
machines via ``scripts/dbt_build_and_refresh.py``. The next task in the daily
DAG (``refresh_synced_tables``) now depends on this task instead of the 9
leaf computes directly, so Lakebase synced tables propagate fresh gold data
without manual intervention.
