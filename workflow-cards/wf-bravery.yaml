## Overview

Bravery is the defending team's willingness to put a body in the way: the percentage of
the opponent's final actions (shots + open-play crosses) that the defending team blocks,
computed per `(match, defending team)`. It is an event-only metric covering every event
provider (StatsBomb / Wyscout / IDSSE / Metrica / SkillCorner / GradientSports).

This is a **methodology / governance card** for the silly-kicks 4.87.0 `compute_bravery`
family. The materialising ADR-013 writer (`src/ingestion/bravery_writer.py`) reads
`bronze.spadl_actions`, computes the aggregate per defending team, and lands it in bronze
for dbt to join into the existing `fct_match_summary` mart (one row per match, with
`home_bravery_*` / `away_bravery_*` pivots). It is scheduled into the daily job via the
`inference` execution phase above (entry point `bravery_writer`, `analytics` environment),
running after the SPADL/VAEP producer.

## Algorithm

`compute_bravery` groups the opponent's shots and open-play crosses by defending team and
computes the blocked share from the `shot_blocked` / `cross_blocked` SPADL enrichments.
Native `(match_id, team_id)` are emitted and resolved to Kimball surrogates
(`match_key` / `team_key`) in dbt staging. The computation is deterministic — no trained
weights.

## Governance

Bravery is **per-team evaluative** and aggregates from per-player defensive actions;
per [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 it is in scope as a defensive-valuation
family, not-high-risk under the current operating posture.
