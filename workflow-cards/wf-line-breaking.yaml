## Overview

Line-Breaking Pass Detection identifies passes that penetrate organized defensive lines.
It uses geometric analysis of defender positions from 360 freeze-frames and tracking data
to classify each pass as line-breaking or not.

## Algorithm

Defensive lines are estimated by fitting lines through defender positions using the convex
hull of the defending team's shape. A pass is classified as line-breaking if its trajectory
crosses at least one fitted defensive line between origin and destination. The algorithm
handles both event-only (StatsBomb 360) and tracking-based (Metrica) data sources.
