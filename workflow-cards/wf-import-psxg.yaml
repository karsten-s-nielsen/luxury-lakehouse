---
name: Import PSxG Predictions from HF Hub
id: wf-import-psxg
version: "1.0.0"
status: production
type: data-movement
domain: soccer-analytics
owners:
  - karsten
tags:
  - import
  - psxg
  - goalkeeper
  - huggingface

references:
  - citation: "Butcher et al. (2025). An Expected Goals On Target (xGOT) Model. MDPI."
    role: methodology

inputs:
  datasets:
    - id: "luxury-lakehouse/psxg-predictions"
      source: huggingface
      description: "PSxG prediction Parquet from HF Hub"

outputs:
  tables:
    - id: "{catalog}.bronze.psxg_predictions"
      destination: delta-table

execution:
  import:
    trigger: orchestrated
    orchestrated_by: wf-hf-sync
    runtime: databricks-workflow
    entry_point: import_psxg_predictions
    module: ingestion.import_psxg_predictions
    distribution: driver-bound
    timeout: "900s"
    environment: analytics

depends_on:
  - wf-export-shots

idempotency:
  strategy: skip-guard
  key: hf-commit-sha
  description: "SHA-based freshness guard via HfApi.repo_info().sha — skips import when the HF Hub dataset has not changed since last successful import. Within a run, replaceWhere on match_id ensures idempotent partition-level writes."

performance:
  inference_timeout: "900s"
  memory_ceiling: "16 GB driver"

cost:
  import:
    runtime: databricks
    sku: "jobs_serverless_compute_run_dbus"
    typical_dbu: 10
    typical_cost_usd: 0.7

monitoring:
  freshness_sla_hours: 168

links:
  source_code:
    - "src/ingestion/import_psxg_predictions.py"
  hf_dataset: "https://huggingface.co/datasets/luxury-lakehouse/psxg-predictions"
---

## Overview

Downloads PSxG (Post-Shot Expected Goals) predictions from HF Hub, stages the
Parquet file to a UC Volume, and writes to a bronze Delta table with replaceWhere
partitioning on match_id.
