## Overview

Materializes `bronze.shot_freeze_frames` — one row per (shot action, player) — for the
tracking providers. For each tracking shot, the linked tracking frame is converted to canonical
home-LTR action-context frames (reusing `analytics.action_context.pipeline._convert_tracking_batch`,
the single source of frame conversion + orientation), and `build_tracking_snapshots_spark` emits the
per-player rows (`x`, `y`, `is_keeper`, `is_teammate`, `set_cardinality`, `shooter_attacks_high_x`).

This is a reusable feature-layer fact consumed by the SPADL-native pre-shot xG model
(`xg_model_v3`, governed by `wf-xg-v2`). The `match_key` surrogate is resolved from gold
`dim_matches` (bronze carries only native ids per ADR-013). Incremental by default; a
`--match-ids "provider:id1,id2"` invocation runs an explicit backfill.

## INTERIM SCOPE — GradientSports + SkillCorner only (deliberate)

The daily run defaults to `--providers gradientsports,skillcorner` (the `xg_model_v3` training
cohort). **IDSSE and Metrica are deferred**: the current implementation converts frames
**driver-side, one `(match, period)` at a time** (`_process_match` → per-period `.toPandas()` →
`_convert_tracking_batch`), which risks a 16 GB-driver OOM on IDSSE's ~1.5M-row periods and lacks the
AC pipeline's M13 boundary de-dup (so batch-edge shots could double-count). GS/SkillCorner periods
are small enough that neither concern bites.

**Long-term (how IDSSE/Metrica onboard):** replace the driver-side loop with a **distributed SINK**
mirroring `compute_action_context` — a per-`(match, period)` work-queue in
`ingestion.action_context_queue` plus a `compute_shot_freeze_frames_drain_worker` entry point. That
(a) moves conversion onto Spark executors (via the same `mapInPandas` frame-batching + M13 owner
de-dup `_process_tracking_match` uses) so the dense providers scale, and (b) amortizes the serverless
cold-start across the whole drain instead of paying it per match. Enabling
`--providers …,idsse,metrica` is a deliberate opt-in that lands with that sink work.
