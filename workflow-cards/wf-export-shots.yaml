## Overview

Reads on-target shots from the gold layer ``fct_shots``, filters to shots with
``end_location_z IS NOT NULL``, stages a Parquet file to a UC Volume, and uploads
the dataset to HF Hub. This is a prerequisite for PSxG model training on HF Jobs.
