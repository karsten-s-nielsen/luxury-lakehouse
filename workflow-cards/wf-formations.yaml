## Overview

EFPI classifies team formations from tracking data using template matching against
canonical formation shapes. It labels each match phase (open play, set piece,
transition) with the detected formation (e.g., 4-3-3, 4-4-2) for both the attacking
and defending team.

The pipeline runs on the 20 tracking matches in the gold layer and is one of the
lightest compute workflows in the platform (~5 DBU per run).

## Algorithm

Player positions are aggregated into a team centroid frame. The Hungarian algorithm
(Bialkowski et al., 2014) assigns each outfield player to a positional role by solving
the minimum-cost bipartite matching between observed positions and the template grid.
Once roles are assigned, the formation is identified by counting players per line
(defenders, midfielders, forwards) in the EFPI zone decomposition (Bekkers & Dabadghao,
2025). A majority-vote window smooths frame-level assignments into phase-level labels,
suppressing noise from pressing triggers and goalkeeper distribution moments.
