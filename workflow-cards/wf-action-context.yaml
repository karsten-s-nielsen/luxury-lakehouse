      source: delta-table
      description: "Global xT grid — the xt_gk_* surface; a material change forces a full re-materialize (ADR-063)"

outputs:
  tables:
    - id: "{catalog}.bronze.spadl_action_context"
      destination: delta-table
      description: "Per-action context features (~110 columns for tracking, ~5 for event-only)"

execution:
  enrichment:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: compute_action_context
    module: ingestion.action_context
    schedule: "daily 06:00 UTC"
    timeout: "28800s"
    environment: spadl
  # ADR-058: statsbomb sb360 arm — a single distributed cogroup.applyInPandas job (statsbomb exits
  # the per-match drain; scan each bronze table once, enrich per match on executors, distributed write).
  statsbomb_enrichment:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: compute_action_context_statsbomb
    module: ingestion.action_context
    schedule: "daily 06:00 UTC"
    timeout: "28800s"
    environment: analytics
  # D8: the fan-in completeness gate over BOTH arms above (run_if = ALL_DONE — it runs even
  # when the drain failed). Reads the work queue + the D9 unit-event log + the results mart and
  # asserts every expected unit ran and its rows landed. Only INCOMPLETE fails the task.
  verification:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: verify_action_context_drain
    module: ingestion.action_context_gate
    schedule: "daily 06:00 UTC"
    timeout: "3600s"
    environment: analytics

dbt_model: fct_action_context

idempotency:
