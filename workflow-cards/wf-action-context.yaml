## Overview

Unified action context pipeline (AC-1). Runs the full silly-kicks enrichment
chain in a single applyInPandas pass per match. Covers all 6 providers:
StatsBomb, Wyscout, IDSSE, Metrica, SkillCorner, GradientSports.
Event-only providers get game_state + GK resolution (~5 columns);
tracking providers get the full ~110 column feature set.

A fan-in completeness gate (`verify_action_context_drain`, ADR-068) closes the
run: the drain workers and the sb360 task append per-unit lifecycle events, and
the gate reads them back to prove every enumerated unit actually ran and its rows
actually landed. It runs on ALL_DONE — precisely so that a *failed* drain still
gets audited, which is when knowing what died matters most.
