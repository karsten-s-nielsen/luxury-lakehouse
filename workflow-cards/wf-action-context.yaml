---
name: Action Context Enrichment
id: wf-action-context
version: "1.0"
status: production
type: heuristic
domain: action-features
owners:
  - karsten
tags:
  - action-context
  - game-state
  - tracking
  - pitch-control
  - pressure
  - team-shape
  - line-breaking
  - gk-influence
  - obso
