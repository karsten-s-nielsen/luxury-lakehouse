## Overview

Cost bridge that reads per-run cost history from HF Hub repos (written by
HFJobsCostRecorder) and MERGEs them into the ``workflow_cost_live`` Delta table.
Discovers HF Jobs repos by parsing workflow-cards YAML. Designed to run as a
scheduled Databricks task every 15 minutes, unifying Databricks and HF Jobs
cost data in a single observability table.
