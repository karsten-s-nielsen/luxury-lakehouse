## Overview

Four-pillar goalkeeper evaluation built on StatsBomb open data:

1. **Shot stopping**: PSxG model (Butcher et al. 2025). Logistic regression on goalmouth
   coordinates predicts the probability that a goalkeeper saves a given on-target shot.
   Goals prevented = PSxG &minus; actual goals conceded.
2. **Distribution**: xT delta on GK-initiated passes (goal kicks, throws, long passes) from
   `fct_action_values`. Launch rate (long ball %) per 90.
3. **Cross collection**: Claim rate and punch rate on crossed balls, per 90 minutes played.
4. **Sweeper-keeper**: Defensive actions outside the penalty area (tracking matches only).

All four pillars are aggregated into `fct_goalkeeper_stats` with per-90 normalization.

## PSxG Model

The PSxG (Post-Shot Expected Goals) model estimates save probability from goalmouth
position. Logistic regression is trained on ~15K on-target shots from StatsBomb open data.
Features:

| Feature | Description |
|---------|-------------|
| `end_location_y` | Horizontal goalmouth position, normalized [0, 1] (0 = left post, 1 = right post) |
| `end_location_z` | Vertical goalmouth position, normalized [0, 1] (0 = ground, 1 = crossbar) |

Model outputs PSxG per shot (probability of a goal given the shot reached the target).
Goals prevented = sum(PSxG) &minus; actual goals conceded. Serialized as JSON (zero pickle).
