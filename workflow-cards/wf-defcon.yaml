## Overview

DEFCON assigns defensive credit to individual players by estimating the counterfactual
value change caused by each defender's presence. An XGBoost value estimator is trained
inline during the inference run, then applied per-match to attribute defensive contributions.

## Algorithm

For each defensive action, DEFCON computes the value difference between the observed state
and a counterfactual where the defender is absent. The value estimator (XGBoost) is trained
on VAEP action values and spatial features from 360 freeze-frames and tracking data.
Credit assignment distributes across executors via `applyInPandas` grouped by match_id.
