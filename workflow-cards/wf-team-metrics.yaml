## Overview

Team Metrics is the per-`(match, team)` KPI glossary: 44 team-match measures spanning the Twelve
match-report set (PPDA, field tilt, pass tempo, line heights, recoveries, the conversion chain) and
the event-based practitioner set (counter-press windows, post-regain security, build-up taxonomy,
breakout-by-channel, switch-conditioned press). It is an event-only metric covering every event
provider (StatsBomb / Wyscout / IDSSE / Metrica / SkillCorner / GradientSports).

This is a **methodology card** for the silly-kicks 4.120.0 `team_metrics.compute_team_kpis` family
(TF-52). The materialising ADR-013 writer (`src/ingestion/team_metrics_writer.py`) reads
`bronze.spadl_actions`, computes the KPIs per team, and lands them in bronze for dbt to join into the
wide-by-granularity team-match mart `fct_team_metrics` (shared with `match_outcome`). It is scheduled
into the daily job via the `inference` execution phase above (entry point `team_metrics_writer`,
`analytics` environment), running after the SPADL/VAEP producer.

## Algorithm

`compute_team_kpis` rests on `spadl.add_possessions` (deriving possessions from the SPADL actions) and
computes the 44 KPIs per `(game_id, team_id)`. Native `(match_id, team_id)` are emitted and resolved to
Kimball surrogates (`match_key` / `team_key`) in dbt. The computation is deterministic — no trained
weights.

## Governance

Team Metrics is **per-team**, not per-player-evaluative: every KPI describes the team's collective
structure or tempo, never an individual player's performance. It is therefore excluded from the
`PER_PLAYER_EVALUATIVE_CARDS` inventory and carries no EU-AI-Act model card
(see [`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6).
