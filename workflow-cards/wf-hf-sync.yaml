## Overview

The `hf_sync` task is the daily job's HF orchestration stage. It iterates
through 6 sub-operations in order, each wrapped in a best-effort error
boundary (failures logged at ERROR but do not abort the parent task):

1. Import space creation data from HF Hub
2. Import PSXG predictions from HF Hub
3. Export football2vec v2 training data to HF Hub
4. Export shots-on-target to HF Hub
5. Prepare 360 training data for HF Jobs
6. Sync HF Jobs cost telemetry into Delta

The OBSO/PAUSA import was previously a 7th sub-operation here; PR-Cycle-B
(2026-05-01) split it out into its own Databricks task (`import_obso_results`)
so `wf-obso-pausa` (`compute_pausa`) can declare an explicit dependency on
the import. See `workflow-cards/wf-import-obso.yaml`.

The parent task runs once daily via the `soccer-analytics-ingestion-dev`
Databricks job (`terraform/modules/workflows/main.tf`); each sub-operation's
own workflow card declares `trigger: orchestrated` and `orchestrated_by:
wf-hf-sync`.
