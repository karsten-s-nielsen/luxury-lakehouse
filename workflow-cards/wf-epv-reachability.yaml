## Overview

This workflow computes Expected Possession Value (EPV) transition matrices and ball
reachability surfaces used as inputs to the OBSO and PAUSA models. The grids encode how
possession value changes as the ball moves across the pitch.

## Algorithm

Ball transition probabilities are estimated from SPADL actions across multiple competitions.
A Markov chain model computes the EPV at each grid cell by propagating scoring probabilities
through the transition matrix. Ball reachability grids encode the time-to-intercept surface
used by downstream pitch control models.
