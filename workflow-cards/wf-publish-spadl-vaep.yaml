## Overview

Publishes the full `fct_action_values` gold mart as a Parquet dataset
(partitioned by `data_source`) to HF Hub as
`luxury-lakehouse/spadl-vaep-action-values`.

Two execution paths:
- **export** (orchestrated by `wf-hf-sync`): runs daily via `spark.sql()` in the
  Databricks mega-job (`src/ingestion/publish_spadl_vaep_hf.py`).
- **export_hf_jobs** (manual): `hf jobs uv run scripts/publish_spadl_vaep_hf.py`
  — uses the Databricks SQL Statement Execution API from HF Jobs.

This dataset is the primary input for VAEP model retraining and for downstream
analytics scripts that need pre-computed action values (xT grid, EPV, OBSO).
