## Overview

Queries the Databricks SQL Statement Execution API to extract every action-value
record from the gold-layer `fct_action_values` table and publishes the Parquet
dataset (partitioned by `data_source`) to HF Hub as
`luxury-lakehouse/spadl-vaep-action-values`.

This dataset is the primary input for VAEP model retraining (`train_vaep_model_hf.py`)
and for downstream analytics scripts that need pre-computed action values
(xT grid, EPV transition, OBSO).

## Trigger Policy

Manual HF Jobs invocation — `hf jobs uv run scripts/publish_spadl_vaep_hf.py`.
The daily `data_ingestion` job does not publish the dataset; republish on demand
when the action-value pipeline has been retrained or when a new data source has
been added upstream.
