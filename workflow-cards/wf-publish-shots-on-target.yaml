## Overview

Queries the Databricks SQL Statement Execution API to extract every on-target
shot record from the gold-layer `fct_shots` table (filtered to
`end_location_z IS NOT NULL`), JOINed to `dim_matches` to recover native
match identifiers alongside the Kimball `match_key` surrogate. Normalises
dtypes and publishes the resulting Parquet dataset to HF Hub as
`luxury-lakehouse/statsbomb-shots-on-target`.

This dataset is the primary training input for the PSxG (Post-Shot Expected
Goals) model documented in `wf-psxg`.

## Relationship to wf-export-shots

This card is the PEP 723 / HF Jobs alternative to the Databricks-workflow-task
form documented in `wf-export-shots`. Both produce the same HF dataset; the
PEP 723 form is preferred for ad-hoc local republishes (no workspace clone
of the lakehouse repo required) while `wf-export-shots` is preferred when
the export rides alongside other Databricks workflow tasks in a single job.

## Trigger Policy

Manual HF Jobs invocation — `hf jobs uv run scripts/publish_shots_on_target_hf.py`
— or local invocation via `uv run --no-project --script scripts/publish_shots_on_target_hf.py`
with `DATABRICKS_HOST` / `DATABRICKS_TOKEN` / `DATABRICKS_SQL_WAREHOUSE_ID` /
`HF_TOKEN` env vars set. Republish on demand when upstream shot fact data
or governance posture has changed materially.
