## Overview

Queries the Databricks SQL Statement Execution API to extract every shot record
from the gold-layer `fct_shots` table, normalises dtypes, and publishes the
resulting Parquet dataset (partitioned by `data_source`) to HF Hub as
`luxury-lakehouse/xg-shot-data`.

This dataset is the primary training input for two downstream workflow cards:

- `wf-xg-v1` — XGBoost shot model (`scripts/train_xg_model_hf.py`)
- `wf-xg-v2` — Deep Sets shot model (`scripts/train_xg_v2_hf.py`)

## Trigger Policy

Manual HF Jobs invocation — `hf jobs uv run scripts/publish_xg_shots_hf.py`.
The daily `data_ingestion` job does not publish the dataset; republish on demand
when upstream shot fact data has changed materially enough to retrain a model.
