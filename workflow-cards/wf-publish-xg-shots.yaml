## Overview

Publishes the full `fct_shots` gold mart as a Parquet dataset (partitioned by
`data_source`) to HF Hub as `luxury-lakehouse/xg-shot-data`.

Two execution paths:
- **export** (orchestrated by `wf-hf-sync`): runs daily via `spark.sql()` in the
  Databricks mega-job (`src/ingestion/publish_xg_shots_hf.py`).
- **export_hf_jobs** (manual): `hf jobs uv run scripts/publish_xg_shots_hf.py`
  — uses the Databricks SQL Statement Execution API from HF Jobs.

Primary training input for `wf-xg-v2` (Deep Sets shot model); v1 retired
SK3-MIG-B 2026-05-03 per ADR-023.
