## Overview

GKDV (Goalkeeper Deterrent Value) estimates a keeper's off-line deterrent effect by a
counterfactual: for each scored-and-defending tracking frame it builds a "ghost" frame
with the keeper removed, and measures the change in Dangerous-Attacks-Space
(`delta_das`, accessible-space) and in fitted-xT threat (`delta_threat_suppression`) that
the keeper's positioning suppresses. The per-frame deltas are pooled per keeper over
`(competition, season)`.

This is a **methodology / governance card** for the silly-kicks 4.87.0 gkdv family. The
materialising ADR-013 writer (`src/ingestion/gkdv_writer.py`) requires the `[das]` extra,
restricts to frames whose `provenance["drop_reason"].isna()` (a dropped frame is
byte-identical across the actual/ghost legs, so differencing it would bias every aggregate
toward the null), and lands the pooled result in bronze for dbt to join into the existing
`fct_gk_shot_stopping_pooled` mart. It is scheduled into the daily job via the `inference`
execution phase above (entry point `gkdv_writer`, `analytics` environment — which carries
the `[das]` extra), running after the action-context drain.

GKDV composes a ghost-substitution engine (Le, Yue, Carr & Lucey 2017) with two physics
arms — accessible space (`delta_das`, Bischofberger & Baca 2026) and threat-suppression
(`delta_threat_suppression`, Spearman 2018 + Shaw & Sudarshan 2020, the source of the
`lambda_gk = 3 * lambda_outfield` constant). The ghost-frame construction and per-keeper
pooling are silly-kicks-native and pinned to the 4.87.0 signatures (`build_ghost_frames` /
`delta_das` / `delta_threat_suppression` / `aggregate_by_keeper`) as the surface is still
evolving upstream. DEFCON-GNN (Kim et al. 2025) is a comparator only, not implemented here.

## Governance

GKDV is **per-player evaluative** (per-goalkeeper deterrent value). See
[`AI_GOVERNANCE.md`](../AI_GOVERNANCE.md) §5/§6 for the full risk classification and the
not-high-risk-under-current-posture determination.
