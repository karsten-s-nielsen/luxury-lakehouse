## Overview

Joins SPADL action values with StatsBomb 360 freeze-frame data to build per-player-match
training sequences for the Football2Vec 360 model. Each output row contains temporally
ordered action structs paired with positionally aligned freeze-frame player arrays.
Exports to HF Hub for downstream GPU training on HF Jobs.
