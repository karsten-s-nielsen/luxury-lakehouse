## Overview

Football2Vec generates dense vector embeddings for players by treating each player's
match-level action sequences as documents. The Doc2Vec model learns representations that
capture playing style, enabling similarity search and clustering across data sources.

## Algorithm

Player action sequences are extracted from StatsBomb and Wyscout events, tokenized into
action-type strings, and fed to a Doc2Vec model (PV-DBOW variant). Training runs inline
on a Databricks notebook. Inference distributes embedding computation across executors
using `applyInPandas` grouped by synthetic batch ID for memory-safe parallelism.
