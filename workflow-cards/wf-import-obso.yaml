---
name: Import OBSO Results from HF Hub
id: wf-import-obso
version: "1.0.0"
status: production
type: data-movement
domain: soccer-analytics
owners:
  - karsten
tags:
  - import
  - obso
  - pausa
  - off-ball

references:
  - citation: "Spearman (2018). Beyond Expected Goals. MIT Sloan."
    role: methodology
  - citation: "Lee, Jo, Hong, Bauer & Ko (2026). Valuing La Pausa. MIT Sloan 2026."
    role: methodology

inputs:
  datasets:
    - id: "luxury-lakehouse/obso-pausa-values"
      source: huggingface
      description: "OBSO/PAUSA Parquet downloaded from HF Hub to UC Volume staging path"

outputs:
  tables:
    - id: "{catalog}.bronze.pausa_raw_scores"
      destination: delta-table
    - id: "{catalog}.bronze.obso_surfaces"
      destination: delta-table

execution:
  import:
    trigger: scheduled
    runtime: databricks-workflow
    entry_point: import_obso_results
    module: ingestion.import_obso_results
    distribution: driver-bound
    timeout: "600s"
    environment: hf

# PR-Cycle-B (2026-05-01): standalone task — split out of wf-hf-sync so that
# wf-obso-pausa (compute_pausa) can declare an explicit dependency on the
# OBSO import. Pure HF Hub download; no internal pipeline data dependency.
depends_on: []

idempotency:
  strategy: skip-guard
  key: hf-commit-sha
  description: "SHA-based freshness guard via HfApi.repo_info().sha — skips import when the HF Hub dataset has not changed since last successful import. Within a run, replaceWhere on match_id ensures idempotent partition-level writes."

performance:
  inference_timeout: "900s"
  memory_ceiling: "16 GB driver"

cost:
  import:
    runtime: databricks
    sku: "jobs_serverless_compute_run_dbus"
    typical_dbu: 10
    typical_cost_usd: 0.7

monitoring:
  freshness_sla_hours: 168

links:
  source_code:
    - "src/ingestion/import_obso_results.py"
---

## Overview

Downloads from HF Hub, stages to UC Volume, then writes to bronze Delta tables.
Imports both PAUSA raw scores and optional OBSO surfaces with replaceWhere
partitioning on match_id for idempotent writes.
