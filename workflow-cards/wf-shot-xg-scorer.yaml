## Overview

`compute_xg_shot_scores` turns the canonical-SPADL pre-shot xG model `xg_model_v3` into the
consumable per-shot fact `bronze.xg_shot_predictions`. It loads the Champion weights (raw xG)
plus the trainer-shipped per-provider + pooled OOF calibrators, scores every shot-family row in
`fct_action_values` — assembling tabular features via the SHARED `analytics.xg_model.build_features`
and freeze-frame sets via the SHARED `analytics.xg_freeze_frame.normalize_freeze_frame` (the same
functions the trainer uses; a cross-entry-point parity test pins the identity) — and writes one row
per `(match_key, action_id)`.

## Two-mode gate (selection ≠ certification)

Per provider, `select_scoring_mode` picks context-aware vs tabular-only from the held-out
discrimination CI lower bound, while `is_mode_certified` + `calibration_ok_n_aware` decide whether
the shipped mode is trusted. Selection is a comparison; certification is an absolute bar — a mode can
be selected yet fail certification, which sets `ood_flag=true`. Missing per-provider calibrator → the
pooled calibrator plus `ood_flag=true` (N4). `shot_penalty` rows bypass the encoder and take the
constant `_penalty_xg` from the envelope. All logic comes from `analytics.xg_calibration` — never
re-derived here.
