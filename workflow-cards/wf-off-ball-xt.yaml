## Overview

Off-Ball xT Attribution assigns expected threat value to off-ball players based on their
positioning relative to the xT surface. It quantifies each player's spatial contribution
to the team's attacking threat even when they are not directly involved in the play.

## Algorithm

For each tracking frame, the xT grid value at each off-ball player's position is combined
with a pitch control weighting to produce an attributed xT score. Players who position
themselves in high-value areas while maintaining receivability (pitch control advantage)
earn higher off-ball xT credits. Computation is distributed via `applyInPandas` with
synthetic frame batch partitions.

## Run-Values (silly-kicks 4.87.0) — moved to wf-tracking-marts

Off-ball run detection + valuation (`detect_off_ball_runs` + `value_off_ball_runs`, TF-4/TF-35;
the per-(action, runner) mart `fct_off_ball_runs`) used to be materialised by the standalone
`off_ball_runs_writer` scheduled as a second phase on THIS card. That writer was one of three
driver-sequential tracking-grain writers consolidated into the **tracking-marts worker-drain**
([`wf-tracking-marts`](wf-tracking-marts.yaml)); its pure scoring function (`compute_off_ball_runs`)
is now called per-unit by `TrackingMartsProcessor`. Run-values governance therefore lives on
`wf-tracking-marts`; this card retains only the off-ball xT attribution phase. The Power / Vidal-Codina /
Esposito references below remain here for the off-ball expected-threat family provenance.
