## Overview

Off-Ball xT Attribution assigns expected threat value to off-ball players based on their
positioning relative to the xT surface. It quantifies each player's spatial contribution
to the team's attacking threat even when they are not directly involved in the play.

## Algorithm

For each tracking frame, the xT grid value at each off-ball player's position is combined
with a pitch control weighting to produce an attributed xT score. Players who position
themselves in high-value areas while maintaining receivability (pitch control advantage)
earn higher off-ball xT credits. Computation is distributed via `applyInPandas` with
synthetic frame batch partitions.

## Run-Values Extension (silly-kicks 4.87.0)

This card also governs the **run-values** family: off-ball run detection and valuation
(`detect_off_ball_runs` + `value_off_ball_runs`, TF-4/TF-35). Off-ball runs are a
drain-native action-context signal; the per-(action, runner) mart `fct_off_ball_runs` is
materialised by the ADR-013 writer `src/ingestion/off_ball_runs_writer.py`, which
reconstructs the oriented `(actions, frames, xt)` per tracking work unit, detects
qualifying runs, and values completed passes/crosses against the fitted expected-threat
grid. Run-values is a **per-player evaluative** off-ball-movement metric and belongs to the
same off-ball expected-threat family as off-ball xT — this card is its governance home.
`value_off_ball_runs` values only completed passes/crosses with a resolved receiver, so
most rows carry a legitimately off-domain NaN `run_value`. The writer is scheduled into the
daily job as the `run_values` execution phase above (entry point `off_ball_runs_writer`,
`analytics` environment), running after the action-context drain.
