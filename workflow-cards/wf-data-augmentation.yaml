## Overview

Physics-Based Tracking Data Augmentation is a library module (not a pipeline) that provides
symmetry-aware data augmentation functions for tracking data. It is consumed by the pitch
control and off-ball xT workflows to increase effective training data volume while
preserving physical constraints.

## Algorithm

The library implements horizontal and vertical pitch reflections that correctly transform
player positions, velocities, and orientations. Augmented frames maintain physical
consistency (e.g., reflected velocities match reflected positions). The symmetry group
exploits the bilateral symmetry of football pitches to double or quadruple effective
sample sizes without introducing artifacts.
