version: 2

seeds:
  - name: position_mapping
    description: >
      Maps StatsBomb position IDs (1-25) to broad position groups
      (Goalkeeper, Defender, Midfielder, Forward). Joined into dim_players.
    columns:
      - name: position_id
        data_tests:
          - unique
          - not_null
      - name: position_name
        data_tests:
          - not_null
      - name: position_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Goalkeeper', 'Defender', 'Midfielder', 'Forward']

  - name: competition_metadata
    description: >
      Enrichment seed for competition display metadata. Joined into dim_competitions.
    columns:
      - name: competition_id
        data_tests:
          - unique
          - not_null

  - name: player_xref_overrides
    description: >
      Manual overrides for cross-source player entity resolution.
      Rows with action=force_match force a link between StatsBomb and Wyscout
      player IDs. Rows with action=force_reject suppress a false positive.
    config:
      column_types:
        statsbomb_player_id: int
        wyscout_player_id: int
        action: string
    columns:
      - name: statsbomb_player_id
        description: StatsBomb player_id
        data_tests:
          - not_null
      - name: wyscout_player_id
        description: Wyscout wyId
        data_tests:
          - not_null
      - name: action
        description: Override action (force_match or force_reject)
        data_tests:
          - accepted_values:
              arguments:
                values: ['force_match', 'force_reject']

  - name: task_workflow_mapping
    description: >
      Static mapping from Databricks task_key to workflow card ID.
      Used by fct_workflow_costs to populate workflow_id deterministically,
      independent of transient workflow_cost_live data.
    columns:
      - name: task_key
        description: Databricks job task key (matches pyproject.toml entry point name)
        data_tests:
          - unique
          - not_null
      - name: workflow_id
        description: Workflow card ID (matches workflow-cards/*.yaml id field)
        data_tests:
          - not_null

  - name: model_baseline_scalars
    description: >
      Reference baselines for model validation and drift detection.
      Each row defines a scalar threshold for one model-metric pair.
      Used by the model_validation pipeline to compare current metric
      values against known-good reference values.
    config:
      column_types:
        model_name: string
        metric_name: string
        reference_value: float
        threshold_warn: float
        threshold_alert: float
        computed_from: string
    columns:
      - name: model_name
        description: Model identifier (e.g., xg_xgboost, vaep, pitch_control)
        data_tests:
          - not_null
      - name: metric_name
        description: Metric identifier (e.g., mean_prediction, roc_auc, field_sum)
        data_tests:
          - not_null
      - name: reference_value
        description: Known-good baseline value for comparison
        data_tests:
          - not_null
      - name: computed_from
        description: Source description for the baseline (e.g., statsbomb_la_liga_2015_16)
        data_tests:
          - not_null
