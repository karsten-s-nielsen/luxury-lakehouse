version: 2

seeds:
  - name: position_mapping
    description: >
      Maps StatsBomb position IDs (1-25) to broad position groups
      (Goalkeeper, Defender, Midfielder, Forward). Joined into dim_players.
    columns:
      - name: position_id
        data_tests:
          - unique
          - not_null
      - name: position_name
        data_tests:
          - not_null
      - name: position_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Goalkeeper', 'Defender', 'Midfielder', 'Forward']

  - name: competition_metadata
    description: >
      Enrichment seed for competition display metadata. Joined into dim_competitions.
    columns:
      - name: competition_id
        data_tests:
          - unique
          - not_null

  - name: player_xref_overrides
    description: >
      Manual overrides for cross-source player entity resolution.
      Rows with action=force_match force a link between StatsBomb and Wyscout
      player IDs. Rows with action=force_reject suppress a false positive.
    config:
      column_types:
        statsbomb_player_id: int
        wyscout_player_id: int
        action: string
    columns:
      - name: statsbomb_player_id
        description: StatsBomb player_id
        data_tests:
          - not_null
      - name: wyscout_player_id
        description: Wyscout wyId
        data_tests:
          - not_null
      - name: action
        description: Override action (force_match or force_reject)
        data_tests:
          - accepted_values:
              arguments:
                values: ['force_match', 'force_reject']

  - name: expected_threat_grid
    description: >
      12x8 Expected Threat (xT) grid from Karun Singh (2018). Each cell
      represents the probability of scoring from that zone. Zone indices
      map to StatsBomb 120x80 coordinates where each zone is 10x10 units.
      Used by the Off-Ball xT analytics module.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - zone_x
            - zone_y
    columns:
      - name: zone_x
        description: Horizontal zone index (0-11, left to right)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 11
      - name: zone_y
        description: Vertical zone index (0-7, bottom to top)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 7
      - name: xt_value
        description: Expected threat probability (0-1) for this zone
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
