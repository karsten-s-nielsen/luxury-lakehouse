name: soccer_analytics
version: '1.0.0'
config-version: 2

profile: databricks

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Model Materializations ─────────────────────────────────────────────
# Staging  → views in the silver schema (lightweight, always fresh)
# Intermediate → ephemeral (CTEs inlined into downstream models)
# Marts    → tables in the gold schema (query-optimized, materialized)
models:
  soccer_analytics:
    staging:
      +materialized: view
      +schema: silver
      +tags: ["staging"]
      +grants:
        select: ['account users']
    intermediate:
      +materialized: ephemeral
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: gold
      +tags: ["marts"]
      +grants:
        select: ['account users']

seeds:
  soccer_analytics:
    +schema: silver

vars:
  # Standard pitch dimensions used across macros (StatsBomb coordinate system)
  pitch_length: 120
  pitch_width: 80
  # Goal center coordinates (center of the goal line)
  goal_x: 120
  goal_y: 40
  # Domain thresholds (documented in Soccermatics curriculum)
  sprint_speed_threshold: 7.0        # m/s — standard sports science sprint threshold
  progressive_pass_ratio: 0.75       # end distance < 75% of start distance to goal
  pass_direction_threshold: 5        # yards — forward/backward deadband
  frame_duration_seconds: 0.04       # 1/25fps — Metrica tracking frame interval
  goal_width: 8                      # yards — standard goal width (IFAB Laws of the Game)
  minutes_per_match: 90              # standard match length for per-90 normalization
