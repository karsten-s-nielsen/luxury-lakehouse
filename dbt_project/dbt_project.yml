name: soccer_analytics
version: '1.0.0'
config-version: 2

flags:
  use_materialization_v2: true

profile: databricks

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Model Materializations ─────────────────────────────────────────────
# Staging  → views in the silver schema (lightweight, always fresh)
# Intermediate → ephemeral (CTEs inlined into downstream models)
# Marts    → tables in the gold schema (query-optimized, materialized)
models:
  soccer_analytics:
    staging:
      +materialized: view
      +schema: silver
      +tags: ["staging"]
      +grants:
        select: "{{ var('grant_select_to', ['account users']) }}"
    intermediate:
      +materialized: ephemeral
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: gold
      +tags: ["marts"]
      +grants:
        select: "{{ var('grant_select_to', ['account users']) }}"

seeds:
  soccer_analytics:
    +schema: silver

vars:
  # UC grant principals — override with specific SPs for production
  # Default 'account users' is acceptable for dev with public data (L-15)
  grant_select_to:
    - 'account users'
  # Standard pitch dimensions used across macros (StatsBomb coordinate system)
  pitch_length: 120
  pitch_width: 80
  # Goal center coordinates (center of the goal line)
  goal_x: 120
  goal_y: 40
  # Domain thresholds (documented in Soccermatics curriculum)
  sprint_speed_threshold: 7.0        # m/s — standard sports science sprint threshold
  high_speed_threshold: 5.5          # m/s — high-speed running threshold (sports science standard)
  high_acceleration_threshold: 3.0   # m/s^2 — high acceleration threshold
  # Off-Ball xT join toggle — set to true after running compute_off_ball_xt pipeline
  off_ball_xt_enabled: false
  # DEFCON-lite join toggle — set to true after running compute_defcon_lite pipeline
  defcon_enabled: false
  progressive_pass_ratio: 0.75       # end distance < 75% of start distance to goal
  pass_direction_threshold: 5        # yards — forward/backward deadband
  # DEPRECATED: frame_duration_seconds is no longer used in fct_tracking_frames.
  # Velocity now uses per-row frame_rate column (Phase 10). Kept for backward compat.
  frame_duration_seconds: 0.04       # 1/25fps — legacy Metrica-only tracking interval
  goal_width: 8                      # yards — standard goal width (IFAB Laws of the Game)
  minutes_per_match: 90              # standard match length for per-90 normalization
