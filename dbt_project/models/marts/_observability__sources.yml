version: 2

sources:
  - name: observability
    description: >
      Platform operational metadata schema. Tables written by runtime hooks
      (CostEstimateHook), not by dbt. Used as read-only enrichment sources.
    database: "{{ target.catalog }}"
    schema: observability
    tables:
      - name: workflow_cost_live
        description: >
          Warm-tier cost and lifecycle data written by CostEstimateHook during
          pipeline execution. Rows are pruned by fct_workflow_costs post-hook
          after cold-tier capture. Not managed by dbt.
        loaded_at_field: updated_at
        columns:
          - name: workflow_id
            description: >
              Workflow card identifier (e.g., wf-vaep). Primary join key to
              cold tier via task_workflow_mapping seed + temporal window.
          - name: started_at
            description: >
              UTC timestamp when CostEstimateHook.on_start fired. Used in
              temporal join window with cold-tier task_started_at.
          - name: run_id
            description: UUID unique to each pipeline execution.
          - name: state
            description: "Pipeline outcome: RUNNING, COMPLETED, SKIPPED, or ERROR."
          - name: duration_seconds
            description: >
              Actual pipeline work duration (excludes cold start overhead).
          - name: entity_count
            description: Number of entities the guard found for this run.
          - name: row_count
            description: Number of rows the pipeline output.
          - name: guard_duration_seconds
            description: >
              Wall-clock seconds the skip guard check took. Populated by
              timed_check(). NULL for runs predating this instrumentation.
          - name: estimated_cost_usd
            description: "Hook's per-task cost estimate (rate * duration)."
