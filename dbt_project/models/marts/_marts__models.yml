version: 2

models:
  # ── Fact Tables ───────────────────────────────────────────────────────

  - name: fct_shots
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer shot fact keyed on match_key (Kimball surrogate per ADR-011,
      PR 3). Contains every shot from StatsBomb + Wyscout sources with computed
      geometry features (distance to goal, shot angle), StatsBomb xG where
      available, and categorical features for ML model training. Legacy
      competition_id INT retained nullable for bronze back-compat and
      non-Taipy consumers; scheduled for removal in PR 8 sweep. One row
      per shot.
    columns:
      - name: shot_id
        data_type: string
        description: Unique shot identifier (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches.match_key (ADR-011, PR 3). Native match_id recoverable via JOIN dim_matches.
        data_tests:
          - not_null
      - name: competition_key
        data_type: bigint
        description: Kimball surrogate FK to dim_competitions.competition_key (ADR-011, PR 2). fct_shots always populates this (source set is SB+WS only; both providers have competition_id populated).
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — populated for all SB+WS shots via dim_teams JOIN on (provider, native_team_id)).
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — populated for all SB+WS shots via dim_players JOIN on (provider, native_player_id)).
      - name: location_x
        data_type: double
        description: Shot X coordinate (0-120). May slightly exceed bounds for off-pitch events.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "location_x is not null"
              config:
                severity: warn
      - name: location_y
        data_type: double
        description: Shot Y coordinate (0-80)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "location_y is not null"
              config:
                severity: warn
      - name: statsbomb_xg
        data_type: double
        description: StatsBomb xG value (NULL for non-StatsBomb data)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "statsbomb_xg is not null"
      - name: distance_to_goal
        data_type: double
        description: Euclidean distance from shot location to goal center (yards)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 170
                row_condition: "distance_to_goal is not null"
              config:
                severity: warn
      - name: shot_angle
        data_type: double
        description: Angle subtended at the goal posts (radians)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3.15
                row_condition: "shot_angle is not null"
              config:
                severity: warn
      - name: shot_outcome
        data_type: string
        description: Shot outcome classification
        data_tests:
          - not_null
      - name: is_goal
        data_type: int
        description: Binary goal indicator (1=goal, 0=no goal)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: period
        data_type: bigint
        description: Match period
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: competition_id
        data_type: int
        description: Legacy INT competition id, nullable. Retained for bronze back-compat and non-Taipy consumers; scheduled for removal in PR 8 sweep (replaced by competition_key per ADR-011).
      - name: season_id
        data_type: int
        description: Season identifier
      - name: minute
        data_type: bigint
        description: Match minute of the shot
      - name: second
        data_type: bigint
        description: Match second of the shot
      - name: end_location_x
        data_type: double
        description: X coordinate where the shot ended
      - name: end_location_y
        data_type: double
        description: Y coordinate where the shot ended
      - name: end_location_z
        data_type: double
        description: "Z coordinate of shot end location — goalmouth height in yards (0-8). NULL for off-target shots."
      - name: shot_body_part
        data_type: string
        description: Body part used for the shot
      - name: shot_technique
        data_type: string
        description: Shot technique classification
      - name: shot_type
        data_type: string
        description: Shot type classification (Open Play, Free Kick, Penalty, etc.)
      - name: is_first_time
        data_type: boolean
        description: Whether the shot was taken first-time
      - name: play_pattern
        data_type: string
        description: "Play pattern (e.g., Regular Play, From Corner). StatsBomb only; NULL for Wyscout."
      - name: game_state
        data_type: string
        description: >
          Game state from the shooting team's perspective at the moment of
          the shot: winning, losing, or drawing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winning', 'losing', 'drawing']

  - name: fct_passes
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer pass fact table with progressive pass identification.
      Contains every pass from all sources with pass metrics, progressive
      pass flag, and pass network building blocks. One row per pass.
    columns:
      - name: pass_id
        data_type: string
        description: Unique pass identifier (surrogate of match_key + event_id + data_source).
        data_tests:
          - unique
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches.match_key (ADR-011). Native match_id is recoverable via JOIN dim_matches ON match_key.
        data_tests:
          - not_null
      - name: competition_key
        data_type: bigint
        description: Kimball surrogate FK to dim_competitions.competition_key (ADR-011, PR 2). NULL for Metrica (no competition metadata).
      - name: player_id
        data_type: int
        description: Foreign key to dim_players (NULL for IDSSE/Metrica — see stg_*__passes).
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams (NULL for IDSSE/Metrica — see stg_*__passes).
      - name: team_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_teams (PR 7 — populated for all providers
          via dim_teams JOIN on (provider, native_team_id)). PR 7 hotfix #2:
          IDSSE staging now reads the DFL-CLU code from `play_team` directly
          (the bridge JOIN was an obsolete intermediate that 100%-NULL'd team_key
          for every IDSSE row).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: passer_player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 7 — populated for all providers
          via dim_players JOIN on (provider, native_player_id)). PR 7 hotfix #2:
          Metrica staging now strips the 'Player' / 'Player ' prefix from the
          source player column so the synthesized native_player_id matches the
          form dim_players uses (bare numeric per the tracking JSON map keys).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: recipient_player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players for recipient (PR 7 — NULL when
          recipient is unknown, e.g. Wyscout open-data has no recipient field
          + incomplete passes for any provider).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: start_x
        data_type: double
        description: Starting X coordinate (120-yard scale). May slightly exceed bounds for off-pitch events (corner kicks at endline, throw-ins).
        data_tests:
          # Range relaxed 2026-04-27 to [-2, 122]: legitimate off-pitch
          # events (corner kicks at exactly 120, Metrica throw-ins at -1.85)
          # were firing warn-severity at [0, 120]. Float-precision drift on
          # Metrica's 0-1 → 0-120 rescale also contributes. Test still
          # detects coordinate-system inversions or normalizer bugs that
          # shift values into the 1000s.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -2
                max_value: 122
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        data_type: double
        description: Starting Y coordinate (80-yard scale). May slightly exceed bounds for off-pitch events (throw-ins past the touchline).
        data_tests:
          # Range relaxed 2026-04-27 to [-2, 82]: legitimate throw-in
          # positions on/over the touchline + Metrica float-precision on
          # 0-1 → 0-80 rescale. See start_x rationale above.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -2
                max_value: 82
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        data_type: double
        description: Ending X coordinate (120-yard scale)
      - name: end_y
        data_type: double
        description: Ending Y coordinate (80-yard scale)
      - name: is_progressive
        data_type: boolean
        description: Whether the pass moved the ball significantly closer to goal
      - name: is_complete
        data_type: boolean
        description: Whether the pass was completed successfully
      - name: pass_outcome
        data_type: string
        description: Pass result (Complete, Incomplete, Out, etc.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['Complete', 'Incomplete', 'Out', 'Pass Offside', 'Injury Clearance', 'Unknown']
              config:
                severity: warn
      - name: pass_direction
        data_type: string
        description: Pass direction (forward, backward, lateral)
        data_tests:
          - accepted_values:
              arguments:
                values: ['forward', 'backward', 'lateral']
      - name: period
        data_type: bigint
        description: Match period
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout, idsse, metrica)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica']
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions (NULL for Wyscout and tracking providers — resolved via dim_matches at PR 2).
      - name: season_id
        data_type: int
        description: Season identifier (NULL for Wyscout and tracking providers).
      - name: minute
        data_type: bigint
        description: Match minute of the pass
      - name: second
        data_type: bigint
        description: Match second of the pass
      - name: pass_type
        data_type: string
        description: Pass type classification
      - name: pass_height
        data_type: string
        description: Pass height (Ground Pass, Low Pass, High Pass)
      - name: body_part
        data_type: string
        description: Body part used for the pass
      - name: pass_length
        data_type: double
        description: Pass length in yards
      - name: pass_angle_radians
        data_type: double
        description: Pass angle in radians
      - name: is_cross
        data_type: boolean
        description: Whether the pass was a cross
      - name: is_switch
        data_type: boolean
        description: Whether the pass was a switch of play
      - name: is_through_ball
        data_type: boolean
        description: Whether the pass was a through ball
      - name: pass_recipient_id
        data_type: int
        description: Foreign key to dim_players — player who received the pass (NULL for Wyscout and incomplete passes)
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
                where: "pass_recipient_id is not null AND data_source = 'statsbomb'"
      - name: is_line_breaking
        data_type: boolean
        description: >
          Whether the pass breaks through at least one opponent defensive line.
          Detected via Ward hierarchical clustering of opponent positions.
          Available for StatsBomb 360 matches and Metrica tracking matches only.
      - name: lines_broken
        data_type: int
        description: Number of defensive lines broken (0-3)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: line_breaking_type
        data_type: string
        description: >
          Type of line break — 'through' (between defenders) or 'around'
          (outside outermost defender via sideline). NULL for non-line-breaking passes.
        data_tests:
          - accepted_values:
              arguments:
                values: ['through', 'around']
              config:
                severity: warn
                where: "line_breaking_type is not null"
      - name: game_state
        data_type: string
        description: >
          Game state from the passing team's perspective at the moment of
          the pass: winning, losing, or drawing.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winning', 'losing', 'drawing']

  - name: fct_player_stats
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-90-minute player aggregation table. Contains rolling and seasonal
      statistics normalized to per-90 rates for fair comparison across
      players with different minutes played. Grain: one row per
      (player_id, competition_id, season_id, data_source) — PR 5a added
      data_source to the grain so dim_players resolves player_key uniquely.
    columns:
      - name: player_stats_id
        data_type: string
        description: Surrogate key (player_id + competition_id + season_id + data_source).
        data_tests:
          - unique
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players.player_key (ADR-011, PR 5a).
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: player_key
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams.team_key. Nullable — aggregate spans teams.
      - name: player_id
        data_type: int
        description: >
          LEGACY native player identifier. 1 NULL outlier (match 3825894)
          previously warn-suppressed; closed in PR 5a via INNER JOIN to
          dim_players. Retained for the coordinated 2026-07-22 dual-column
          sunset per ADR-011.
        data_tests:
          - not_null
      - name: data_source
        data_type: string
        description: Provider origin (statsbomb/wyscout/idsse/metrica) — part of the grain post-PR-5a.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica']
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: minutes_played
        data_type: bigint
        description: Total minutes played
      - name: total_shots
        data_type: bigint
        description: Total shots taken
      - name: total_goals
        data_type: bigint
        description: Total goals scored
      - name: total_xg
        data_type: double
        description: Total expected goals
      - name: pass_completion_pct
        data_type: decimal(26,1)
        description: Pass completion percentage (0-100)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: goals_per_90
        data_type: decimal(28,2)
        description: Goals scored per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5
                row_condition: "goals_per_90 is not null"
              config:
                severity: warn
      - name: xg_per_90
        data_type: double
        description: Expected goals per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5
                row_condition: "xg_per_90 is not null"
              config:
                severity: warn
      - name: passes_per_90
        data_type: decimal(28,2)
        description: Total passes attempted per 90 minutes
      - name: progressive_passes_per_90
        data_type: decimal(28,2)
        description: Progressive passes per 90 minutes
      - name: shots_on_target
        data_type: bigint
        description: Total shots on target
      - name: total_passes
        data_type: bigint
        description: Total passes attempted
      - name: completed_passes
        data_type: bigint
        description: Total passes completed
      - name: progressive_passes
        data_type: bigint
        description: Total progressive passes
      - name: assists_per_90
        data_type: double
        description: Assists per 90 minutes (NULL until assist data available)
      - name: xg_overperformance
        data_type: double
        description: Goals minus xG (positive = clinical finisher)
      - name: line_breaking_passes
        data_type: bigint
        description: Total number of line-breaking passes
      - name: line_breaking_per_90
        data_type: decimal(28,2)
        description: Line-breaking passes per 90 minutes. Top-class playmakers (deep-lying CMs, ball-playing CBs) routinely exceed 20/90.
        data_tests:
          # Ceiling raised 2026-04-27 from 20 → 70: empirical max on
          # dev_gold is ~50/90 with adequate minutes (e.g. 1322 line-breakers
          # over 3053 minutes = 38.97/90), and small-minute substitutes can
          # legitimately hit higher per-90 rates. 20 was always too low —
          # the test was firing on legitimate top-tier playmakers, not bugs.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 70
                row_condition: "line_breaking_per_90 is not null"
              config:
                severity: warn
      - name: total_vaep
        data_type: double
        description: Total VAEP value across all actions
      - name: total_offensive_vaep
        data_type: double
        description: Total offensive VAEP value
      - name: total_defensive_vaep
        data_type: double
        description: Total defensive VAEP value
      - name: total_actions
        data_type: bigint
        description: Total number of SPADL actions
      - name: vaep_per_90
        data_type: double
        description: Net VAEP per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
                row_condition: "vaep_per_90 is not null"
              config:
                severity: warn
      - name: offensive_vaep_per_90
        data_type: double
        description: Offensive VAEP per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
                row_condition: "offensive_vaep_per_90 is not null"
              config:
                severity: warn
      - name: defensive_vaep_per_90
        data_type: double
        description: Defensive VAEP per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
                row_condition: "defensive_vaep_per_90 is not null"
              config:
                severity: warn
      - name: total_defcon
        data_type: double
        description: Total DEFCON value (NULL if defcon_enabled is false)
      - name: defcon_credits
        data_type: bigint
        description: Total number of defensive credits
      - name: defcon_per_90
        data_type: double
        description: DEFCON-lite total value per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 10
                row_condition: "defcon_per_90 is not null"
              config:
                severity: warn
      - name: intercept_per_90
        data_type: double
        description: DEFCON Intercept value per 90 minutes
      - name: deter_per_90
        data_type: double
        description: DEFCON Deter value per 90 minutes

  - name: fct_action_values
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer SPADL action values with VAEP scores. Contains every on-ball
      action from all data sources converted to the SPADL unified format,
      scored with offensive, defensive, and net VAEP values. Enables player
      ranking by total contribution beyond goals/assists.
      Coordinate system: 105x68 meters (SPADL academic standard).
      One row per action.
    columns:
      - name: action_value_id
        data_type: string
        description: Unique action identifier (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches.match_key (ADR-011, PR 4b). Primary match identifier.
        data_tests:
          - not_null
      - name: competition_key
        data_type: bigint
        description: Kimball surrogate FK to dim_competitions.competition_key (ADR-011, PR 4b). Nullable.
      - name: match_id
        data_type: bigint
        description: >
          LEGACY native match identifier (BIGINT). Retained for the 90-day
          dual-column window (sunset 2026-07-22 per ADR-011 policy). Use
          match_key for new consumer code.
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — populated for all SB+WS actions via dim_teams JOIN on (provider, native_team_id)).
        data_tests:
          - not_null:
              config:
                where: "data_source IN ('statsbomb', 'wyscout')"
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — populated for all SB+WS actions via dim_players JOIN on (provider, native_player_id)).
        data_tests:
          - not_null:
              config:
                where: "data_source IN ('statsbomb', 'wyscout')"
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: competition_id
        data_type: int
        description: >
          LEGACY native competition identifier. Retained for the 90-day
          dual-column window (sunset 2026-07-22). Use competition_key.
      - name: season_id
        data_type: int
        description: Season identifier
      - name: period
        data_type: int
        description: Match period (1-5)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: time_seconds
        data_type: double
        description: Seconds from period start (SPADL academic convention — period-local).
      - name: minute
        data_type: int
        description: >
          Match-absolute minute (period 1 = time_seconds / 60; period 2 = 45 +
          time_seconds / 60; period 3 = 90 + time_seconds / 60; period 4 = 105 +
          time_seconds / 60; period 5 = 120 + time_seconds / 60). Aligned with
          fct_shots.minute and bronze statsbomb_events.minute so displays in
          Taipy show the same value regardless of which mart the event came
          from. Guarded by tests/assert_fct_action_values_minute_match_absolute.sql.
      - name: second
        data_type: int
        description: Second within the current minute (match-absolute minute, but modulo-60 so 0..59).
      - name: start_x
        data_type: double
        description: Action start X coordinate (0-105 meters)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 105
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        data_type: double
        description: Action start Y coordinate (0-68 meters)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 68
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        data_type: double
        description: Action end X coordinate (0-105 meters)
      - name: end_y
        data_type: double
        description: Action end Y coordinate (0-68 meters)
      - name: action_type
        data_type: string
        description: SPADL action type name (23 types)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pass
                  - cross
                  - throw_in
                  - freekick_crossed
                  - freekick_short
                  - corner_crossed
                  - corner_short
                  - take_on
                  - foul
                  - tackle
                  - interception
                  - shot
                  - shot_penalty
                  - shot_freekick
                  - keeper_save
                  - keeper_claim
                  - keeper_punch
                  - keeper_pick_up
                  - clearance
                  - bad_touch
                  - non_action
                  - dribble
                  - goalkick
      - name: action_result
        data_type: string
        description: Action result (success, fail, offside, owngoal, yellow_card, red_card)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'fail', 'offside', 'owngoal', 'yellow_card', 'red_card']
      - name: bodypart
        data_type: string
        description: Body part used for the action
      - name: offensive_value
        data_type: double
        description: VAEP offensive value (change in scoring probability)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 1
                row_condition: "offensive_value is not null"
              config:
                severity: warn
      - name: defensive_value
        data_type: double
        description: VAEP defensive value (change in conceding probability)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 1
                row_condition: "defensive_value is not null"
              config:
                severity: warn
      - name: vaep_value
        data_type: double
        description: Net VAEP value (offensive + defensive)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 1
                row_condition: "vaep_value is not null"
              config:
                severity: warn
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: original_event_id
        data_type: string
        description: Original event ID from source data (NULL for synthetic dribbles)
      - name: possession_id
        data_type: bigint
        description: >
          StatsBomb possession sequence number identifying the possession
          chain this action belongs to. NULL for Wyscout (no possession
          tracking in open data).
      - name: possession_team_id
        data_type: int
        description: >
          Team ID of the team in possession during this action.
          NULL for Wyscout.
      - name: game_state
        data_type: string
        description: >
          Game state from the acting team's perspective at the moment of
          this action: winning, losing, or drawing. Derived from
          int_running_score cumulative scoreline.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['winning', 'losing', 'drawing']
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when the action values were loaded into the gold table

  - name: fct_match_summary
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Match-level aggregate metrics. Contains one row per match with
      team-level statistics including xG, possession percentage, pass
      completion rate, shot counts, and other summary metrics.
    columns:
      - name: match_key
        data_type: bigint
        description: Kimball surrogate primary key — FK to dim_matches.match_key (ADR-011).
        data_tests:
          - unique
          - not_null
      - name: competition_key
        data_type: bigint
        description: Kimball surrogate FK to dim_competitions.competition_key (ADR-011, PR 2). NULL for Metrica (no competition metadata).
      - name: competition_id
        data_type: int
        description: Legacy native INT competition identifier. NULL for IDSSE/Metrica (non-numeric / absent). Retained for backward compat; use competition_key for new consumers.
      - name: season_id
        data_type: int
        description: Season identifier (NULL for IDSSE/Metrica).
      - name: home_team_id
        data_type: int
        description: Foreign key to dim_teams (NULL for non-StatsBomb rows in PR 2).
      - name: away_team_id
        data_type: int
        description: Foreign key to dim_teams (NULL for non-StatsBomb rows in PR 2).
      - name: home_team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (home team) — PR 7 hotfix #3 extended resolution to all providers via int_tracking__match_side_team_bridge for tracking-derived providers (IDSSE/Metrica/SkillCorner); SB/WS continue via event-team-id pivot.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: away_team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (away team) — PR 7 hotfix #3 extended resolution to all providers via int_tracking__match_side_team_bridge.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: match_date
        data_type: date
        description: Date the match was played (NULL for IDSSE/Metrica).
      - name: home_xg
        data_type: double
        description: Total home team expected goals
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20
                row_condition: "home_xg is not null"
              config:
                severity: warn
      - name: away_xg
        data_type: double
        description: Total away team expected goals
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20
                row_condition: "away_xg is not null"
              config:
                severity: warn
      - name: home_score
        data_type: int
        description: Final home team score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 30
                row_condition: "home_score is not null"
      - name: away_score
        data_type: int
        description: Final away team score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 30
                row_condition: "away_score is not null"
      - name: home_possession_pct
        data_type: decimal(26,1)
        description: Home team possession percentage
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: home_pass_completion_pct
        data_type: decimal(26,1)
        description: Home team pass completion percentage
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: away_pass_completion_pct
        data_type: decimal(26,1)
        description: Away team pass completion percentage
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: match_result
        data_type: string
        description: Match result (home_win, away_win, draw)
        data_tests:
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']
      - name: home_team_name
        data_type: string
        description: Home team display name
      - name: away_team_name
        data_type: string
        description: Away team display name
      - name: home_shots
        data_type: bigint
        description: Total home team shots
      - name: home_goals
        data_type: bigint
        description: Total home team goals (from shot events)
      - name: home_shots_on_target
        data_type: bigint
        description: Home team shots on target
      - name: away_shots
        data_type: bigint
        description: Total away team shots
      - name: away_goals
        data_type: bigint
        description: Total away team goals (from shot events)
      - name: away_shots_on_target
        data_type: bigint
        description: Away team shots on target
      - name: home_total_passes
        data_type: bigint
        description: Total home team passes
      - name: home_completed_passes
        data_type: bigint
        description: Home team completed passes
      - name: home_progressive_passes
        data_type: bigint
        description: Home team progressive passes
      - name: away_total_passes
        data_type: bigint
        description: Total away team passes
      - name: away_completed_passes
        data_type: bigint
        description: Away team completed passes
      - name: away_progressive_passes
        data_type: bigint
        description: Away team progressive passes
      - name: xg_difference
        data_type: double
        description: Home xG minus away xG (positive = home advantage)
      - name: home_ppda
        data_type: decimal(25,2)
        description: >
          Home team Passes Per Defensive Action. Lower = more aggressive press.
          NULL when zero defensive actions. StatsBomb matches only.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                row_condition: "home_ppda is not null"
              config:
                severity: warn
      - name: away_ppda
        data_type: decimal(25,2)
        description: >
          Away team Passes Per Defensive Action. Lower = more aggressive press.
          NULL when zero defensive actions. StatsBomb matches only.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                row_condition: "away_ppda is not null"
              config:
                severity: warn

  - name: fct_tracking_frames
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Enriched tracking data from all providers (Metrica, IDSSE, SkillCorner).
      Contains spatial analysis outputs including player speeds, distance to
      ball, and velocity components. Supports mixed frame rates (25fps
      Metrica/IDSSE, 10fps SkillCorner). One row per player per frame.
    columns:
      - name: tracking_id
        data_type: string
        description: Primary key from staging models
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (prefixed by provider)
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier
        data_tests:
          - not_null
      - name: source_provider
        data_type: string
        description: Tracking data provider (metrica, idsse, skillcorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica', 'idsse', 'skillcorner']
      - name: is_goalkeeper
        data_type: boolean
        description: >
          Whether this player is the goalkeeper. Derived from provider metadata:
          IDSSE (PlayingPosition='TW'), SkillCorner (kloppy PositionType.Goalkeeper),
          Metrica (EPTS PlayingPosition or jersey #1 heuristic).
        data_tests:
          - not_null
      - name: frame_rate
        data_type: bigint
        description: Frame rate in fps (25 for Metrica/IDSSE, 10 for SkillCorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10, 25]
      - name: distance_to_ball
        data_type: double
        description: Euclidean distance from player to ball (yards)
      - name: speed
        data_type: double
        description: >
          Player speed in coordinate-units/second (120x80 pitch scale).
          NULL for the first frame of each (match_id, player_id, period) partition.
      - name: pitch_control_value
        data_type: double
        description: >
          Pitch control probability [0,1] at this player's location.
          Computed using Fernandez & Bornn (2018) model. NULL until ML pipeline.
      - name: period
        data_type: int
        description: Match period (1 or 2)
      - name: frame
        data_type: int
        description: Frame number within the period
      - name: timestamp_seconds
        data_type: double
        description: Timestamp in seconds from period start
      - name: team
        data_type: string
        description: Team affiliation (home or away)
      - name: x
        data_type: double
        description: Player X coordinate (120-yard scale)
      - name: y
        data_type: double
        description: Player Y coordinate (80-yard scale)
      - name: ball_x
        data_type: double
        description: Ball X coordinate (120-yard scale)
      - name: ball_y
        data_type: double
        description: Ball Y coordinate (80-yard scale)
      - name: velocity_x
        data_type: double
        description: Player velocity in X direction (coordinate-units/second)
      - name: velocity_y
        data_type: double
        description: Player velocity in Y direction (coordinate-units/second)
      - name: velocity_x_ms
        data_type: double
        description: Player velocity in X direction (m/s, anisotropic-scaled)
      - name: velocity_y_ms
        data_type: double
        description: Player velocity in Y direction (m/s, anisotropic-scaled)
      - name: speed_ms
        data_type: double
        description: >
          Player speed in m/s. Uses anisotropic scaling (x*105/120, y*68/80)
          since StatsBomb x and y scales differ. NULL for the first frame of
          each (match_id, player_id, period) partition.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 15
                row_condition: "speed_ms is not null"
              config:
                severity: warn
      - name: acceleration_ms2
        data_type: double
        description: >
          Player acceleration in m/s^2. Computed as (speed_ms - prev_speed_ms)
          * frame_rate. NULL for the first two frames of each partition.
      - name: voronoi_area
        data_type: double
        description: Voronoi cell area controlled by player (NULL until spatial pipeline)
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 hotfix #3 — populated for all 3 tracking providers post idsse_ prefix strip at staging).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_matches')
                field: match_key
      - name: team_id
        data_type: string
        description: Native team identifier (provider-canonical post staging fixes).
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 hotfix #3 — populated for all 3 tracking providers via canonicalized native_team_id).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 hotfix #3 — populated for all 3 tracking providers post Metrica Player-prefix strip at staging).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: data_source
        data_type: string
        description: Data provider (alias of source_provider for cross-mart consistency).

  - name: fct_player_embeddings
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-match player embedding vectors for similarity search. Dual-vector
      design: behavioral_vector (32-dim Doc2Vec from football2vec event
      sequences) and stat_vector (13-dim z-score normalized per-90 stats).
      One row per player per match.
    columns:
      - name: embedding_id
        data_type: string
        description: Surrogate key (canonical_player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: Foreign key to dim_players (unified player identifier)
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 5b, ADR-011). LEFT JOIN
          on canonical_player_id; nullable for upstream rows whose
          dim_players row hasn't materialised yet (live coverage 100% at
          PR 5b ship). Coexists with canonical_player_id during the
          2026-07-22 dual-column window; PR 8 drops canonical_player_id.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_matches (PR 5b, ADR-011). LEFT JOIN
          on (provider='statsbomb', try_cast(native_match_id as bigint)
          = match_id). Nullable for Wyscout rows (data_source='wyscout')
          where the SB-only filter doesn't match; downstream
          fct_player_embeddings_season + _season_360 INNER JOIN
          fct_match_summary on match_key, so unmatched rows are excluded
          from the season aggregates (same behaviour as the PR 5a CI-
          triage dim_matches bridge that this column retires).
        data_tests:
          - relationships:
              to: ref('dim_matches')
              field: match_key
              config:
                severity: warn
      - name: data_source
        data_type: string
        description: Data provider or model variant (statsbomb, wyscout, football2vec_360)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'football2vec_360']
      - name: behavioral_vector
        data_type: array<double>
        description: >
          32-dim Doc2Vec embedding capturing playing style from event sequences
          (action type + pitch grid location tokens). Generated by football2vec.
        data_tests:
          - not_null
      - name: stat_vector
        data_type: array<double>
        description: >
          13-dim z-score normalized per-90 statistics (nullable). Contains
          goals, assists, xG, key passes, etc. NULL when stat data unavailable.

  - name: fct_player_embeddings_season
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per player-competition-season aggregation of embedding vectors.
      Behavioral vectors are averaged element-wise across all matches in the
      season. Enables season-level similarity search and style evolution
      analysis. One row per player per competition per season.
    columns:
      - name: embedding_season_id
        data_type: string
        description: Surrogate key (canonical_player_id + competition_id + season_id)
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: Foreign key to dim_players (unified player identifier)
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 5b, ADR-011). Passed
          through from fct_player_embeddings via any_value() in the
          season aggregate. Coexists with canonical_player_id during the
          2026-07-22 dual-column window.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
        data_tests:
          - not_null
      - name: season_id
        data_type: int
        description: Season identifier
        data_tests:
          - not_null
      - name: behavioral_vector
        data_type: array<double>
        description: >
          Element-wise mean of 32-dim behavioral vectors across all matches
          in this competition-season.
        data_tests:
          - not_null
      - name: stat_vector
        data_type: array<double>
        description: >
          13-dim stat vector (any_value from the competition-season group).
          NULL when stat data unavailable.
      - name: matches_in_sample
        data_type: bigint
        description: Number of matches contributing to this aggregation
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
      - name: data_sources
        data_type: array<string>
        description: Array of distinct data providers contributing to this aggregation

  - name: fct_player_embeddings_career
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Career-level aggregation of player embedding vectors. Averages all
      match-level embeddings across competitions and seasons into a single
      career embedding per player. Both behavioral and stat vectors are
      averaged element-wise. One row per canonical_player_id.
    columns:
      - name: canonical_player_id
        data_type: string
        description: Primary key — unified player identifier
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 5b, ADR-011). Passed
          through from fct_player_embeddings via any_value() in the
          career aggregate. Coexists with canonical_player_id during the
          2026-07-22 dual-column window.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
      - name: behavioral_vector
        data_type: array<double>
        description: >
          Element-wise mean of 32-dim behavioral vectors across all career
          matches.
        data_tests:
          - not_null
      - name: stat_vector
        data_type: array<double>
        description: >
          Element-wise mean of 13-dim stat vectors across all career matches.
          NULL stat_vectors are excluded from the mean. NULL when no stat
          data available for any match.
      - name: total_matches
        data_type: bigint
        description: Total number of matches contributing to this career embedding
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 1000
      - name: data_sources
        data_type: array<string>
        description: Array of distinct data providers contributing to this aggregation

  - name: fct_physical_stats
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-player per-match physical performance metrics from tracking data.
      Aggregates distance, speed, acceleration, and sprint metrics from
      fct_tracking_frames. One row per (player_id, match_id). Only available
      for tracking matches (Metrica, IDSSE, SkillCorner).
    columns:
      - name: physical_stats_id
        data_type: string
        description: Surrogate key (player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: source_provider
        data_type: string
        description: Tracking data provider (metrica, idsse, skillcorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica', 'idsse', 'skillcorner']
      - name: frame_rate
        data_type: bigint
        description: Frame rate in fps
      - name: minutes_played
        data_type: decimal(36,25)
        description: Estimated minutes played (from frame range)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 150
                row_condition: "minutes_played is not null"
              config:
                severity: warn
      - name: total_distance_m
        data_type: double
        description: Total distance covered in meters
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20000
                row_condition: "total_distance_m is not null"
              config:
                severity: warn
      - name: total_distance_km
        data_type: double
        description: Total distance covered in kilometers
      - name: hsr_distance_m
        data_type: double
        description: Distance covered at high speed (>= 5.5 m/s) in meters
      - name: sprint_distance_m
        data_type: double
        description: Distance covered at sprint speed (>= 7.0 m/s) in meters
      - name: sprint_frame_count
        data_type: bigint
        description: Number of frames at sprint speed
      - name: high_accel_count
        data_type: bigint
        description: Number of frames with acceleration >= 3.0 m/s^2
      - name: high_decel_count
        data_type: bigint
