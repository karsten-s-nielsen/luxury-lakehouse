                max_value: 1
              config:
                severity: warn
      - name: xg_gradient_boosted
        data_type: double
        description: Calibrated XGBoost xG (all 13 features)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

  - name: fct_xg_predictions_v2
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer v2 xG predictions (Deep Sets set encoder with MC dropout
      confidence intervals). Kimball keys (match_key, competition_key)
      inherited from fct_shots via INNER JOIN on shot_id per ADR-013 —
      first mart applying the ML-inference-outputs pattern (consumer-side
      counterpart to ADR-012 producer-side weight delivery). Enabled via
      var 'xg_v2_enabled' (default false; flipped on in Databricks job
      config). Legacy competition_id INT retained nullable for consumers
      that still filter on native id; removed in PR 8 sweep.
    columns:
      - name: shot_id
        data_type: string
        description: md5(event_id || '-' || data_source). FK to fct_shots.shot_id.
        data_tests:
          - not_null
          - unique
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (inherited from fct_shots via INNER JOIN on shot_id).
        data_tests:
          - not_null
      - name: competition_key
        data_type: bigint
        description: Kimball surrogate FK to dim_competitions (inherited from fct_shots). Always populated — v2 scores only SB+WS shots.
      - name: competition_id
        data_type: int
        description: Legacy INT competition id, nullable (inherited from fct_shots). Scheduled for removal in PR 8 sweep per ADR-011.
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — inherited from fct_shots via INNER JOIN on shot_id).
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — inherited from fct_shots via INNER JOIN on shot_id).
      - name: xg_set_encoder
        data_type: double
        description: v2 Deep Sets + MC dropout mean xG prediction.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "xg_set_encoder is not null"
              config:
                severity: warn
      - name: xg_ci_lower
        data_type: double
        description: v2 xG 95% CI lower bound.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "xg_ci_lower is not null"
              config:
                severity: warn
      - name: xg_ci_upper
        data_type: double
        description: v2 xG 95% CI upper bound.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "xg_ci_upper is not null"
              config:
                severity: warn

  - name: fct_pausa_values
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer per-pass PAUSA decomposition: temporal judgment, spatial
      selection, and composite PAUSA score. Keys inherited via INNER JOIN
      to fct_passes on pass_id per ADR-013 (consumer-side ML inference output
      pattern; second application after PR 3 fct_xg_predictions_v2). Enabled
      via var 'pausa_enabled' (default true). Reference Lee et al. (2026).
    columns:
      - name: pass_id
        data_type: string
        description: >
          Kimball surrogate FK to fct_passes (md5(match_key || '-' || event_id
          || '-' || data_source) — same dbt_utils.generate_surrogate_key recipe
          fct_passes uses). Resolved in stg_pausa__values from the bronze
          writer's prefixed native id; the relationships test below is the
          structural guard that catches recipe drift between staging and the
          identity-fact mart on first build.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fct_passes')
                field: pass_id
      - name: match_id
        data_type: string
        description: Native prefixed match identifier (e.g. `idsse_J03WMX`); preserved for parity with the obso-pausa-values HF dataset shape during the dual-column window.
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — inherited from fct_passes via INNER JOIN on pass_id).
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — inherited from fct_passes via INNER JOIN on pass_id).
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — passer player; inherited from fct_passes.passer_player_key via INNER JOIN).
      - name: player_id
        data_type: string
        description: Native passer player identifier (legacy — IDSSE OBJ STRING).
      - name: team
        data_type: string
        description: Team role string ('home'/'away' or DFL CLU code per source).
      - name: period
        data_type: int
        description: Match period (1 or 2).
      - name: timestamp_seconds
        data_type: double
        description: Event timestamp in seconds from period start.
      - name: frame_id
        data_type: int
        description: Aligned tracking frame identifier.
      - name: temporal_judgment
        data_type: double
        description: Ratio of actual to peak OBSO (0–1, higher = better release timing).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: spatial_selection
        data_type: double
        description: Ratio of actual to optimal OBSO (0–1, higher = better receiver choice).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: pausa_score
        data_type: double
        description: Composite PAUSA = temporal × spatial (0–1, higher = better timing + selection).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: actual_obso
        data_type: double
        description: OBSO value at pass release.
      - name: peak_obso
        data_type: double
        description: Peak OBSO in the temporal evaluation window.
      - name: optimal_obso
        data_type: double
        description: Optimal OBSO across all available receivers at release time.
      - name: receiver_x
        data_type: double
        description: Receiver X coordinate (StatsBomb 120×80 normalized).
      - name: receiver_y
        data_type: double
        description: Receiver Y coordinate (StatsBomb 120×80 normalized).

  # ── Dimension Tables ──────────────────────────────────────────────────

  - name: dim_players
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Conformed player dimension (ADR-011 PR 5a). 4-provider union with Kimball
      surrogate player_key + preserved canonical_player_id legacy hash (for
      Hyrum's Law compat across 57 downstream files + HF datasets).
      canonical_player_key collapses xref-matched pairs per entity resolution.
      Metrica siloed by design (anonymised; no cross-provider xref possible).
      Grain: one row per (provider, native_player_id).
    columns:
      - name: player_key
        data_type: bigint
        description: Kimball surrogate (xxhash64 of provider|native_player_id).
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: >
          Legacy string hash preserved for downstream compat through the
          coordinated 2026-07-22 sunset (ADR-011). 57 files + HF embedding
          datasets reference this column.
        data_tests:
          - not_null
      - name: canonical_player_key
        data_type: bigint
        description: xref-resolved canonical pointer (SB > WS > IDSSE), or self.
        data_tests:
          - not_null
      - name: provider
        data_type: string
        description: Provider label for this row (5-provider union post-PR-7; SkillCorner onboarded for tracking-only data).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica', 'skillcorner']
      - name: native_player_id
        data_type: string
        description: Stringified native provider ID (real for SB/WS/IDSSE; synthesised for Metrica anonymised).
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: >
          Legacy native integer (StatsBomb + Wyscout only). Dual-column window
          through 2026-07-22 per ADR-011. NULL for IDSSE/Metrica rows.
      - name: player_name
        data_type: string
      - name: player_display_name
        data_type: string
      - name: primary_position
        data_type: string
      - name: position_group
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['Goalkeeper', 'Defender', 'Midfielder', 'Forward']
              config:
                severity: warn
      - name: statsbomb_player_id
        data_type: int
        description: SB native ID when row is SB; otherwise NULL.
      - name: wyscout_player_id
        data_type: int
        description: WS native ID when row is WS; otherwise NULL.
      - name: idsse_player_id
        data_type: string
        description: IDSSE DFL PersonId when row is IDSSE; otherwise NULL.
      - name: match_confidence
        data_type: double
      - name: match_layer
        data_type: int
      - name: birth_date
        data_type: string
      - name: nationality
        data_type: string
      - name: is_synthesized
        data_type: boolean
        data_tests:
          - not_null
      - name: is_anonymized
        data_type: boolean
      - name: synthesis_reason
        data_type: string
      - name: data_sources
        data_type: string
        description: Provider label (same as provider col; retained for backward compat). PR 7 adds 'skillcorner'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica', 'skillcorner']

  - name: dim_teams
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Conformed team dimension (ADR-011 PR 5a). Kimball surrogate team_key
      across StatsBomb / Wyscout / IDSSE / Metrica. Synthesis flags mark
      Metrica anonymised + Wyscout unresolved-teamsdata fallback rows.
      team_name populated for Wyscout real rows from Figshare teams.json
      (ingestion gap closed in PR 5a).
      Grain: one row per (provider, native_team_id).
    columns:
      - name: team_key
        data_type: bigint
        description: Kimball surrogate (xxhash64 of provider|native_team_id).
        data_tests:
          - unique
          - not_null
      - name: provider
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica', 'skillcorner']
      - name: native_team_id
        data_type: string
        data_tests:
          - not_null
      - name: team_id
        data_type: bigint
        description: >
          Legacy native team_id (SB + WS real rows only). BIGINT matches
          upstream stg_*_events.team_id AND the pre-PR-5a synced-table PK.
          Changing the synced-table PK column type is unsupported
          (CHANGED_PRIMARY_KEY_COLUMN_TYPE), so we retain BIGINT regardless
          of the plan's original INT intent. Dual-column window through
          2026-07-22 per ADR-011. NULL for IDSSE / Metrica / Wyscout
          synth-fallback rows.
      - name: team_name
        data_type: string
      - name: canonical_team_key
        data_type: bigint
        description: xref-resolved canonical pointer (SB > WS > IDSSE), or self.
        data_tests:
          - not_null
      - name: is_synthesized
        data_type: boolean
        data_tests:
          - not_null
      - name: is_anonymized
        data_type: boolean
      - name: synthesis_reason
        data_type: string
      - name: data_source
        data_type: string
        description: >
          LEGACY provider label — preserved during the coordinated ADR-011
          dual-column window (sunset 2026-07-22 per PR 8). Same value as
          `team_data_source` and `provider`. Retained so Lakebase synced-table
          auto-evolution stays additive (drop would require destructive
          recreate; auto-evolution cannot handle DROP COLUMN). Consumer code
          should migrate to `provider` for new development.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica', 'skillcorner']
      - name: team_data_source
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica', 'skillcorner']

  - name: dim_competitions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Conformed competition dimension unifying StatsBomb + Wyscout + IDSSE
      + Metrica competitions. PR 2 (ADR-011) added `competition_key` as
      the surrogate primary key. PR 5a added a synthetic Metrica
      pseudo-competition row (native_competition_id='metrica-sample',
      provider='metrica') so anonymised sample-data matches surface in
      the Pass Map competition cascade alongside the three real-identity
      providers. The Metrica row has NULL country + gender per the
      anonymised-source constraint.
      extending the same pattern as `dim_matches.match_key` from matches
      to competitions.

      Grain: one row per (provider, native_competition_id). StatsBomb
      and Wyscout use separate integer competition-id spaces for the
      same leagues (e.g. La Liga is 11 in StatsBomb, 795 in Wyscout);
      both spaces are preserved as independent rows with different
      competition_keys. IDSSE uses DFL-COM-XXXXXX strings.
    columns:
      - name: competition_key
        data_type: bigint
        description: >
          Kimball surrogate primary key. Deterministic BIGINT hash of
          (provider, native_competition_id) via `generate_competition_key`.
          Used by migrated fact tables (PR 2+) as the competition FK.
        data_tests:
          - unique
          - not_null
      - name: provider
        data_type: string
        description: >
          Data source that produced this competition (statsbomb, wyscout,
          idsse, metrica). PR 5a added a 'metrica' pseudo-competition row
          (native_competition_id='metrica-sample') so Metrica passes
          surface in the Pass Map competition cascade.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica']
      - name: native_competition_id
        data_type: string
        description: >
          Source-system-native competition identifier, stringified.
          StatsBomb + Wyscout stringify their BIGINT IDs; IDSSE is
          natively string ('DFL-COM-XXXXXX'). Together with `provider`
          forms the natural key.
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: >
          Legacy native INT competition identifier (StatsBomb/Wyscout
          only). NULL for IDSSE (non-numeric native IDs). Retained for
          backward compatibility with unmigrated fact tables; will be
          dropped in PR 8 once all consumers switch to competition_key.
      - name: competition_name
        data_type: string
        description: Competition display name.
        data_tests:
          - not_null
      - name: country
        data_type: string
        description: Country where the competition is held.
      - name: gender
        data_type: string
        description: Gender category (male, female).
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'female']
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - provider
            - native_competition_id

  # ── PAUSA Tables ──────────────────────────────────────────────────────

  - name: fct_pass_timing
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-player per-match PAUSA pass timing aggregation. Temporal judgment,
      spatial selection, and composite PAUSA score aggregated at the
      player-match grain. One row per player per match.
    columns:
      - name: pass_timing_id
        data_type: string
        description: Surrogate key (player_id + match_id; PR 7 added).
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier (foreign key to dim_players)
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — passthrough from int_pausa__pass_quality).
      - name: match_id
        data_type: string
        description: Match identifier
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — passthrough from int_pausa__pass_quality).
      - name: player_display_name
        data_type: string
        description: Human-readable player name from dim_players
      - name: pass_count
        data_type: int
        description: Number of passes evaluated for PAUSA
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 500
              config:
                severity: warn
      - name: avg_temporal_judgment
        data_type: double
        description: >
          Average temporal judgment across passes. 1.0 = always released at
          the peak OBSO moment.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: avg_spatial_selection
        data_type: double
        description: >
          Average spatial selection across passes. 1.0 = always chose the
          optimal receiver.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: avg_pausa
        data_type: double
        description: >
          Average PAUSA composite score (temporal × spatial). Higher = better
          pass timing and target choice.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: median_pausa
        data_type: double
        description: Median PAUSA composite score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: passes_above_median_pausa
        data_type: int
        description: Number of passes with PAUSA score above 0.5
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when the row was materialized

  - name: fct_pausa_rankings
    description: >
      Player-level PAUSA aggregate with activity quality filters.
      One row per player, aggregated across all matches.
      Uses actual_obso > 0 as quality proxy for pass filtering.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: pausa_ranking_id
        data_type: string
        description: Surrogate key (player_id; PR 7 added).
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier.
        data_tests:
          - unique
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — passthrough from int_pausa__pass_quality).
      - name: player_display_name
        data_type: string
        description: Human-readable player name from dim_players.
      - name: total_matches
        data_type: int
        description: Number of distinct matches this player appears in.
      - name: total_passes
        data_type: int
        description: Total passes evaluated by PAUSA pipeline.
      - name: passes_with_value
        data_type: int
        description: >
          Passes with actual_obso > 0 (quality proxy for successful passes).
          Used as the primary activity filter threshold.
      - name: avg_pausa
        data_type: double
        description: Average PAUSA composite score across all passes (0-1, higher = better timing).
      - name: avg_temporal_judgment
        data_type: double
        description: Average temporal judgment component (0-1).
      - name: avg_spatial_selection
        data_type: double
        description: Average spatial selection component (0-1).
      - name: median_pausa
        data_type: double
        description: Median PAUSA score via percentile_approx.
      - name: total_minutes
        data_type: double
        description: >
          Sum of minutes_played from fct_physical_stats (tracking-derived).
          NULL if player has no tracking data. IDSSE-only for current dataset.
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_player_percentiles
    description: >
      Per-competition percentile ranks for player metrics.
      Provides calibration context for raw values (CHI-AUDIT-180 U1).
      Grain: one row per (player_id, competition_id, season_id).
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: player_id
        data_type: string
        description: Player identifier.
        data_tests:
          - not_null
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 5b, ADR-011). Pulled
          through from fct_player_stats which carries player_key via
          INNER JOIN to dim_players (PR 5a). Coexists with player_id
          during the 2026-07-22 dual-column window.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
      - name: competition_id
        data_type: int
        description: Competition identifier (partition key). NULL when upstream fct_player_stats has NULL.
      - name: season_id
        data_type: int
        description: Season identifier. NULL when upstream fct_player_stats has NULL.
      - name: player_display_name
        data_type: string
        description: Human-readable player name.
      - name: position_group
        data_type: string
        description: Position group used for percentile partitioning (Goalkeeper, Defender, Midfielder, Forward).
        data_tests:
          - not_null
          - accepted_values:
              values: ['Goalkeeper', 'Defender', 'Midfielder', 'Forward']
      - name: minutes_played
        data_type: double
        description: Total minutes played in this competition/season.
      - name: xg_per_90_pctile
        data_type: double
        description: Percentile rank of xG per 90 within competition/season/position_group (0-1).
      - name: goals_per_90_pctile
        data_type: double
        description: Percentile rank of goals per 90.
      - name: passes_per_90_pctile
        data_type: double
        description: Percentile rank of passes per 90.
      - name: progressive_passes_per_90_pctile
        data_type: double
        description: Percentile rank of progressive passes per 90.
      - name: pass_completion_pct_pctile
        data_type: double
        description: Percentile rank of pass completion percentage.
      - name: vaep_per_90_pctile
        data_type: double
        description: Percentile rank of VAEP per 90.
      - name: offensive_vaep_per_90_pctile
        data_type: double
        description: Percentile rank of offensive VAEP per 90.
      - name: defensive_vaep_per_90_pctile
        data_type: double
        description: Percentile rank of defensive VAEP per 90.
      - name: line_breaking_per_90_pctile
        data_type: double
        description: Percentile rank of line-breaking passes per 90.
      - name: defcon_per_90_pctile
        data_type: double
        description: Percentile rank of DEFCON per 90 (NULL when defcon_enabled=false).
      - name: avg_pausa_pctile
        data_type: double
        description: Percentile rank of avg PAUSA (NULL when pausa_enabled=false).
      - name: distance_per_minute_pctile
        data_type: double
        description: Percentile rank of distance per minute (NULL for non-tracking).
      - name: max_speed_pctile
        data_type: double
        description: Percentile rank of max speed (NULL for non-tracking).
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_workflow_costs
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: internal
        contains_pii: false
    description: >
      Gold-layer workflow cost attribution from Databricks system tables.
      Joins billing usage with list prices and attributes cost per-task
      proportionally by execution duration within each job run.
      90-day rolling window refreshed daily.
    columns:
      - name: task_key
        data_type: string
        description: >
          Databricks job task key, maps to workflow card entry_point.
        data_tests:
          - not_null
      - name: usage_date
        data_type: date
        description: Date the billing usage was recorded.
        data_tests:
          - not_null
      - name: job_run_id
        data_type: bigint
        description: Databricks job run identifier.
        data_tests:
          - not_null
      - name: workflow_id
        data_type: string
        description: >
          Workflow card identifier (e.g., wf-vaep). Resolved from
          task_workflow_mapping seed via task_key join. NULL for
          task_keys not yet mapped in the seed.
      - name: attributed_dbu
        data_type: decimal(10,4)
        description: >
          Proportional DBU consumption for this task within the job run.
          Attributed by execution_duration_seconds ratio.
      - name: attributed_cost_usd
        data_type: decimal(10,4)
        description: >
          Proportional dollar cost for this task within the job run.
          Attributed by execution_duration_seconds ratio.
      - name: execution_duration_seconds
        data_type: bigint
        description: >
          Total wall-clock duration from Databricks system tables
          (system.lakeflow.job_task_run_timeline). Includes cold start,
          pipeline work, and teardown.
      - name: duration_seconds
        data_type: int
        description: >
          Actual pipeline work duration in seconds from CostEstimateHook.
          Excludes cold start overhead (environment setup, wheel install,
          imports). NULL for runs predating hook deployment.
      - name: cold_start_seconds
        data_type: int
        description: >
          Environment setup overhead in seconds (serverless spin-up, wheel
          install, imports). Computed as warm-tier started_at minus cold-tier
          task_started_at. NULL when no warm-tier row matches the task's
          temporal join window — either runs predating hook deployment or
          runs where the warm-tier write was not observed before the join
          cutoff. GREATEST(..., 0) clamps small negative skews to 0 but
          propagates NULL (intended semantic: unknown, not zero).
      - name: entity_count
        data_type: int
        description: >
          Number of entities the guard found for this run (e.g., match count).
          NULL for runs predating hook deployment or when hook failed.
      - name: row_count
        data_type: int
        description: >
          Number of rows the pipeline wrote. NULL for runs predating hook
          deployment, SKIPPED runs (always 0), or when hook failed.
      - name: guard_duration_seconds
        data_type: int
        description: >
          Wall-clock seconds the skip guard check took. Includes the first
          Spark SQL query (which bears serverless executor spin-up cost)
          plus the anti-join to find new IDs. NULL for runs predating
          timed_check deployment. Use with cold_start_seconds to decompose:
          environment_setup = cold_start - guard_duration.
      - name: pipeline_state
        data_type: string
        description: >
          Pipeline outcome from CostEstimateHook: COMPLETED, SKIPPED, or ERROR.
          NULL for runs predating hook deployment.
      - name: estimated_cost_usd
        data_type: decimal(10,4)
        description: >
          Hook's per-task cost estimate (rate_usd_per_hour * duration).
          Independent of billing attribution — useful for comparing hook
          estimates against actual attributed_cost_usd. NULL for older runs.
      - name: effective_cost_usd
        data_type: decimal(10,4)
        description: >
          Best available cost: COALESCE(attributed_cost_usd, estimated_cost_usd).
          Shows actual billing cost when available (~1 day lag), falls back to
          hook estimate for recent runs. NULL only for pre-hook runs.
    data_tests:
      # Grain is (task_key, usage_date, job_run_id). Synced table
      # fct_workflow_costs_synced enforces this as a PG primary-key constraint;
      # without this compile-time gate, multiplications from the warm_tier
      # temporal-window join (workflow retries within 7 min) reach the synced
      # refresh and fail with PRIMARY_KEY_CONSTRAINT_VIOLATION. The terminal
      # QUALIFY in fct_workflow_costs.sql is the runtime guarantee; this is
      # the dbt-build-time gate that catches future regressions in CI.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - task_key
            - usage_date
            - job_run_id

  # ── Formation Detection ────────────────────────────────────────────────

  - name: fct_formation_labels
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer formation detection results per match, period, and team.
      Contains one row per detected formation window: the time range during
      which a given team held a specific shape, as identified by either the
      EFPI (Elastic Formation Position Identifier) algorithm (Hungarian method
      template matching) or the shape graph detector (Sotudeh 2026). The
      detector column distinguishes which algorithm produced each row. Sourced
      from the bronze formation_labels table written by the formations
      ingestion pipeline.
      References: Shaw & Glickman (2019), Sotudeh (2026).
    columns:
      - name: formation_label_id
        data_type: string
        description: Surrogate key (match_id + period + team + window_start_s + detector + source_provider; PR 7 added source_provider)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — resolved via dim_matches JOIN on (provider, native_match_id) with provider derived from staging match_id prefix).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_matches')
                field: match_key
      - name: period
        data_type: int
        description: Match period (1 or 2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 2
              config:
                severity: warn
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 hotfix #3 — resolved via int_tracking__match_side_team_bridge JOIN on (source_provider, match_id, side='home'/'away') → team_id → dim_teams).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: window_start_s
        data_type: double
        description: Window start time in seconds from period start
      - name: window_end_s
        data_type: double
        description: Window end time in seconds from period start
      - name: formation_label
        data_type: string
        description: "Detected formation label (e.g., 4-4-2, 4-3-3)"
        data_tests:
          - not_null
      - name: cost
        data_type: double
        description: >
          Hungarian matching cost for template fit. Lower values indicate a
          closer match between observed player positions and the formation
          template. Used to assess detection confidence.
      - name: detector
        data_type: string
        description: "Detection algorithm: efpi (Bekkers & Dabadghao 2025) or shape_graph (Sotudeh 2026)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['efpi', 'shape_graph']
      - name: data_source
        data_type: string
        description: Source provider (PR 7 — derived from match_id prefix in stg_formations__labels).
      - name: _ingested_at
        data_type: timestamp
        description: UTC timestamp when the row was written to the bronze table

  # ── Position Maps (Shape Graph) ──────────────────────────────────────

  - name: fct_player_positions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer per-frame position labels from the shape graph algorithm.
      Each row assigns a player to a tactical position (5-level vertical x
      5-level horizontal grid) for one tracking frame. Incremental by match_id.
      Reference: Sotudeh, S. (2026). Shape graph formation detection.
    columns:
      - name: position_id
        data_type: string
        description: Surrogate key (match_id + frame_id + player_id + source_provider; PR 7 added source_provider)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — resolved via dim_matches JOIN on (provider, native_match_id)).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_matches')
                field: match_key
      - name: frame_id
        data_type: bigint
        description: Tracking frame identifier within the match
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — resolved via dim_players JOIN on (provider, native_player_id)).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: player_display_name
        data_type: string
        description: "Human-readable player name from tracking metadata (falls back to player_id)"
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 hotfix #3 — resolved via int_tracking__player_match_team_bridge → dim_teams).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: team_display_name
        data_type: string
        description: "Human-readable team name from tracking metadata (falls back to Home/Away)"
        data_tests:
          - not_null
      - name: position_label
        data_type: string
        description: "Tactical position label (e.g., LC-DM, C-B, R-AM)"
        data_tests:
          - not_null
      - name: vertical_level
        data_type: string
        description: "Vertical pitch zone: B (back), DM, M (mid), AM, F (front)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['B', 'DM', 'M', 'AM', 'F']
      - name: horizontal_level
        data_type: string
        description: "Horizontal pitch zone: L, LC, C, RC, R"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['L', 'LC', 'C', 'RC', 'R']
      - name: detector
        data_type: string
        description: Detection algorithm identifier (shape_graph)
        data_tests:
          - not_null
      - name: data_source
        data_type: string
        description: Source provider (PR 7 — derived from match_id prefix in stg_shape_graphs__positions).
      - name: _ingested_at
        data_type: timestamp
        description: UTC timestamp when the row was written to the bronze table

  - name: fct_position_maps
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer aggregated position maps per player per match. Each row
      represents the proportion of time a player spent in a given tactical
      position (5x5 grid). Computed from fct_player_positions by counting
      frames per position and normalising to percentage of total frames.
      The phase column supports future possession-phase variants.
      Reference: Sotudeh, S. (2026). Shape graph formation detection.
    columns:
      - name: position_map_id
        data_type: string
        description: Surrogate key (player_id + match_id + position_label + data_source + phase; PR 7 added data_source)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — passthrough from upstream fct_player_positions).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: player_display_name
        data_type: string
        description: "Human-readable player name from tracking metadata (falls back to player_id)"
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — passthrough from upstream fct_player_positions).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_matches')
                field: match_key
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 hotfix #3 — passthrough from upstream fct_player_positions, which now resolves via int_tracking__player_match_team_bridge).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: team_display_name
        data_type: string
        description: "Human-readable team name from tracking metadata (falls back to Home/Away)"
        data_tests:
          - not_null
      - name: position_label
        data_type: string
        description: "Tactical position label (e.g., LC-DM, C-B, R-AM)"
        data_tests:
          - not_null
      - name: vertical_level
        data_type: string
        description: "Vertical pitch zone: B (back), DM, M (mid), AM, F (front)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['B', 'DM', 'M', 'AM', 'F']
      - name: horizontal_level
        data_type: string
        description: "Horizontal pitch zone: L, LC, C, RC, R"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['L', 'LC', 'C', 'RC', 'R']
      - name: pct_time
        data_type: double
        description: >
          Percentage of total frames the player occupied this position
          within the match (0-100, rounded to 2 decimals).
        data_tests:
          - not_null
      - name: phase
        data_type: string
        description: >
          Possession phase filter: all (full match), in_possession, or
          out_of_possession. Currently only 'all' is populated; phase
          variants are deferred.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all', 'in_possession', 'out_of_possession']
      - name: data_source
        data_type: string
        description: Source provider (PR 7 — passthrough from upstream fct_player_positions).

  - name: fct_tracking_avg_positions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer pre-computed average positions per player per match-period.
      Replaces expensive runtime AVG() queries that scan 1-3M rows of
      fct_tracking_frames. One row per (match_id, period, player_id, team).
      Coordinate system: StatsBomb 120x80 pitch coordinates.
    columns:
      - name: avg_position_id
        data_type: string
        description: Surrogate key (match_id + period + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: period
        data_type: int
        description: Match period (1 or 2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 2
              config:
                severity: warn
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: avg_x
        data_type: double
        description: Average X coordinate across all frames in the period (0-120 scale)
      - name: avg_y
        data_type: double
        description: Average Y coordinate across all frames in the period (0-80 scale)
      - name: avg_speed
        data_type: double
        description: Average speed in meters per second across all frames in the period
      - name: frame_count
        data_type: bigint
        description: Number of tracking frames for this player in the period (for weighting)
        data_tests:
          - not_null
      - name: min_frame
        data_type: int
        description: First frame number for this player in the period
      - name: max_frame
        data_type: int
        description: Last frame number for this player in the period
      - name: frame_rate
        data_type: bigint
        description: Tracking frame rate in Hz (constant per match, MAX aggregated)

  - name: fct_tracking_shape_timeline
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer pre-computed time-bucketed positions at 5-second intervals.
      Replaces expensive runtime sampled-position queries on fct_tracking_frames.
      One row per (match_id, period, time_bucket, player_id, team).
      Coordinate system: StatsBomb 120x80 pitch coordinates.
    columns:
      - name: shape_timeline_id
        data_type: string
        description: Surrogate key (match_id + period + time_bucket + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: period
        data_type: int
        description: Match period (1 or 2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 2
              config:
                severity: warn
      - name: time_bucket
        data_type: bigint
        description: >
          Time bucket start in seconds from period start.
          Computed as FLOOR(timestamp_seconds / 5) * 5 for 5-second intervals.
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: avg_x
        data_type: double
        description: Average X coordinate within the 5-second bucket (0-120 scale)
      - name: avg_y
        data_type: double
        description: Average Y coordinate within the 5-second bucket (0-80 scale)
      - name: avg_speed
        data_type: double
        description: Average speed in meters per second within the 5-second bucket

  # ── Line-Breaking Detection ──────────────────────────────────────────

  - name: fct_line_breaking_results
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer line-breaking detection results per pass event. Each row
      records whether a pass was line-breaking, how many defensive lines
      were broken, and the type of line break. One row per event. Sourced
      from the bronze line_breaking_results table written by the
      line-breaking detection pipeline.
    columns:
      - name: line_breaking_id
        data_type: string
        description: Surrogate key derived from event_id.
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_type: string
        description: Source event identifier from the pass event.
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches.match_key (ADR-011).
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — passer team; resolved via int_unified_passes JOIN).
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — passer; resolved via int_unified_passes JOIN).
      - name: is_line_breaking
        data_type: boolean
        description: Whether the pass broke at least one defensive line
        data_tests:
          - not_null
      - name: lines_broken
        data_type: int
        description: Number of defensive lines broken by the pass (0 if not line-breaking)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 4
              config:
                severity: warn
      - name: line_breaking_type
        data_type: string
        description: "Type of line break (e.g., between, through). NULL if not line-breaking."
      - name: data_source
        data_type: string
        description: Source data pipeline (statsbomb_360, metrica_tracking, idsse_tracking).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb_360', 'metrica_tracking', 'idsse_tracking']

  # ── Off-Ball xT ─────────────────────────────────────────────────────

  - name: fct_off_ball_xt
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer off-ball expected threat (xT) results per player per match.
      Each row contains aggregated off-ball xT metrics: total accumulated xT
      from off-ball movement, average xT per sampled frame, and the number of
      frames sampled. One row per player per match. Sourced from the bronze
      off_ball_xt_results table written by the off-ball xT compute pipeline.
    columns:
      - name: off_ball_xt_id
        data_type: string
        description: Surrogate key (player_id + match_id + source_provider; PR 7 added source_provider)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 \u2014 resolved via dim_players JOIN on (provider, native_player_id)).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_key
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 \u2014 resolved via dim_matches JOIN on (provider, native_match_id)).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_matches')
                field: match_key
      - name: total_off_ball_xt
        data_type: double
        description: "Total off-ball xT accumulated across all sampled frames (0\u20131+ scale, higher = more threat generated)"
      - name: avg_off_ball_xt
        data_type: double
        description: "Average off-ball xT per sampled frame (0\u20131 scale, higher = better positioning)"
      - name: frames_sampled
        data_type: int
        description: Number of tracking frames sampled for this player in this match
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 200000
              config:
                severity: warn
      - name: data_source
        data_type: string
        description: Source provider (PR 7 \u2014 derived from match_id prefix in stg_off_ball_xt__results).

  # ── Goalkeeper Stats ─────────────────────────────────────────────────

  - name: fct_goalkeeper_stats
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-match goalkeeper statistics combining saves, claims, distribution xT,
      PSxG shot-stopping, and sweeper-keeper positioning metrics. One row per
      goalkeeper per match. Feature-gated: requires goalkeeper_enabled=true.
    columns:
      - name: gk_stat_id
        data_type: string
        description: Surrogate key (player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players (goalkeeper only)
        data_tests:
          - not_null
      - name: match_id
        data_type: bigint
        description: Match identifier
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: "GK's team in this match (min team_id from SPADL actions)"
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: minutes_played
        data_type: double
        description: Minutes played in this match (derived from lineups and substitutions)
      - name: saves
        data_type: bigint
        description: Number of saves (SPADL keeper_save actions)
      - name: save_pct
        data_type: double
        description: "Save success rate (0-1 fraction). NULL when no save attempts."
      - name: claims
        data_type: bigint
        description: Number of aerial claims (SPADL keeper_claim actions)
      - name: claim_success_rate
        data_type: double
        description: "Claim success rate (0-1 fraction). NULL when no claim attempts."
      - name: punches
        data_type: bigint
        description: Number of punches (SPADL keeper_punch actions)
      - name: distribution_passes
        data_type: bigint
        description: Number of distribution passes (pass, cross, freekick, goalkick)
      - name: gk_xt_delta_total
        data_type: double
        description: "Total xT delta from goalkeeper distribution (positive = progressed ball into higher-threat zones)"
      - name: gk_xt_per_pass
        data_type: double
        description: "Average xT delta per distribution pass (0-1 scale, higher = more progressive distribution)"
      - name: launch_rate
        data_type: double
        description: "Fraction of distribution passes that are long (distance > 60m, 0-1). NULL when no distribution passes."
      - name: keeper_pick_ups
        data_type: bigint
        description: Number of keeper pick-ups (SPADL keeper_pick_up actions)
      - name: psxg_faced
        data_type: double
        description: "Post-shot expected goals faced (sum of PSxG for shots on target against this GK)"
      - name: goals_conceded
        data_type: int
        description: "Goals conceded in this match (from PSxG shot outcome join)"
      - name: goals_prevented
        data_type: double
        description: "Goals prevented vs PSxG expectation (psxg_faced - goals_conceded)"
      - name: avg_defensive_action_distance
        data_type: double
        description: "Average distance from own goal line in meters (LEAST(x, 105-x), lower = closer to goal)"
      - name: actions_outside_box_per_90
        data_type: double
        description: "Defensive actions outside the penalty box per 90 minutes played"
      - name: data_source
        data_type: string
        description: >
          Provider attribution (PR 6 — ADR-011). Closes a latent multi-provider
          correctness gap: pre-PR-6 SB and WS BIGINT match_ids could collide
          on (player_id, match_id).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: match_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_matches.match_key (PR 6, ADR-011).
          Inherited from fct_action_values via gk_matches (PR 4b migration
          of fct_action_values + PR 6 propagation).
        data_tests:
          - relationships:
              to: ref('dim_matches')
              field: match_key
              config:
                severity: warn
                where: "match_key IS NOT NULL"
      - name: team_key
        data_type: bigint
        description: "Kimball surrogate FK to dim_teams.team_key (GK's team)."
        data_tests:
          - relationships:
              to: ref('dim_teams')
              field: team_key
              config:
                severity: warn
                where: "team_key IS NOT NULL"
      - name: player_key
        data_type: bigint
        description: "Kimball surrogate FK to dim_players.player_key (the GK)."
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
                where: "player_key IS NOT NULL"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - match_id
            - data_source

  # ── Space Creation ───────────────────────────────────────────────────

  - name: fct_space_creation
    config:
      contract:
        enforced: false
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer per-player space creation/destruction values derived from OBSO
      differential (Fernandez & Bornn 2018). Each row represents one player's
      net spatial impact at one tracking frame: how many square metres of space
      they created for their team and destroyed for the opposition. Feature-gated:
      requires space_creation_enabled=true.
    columns:
      - name: space_creation_id
        data_type: string
        description: Surrogate key (match_id + frame_id + player_id + source_provider; PR 7 added source_provider)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — resolved via dim_matches JOIN on (provider, native_match_id)).
      - name: frame_id
        data_type: int
        description: Tracking frame identifier
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier (canonical, resolved via dim_players where available)
        data_tests:
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — resolved via dim_players JOIN on (provider, native_player_id)).
      - name: team
        data_type: string
        description: Team of the player at this frame
      - name: period
        data_type: int
        description: Match period
      - name: space_created_m2
        data_type: double
        description: "Square metres of space created by this player's movement (positive = space opened for teammates)"
      - name: space_destroyed_m2
        data_type: double
        description: "Square metres of space destroyed by this player's movement (positive = space closed for opponents)"
      - name: net_space_m2
        data_type: double
        description: "Net space impact in square metres (space_created_m2 - space_destroyed_m2)"
      - name: data_source
        data_type: string
        description: Source provider (PR 7 — derived from match_id prefix in stg_space_creation__values).

  - name: fct_player_embeddings_career_360
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Career-level aggregation of 360-degree player embedding vectors. Averages all
      match-level embeddings from the football2vec_360 encoder (144-dim) across all
      competitions and seasons into a single career embedding per player.
      One row per canonical_player_id.
    columns:
      - name: embedding_career_360_id
        data_type: string
        description: Surrogate key (canonical_player_id)
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: Primary key — unified player identifier
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 5b, ADR-011). Passed
          through from fct_player_embeddings via any_value() in the 360
          career aggregate. Coexists with canonical_player_id during the
          2026-07-22 dual-column window.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
      - name: behavioral_vector
        data_type: array<double>
        description: >
          Element-wise mean of 144-dim behavioral vectors (football2vec_360 encoder)
          across all career matches.
        data_tests:
          - not_null
      - name: total_matches
        data_type: bigint
        description: Total number of matches contributing to this career embedding
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 1000
      - name: data_sources
        data_type: array<string>
        description: Array of distinct data providers contributing to this aggregation

  - name: fct_player_embeddings_season_360
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per player-competition-season aggregation of 360-degree embedding vectors.
      Behavioral vectors from the football2vec_360 encoder (144-dim) are averaged
      element-wise across all matches in the season. Enables season-level similarity
      search and style evolution analysis. One row per player per competition per season.
    columns:
      - name: embedding_season_360_id
        data_type: string
        description: Surrogate key (canonical_player_id + competition_id + season_id)
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: Foreign key to dim_players (unified player identifier)
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players (PR 5b, ADR-011). Passed
          through from fct_player_embeddings via any_value() in the 360
          season aggregate. Coexists with canonical_player_id during the
          2026-07-22 dual-column window.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
      - name: competition_id
        data_type: bigint
        description: Foreign key to dim_competitions
        data_tests:
          - not_null
      - name: season_id
        data_type: bigint
        description: Season identifier
        data_tests:
          - not_null
      - name: behavioral_vector
        data_type: array<double>
        description: >
          Element-wise mean of 144-dim behavioral vectors (football2vec_360 encoder)
          across all matches in this competition-season.
        data_tests:
          - not_null
      - name: total_matches
        data_type: bigint
        description: Number of matches contributing to this aggregation
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
      - name: data_sources
        data_type: array<string>
        description: Array of distinct data providers contributing to this aggregation

  # ── Pre-aggregated marts (2026-04-16 optimization audit) ────────────────
  # Each mart below was added to solve a "comp-only query on multi-million-row
  # fact table" bottleneck verified via EXPLAIN ANALYZE.  See the related
  # .sql model for measurement details.

  - name: fct_funnel_stages_agg
    description: >
      Pre-aggregated conversion funnel stages for Taipy Conversion Funnel page.
      Grain: (match_id, team_id, game_state). Source: fct_action_values INNER
      JOIN fct_match_summary. Replaces a 37,800 ms Parallel Seq Scan + Nested
      Loop that exceeded the app's 30 s statement_timeout, AND closes a silent
      LIMIT 500000 truncation that under-reported A3/shots/goals by >50 % for
      prolific teams. See fct_funnel_stages_agg.sql header for straddler +
      Wyscout handling.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: match_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_matches.match_key (ADR-011, PR 5a).
          Propagated from fct_match_summary via the existing `using (match_key)` join.
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_match_summary')
              field: match_key
      - name: match_id
        data_type: bigint
        description: >
          LEGACY native match identifier retained for the coordinated 2026-07-22
          dual-column sunset per ADR-011.
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Denormalized for season-mode WHERE clauses (drives idx_funnel_agg_comp_*_gs).
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Acting team (legacy INT).
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams.team_key (acting team, ADR-011 PR 5a).
        data_tests:
          - relationships:
              to: ref('dim_teams')
              field: team_key
              config:
                where: "team_key IS NOT NULL"
      - name: opponent_team_id
        data_type: int
        description: >
          The other team in the match (derived from fct_match_summary home/away).
          Wyscout rows previously NULL (~7,587 of ~21,000). PR 5a closed the
          gap via stg_wyscout__home_away_teams bridge + fct_match_summary
          Wyscout branch update. Flipped from warn to error severity.
        data_tests:
          - not_null
      - name: opponent_team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams.team_key (opposing team, ADR-011 PR 5a).
        data_tests:
          - relationships:
              to: ref('dim_teams')
              field: team_key
              config:
                where: "opponent_team_key IS NOT NULL"
      - name: game_state
        data_type: string
        description: "Score-state bucket — winning, losing, or drawing — at the time of the action."
        data_tests:
          - not_null
          - accepted_values:
              values: ['winning', 'losing', 'drawing']
      - name: pos_in_gs
        data_type: bigint
        description: >
          COUNT(DISTINCT possession_id) within this (match, team, game_state).
          Straddlers that cross gs boundaries are counted once per gs they touch.
        data_tests:
          - not_null
      - name: pos_in_match
        data_type: bigint
        description: >
          COUNT(DISTINCT possession_id) across the full (match, team). Replicated on
          every gs row for that match+team so app-side dedup at gs=All is one
          groupby().first().sum() call.
        data_tests:
          - not_null
      - name: a3_entries
        data_type: bigint
        description: Actions with start_x ≤ 70 AND end_x > 70 (attacking-third entries).
        data_tests:
          - not_null
      - name: shots
        data_type: bigint
        description: Actions where action_type is shot, shot_penalty, or shot_freekick.
        data_tests:
          - not_null
      - name: goals
        data_type: bigint
        description: Shots where action_result = 'success'.
        data_tests:
          - not_null
      - name: wy_match_flag
        data_type: smallint
        description: >
          1 if the team had any NULL-possession_id row (Wyscout) during this
          specific (match, team, game_state). Per-gs flag (NOT match-level):
          a match with Wyscout rows only during 'drawing' has flag=1 on its
          drawing row but flag=0 on its winning/losing rows. Used at the app
          driver via COUNT(DISTINCT CASE WHEN wy_match_flag=1 THEN match_id END),
          which correctly handles both gs-filtered and gs=All rollups.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - game_state

  - name: fct_heatmap_agg
    description: >
      Pre-aggregated heatmap grid counts for Taipy Heat Map page.
      Grain: (competition_id, team_id, action_type, x_bin, y_bin).
      Source: fct_passes + fct_shots, binned to 12x8 grid via
      round(x/10)*10+5. Replaces a 6,864 ms comp-only Parallel Seq Scan.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions.
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams.
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — passthrough from upstream fct_passes / fct_shots).
      - name: action_type
        data_type: string
        description: "Either 'pass' or 'shot'."
        data_tests:
          - not_null
          - accepted_values:
              values: ['pass', 'shot']
      - name: x_bin
        data_type: int
        description: Grid bin centre X coordinate (5, 15, 25, ... 115).
        data_tests:
          - not_null
      - name: y_bin
        data_type: int
        description: Grid bin centre Y coordinate (5, 15, 25, ... 75).
        data_tests:
          - not_null
      - name: event_count
        data_type: bigint
        description: Number of events (passes or shots) in this bin.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_vaep_breakdown_agg
    description: >
      Pre-aggregated VAEP breakdown by action_type for Taipy Action Values
      and Defensive Impact pages.
      Grain: (competition_id, team_id, player_id, action_type).
      Source: fct_action_values summed. Replaces a 2,800 ms comp-only
      Parallel Seq Scan on the 9.53M row fct_action_values table.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions.
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams.
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — passthrough from upstream fct_action_values).
      - name: player_id
        data_type: int
        description: Foreign key to dim_players.
        data_tests:
          - not_null
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — passthrough from upstream fct_action_values).
      - name: action_type
        data_type: string
        description: SPADL action type (pass, dribble, shot, tackle, ...).
        data_tests:
          - not_null
      - name: total_vaep
        data_type: double
        description: Sum of vaep_value across all actions of this (comp, team, player, type).
      - name: total_offensive
        data_type: double
        description: Sum of offensive_value.
      - name: total_defensive
        data_type: double
        description: Sum of defensive_value.
      - name: action_count
        data_type: bigint
        description: Count of actions in this group.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_gk_actions_detail
    description: >
      Pre-filtered goalkeeper pass and goalkick actions for Taipy Goalkeeper
      Analytics "Distribution" sub-view.
      Grain: one row per (match, GK, action) where action_type IN
      ('goalkick', 'pass'). Pre-joined to dim_players on position_group =
      'Goalkeeper'. Replaces a 13,247 ms comp-only Parallel Seq Scan on the
      9.53M row fct_action_values table + dim_players join.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: gk_action_id
        data_type: string
        description: Unique action identifier (inherits fct_action_values.action_value_id).
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: bigint
        description: Foreign key to fct_match_summary.
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions.
        data_tests:
          - not_null
      - name: season_id
        data_type: int
        description: Season identifier.
      - name: team_id
        data_type: int
        description: Team the goalkeeper played for in this match.
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players (goalkeeper).
        data_tests:
          - not_null
      - name: period
        data_type: int
        description: Half of the match (1 or 2).
      - name: time_seconds
        data_type: double
        description: Seconds from period start (SPADL academic convention — period-local).
      - name: minute
        data_type: int
        description: >
          Match-absolute minute — inherits the convention from fct_action_values
          (period 1 = 0 offset; period 2 = +45; period 3 = +90; period 4 = +105).
      - name: second
        data_type: int
        description: Second within the current minute.
      - name: start_x
        data_type: double
        description: Origin X coordinate (SPADL 105m pitch).
      - name: start_y
        data_type: double
        description: Origin Y coordinate (SPADL 68m pitch).
      - name: end_x
        data_type: double
        description: Destination X coordinate.
      - name: end_y
        data_type: double
        description: Destination Y coordinate.
      - name: action_type
        data_type: string
        description: "Either 'goalkick' or 'pass'."
        data_tests:
          - not_null
          - accepted_values:
              values: ['goalkick', 'pass']
      - name: action_result
        data_type: string
        description: "SPADL action result: 'success' or 'fail'."
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout, etc.).
      - name: match_key
        data_type: bigint
        description: "Kimball surrogate FK inherited from fct_action_values."
        data_tests:
          - relationships:
              to: ref('dim_matches')
              field: match_key
              config:
                severity: warn
                where: "match_key IS NOT NULL"
      - name: team_key
        data_type: bigint
        description: "Kimball surrogate FK to dim_teams.team_key."
        data_tests:
          - relationships:
              to: ref('dim_teams')
              field: team_key
              config:
                severity: warn
                where: "team_key IS NOT NULL"
      - name: player_key
        data_type: bigint
        description: "Kimball surrogate FK to dim_players.player_key (GK)."
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
                where: "player_key IS NOT NULL"
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_discipline_events
    description: >
      Per-event discipline mart — one row per card issued on a StatsBomb
      'Bad Behaviour' or 'Foul Committed' event. Used by the Match Summary
      redesign for Row 1 red-card auto-inclusion and Row 2 xG-race red-card
      markers. Filter `card_name IN ('Red Card', 'Second Yellow')` for the
      match-changing subset; keep all three values (including 'Yellow Card')
      in the mart so downstream pages can surface yellow-card narrative if
      needed.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: event_id
        data_type: string
        description: Unique event identifier (inherits stg_statsbomb__events.event_id).
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: bigint
        description: Foreign key to fct_match_summary.
        data_tests:
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (PR 7 — resolved via dim_matches JOIN, provider='statsbomb').
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions.
        data_tests:
          - not_null
      - name: season_id
        data_type: int
        description: Season identifier.
      - name: period
        data_type: int
        description: Half of the match (1, 2, or 3+ for extra time).
        data_tests:
          - not_null
      - name: minute
        data_type: int
        description: Minute of the match.
        data_tests:
          - not_null
      - name: second
        data_type: int
        description: Seconds within minute.
      - name: player_id
        data_type: int
        description: Foreign key to dim_players (the carded player).
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — resolved via dim_players JOIN, provider='statsbomb').
      - name: team_id
        data_type: int
        description: Team the carded player played for.
        data_tests:
          - not_null
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — resolved via dim_teams JOIN, provider='statsbomb').
      - name: event_type
        data_type: string
        description: StatsBomb event type that carried the card ('Bad Behaviour' or 'Foul Committed').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bad Behaviour', 'Foul Committed']
      - name: card_name
        data_type: string
        description: Card issued ('Yellow Card', 'Red Card', or 'Second Yellow').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Yellow Card', 'Red Card', 'Second Yellow']
      - name: data_source
        data_type: string
        description: Data provider. Hard-coded to 'statsbomb' until Wyscout discipline lands.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb']
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  # ── Kimball Conformed Match Dimension (ADR-011) ───────────────────────
  - name: dim_matches
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Conformed match dimension unifying all four providers (StatsBomb,
      Wyscout, IDSSE, Metrica). Primary key is `match_key` — a deterministic
      BIGINT surrogate generated via `generate_match_key(provider, native_match_id)`.
      Natural keys are preserved as attributes for lineage.

      PR 1 establishes this dim as the Kimball conformed dimension; no fact
      tables reference it yet. PR 2 through PR 8 migrate existing facts
      from their native-ID `match_id` columns to `match_key` FKs against
      this dim. See ADR-011.
    columns:
      - name: match_key
        data_type: bigint
        description: >
          Kimball surrogate primary key. Deterministic BIGINT hash of
          (provider, native_match_id). Future facts reference this as FK.
        data_tests:
          - unique
          - not_null
      - name: competition_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_competitions.competition_key
          (ADR-011, added PR 2). NULL for Metrica (no competition metadata).
      - name: provider
        data_type: string
        description: >
          Data source that produced this match. One of: statsbomb, wyscout,
          idsse, metrica, skillcorner (PR 7 onboarded SkillCorner for
          tracking-only data).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica', 'skillcorner']
      - name: native_match_id
        data_type: string
        description: >
          Source-system-native match identifier, stringified (StatsBomb and
          Wyscout stringify their BIGINT IDs; IDSSE and Metrica are natively
          string). Together with `provider`, uniquely identifies a match.
        data_tests:
          - not_null
      - name: competition_id
        data_type: string
        description: >
          Provider-native competition ID. NULL for Metrica (anonymized). For
          StatsBomb/Wyscout the BIGINT competition_id is stringified for uniform
          typing across providers.
      - name: season_id
        data_type: string
        description: >
          Provider-native season ID, stringified. NULL for IDSSE/Metrica.
      - name: match_date
        data_type: date
        description: Match calendar date. NULL for IDSSE/Metrica.
      - name: home_team_name
        data_type: string
        description: >
          Home team display name. Populated for StatsBomb and IDSSE.
          NULL for Wyscout (staging doesn't expose names). Constant 'Home'
          for Metrica (anonymised open-data).
      - name: away_team_name
        data_type: string
        description: >
          Away team display name. Populated for StatsBomb and IDSSE.
          NULL for Wyscout (staging doesn't expose names). Constant 'Away'
          for Metrica (anonymised open-data).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - provider
            - native_match_id
