version: 2

models:
  # ── Fact Tables ───────────────────────────────────────────────────────

  - name: fct_shots
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer shot fact table with xG features. Contains every shot from
      all data sources with computed geometry features (distance to goal,
      shot angle), StatsBomb xG where available, and categorical features
      for ML model training. One row per shot.
    columns:
      - name: shot_id
        data_type: string
        description: Unique shot identifier (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: bigint
        description: Foreign key to fct_match_summary
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
        data_tests:
          - not_null
      - name: location_x
        data_type: double
        description: Shot X coordinate (0-120). May slightly exceed bounds for off-pitch events.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "location_x is not null"
              config:
                severity: warn
      - name: location_y
        data_type: double
        description: Shot Y coordinate (0-80)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "location_y is not null"
              config:
                severity: warn
      - name: statsbomb_xg
        data_type: double
        description: StatsBomb xG value (NULL for non-StatsBomb data)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "statsbomb_xg is not null"
      - name: distance_to_goal
        data_type: double
        description: Euclidean distance from shot location to goal center (yards)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 170
                row_condition: "distance_to_goal is not null"
              config:
                severity: warn
      - name: shot_angle
        data_type: double
        description: Angle subtended at the goal posts (radians)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3.15
                row_condition: "shot_angle is not null"
              config:
                severity: warn
      - name: shot_outcome
        data_type: string
        description: Shot outcome classification
        data_tests:
          - not_null
      - name: is_goal
        data_type: int
        description: Binary goal indicator (1=goal, 0=no goal)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: period
        data_type: bigint
        description: Match period
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: minute
        data_type: bigint
        description: Match minute of the shot
      - name: second
        data_type: bigint
        description: Match second of the shot
      - name: end_location_x
        data_type: double
        description: X coordinate where the shot ended
      - name: end_location_y
        data_type: double
        description: Y coordinate where the shot ended
      - name: shot_body_part
        data_type: string
        description: Body part used for the shot
      - name: shot_technique
        data_type: string
        description: Shot technique classification
      - name: shot_type
        data_type: string
        description: Shot type classification (Open Play, Free Kick, Penalty, etc.)
      - name: is_first_time
        data_type: boolean
        description: Whether the shot was taken first-time
      - name: play_pattern
        data_type: string
        description: "Play pattern (e.g., Regular Play, From Corner). StatsBomb only; NULL for Wyscout."

  - name: fct_passes
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer pass fact table with progressive pass identification.
      Contains every pass from all sources with pass metrics, progressive
      pass flag, and pass network building blocks. One row per pass.
    columns:
      - name: pass_id
        data_type: string
        description: Unique pass identifier (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: bigint
        description: Foreign key to fct_match_summary
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
      - name: start_x
        data_type: double
        description: Starting X coordinate (120-yard scale). May slightly exceed bounds.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        data_type: double
        description: Starting Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        data_type: double
        description: Ending X coordinate (120-yard scale)
      - name: end_y
        data_type: double
        description: Ending Y coordinate (80-yard scale)
      - name: is_progressive
        data_type: boolean
        description: Whether the pass moved the ball significantly closer to goal
      - name: is_complete
        data_type: boolean
        description: Whether the pass was completed successfully
      - name: pass_outcome
        data_type: string
        description: Pass result (Complete, Incomplete, Out, etc.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['Complete', 'Incomplete', 'Out', 'Pass Offside', 'Injury Clearance', 'Unknown']
              config:
                severity: warn
      - name: pass_direction
        data_type: string
        description: Pass direction (forward, backward, lateral)
        data_tests:
          - accepted_values:
              arguments:
                values: ['forward', 'backward', 'lateral']
      - name: period
        data_type: bigint
        description: Match period
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: minute
        data_type: bigint
        description: Match minute of the pass
      - name: second
        data_type: bigint
        description: Match second of the pass
      - name: pass_type
        data_type: string
        description: Pass type classification
      - name: pass_height
        data_type: string
        description: Pass height (Ground Pass, Low Pass, High Pass)
      - name: body_part
        data_type: string
        description: Body part used for the pass
      - name: pass_length
        data_type: double
        description: Pass length in yards
      - name: pass_angle_radians
        data_type: double
        description: Pass angle in radians
      - name: is_cross
        data_type: boolean
        description: Whether the pass was a cross
      - name: is_switch
        data_type: boolean
        description: Whether the pass was a switch of play
      - name: is_through_ball
        data_type: boolean
        description: Whether the pass was a through ball
      - name: pass_recipient_id
        data_type: int
        description: Foreign key to dim_players — player who received the pass (NULL for Wyscout and incomplete passes)
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
              config:
                severity: warn
                where: "pass_recipient_id is not null AND data_source = 'statsbomb'"
      - name: is_line_breaking
        data_type: boolean
        description: >
          Whether the pass breaks through at least one opponent defensive line.
          Detected via Ward hierarchical clustering of opponent positions.
          Available for StatsBomb 360 matches and Metrica tracking matches only.
      - name: lines_broken
        data_type: int
        description: Number of defensive lines broken (0-3)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3
      - name: line_breaking_type
        data_type: string
        description: >
          Type of line break — 'through' (between defenders) or 'around'
          (outside outermost defender via sideline). NULL for non-line-breaking passes.
        data_tests:
          - accepted_values:
              arguments:
                values: ['through', 'around']
              config:
                severity: warn
                where: "line_breaking_type is not null"

  - name: fct_player_stats
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-90-minute player aggregation table. Contains rolling and seasonal
      statistics normalized to per-90 rates for fair comparison across
      players with different minutes played. One row per player per
      competition per season.
    columns:
      - name: player_stats_id
        data_type: string
        description: Surrogate key (player_id + competition_id + season_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: minutes_played
        data_type: bigint
        description: Total minutes played
      - name: total_shots
        data_type: bigint
        description: Total shots taken
      - name: total_goals
        data_type: bigint
        description: Total goals scored
      - name: total_xg
        data_type: double
        description: Total expected goals
      - name: pass_completion_pct
        data_type: decimal(26,1)
        description: Pass completion percentage (0-100)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: goals_per_90
        data_type: decimal(28,2)
        description: Goals scored per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5
                row_condition: "goals_per_90 is not null"
              config:
                severity: warn
      - name: xg_per_90
        data_type: double
        description: Expected goals per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5
                row_condition: "xg_per_90 is not null"
              config:
                severity: warn
      - name: passes_per_90
        data_type: decimal(28,2)
        description: Total passes attempted per 90 minutes
      - name: progressive_passes_per_90
        data_type: decimal(28,2)
        description: Progressive passes per 90 minutes
      - name: shots_on_target
        data_type: bigint
        description: Total shots on target
      - name: total_passes
        data_type: bigint
        description: Total passes attempted
      - name: completed_passes
        data_type: bigint
        description: Total passes completed
      - name: progressive_passes
        data_type: bigint
        description: Total progressive passes
      - name: assists_per_90
        data_type: double
        description: Assists per 90 minutes (NULL until assist data available)
      - name: xg_overperformance
        data_type: double
        description: Goals minus xG (positive = clinical finisher)
      - name: line_breaking_passes
        data_type: bigint
        description: Total number of line-breaking passes
      - name: line_breaking_per_90
        data_type: decimal(28,2)
        description: Line-breaking passes per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20
                row_condition: "line_breaking_per_90 is not null"
              config:
                severity: warn
      - name: total_vaep
        data_type: double
        description: Total VAEP value across all actions
      - name: total_offensive_vaep
        data_type: double
        description: Total offensive VAEP value
      - name: total_defensive_vaep
        data_type: double
        description: Total defensive VAEP value
      - name: total_actions
        data_type: bigint
        description: Total number of SPADL actions
      - name: vaep_per_90
        data_type: double
        description: Net VAEP per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
                row_condition: "vaep_per_90 is not null"
              config:
                severity: warn
      - name: offensive_vaep_per_90
        data_type: double
        description: Offensive VAEP per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
                row_condition: "offensive_vaep_per_90 is not null"
              config:
                severity: warn
      - name: defensive_vaep_per_90
        data_type: double
        description: Defensive VAEP per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 5
                row_condition: "defensive_vaep_per_90 is not null"
              config:
                severity: warn
      - name: total_defcon
        data_type: double
        description: Total DEFCON value (NULL if defcon_enabled is false)
      - name: defcon_credits
        data_type: bigint
        description: Total number of defensive credits
      - name: defcon_per_90
        data_type: double
        description: DEFCON-lite total value per 90 minutes
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 10
                row_condition: "defcon_per_90 is not null"
              config:
                severity: warn
      - name: intercept_per_90
        data_type: double
        description: DEFCON Intercept value per 90 minutes
      - name: deter_per_90
        data_type: double
        description: DEFCON Deter value per 90 minutes

  - name: fct_action_values
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer SPADL action values with VAEP scores. Contains every on-ball
      action from all data sources converted to the SPADL unified format,
      scored with offensive, defensive, and net VAEP values. Enables player
      ranking by total contribution beyond goals/assists.
      Coordinate system: 105x68 meters (SPADL academic standard).
      One row per action.
    columns:
      - name: action_value_id
        data_type: string
        description: Unique action identifier (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: bigint
        description: Match identifier
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: period
        data_type: int
        description: Match period (1-5)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: time_seconds
        data_type: double
        description: Seconds from period start
      - name: minute
        data_type: int
        description: Match minute derived from time_seconds
      - name: second
        data_type: int
        description: Match second derived from time_seconds
      - name: start_x
        data_type: double
        description: Action start X coordinate (0-105 meters)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 105
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        data_type: double
        description: Action start Y coordinate (0-68 meters)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 68
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        data_type: double
        description: Action end X coordinate (0-105 meters)
      - name: end_y
        data_type: double
        description: Action end Y coordinate (0-68 meters)
      - name: action_type
        data_type: string
        description: SPADL action type name (23 types)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pass
                  - cross
                  - throw_in
                  - freekick_crossed
                  - freekick_short
                  - corner_crossed
                  - corner_short
                  - take_on
                  - foul
                  - tackle
                  - interception
                  - shot
                  - shot_penalty
                  - shot_freekick
                  - keeper_save
                  - keeper_claim
                  - keeper_punch
                  - keeper_pick_up
                  - clearance
                  - bad_touch
                  - non_action
                  - dribble
                  - goalkick
      - name: action_result
        data_type: string
        description: Action result (success, fail, offside, owngoal, yellow_card, red_card)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['success', 'fail', 'offside', 'owngoal', 'yellow_card', 'red_card']
      - name: bodypart
        data_type: string
        description: Body part used for the action
      - name: offensive_value
        data_type: double
        description: VAEP offensive value (change in scoring probability)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 1
                row_condition: "offensive_value is not null"
              config:
                severity: warn
      - name: defensive_value
        data_type: double
        description: VAEP defensive value (change in conceding probability)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 1
                row_condition: "defensive_value is not null"
              config:
                severity: warn
      - name: vaep_value
        data_type: double
        description: Net VAEP value (offensive + defensive)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -1
                max_value: 1
                row_condition: "vaep_value is not null"
              config:
                severity: warn
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: original_event_id
        data_type: string
        description: Original event ID from source data (NULL for synthetic dribbles)
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when the action values were loaded into the gold table

  - name: fct_match_summary
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Match-level aggregate metrics. Contains one row per match with
      team-level statistics including xG, possession percentage, pass
      completion rate, shot counts, and other summary metrics.
    columns:
      - name: match_id
        data_type: bigint
        description: Primary key — unique match identifier
        data_tests:
          - unique
          - not_null
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: home_team_id
        data_type: int
        description: Foreign key to dim_teams
      - name: away_team_id
        data_type: int
        description: Foreign key to dim_teams
      - name: match_date
        data_type: date
        description: Date the match was played
      - name: home_xg
        data_type: double
        description: Total home team expected goals
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20
                row_condition: "home_xg is not null"
              config:
                severity: warn
      - name: away_xg
        data_type: double
        description: Total away team expected goals
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20
                row_condition: "away_xg is not null"
              config:
                severity: warn
      - name: home_score
        data_type: int
        description: Final home team score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 30
                row_condition: "home_score is not null"
      - name: away_score
        data_type: int
        description: Final away team score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 30
                row_condition: "away_score is not null"
      - name: home_possession_pct
        data_type: decimal(26,1)
        description: Home team possession percentage
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: home_pass_completion_pct
        data_type: decimal(26,1)
        description: Home team pass completion percentage
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: away_pass_completion_pct
        data_type: decimal(26,1)
        description: Away team pass completion percentage
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: match_result
        data_type: string
        description: Match result (home_win, away_win, draw)
        data_tests:
          - accepted_values:
              arguments:
                values: ['home_win', 'away_win', 'draw']
      - name: home_team_name
        data_type: string
        description: Home team display name
      - name: away_team_name
        data_type: string
        description: Away team display name
      - name: home_shots
        data_type: bigint
        description: Total home team shots
      - name: home_goals
        data_type: bigint
        description: Total home team goals (from shot events)
      - name: home_shots_on_target
        data_type: bigint
        description: Home team shots on target
      - name: away_shots
        data_type: bigint
        description: Total away team shots
      - name: away_goals
        data_type: bigint
        description: Total away team goals (from shot events)
      - name: away_shots_on_target
        data_type: bigint
        description: Away team shots on target
      - name: home_total_passes
        data_type: bigint
        description: Total home team passes
      - name: home_completed_passes
        data_type: bigint
        description: Home team completed passes
      - name: home_progressive_passes
        data_type: bigint
        description: Home team progressive passes
      - name: away_total_passes
        data_type: bigint
        description: Total away team passes
      - name: away_completed_passes
        data_type: bigint
        description: Away team completed passes
      - name: away_progressive_passes
        data_type: bigint
        description: Away team progressive passes
      - name: xg_difference
        data_type: double
        description: Home xG minus away xG (positive = home advantage)
      - name: home_ppda
        data_type: decimal(25,2)
        description: >
          Home team Passes Per Defensive Action. Lower = more aggressive press.
          NULL when zero defensive actions. StatsBomb matches only.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                row_condition: "home_ppda is not null"
              config:
                severity: warn
      - name: away_ppda
        data_type: decimal(25,2)
        description: >
          Away team Passes Per Defensive Action. Lower = more aggressive press.
          NULL when zero defensive actions. StatsBomb matches only.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
                row_condition: "away_ppda is not null"
              config:
                severity: warn

  - name: fct_tracking_frames
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Enriched tracking data from all providers (Metrica, IDSSE, SkillCorner).
      Contains spatial analysis outputs including player speeds, distance to
      ball, and velocity components. Supports mixed frame rates (25fps
      Metrica/IDSSE, 10fps SkillCorner). One row per player per frame.
    columns:
      - name: tracking_id
        data_type: string
        description: Primary key from staging models
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (prefixed by provider)
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier
        data_tests:
          - not_null
      - name: source_provider
        data_type: string
        description: Tracking data provider (metrica, idsse, skillcorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica', 'idsse', 'skillcorner']
      - name: is_goalkeeper
        data_type: boolean
        description: >
          Whether this player is the goalkeeper. Derived from provider metadata:
          IDSSE (PlayingPosition='TW'), SkillCorner (kloppy PositionType.Goalkeeper),
          Metrica (EPTS PlayingPosition or jersey #1 heuristic).
        data_tests:
          - not_null
      - name: frame_rate
        data_type: bigint
        description: Frame rate in fps (25 for Metrica/IDSSE, 10 for SkillCorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10, 25]
      - name: distance_to_ball
        data_type: double
        description: Euclidean distance from player to ball (yards)
      - name: speed
        data_type: double
        description: >
          Player speed in coordinate-units/second (120x80 pitch scale).
          NULL for the first frame of each (match_id, player_id, period) partition.
      - name: pitch_control_value
        data_type: double
        description: >
          Pitch control probability [0,1] at this player's location.
          Computed using Fernandez & Bornn (2018) model. NULL until ML pipeline.
      - name: period
        data_type: int
        description: Match period (1 or 2)
      - name: frame
        data_type: int
        description: Frame number within the period
      - name: timestamp_seconds
        data_type: double
        description: Timestamp in seconds from period start
      - name: team
        data_type: string
        description: Team affiliation (home or away)
      - name: x
        data_type: double
        description: Player X coordinate (120-yard scale)
      - name: y
        data_type: double
        description: Player Y coordinate (80-yard scale)
      - name: ball_x
        data_type: double
        description: Ball X coordinate (120-yard scale)
      - name: ball_y
        data_type: double
        description: Ball Y coordinate (80-yard scale)
      - name: velocity_x
        data_type: double
        description: Player velocity in X direction (coordinate-units/second)
      - name: velocity_y
        data_type: double
        description: Player velocity in Y direction (coordinate-units/second)
      - name: velocity_x_ms
        data_type: double
        description: Player velocity in X direction (m/s, anisotropic-scaled)
      - name: velocity_y_ms
        data_type: double
        description: Player velocity in Y direction (m/s, anisotropic-scaled)
      - name: speed_ms
        data_type: double
        description: >
          Player speed in m/s. Uses anisotropic scaling (x*105/120, y*68/80)
          since StatsBomb x and y scales differ. NULL for the first frame of
          each (match_id, player_id, period) partition.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 15
                row_condition: "speed_ms is not null"
              config:
                severity: warn
      - name: acceleration_ms2
        data_type: double
        description: >
          Player acceleration in m/s^2. Computed as (speed_ms - prev_speed_ms)
          * frame_rate. NULL for the first two frames of each partition.
      - name: voronoi_area
        data_type: double
        description: Voronoi cell area controlled by player (NULL until spatial pipeline)

  - name: fct_player_embeddings
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-match player embedding vectors for similarity search. Dual-vector
      design: behavioral_vector (32-dim Doc2Vec from football2vec event
      sequences) and stat_vector (13-dim z-score normalized per-90 stats).
      One row per player per match.
    columns:
      - name: embedding_id
        data_type: string
        description: Surrogate key (canonical_player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: Foreign key to dim_players (unified player identifier)
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: data_source
        data_type: string
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: behavioral_vector
        data_type: array<double>
        description: >
          32-dim Doc2Vec embedding capturing playing style from event sequences
          (action type + pitch grid location tokens). Generated by football2vec.
        data_tests:
          - not_null
      - name: stat_vector
        data_type: array<double>
        description: >
          13-dim z-score normalized per-90 statistics (nullable). Contains
          goals, assists, xG, key passes, etc. NULL when stat data unavailable.

  - name: fct_player_embeddings_season
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per player-competition-season aggregation of embedding vectors.
      Behavioral vectors are averaged element-wise across all matches in the
      season. Enables season-level similarity search and style evolution
      analysis. One row per player per competition per season.
    columns:
      - name: embedding_season_id
        data_type: string
        description: Surrogate key (canonical_player_id + competition_id + season_id)
        data_tests:
          - unique
          - not_null
      - name: canonical_player_id
        data_type: string
        description: Foreign key to dim_players (unified player identifier)
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
        data_tests:
          - not_null
      - name: season_id
        data_type: int
        description: Season identifier
        data_tests:
          - not_null
      - name: behavioral_vector
        data_type: array<double>
        description: >
          Element-wise mean of 32-dim behavioral vectors across all matches
          in this competition-season.
        data_tests:
          - not_null
      - name: stat_vector
        data_type: array<double>
        description: >
          13-dim stat vector (any_value from the competition-season group).
          NULL when stat data unavailable.
      - name: matches_in_sample
        data_type: bigint
        description: Number of matches contributing to this aggregation
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
      - name: data_sources
        data_type: array<string>
        description: Array of distinct data providers contributing to this aggregation

  - name: fct_player_embeddings_career
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Career-level aggregation of player embedding vectors. Averages all
      match-level embeddings across competitions and seasons into a single
      career embedding per player. Both behavioral and stat vectors are
      averaged element-wise. One row per canonical_player_id.
    columns:
      - name: canonical_player_id
        data_type: string
        description: Primary key — unified player identifier
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_players')
              field: canonical_player_id
              config:
                severity: warn
      - name: behavioral_vector
        data_type: array<double>
        description: >
          Element-wise mean of 32-dim behavioral vectors across all career
          matches.
        data_tests:
          - not_null
      - name: stat_vector
        data_type: array<double>
        description: >
          Element-wise mean of 13-dim stat vectors across all career matches.
          NULL stat_vectors are excluded from the mean. NULL when no stat
          data available for any match.
      - name: total_matches
        data_type: bigint
        description: Total number of matches contributing to this career embedding
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 1000
      - name: data_sources
        data_type: array<string>
        description: Array of distinct data providers contributing to this aggregation

  - name: fct_physical_stats
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-player per-match physical performance metrics from tracking data.
      Aggregates distance, speed, acceleration, and sprint metrics from
      fct_tracking_frames. One row per (player_id, match_id). Only available
      for tracking matches (Metrica, IDSSE, SkillCorner).
    columns:
      - name: physical_stats_id
        data_type: string
        description: Surrogate key (player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: source_provider
        data_type: string
        description: Tracking data provider (metrica, idsse, skillcorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica', 'idsse', 'skillcorner']
      - name: frame_rate
        data_type: bigint
        description: Frame rate in fps
      - name: minutes_played
        data_type: decimal(36,25)
        description: Estimated minutes played (from frame range)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 150
                row_condition: "minutes_played is not null"
              config:
                severity: warn
      - name: total_distance_m
        data_type: double
        description: Total distance covered in meters
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20000
                row_condition: "total_distance_m is not null"
              config:
                severity: warn
      - name: total_distance_km
        data_type: double
        description: Total distance covered in kilometers
      - name: hsr_distance_m
        data_type: double
        description: Distance covered at high speed (>= 5.5 m/s) in meters
      - name: sprint_distance_m
        data_type: double
        description: Distance covered at sprint speed (>= 7.0 m/s) in meters
      - name: sprint_frame_count
        data_type: bigint
        description: Number of frames at sprint speed
      - name: high_accel_count
        data_type: bigint
        description: Number of frames with acceleration >= 3.0 m/s^2
      - name: high_decel_count
        data_type: bigint
        description: Number of frames with deceleration <= -3.0 m/s^2
      - name: distance_per_minute_m
        data_type: double
        description: Distance covered per minute in meters
      - name: avg_speed_ms
        data_type: double
        description: Average speed in m/s
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10
                row_condition: "avg_speed_ms is not null"
              config:
                severity: warn
      - name: max_speed_ms
        data_type: double
        description: Maximum speed in m/s
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 15
                row_condition: "max_speed_ms is not null"
              config:
                severity: warn
      - name: avg_x
        data_type: double
        description: Average X position during the match
      - name: avg_y
        data_type: double
        description: Average Y position during the match
      - name: total_off_ball_xt
        data_type: double
        description: Total Off-Ball xT contribution (NULL until batch computed)
      - name: avg_off_ball_xt
        data_type: double
        description: Average Off-Ball xT contribution per frame
      - name: off_ball_xt_frames_sampled
        data_type: int
        description: Number of frames sampled for Off-Ball xT computation

  - name: fct_defensive_values
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-defender per-match defensive valuation summary. Aggregates DEFCON-lite
      credits into per-match totals and breakdowns by credit type (Intercept,
      Concede, Disturb, Deter). One row per defender per match.
    columns:
      - name: defensive_value_id
        data_type: string
        description: Surrogate key (player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: total_defcon_value
        data_type: double
        description: Total DEFCON value across all credit types
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 50
                row_condition: "total_defcon_value is not null"
              config:
                severity: warn
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
      - name: data_source
        data_type: string
        description: Data provenance (statsbomb_360, metrica_tracking)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb_360', 'metrica_tracking']
      - name: total_credits
        data_type: bigint
        description: Total number of defensive credits
      - name: intercept_value
        data_type: double
        description: Total Intercept credit value
      - name: concede_value
        data_type: double
        description: Total Concede credit value
      - name: disturb_value
        data_type: double
        description: Total Disturb credit value
      - name: deter_value
        data_type: double
        description: Total Deter credit value
      - name: intercept_count
        data_type: bigint
        description: Number of Intercept credits
      - name: concede_count
        data_type: bigint
        description: Number of Concede credits
      - name: disturb_count
        data_type: bigint
        description: Number of Disturb credits
      - name: deter_count
        data_type: bigint
        description: Number of Deter credits
      - name: high_confidence_count
        data_type: bigint
        description: Number of high-confidence credits
      - name: approx_confidence_count
        data_type: bigint
        description: Number of approximate-confidence credits
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when the defensive values were loaded into the gold table

  - name: fct_defcon_actions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-defender per-action defensive credits. Full granularity DEFCON-lite
      results for timeline visualization. One row per credited defender per
      action. Coordinate system: SPADL 105x68 meters.
    columns:
      - name: defcon_action_id
        data_type: string
        description: Surrogate key (event_id + defender_player_id + data_source)
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_type: string
        description: Original event ID
        data_tests:
          - not_null
      - name: player_id
        data_type: int
        description: Credited defender player ID
        data_tests:
          - not_null
      - name: credit_type
        data_type: string
        description: Credit category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['intercept', 'concede', 'disturb', 'deter']
      - name: confidence
        data_type: string
        description: Confidence level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'approximate']
      - name: defcon_value
        data_type: double
        description: Estimated defensive value
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: team_id
        data_type: int
        description: Foreign key to dim_teams
      - name: defender_x
        data_type: double
        description: Defender X coordinate (SPADL 105x68 meters)
      - name: defender_y
        data_type: double
        description: Defender Y coordinate (SPADL 105x68 meters)
      - name: action_player_id
        data_type: int
        description: Player who performed the action
      - name: action_type
        data_type: string
        description: SPADL action type that triggered the credit
      - name: action_x
        data_type: double
        description: Action X coordinate (SPADL 105x68 meters)
      - name: action_y
        data_type: double
        description: Action Y coordinate (SPADL 105x68 meters)
      - name: dist_to_ball
        data_type: double
        description: Defender distance to ball at action time (meters)
      - name: pitch_control_at_action
        data_type: double
        description: Pitch control value at the action location
      - name: data_source
        data_type: string
        description: Data provenance
        data_tests:
          - not_null
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when loaded into the gold table

  - name: fct_defcon_pressure
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-attacker per-match defensive pressure summary. Aggregates DEFCON-lite
      credits by action_player_id (the real player who performed the action)
      rather than defender_player_id. Shows how much defensive attention each
      attacker attracted. One row per attacker per match.
    columns:
      - name: pressure_id
        data_type: string
        description: Surrogate key (action_player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: int
        description: Foreign key to dim_players (real attacker player_id)
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_players')
              field: player_id
              config:
                severity: warn
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: total_pressure
        data_type: double
        description: Total defensive pressure value received
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 50
                row_condition: "total_pressure is not null"
              config:
                severity: warn
      - name: competition_id
        data_type: int
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: int
        description: Season identifier
      - name: data_source
        data_type: string
        description: Data provenance (statsbomb_360, metrica_tracking)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb_360', 'metrica_tracking']
      - name: total_defensive_actions
        data_type: bigint
        description: Total number of defensive actions credited
      - name: intercept_pressure
        data_type: double
        description: Total Intercept pressure value
      - name: concede_pressure
        data_type: double
        description: Total Concede pressure value
      - name: disturb_pressure
        data_type: double
        description: Total Disturb pressure value
      - name: deter_pressure
        data_type: double
        description: Total Deter pressure value
      - name: intercept_count
        data_type: bigint
        description: Number of Intercept actions
      - name: concede_count
        data_type: bigint
        description: Number of Concede actions
      - name: disturb_count
        data_type: bigint
        description: Number of Disturb actions
      - name: deter_count
        data_type: bigint
        description: Number of Deter actions
      - name: high_confidence_count
        data_type: bigint
        description: Number of high-confidence credits
      - name: approx_confidence_count
        data_type: bigint
        description: Number of approximate-confidence credits
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when loaded into the gold table

  - name: fct_xg_predictions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Custom xG model predictions per shot. Contains logistic regression
      baseline and calibrated XGBoost xG values. INNER JOIN to fct_shots
      ensures referential integrity. One row per scored shot.
    columns:
      - name: shot_id
        data_type: string
        description: FK to fct_shots (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: bigint
        description: FK to fct_match_summary
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: FK to dim_competitions
      - name: xg_logistic
        data_type: double
        description: Logistic regression baseline xG (distance + angle only)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: xg_gradient_boosted
        data_type: double
        description: Calibrated XGBoost xG (all 13 features)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn

  # ── Dimension Tables ──────────────────────────────────────────────────

  - name: dim_players
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Player dimension table combining StatsBomb and Wyscout data via cross-source
      entity resolution (Phase 14). Players matched across sources share a
      canonical_player_id; unmatched players retain their source-native ID.
      One row per unique canonical_player_id.
    columns:
      - name: canonical_player_id
        data_type: string
        description: Surrogate key for cross-source identity (unique per player)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: int
        description: Source-native player identifier
        data_tests:
          - not_null
      - name: player_name
        data_type: string
        description: Player full name
        data_tests:
          - not_null
      - name: player_display_name
        data_type: string
        description: Preferred display name (nickname or short_name if available)
        data_tests:
          - not_null
      - name: primary_position
        data_type: string
        description: Most common playing position from source data
      - name: position_group
        data_type: string
        description: >
          Broad position category (Goalkeeper, Defender, Midfielder, Forward)
          mapped from primary_position via position_mapping seed
        data_tests:
          - accepted_values:
              arguments:
                values: ['Goalkeeper', 'Defender', 'Midfielder', 'Forward']
              config:
                severity: warn
      - name: statsbomb_player_id
        data_type: int
        description: StatsBomb player_id (null for Wyscout-only players)
      - name: wyscout_player_id
        data_type: int
        description: Wyscout wyId (null for unmatched StatsBomb players)
      - name: match_confidence
        data_type: double
        description: Entity resolution confidence score (0-100, null if unmatched)
      - name: match_layer
        data_type: bigint
        description: >
          Resolution layer (0=manual override, 1=strict, 2=standard, 3=relaxed,
          null if unmatched)
      - name: birth_date
        data_type: string
        description: Date of birth from Wyscout (YYYY-MM-DD, null if unmatched)
      - name: nationality
        data_type: string
        description: Country name from Wyscout passportArea (null if unmatched)
      - name: data_sources
        data_type: string
        description: Comma-separated list of data providers for this player
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'statsbomb,wyscout']

  - name: dim_teams
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Team dimension table. Deduplicated team master data from all
      data sources. One row per unique team.
    columns:
      - name: team_id
        data_type: bigint
        description: Primary key — canonical team identifier
        data_tests:
          - unique
          - not_null
      - name: team_name
        data_type: string
        description: Team display name (NULL for Wyscout — names not in open data)
      - name: data_source
        data_type: string
        description: Data provider
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']

  - name: dim_competitions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Competition dimension table. Combines competition metadata from
      StatsBomb and Wyscout sources with seed data enrichment.
      One row per unique competition.
    columns:
      - name: competition_id
        data_type: int
        description: Primary key — canonical competition identifier
        data_tests:
          - unique
          - not_null
      - name: competition_name
        data_type: string
        description: Competition display name
        data_tests:
          - not_null
      - name: country
        data_type: string
        description: Country where the competition is held
      - name: gender
        data_type: string
        description: Gender category (male, female)
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'female']

  # ── PAUSA Tables ──────────────────────────────────────────────────────

  - name: fct_pass_timing
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-player per-match PAUSA pass timing aggregation. Temporal judgment,
      spatial selection, and composite PAUSA score aggregated at the
      player-match grain. One row per player per match.
    columns:
      - name: player_id
        data_type: string
        description: Player identifier (foreign key to dim_players)
      - name: match_id
        data_type: string
        description: Match identifier
      - name: player_display_name
        data_type: string
        description: Human-readable player name from dim_players
      - name: pass_count
        data_type: int
        description: Number of passes evaluated for PAUSA
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 500
              config:
                severity: warn
      - name: avg_temporal_judgment
        data_type: double
        description: >
          Average temporal judgment across passes. 1.0 = always released at
          the peak OBSO moment.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: avg_spatial_selection
        data_type: double
        description: >
          Average spatial selection across passes. 1.0 = always chose the
          optimal receiver.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: avg_pausa
        data_type: double
        description: >
          Average PAUSA composite score (temporal × spatial). Higher = better
          pass timing and target choice.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: median_pausa
        data_type: double
        description: Median PAUSA composite score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
              config:
                severity: warn
      - name: passes_above_median_pausa
        data_type: int
        description: Number of passes with PAUSA score above 0.5
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when the row was materialized

  - name: fct_pausa_rankings
    description: >
      Player-level PAUSA aggregate with activity quality filters.
      One row per player, aggregated across all matches.
      Uses actual_obso > 0 as quality proxy for pass filtering.
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: player_id
        data_type: string
        description: Player identifier.
        data_tests:
          - unique
          - not_null
      - name: player_display_name
        data_type: string
        description: Human-readable player name from dim_players.
      - name: total_matches
        data_type: int
        description: Number of distinct matches this player appears in.
      - name: total_passes
        data_type: int
        description: Total passes evaluated by PAUSA pipeline.
      - name: passes_with_value
        data_type: int
        description: >
          Passes with actual_obso > 0 (quality proxy for successful passes).
          Used as the primary activity filter threshold.
      - name: avg_pausa
        data_type: double
        description: Average PAUSA composite score across all passes (0-1, higher = better timing).
      - name: avg_temporal_judgment
        data_type: double
        description: Average temporal judgment component (0-1).
      - name: avg_spatial_selection
        data_type: double
        description: Average spatial selection component (0-1).
      - name: median_pausa
        data_type: double
        description: Median PAUSA score via percentile_approx.
      - name: total_minutes
        data_type: double
        description: >
          Sum of minutes_played from fct_physical_stats (tracking-derived).
          NULL if player has no tracking data. IDSSE-only for current dataset.
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_player_percentiles
    description: >
      Per-competition percentile ranks for player metrics.
      Provides calibration context for raw values (CHI-AUDIT-180 U1).
      Grain: one row per (player_id, competition_id, season_id).
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    columns:
      - name: player_id
        data_type: string
        description: Player identifier.
        data_tests:
          - not_null
      - name: competition_id
        data_type: int
        description: Competition identifier (partition key). NULL when upstream fct_player_stats has NULL.
      - name: season_id
        data_type: int
        description: Season identifier. NULL when upstream fct_player_stats has NULL.
      - name: player_display_name
        data_type: string
        description: Human-readable player name.
      - name: minutes_played
        data_type: double
        description: Total minutes played in this competition/season.
      - name: xg_per_90_pctile
        data_type: double
        description: Percentile rank of xG per 90 within competition/season (0-1).
      - name: goals_per_90_pctile
        data_type: double
        description: Percentile rank of goals per 90.
      - name: passes_per_90_pctile
        data_type: double
        description: Percentile rank of passes per 90.
      - name: progressive_passes_per_90_pctile
        data_type: double
        description: Percentile rank of progressive passes per 90.
      - name: pass_completion_pct_pctile
        data_type: double
        description: Percentile rank of pass completion percentage.
      - name: vaep_per_90_pctile
        data_type: double
        description: Percentile rank of VAEP per 90.
      - name: offensive_vaep_per_90_pctile
        data_type: double
        description: Percentile rank of offensive VAEP per 90.
      - name: defensive_vaep_per_90_pctile
        data_type: double
        description: Percentile rank of defensive VAEP per 90.
      - name: line_breaking_per_90_pctile
        data_type: double
        description: Percentile rank of line-breaking passes per 90.
      - name: defcon_per_90_pctile
        data_type: double
        description: Percentile rank of DEFCON per 90 (NULL when defcon_enabled=false).
      - name: avg_pausa_pctile
        data_type: double
        description: Percentile rank of avg PAUSA (NULL when pausa_enabled=false).
      - name: distance_per_minute_pctile
        data_type: double
        description: Percentile rank of distance per minute (NULL for non-tracking).
      - name: max_speed_pctile
        data_type: double
        description: Percentile rank of max speed (NULL for non-tracking).
      - name: _loaded_at
        data_type: timestamp
        description: Audit timestamp.

  - name: fct_workflow_costs
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: internal
        contains_pii: false
    description: >
      Gold-layer workflow cost attribution from Databricks system tables.
      Joins billing usage with list prices and attributes cost per-task
      proportionally by execution duration within each job run.
      90-day rolling window refreshed daily.
    columns:
      - name: task_key
        data_type: string
        description: >
          Databricks job task key, maps to workflow card entry_point.
        data_tests:
          - not_null
      - name: usage_date
        data_type: date
        description: Date the billing usage was recorded.
        data_tests:
          - not_null
      - name: job_run_id
        data_type: bigint
        description: Databricks job run identifier.
        data_tests:
          - not_null
      - name: workflow_id
        data_type: string
        description: >
          Workflow card identifier (e.g., wf-vaep). Resolved from
          workflow_cost_live via task_key + job_run_id join. NULL for
          runs predating the CostEstimateHook deployment.
      - name: attributed_dbu
        data_type: decimal(10,4)
        description: >
          Proportional DBU consumption for this task within the job run.
          Attributed by execution_duration_seconds ratio.
      - name: attributed_cost_usd
        data_type: decimal(10,4)
        description: >
          Proportional dollar cost for this task within the job run.
          Attributed by execution_duration_seconds ratio.

  # ── Formation Detection ────────────────────────────────────────────────

  - name: fct_formation_labels
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer formation detection results per match, period, and team.
      Contains one row per detected formation window: the time range during
      which a given team held a specific shape, as identified by either the
      EFPI (Elastic Formation Position Identifier) algorithm (Hungarian method
      template matching) or the shape graph detector (Sotudeh 2026). The
      detector column distinguishes which algorithm produced each row. Sourced
      from the bronze formation_labels table written by the formations
      ingestion pipeline.
      References: Shaw & Glickman (2019), Sotudeh (2026).
    columns:
      - name: formation_label_id
        data_type: string
        description: Surrogate key (match_id + period + team + window_start_s + detector)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: period
        data_type: int
        description: Match period (1 or 2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 2
              config:
                severity: warn
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: window_start_s
        data_type: double
        description: Window start time in seconds from period start
      - name: window_end_s
        data_type: double
        description: Window end time in seconds from period start
      - name: formation_label
        data_type: string
        description: "Detected formation label (e.g., 4-4-2, 4-3-3)"
        data_tests:
          - not_null
      - name: cost
        data_type: double
        description: >
          Hungarian matching cost for template fit. Lower values indicate a
          closer match between observed player positions and the formation
          template. Used to assess detection confidence.
      - name: detector
        data_type: string
        description: "Detection algorithm: efpi (Bekkers & Dabadghao 2025) or shape_graph (Sotudeh 2026)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['efpi', 'shape_graph']
      - name: _ingested_at
        data_type: timestamp
        description: UTC timestamp when the row was written to the bronze table

  # ── Position Maps (Shape Graph) ──────────────────────────────────────

  - name: fct_player_positions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer per-frame position labels from the shape graph algorithm.
      Each row assigns a player to a tactical position (5-level vertical x
      5-level horizontal grid) for one tracking frame. Incremental by match_id.
      Reference: Sotudeh, S. (2026). Shape graph formation detection.
    columns:
      - name: position_id
        data_type: string
        description: Surrogate key (match_id + frame_id + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: frame_id
        data_type: bigint
        description: Tracking frame identifier within the match
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: position_label
        data_type: string
        description: "Tactical position label (e.g., LC-DM, C-B, R-AM)"
        data_tests:
          - not_null
      - name: vertical_level
        data_type: string
        description: "Vertical pitch zone: B (back), DM, M (mid), AM, F (front)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['B', 'DM', 'M', 'AM', 'F']
      - name: horizontal_level
        data_type: string
        description: "Horizontal pitch zone: L, LC, C, RC, R"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['L', 'LC', 'C', 'RC', 'R']
      - name: detector
        data_type: string
        description: Detection algorithm identifier (shape_graph)
        data_tests:
          - not_null
      - name: _ingested_at
        data_type: timestamp
        description: UTC timestamp when the row was written to the bronze table

  - name: fct_position_maps
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer aggregated position maps per player per match. Each row
      represents the proportion of time a player spent in a given tactical
      position (5x5 grid). Computed from fct_player_positions by counting
      frames per position and normalising to percentage of total frames.
      The phase column supports future possession-phase variants.
      Reference: Sotudeh, S. (2026). Shape graph formation detection.
    columns:
      - name: position_map_id
        data_type: string
        description: Surrogate key (player_id + match_id + position_label + phase)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: position_label
        data_type: string
        description: "Tactical position label (e.g., LC-DM, C-B, R-AM)"
        data_tests:
          - not_null
      - name: vertical_level
        data_type: string
        description: "Vertical pitch zone: B (back), DM, M (mid), AM, F (front)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['B', 'DM', 'M', 'AM', 'F']
      - name: horizontal_level
        data_type: string
        description: "Horizontal pitch zone: L, LC, C, RC, R"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['L', 'LC', 'C', 'RC', 'R']
      - name: pct_time
        data_type: double
        description: >
          Percentage of total frames the player occupied this position
          within the match (0-100, rounded to 2 decimals).
        data_tests:
          - not_null
      - name: phase
        data_type: string
        description: >
          Possession phase filter: all (full match), in_possession, or
          out_of_possession. Currently only 'all' is populated; phase
          variants are deferred.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all', 'in_possession', 'out_of_possession']

  - name: fct_tracking_avg_positions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer pre-computed average positions per player per match-period.
      Replaces expensive runtime AVG() queries that scan 1-3M rows of
      fct_tracking_frames. One row per (match_id, period, player_id, team).
      Coordinate system: StatsBomb 120x80 pitch coordinates.
    columns:
      - name: avg_position_id
        data_type: string
        description: Surrogate key (match_id + period + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: period
        data_type: int
        description: Match period (1 or 2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 2
              config:
                severity: warn
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: avg_x
        data_type: double
        description: Average X coordinate across all frames in the period (0-120 scale)
      - name: avg_y
        data_type: double
        description: Average Y coordinate across all frames in the period (0-80 scale)
      - name: avg_speed
        data_type: double
        description: Average speed in meters per second across all frames in the period
      - name: frame_count
        data_type: bigint
        description: Number of tracking frames for this player in the period (for weighting)
        data_tests:
          - not_null
      - name: min_frame
        data_type: int
        description: First frame number for this player in the period
      - name: max_frame
        data_type: int
        description: Last frame number for this player in the period
      - name: frame_rate
        data_type: bigint
        description: Tracking frame rate in Hz (constant per match, MAX aggregated)

  - name: fct_tracking_shape_timeline
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer pre-computed time-bucketed positions at 5-second intervals.
      Replaces expensive runtime sampled-position queries on fct_tracking_frames.
      One row per (match_id, period, time_bucket, player_id, team).
      Coordinate system: StatsBomb 120x80 pitch coordinates.
    columns:
      - name: shape_timeline_id
        data_type: string
        description: Surrogate key (match_id + period + time_bucket + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier (string, prefixed by tracking provider)
        data_tests:
          - not_null
      - name: period
        data_type: int
        description: Match period (1 or 2)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 2
              config:
                severity: warn
      - name: time_bucket
        data_type: bigint
        description: >
          Time bucket start in seconds from period start.
          Computed as FLOOR(timestamp_seconds / 5) * 5 for 5-second intervals.
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: team
        data_type: string
        description: Team side (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: avg_x
        data_type: double
        description: Average X coordinate within the 5-second bucket (0-120 scale)
      - name: avg_y
        data_type: double
        description: Average Y coordinate within the 5-second bucket (0-80 scale)
      - name: avg_speed
        data_type: double
        description: Average speed in meters per second within the 5-second bucket

  # ── Line-Breaking Detection ──────────────────────────────────────────

  - name: fct_line_breaking_results
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer line-breaking detection results per pass event. Each row
      records whether a pass was line-breaking, how many defensive lines
      were broken, and the type of line break. One row per event. Sourced
      from the bronze line_breaking_results table written by the
      line-breaking detection pipeline.
    columns:
      - name: line_breaking_id
        data_type: string
        description: Surrogate key (event_id)
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_type: string
        description: Source event identifier from the pass event
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: is_line_breaking
        data_type: boolean
        description: Whether the pass broke at least one defensive line
        data_tests:
          - not_null
      - name: lines_broken
        data_type: int
        description: Number of defensive lines broken by the pass (0 if not line-breaking)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 4
              config:
                severity: warn
      - name: line_breaking_type
        data_type: string
        description: "Type of line break (e.g., between, through). NULL if not line-breaking."
      - name: data_source
        data_type: string
        description: Data provider that supplied the source event data
        data_tests:
          - not_null

  # ── Off-Ball xT ─────────────────────────────────────────────────────

  - name: fct_off_ball_xt
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer off-ball expected threat (xT) results per player per match.
      Each row contains aggregated off-ball xT metrics: total accumulated xT
      from off-ball movement, average xT per sampled frame, and the number of
      frames sampled. One row per player per match. Sourced from the bronze
      off_ball_xt_results table written by the off-ball xT compute pipeline.
    columns:
      - name: off_ball_xt_id
        data_type: string
        description: Surrogate key (player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        data_type: string
        description: Player identifier from the tracking data source
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: total_off_ball_xt
        data_type: double
        description: "Total off-ball xT accumulated across all sampled frames (0\u20131+ scale, higher = more threat generated)"
      - name: avg_off_ball_xt
        data_type: double
        description: "Average off-ball xT per sampled frame (0\u20131 scale, higher = better positioning)"
      - name: frames_sampled
        data_type: int
        description: Number of tracking frames sampled for this player in this match
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
