  - name: fct_defensive_values
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-defender per-match defensive valuation summary. Aggregates DEFCON-lite
      credits into per-match totals and breakdowns by credit type (Intercept,
      Concede, Disturb, Deter). One row per defender per match.
    columns:
      - name: defensive_value_id
        data_type: string
        description: Surrogate key (player_id + match_id)
        data_tests:
          - unique
          - not_null
      - name: player_id
        # bigint, not int: bronze.defcon_results.defender_player_id is BIGINT
        # because StatsBomb 360 freeze frames are anonymous and the synthetic
        # ID is generated via monotonically_increasing_id() which produces
        # 64-bit values exceeding INT range under multi-partition serverless
        # (PR #210, 2026-04-27). Casting BIGINT->INT statically fails ANSI.
        data_type: bigint
        description: Foreign key to dim_players
        data_tests:
          - not_null
      - name: match_id
        data_type: string
        description: Match identifier
        data_tests:
          - not_null
      - name: total_defcon_value
        data_type: double
        description: Total DEFCON value across all credit types
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -5
                max_value: 50
                row_condition: "total_defcon_value is not null"
              config:
                severity: warn
      - name: competition_id
        data_type: bigint
        description: Foreign key to dim_competitions
      - name: season_id
        data_type: bigint
        description: Season identifier
      - name: team_id
        data_type: bigint
        description: Foreign key to dim_teams
      - name: data_source
        data_type: string
        description: Data provenance (statsbomb_360, metrica_tracking)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb_360', 'metrica_tracking']
      - name: total_credits
        data_type: bigint
        description: Total number of defensive credits
      - name: intercept_value
        data_type: double
        description: Total Intercept credit value
      - name: concede_value
        data_type: double
        description: Total Concede credit value
      - name: disturb_value
        data_type: double
        description: Total Disturb credit value
      - name: deter_value
        data_type: double
        description: Total Deter credit value
      - name: intercept_count
        data_type: bigint
        description: Number of Intercept credits
      - name: concede_count
        data_type: bigint
        description: Number of Concede credits
      - name: disturb_count
        data_type: bigint
        description: Number of Disturb credits
      - name: deter_count
        data_type: bigint
        description: Number of Deter credits
      - name: high_confidence_count
        data_type: bigint
        description: Number of high-confidence credits
      - name: approx_confidence_count
        data_type: bigint
        description: Number of approximate-confidence credits
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when the defensive values were loaded into the gold table
      - name: match_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_matches.match_key (PR 6, ADR-011).
          Resolved via provider CASE on data_source.
        data_tests:
          - relationships:
              to: ref('dim_matches')
              field: match_key
              config:
                severity: warn
                where: "match_key IS NOT NULL"
      - name: team_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_teams.team_key (defender's team).
        data_tests:
          - relationships:
              to: ref('dim_teams')
              field: team_key
              config:
                severity: warn
                where: "team_key IS NOT NULL"
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players.player_key (defender).
          Resolution rate is structurally low (~16% on dev_gold) due to
          360-synthetic defenders that don't have real player_id.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
                where: "player_key IS NOT NULL"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - match_id
            - data_source

