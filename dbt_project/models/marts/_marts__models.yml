                where: "player_key IS NOT NULL"
      - name: action_player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players.player_key (the action-performing
          player; the real attacker who drew the defensive credit).
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
                severity: warn
                where: "action_player_key IS NOT NULL"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_id
            - player_id
            - data_source

