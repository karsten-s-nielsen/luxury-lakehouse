      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when loaded into the gold table
      - name: match_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_matches.match_key (PR 6, ADR-011).
          Resolved via provider CASE on data_source.
        data_tests:
          - relationships:
              to: ref('dim_matches')
              field: match_key
              config:
                severity: warn
                where: "match_key IS NOT NULL"
      - name: team_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_teams.team_key (defender's team).
        data_tests:
          - relationships:
              to: ref('dim_teams')
              field: team_key
              config:
                severity: warn
                where: "team_key IS NOT NULL"
      - name: player_key
        data_type: bigint
        description: >
          Kimball surrogate FK to dim_players.player_key (defender).
          Resolution rate is structurally low (~16%) due to 360-synthetic
          defenders that don't have real player_id; action_player_key
          (below) resolves at near-100%.
        data_tests:
          - relationships:
              to: ref('dim_players')
              field: player_key
              config:
