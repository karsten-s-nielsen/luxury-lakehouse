  - name: fct_xg_predictions
    config:
      contract:
        enforced: true
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Gold-layer v1 xG predictions (logistic regression baseline + calibrated
      XGBoost). Kimball keys (match_key, competition_key) inherited from
      fct_shots via INNER JOIN on shot_id per ADR-013 (PR 3). One row per
      scored shot. Legacy competition_id INT retained nullable until PR 8
      sweep.
    columns:
      - name: shot_id
        data_type: string
        description: FK to fct_shots (surrogate key)
        data_tests:
          - unique
          - not_null
      - name: match_key
        data_type: bigint
        description: Kimball surrogate FK to dim_matches (inherited from fct_shots via INNER JOIN on shot_id).
        data_tests:
          - not_null
      - name: competition_key
        data_type: bigint
        description: Kimball surrogate FK to dim_competitions (inherited from fct_shots). Always populated — v1 scores only SB+WS shots, both providers have competition keys.
      - name: competition_id
        data_type: int
        description: Legacy INT competition id, nullable (inherited from fct_shots). Scheduled for removal in PR 8 sweep; replaced by competition_key per ADR-011.
      - name: team_key
        data_type: bigint
        description: Kimball surrogate FK to dim_teams (PR 7 — inherited from fct_shots via INNER JOIN on shot_id).
      - name: player_key
        data_type: bigint
        description: Kimball surrogate FK to dim_players (PR 7 — inherited from fct_shots via INNER JOIN on shot_id).
      - name: xg_logistic
        data_type: double
        description: Logistic regression baseline xG (distance + angle only)
