version: 2

models:
  - name: int_unified_passes
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Unified pass data from StatsBomb and Wyscout sources. Contains all
      passes with standardized schema, progressive pass identification,
      and pass type flags. Materialized as ephemeral (CTE).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_id
            - data_source
    columns:
      - name: event_id
        description: Unique event identifier from source
        data_tests:
          - not_null
      - name: match_id
        description: Match identifier
        data_tests:
          - not_null
      - name: player_id
        description: Player performing the pass
      - name: team_id
        description: Team performing the pass
      - name: start_x
        description: Starting X coordinate (120-yard scale)
      - name: start_y
        description: Starting Y coordinate (80-yard scale)
      - name: end_x
        description: Ending X coordinate (120-yard scale)
      - name: end_y
        description: Ending Y coordinate (80-yard scale)
      - name: is_progressive
        description: Whether the pass moved the ball >=25% closer to goal
      - name: data_source
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: period
        description: Match period (1=first half, 2=second half, etc.)
      - name: minute
        description: Match minute of the pass
      - name: second
        description: Match second of the pass
      - name: pass_type
        description: Pass type classification
      - name: pass_height
        description: Pass height classification (Ground Pass, Low Pass, High Pass)
      - name: body_part
        description: Body part used for the pass
      - name: pass_length
        description: Pass length in yards (Euclidean distance)
      - name: pass_angle_radians
        description: Pass angle in radians
      - name: pass_outcome
        description: Pass outcome (Complete, Incomplete, Out, etc.)
      - name: is_cross
        description: Whether the pass was a cross
      - name: is_switch
        description: Whether the pass was a switch of play
      - name: is_through_ball
        description: Whether the pass was a through ball
      - name: pass_recipient_id
        description: Player ID of the intended pass recipient (StatsBomb only; NULL for Wyscout)

  - name: int_unified_shots
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Unified shot data from StatsBomb and Wyscout sources. Contains all
      shots with standardized schema, geometry features, and outcome
      classification. Materialized as ephemeral (CTE).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_id
            - data_source
    columns:
      - name: event_id
        description: Unique event identifier from source
        data_tests:
          - not_null
      - name: match_id
        description: Match identifier
        data_tests:
          - not_null
      - name: location_x
        description: Shot X coordinate (120-yard scale)
      - name: location_y
        description: Shot Y coordinate (80-yard scale)
      - name: shot_outcome
        description: Standardized shot outcome
        data_tests:
          - not_null
      - name: distance_to_goal
        description: Euclidean distance from shot to goal center
      - name: shot_angle
        description: Angle subtended at the goal posts (radians)
      - name: data_source
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: player_id
        description: Player performing the shot
      - name: team_id
        description: Team performing the shot
      - name: period
        description: Match period
      - name: minute
        description: Match minute of the shot
      - name: second
        description: Match second of the shot
      - name: end_location_x
        description: X coordinate where the shot ended
      - name: end_location_y
        description: Y coordinate where the shot ended
      - name: shot_body_part
        description: Body part used for the shot
      - name: shot_technique
        description: Shot technique classification
      - name: shot_type
        description: Shot type classification
      - name: statsbomb_xg
        description: StatsBomb xG value (NULL for Wyscout)
      - name: is_first_time
        description: Whether the shot was first-time (NULL for Wyscout)

  - name: int_player_xref
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cross-source player identity mapping combining automated entity resolution
      results with manual overrides. Automated matches come from the TF-IDF +
      rapidfuzz + bidirectional pipeline; overrides allow force_match and
      force_reject corrections. Materialized as ephemeral (CTE).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - statsbomb_player_id
            - wyscout_player_id
    columns:
      - name: statsbomb_player_id
        description: StatsBomb player identifier
        data_tests:
          - not_null
      - name: wyscout_player_id
        description: Wyscout player identifier (wyId)
        data_tests:
          - not_null
      - name: confidence
        description: Match confidence score (0-100)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: match_layer
        description: >
          Resolution layer (0=manual override, 1=strict name+DOB+jersey+team,
          2=standard name+DOB, 3=relaxed name+position)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
      - name: resolution_type
        description: How the match was produced (automated or manual_override)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['automated', 'manual_override']

  - name: int_minutes_played
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Approximate minutes played per player per competition per season,
      derived from StatsBomb lineup and substitution event data.
      Materialized as ephemeral (CTE).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - competition_id
            - season_id
    columns:
      - name: player_id
        description: Player identifier
        data_tests:
          - not_null
      - name: competition_id
        description: Competition identifier
        data_tests:
          - not_null
      - name: season_id
        description: Season identifier
        data_tests:
          - not_null
      - name: total_minutes_played
        description: Total minutes played across all matches in a competition/season
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 50000
