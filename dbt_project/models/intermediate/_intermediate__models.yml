version: 2

models:
  - name: int_unified_passes
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Unified pass data from StatsBomb, Wyscout, IDSSE, and Metrica
      sources. Contains all passes with standardized schema, progressive
      pass identification, and pass type flags. Keyed by `match_key`
      (Kimball surrogate FK to dim_matches per ADR-011). Materialized
      as view (upgraded from ephemeral in PR 2).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_key
              - event_id
              - data_source
    columns:
      - name: event_id
        description: Source event identifier (globally unique for StatsBomb/Wyscout; match-local for IDSSE/Metrica — use with match_key for global uniqueness).
        data_tests:
          - not_null
      - name: match_key
        description: Kimball surrogate FK to dim_matches.match_key (bigint, ADR-011).
        data_tests:
          - not_null
      - name: player_id
        description: Player performing the pass (NULL for IDSSE/Metrica — see source staging docs).
      - name: team_id
        description: Team performing the pass
      - name: start_x
        description: Starting X coordinate (120-yard scale)
      - name: start_y
        description: Starting Y coordinate (80-yard scale)
      - name: end_x
        description: Ending X coordinate (120-yard scale)
      - name: end_y
        description: Ending Y coordinate (80-yard scale)
      - name: is_progressive
        description: Whether the pass moved the ball >=25% closer to goal
      - name: data_source
        description: Data provider (statsbomb, wyscout, idsse, metrica)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout', 'idsse', 'metrica']
      - name: period
        description: Match period (1=first half, 2=second half, etc.)
      - name: minute
        description: Match minute of the pass
      - name: second
        description: Match second of the pass
      - name: pass_type
        description: Pass type classification
      - name: pass_height
        description: Pass height classification (Ground Pass, Low Pass, High Pass)
      - name: body_part
        description: Body part used for the pass
      - name: pass_length
        description: Pass length in yards (Euclidean distance)
      - name: pass_angle_radians
        description: Pass angle in radians
      - name: pass_outcome
        description: Pass outcome (Complete, Incomplete, Out, etc.)
      - name: is_cross
        description: Whether the pass was a cross
      - name: is_switch
        description: Whether the pass was a switch of play
      - name: is_through_ball
        description: Whether the pass was a through ball
      - name: pass_recipient_id
        description: Player ID of the intended pass recipient (StatsBomb only; NULL for Wyscout)

  - name: int_unified_shots
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Unified shot events from StatsBomb and Wyscout sources. Each per-source
      CTE emits an identical schema; the final `keyed` CTE joins `dim_matches`
      to assign `match_key` (Kimball surrogate BIGINT FK per ADR-011). Native
      `match_id` / `provider` / `native_match_id` are not present in the
      output — recover via JOIN dim_matches ON match_key. Materialized as
      view (upgraded from ephemeral in PR 3, mirroring PR 2's int_unified_passes
      upgrade).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_key
              - event_id
              - data_source
    columns:
      - name: event_id
        description: Source event identifier (globally unique for StatsBomb/Wyscout).
        data_tests:
          - not_null
      - name: match_key
        description: Kimball surrogate FK to dim_matches.match_key (bigint, ADR-011).
        data_tests:
          - not_null
      - name: location_x
        description: Shot X coordinate (120-yard scale)
      - name: location_y
        description: Shot Y coordinate (80-yard scale)
      - name: shot_outcome
        description: Standardized shot outcome
        data_tests:
          - not_null
      - name: distance_to_goal
        description: Euclidean distance from shot to goal center
      - name: shot_angle
        description: Angle subtended at the goal posts (radians)
      - name: data_source
        description: Data provider (statsbomb, wyscout)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['statsbomb', 'wyscout']
      - name: player_id
        description: Player performing the shot
      - name: team_id
        description: Team performing the shot
      - name: period
        description: Match period
      - name: minute
        description: Match minute of the shot
      - name: second
        description: Match second of the shot
      - name: end_location_x
        description: X coordinate where the shot ended
      - name: end_location_y
        description: Y coordinate where the shot ended
      - name: end_location_z
        description: "Z coordinate of shot end location — goalmouth height in yards (0-8). StatsBomb only; NULL for Wyscout."
      - name: shot_body_part
        description: Body part used for the shot
      - name: shot_technique
        description: Shot technique classification
      - name: shot_type
        description: Shot type classification
      - name: statsbomb_xg
        description: StatsBomb xG value (NULL for Wyscout)
      - name: is_first_time
        description: Whether the shot was first-time (NULL for Wyscout)
      - name: play_pattern
        description: Play-pattern context for the shot (NULL for Wyscout — not emitted by the source).

  - name: int_player_xref
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cross-provider player identity mapping (ADR-011 PR 5a).
      Grain: (source_a, player_id_a, source_b, player_id_b).
      Convention: source_a < source_b lexicographically — each unordered
      pair appears once. Automated matches come from
      scripts/generate_entity_xref.py (rapidfuzz token_sort_ratio); manual
      overrides via seeds/player_xref_overrides.csv support force_match
      and force_reject. Materialized as view (was ephemeral pre-PR-5a).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_a
              - player_id_a
              - source_b
              - player_id_b
    columns:
      - name: source_a
        description: Provider label for side A (statsbomb/wyscout/idsse/metrica).
        data_tests:
          - not_null
      - name: player_id_a
        description: Native player identifier on side A (stringified).
        data_tests:
          - not_null
      - name: source_b
        description: Provider label for side B.
        data_tests:
          - not_null
      - name: player_id_b
        description: Native player identifier on side B (stringified).
        data_tests:
          - not_null
      - name: confidence
        description: Match confidence score (70-100; below-70 discarded at generator).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 70
                max_value: 100
      - name: match_layer
        description: >
          Resolution tier (0=manual override, 1+=automated tiers).
        data_tests:
          - not_null
      - name: resolution_type
        description: How the match was produced.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['automated', 'manual_override']

  - name: int_team_xref
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cross-provider team identity mapping (ADR-011 PR 5a).
      Mirror of int_player_xref for teams. Grain:
      (source_a, team_id_a, source_b, team_id_b).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_a
              - team_id_a
              - source_b
              - team_id_b
    columns:
      - name: source_a
        description: Provider label for side A.
        data_tests:
          - not_null
      - name: team_id_a
        description: Native team identifier on side A (stringified).
        data_tests:
          - not_null
      - name: source_b
        description: Provider label for side B.
        data_tests:
          - not_null
      - name: team_id_b
        description: Native team identifier on side B (stringified).
        data_tests:
          - not_null
      - name: confidence
        description: Match confidence 70-100.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 70
                max_value: 100
      - name: match_layer
        description: 0=manual override, 1+=automated tiers.
      - name: resolution_type
        description: >
          Value is 'automated' for rapidfuzz-generator rows or
          'manual_override' for seeded force_match / force_reject rows.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['automated', 'manual_override']

  - name: int_minutes_played
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Approximate minutes played per player per competition per season,
      derived from StatsBomb lineup and substitution event data.
      Materialized as ephemeral (CTE).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - competition_id
              - season_id
    columns:
      - name: player_id
        description: Player identifier
        data_tests:
          - not_null
      - name: competition_id
        description: Competition identifier
        data_tests:
          - not_null
      - name: season_id
        description: Season identifier
        data_tests:
          - not_null
      - name: total_minutes_played
        description: Total minutes played across all matches in a competition/season
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 50000

  - name: int_running_score
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Running scoreline per match. One kickoff row (0-0) plus one row per
      goal event with cumulative home/away scores. Ephemeral CTE consumed
      by mart models to derive per-action game state.
    columns:
      - name: native_match_id
        description: Native match identifier (STRING, all providers). StatsBomb/Wyscout are stringified ints; IDSSE/Metrica are native string IDs.
        data_tests:
          - not_null
      - name: match_key
        description: Kimball surrogate FK to dim_matches.match_key (BIGINT).
        data_tests:
          - not_null
      - name: home_team_id_native
        description: Native home team identifier (STRING, all providers).
        data_tests:
          - not_null
      - name: away_team_id_native
        description: Native away team identifier (STRING, all providers).
        data_tests:
          - not_null
      - name: period
        description: Match period of the score change
      - name: minute
        description: Match minute of the score change
      - name: second
        description: Match second of the score change
      - name: home_score_after
        description: Cumulative home team goals after this event
        data_tests:
          - not_null
      - name: away_score_after
        description: Cumulative away team goals after this event
        data_tests:
          - not_null

  - name: int_tracking_goalkeepers
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      GK player identities per match from tracking_context staging (TC-2).
      Single source of truth for is_goalkeeper across all tracking providers,
      powered by silly-kicks derive_goalkeepers() 3-tier identification.
      Grain: one row per (match_key, player_key). Ephemeral — inlined as CTE
      into fct_tracking_frames. INNER JOINs to dim_matches/dim_players for
      Kimball surrogate key resolution; unresolved IDs guarded by
      assert_unresolved_gk_player_ids.sql.
    columns:
      - name: match_key
        description: Kimball surrogate FK to dim_matches.match_key (BIGINT).
        data_tests:
          - not_null
      - name: player_key
        description: Kimball surrogate FK to dim_players.player_key (BIGINT).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_key, player_key]

  - name: int_tracking__player_match_team_bridge
    description: >
      Per-(source_provider, match_id, player_id) → team_id bridge for tracking-derived
      facts. Materialized as table (small ~616-row footprint avoids repeat 38M-row
      DISTINCT scans across formations marts that would otherwise force full scans
      on each consumer JOIN). PR 7 hotfix #3.
    columns:
      - name: source_provider
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse', 'metrica', 'skillcorner']
      - name: match_id
        data_type: string
        data_tests:
          - not_null
      - name: player_id
        data_type: string
        data_tests:
          - not_null
      - name: team_id
        data_type: string
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_provider, match_id, player_id]

  - name: int_tracking__match_side_team_bridge
    description: >
      Per-(source_provider, match_id, side='home'/'away') → team_id bridge.
      Generalises the deleted stg_idsse__home_away_teams across all 3 tracking
      providers. Used by fct_match_summary to resolve home/away team_keys for
      IDSSE/Metrica/SkillCorner and by fct_formation_labels for per-side team
      resolution. PR 7 hotfix #3.
    columns:
      - name: source_provider
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse', 'metrica', 'skillcorner']
      - name: match_id
        data_type: string
        data_tests:
          - not_null
      - name: side
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_id
        data_type: string
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_provider, match_id, side]
