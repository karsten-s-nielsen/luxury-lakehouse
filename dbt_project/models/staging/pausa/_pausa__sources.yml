version: 2

sources:
  - name: pausa
    description: >
      PAUSA (Passing Ability Under Spatiotemporal Awareness) pipeline outputs.
      Contains per-pass OBSO raw scores from GPU batch (D16) and computed
      PAUSA values from the serverless pipeline (D10).
    database: soccer_analytics
    schema: bronze
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: pausa_raw_scores
        description: >
          Per-pass OBSO scalars produced by D16 GPU batch on HF Jobs.
          Each row is one pass with actual, peak, and optimal OBSO values.
        columns:
          - name: pass_id
            description: Unique pass identifier
          - name: match_id
            description: Match identifier
          - name: actual_obso
            description: OBSO value at the moment the pass was released
          - name: peak_obso
            description: Maximum OBSO in the temporal window (±3s/+1s)
          - name: optimal_obso
            description: Maximum OBSO across all available receivers

  - name: pausa_gold
    description: >
      PAUSA computed values in the gold layer, written directly by the
      compute_pausa Python pipeline.
    database: soccer_analytics
    schema: dev_gold
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: fct_pausa_values
        description: >
          Per-pass PAUSA decomposition: temporal judgment, spatial selection,
          and composite PAUSA score. Written by compute_pausa pipeline.
        columns:
          - name: pass_id
            description: Unique pass identifier
          - name: match_id
            description: Match identifier
          - name: player_id
            description: Passer player identifier
          - name: team
            description: Team of the passer
          - name: period
            description: Match period
          - name: timestamp_seconds
            description: Event timestamp in seconds
          - name: frame_id
            description: Aligned tracking frame ID
          - name: temporal_judgment
            description: Ratio of actual to peak OBSO (0–1)
          - name: spatial_selection
            description: Ratio of actual to optimal OBSO (0–1)
          - name: pausa_score
            description: Composite PAUSA = temporal × spatial (0–1)
          - name: actual_obso
            description: OBSO value at pass release
          - name: peak_obso
            description: Peak OBSO in temporal window
          - name: optimal_obso
            description: Optimal OBSO across receivers
          - name: receiver_x
            description: Receiver X coordinate (StatsBomb 120×80)
          - name: receiver_y
            description: Receiver Y coordinate (StatsBomb 120×80)
