version: 2

sources:
  - name: entity_resolution
    description: >
      Cross-source player entity resolution results produced by the TF-IDF +
      rapidfuzz + bidirectional validation pipeline. Contains automated matches
      between StatsBomb and Wyscout player IDs.
    database: soccer_analytics
    schema: bronze
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: player_xref_raw
        description: >
          Automated cross-source player matches from the three-layer entity
          resolution pipeline. PR 5a (ADR-011) extends from SB↔WS-only to
          multi-provider pairs — new rows from scripts/generate_entity_xref.py
          cover SB↔IDSSE + WS↔IDSSE. The existing source_a / source_b columns
          serve as the canonical provider-label columns (pre-populated for all
          2,780 legacy rows with 'statsbomb' / 'wyscout'). Convention:
          source_a < source_b lexicographically.
        columns:
          - name: player_id_a
            description: Native player identifier on side A (stringified for cross-provider compat)
          - name: player_id_b
            description: Native player identifier on side B
          - name: confidence
            description: Match confidence score (70-100; below-70 discarded at generator)
          - name: match_method
            description: Algorithm variant used (e.g. layer1_tfidf_rapidfuzz_bidirectional)
          - name: match_layer
            description: Resolution layer (0=manual override; 1=strict; 2=standard; 3=relaxed)
          - name: source_a
            description: >
              Provider label for side A (e.g., 'statsbomb', 'wyscout', 'idsse').
              PR 5a canonical column for cross-provider xref; retained from the
              original bronze schema under the source_a / source_b naming
              convention rather than introducing redundant provider_a / provider_b.
          - name: source_b
            description: >
              Provider label for side B. Convention: source_a < source_b
              lexicographically so each unordered pair appears once.

      - name: team_xref_raw
        description: >
          Cross-provider team identity mapping produced by
          scripts/generate_entity_xref.py. Mirror of player_xref_raw.
          Grain: one row per (source_a, team_id_a, source_b, team_id_b).
          Convention: source_a < source_b lexicographically.
        columns:
          - name: source_a
            description: Provider label for side A
          - name: team_id_a
            description: Native team ID on side A (stringified)
          - name: source_b
            description: Provider label for side B
          - name: team_id_b
            description: Native team ID on side B
          - name: confidence
            description: Fuzzy-match confidence 70-100
          - name: match_layer
            description: 0 = manual override; 1..3 = automated tiers
          - name: resolution_type
            description: >
              Value is 'automated' (from the rapidfuzz generator) or
              'manual_override' (from the team_xref_overrides seed).
          - name: _ingested_at
            description: UTC timestamp of MERGE write
