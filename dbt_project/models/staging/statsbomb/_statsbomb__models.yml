version: 2

models:
  - name: stg_statsbomb__events
    description: >
      Flattened and cleaned StatsBomb event data. Extracts key fields from
      nested JSON structures, converts location arrays to separate x/y
      columns, and standardizes timestamps. One row per event.
    columns:
      - name: event_id
        description: Unique event identifier (UUID from StatsBomb)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Foreign key to stg_statsbomb__matches
        data_tests:
          - not_null
      - name: event_type
        description: Event type name (Shot, Pass, Carry, Duel, etc.)
        data_tests:
          - not_null
      - name: team_id
        description: Team performing the event
      - name: player_id
        description: Player performing the event
      - name: location_x
        description: X coordinate on pitch (0-120). May exceed bounds for off-pitch events (throw-ins, GK).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "location_x is not null"
              config:
                severity: warn
      - name: location_y
        description: Y coordinate on pitch (0-80). May exceed bounds for off-pitch events.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "location_y is not null"
              config:
                severity: warn
      - name: minute
        description: Match minute
      - name: second
        description: Match second
      - name: period
        description: Match period (1=first half, 2=second half, etc.)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: timestamp
        description: Precise event timestamp within the match
      - name: possession
        description: Possession sequence number
      - name: possession_team_id
        description: Team ID that has possession
      - name: play_pattern
        description: Play pattern name (Regular Play, From Corner, etc.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['Regular Play', 'From Corner', 'From Free Kick', 'From Goal Kick', 'From Keeper', 'From Kick Off', 'From Throw In', 'Other']
              config:
                severity: warn
      - name: duration
        description: Duration in seconds that the event lasted
      - name: index
        description: Ordering index within a possession sequence
      - name: team_name
        description: Name of the team performing the event
      - name: player_name
        description: Name of the player performing the event
      - name: shot_end_location
        description: Raw JSON array of shot end location coordinates (pass-through for stg_statsbomb__shots)
      - name: shot_freeze_frame
        description: Raw JSON array of freeze frame data (pass-through for stg_statsbomb__shots)
      - name: shot_outcome
        description: Shot outcome string (pass-through for stg_statsbomb__shots)
      - name: shot_technique
        description: Shot technique string (pass-through for stg_statsbomb__shots)
      - name: shot_body_part
        description: Shot body part string (pass-through for stg_statsbomb__shots)
      - name: shot_type
        description: Shot type string (pass-through for stg_statsbomb__shots)
      - name: shot_statsbomb_xg
        description: StatsBomb xG value (pass-through for stg_statsbomb__shots)
      - name: shot_first_time
        description: Whether shot was taken first-time (pass-through for stg_statsbomb__shots)
      - name: shot_one_on_one
        description: Whether shot was a one-on-one (pass-through for stg_statsbomb__shots)
      - name: pass_end_location
        description: Raw JSON array of pass end location coordinates (pass-through for int_unified_passes)
      - name: pass_type
        description: Pass type classification (pass-through for int_unified_passes)
      - name: pass_height
        description: Pass height classification (pass-through for int_unified_passes)
      - name: pass_body_part
        description: Body part used for the pass (pass-through for int_unified_passes)
      - name: pass_length
        description: Pass length in yards (pass-through for int_unified_passes)
      - name: pass_angle
        description: Pass angle in radians (pass-through for int_unified_passes)
      - name: pass_outcome
        description: Pass outcome classification (pass-through for int_unified_passes)
      - name: pass_cross
        description: Whether the pass was a cross (pass-through for int_unified_passes)
      - name: pass_switch
        description: Whether the pass was a switch of play (pass-through for int_unified_passes)
      - name: pass_through_ball
        description: Whether the pass was a through ball (pass-through for int_unified_passes)
      - name: substitution_replacement_id
        description: Player ID of the substitution replacement (pass-through for int_minutes_played)

  - name: stg_statsbomb__shots
    description: >
      Shot-specific extraction from StatsBomb events. Includes shot outcome,
      technique, body part, freeze frame data, and StatsBomb's own xG value.
      One row per shot event.
    columns:
      - name: event_id
        description: Unique shot event identifier
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Foreign key to stg_statsbomb__matches
        data_tests:
          - not_null
      - name: player_id
        description: Shooter player ID
        data_tests:
          - not_null
      - name: team_id
        description: Team performing the shot
        data_tests:
          - not_null
      - name: statsbomb_xg
        description: StatsBomb expected goals value for this shot
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "statsbomb_xg is not null"
      - name: shot_outcome
        description: Outcome of the shot (Goal, Saved, Off T, Blocked, etc.)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Goal', 'Saved', 'Off T', 'Blocked', 'Wayward', 'Post', 'Saved Off Target', 'Saved to Post']
      - name: shot_technique
        description: Shot technique used
        data_tests:
          - accepted_values:
              arguments:
                values: ['Normal', 'Volley', 'Half Volley', 'Lob', 'Overhead Kick', 'Diving Header', 'Backheel']
              config:
                severity: warn
      - name: shot_body_part
        description: Body part used for the shot
        data_tests:
          - accepted_values:
              arguments:
                values: ['Right Foot', 'Left Foot', 'Head', 'No Touch']
              config:
                severity: warn
      - name: location_x
        description: X coordinate of shot location
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
              config:
                severity: warn
      - name: location_y
        description: Y coordinate of shot location
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
              config:
                severity: warn
      - name: end_location_x
        description: X coordinate where the shot ended
      - name: end_location_y
        description: Y coordinate where the shot ended
      - name: distance_to_goal
        description: Euclidean distance from shot to goal center (yards)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 170
                row_condition: "distance_to_goal is not null"
              config:
                severity: warn
      - name: shot_angle
        description: Angle subtended at the goal posts (radians)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3.15
                row_condition: "shot_angle is not null"
              config:
                severity: warn
      - name: team_name
        description: Name of the team taking the shot
      - name: player_name
        description: Name of the player taking the shot
      - name: period
        description: Match period (1=first half, 2=second half, etc.)
      - name: minute
        description: Match minute of the shot
      - name: second
        description: Match second of the shot
      - name: end_location_z
        description: Z coordinate of shot end location (height in yards)
      - name: shot_type
        description: Shot type classification (Open Play, Free Kick, Penalty, etc.)
      - name: is_first_time
        description: Whether the shot was taken first-time without controlling the ball
      - name: is_one_on_one
        description: Whether the shot was a one-on-one with the goalkeeper
      - name: defenders_in_frame
        description: Number of defenders visible in the freeze frame
      - name: teammates_in_frame
        description: Number of teammates visible in the freeze frame

  - name: stg_statsbomb__matches
    description: >
      Cleaned match metadata from StatsBomb. The ingestion layer already
      flattened most fields — competition/season IDs are top-level,
      team names are plain strings (no team_id available).
      One row per match.
    columns:
      - name: match_id
        description: Primary key — unique match identifier
        data_tests:
          - unique
          - not_null
      - name: competition_id
        description: Competition identifier
        data_tests:
          - not_null
      - name: season_id
        description: Season identifier
        data_tests:
          - not_null
      - name: competition_name
        description: Competition display name
      - name: season_name
        description: Season display name
      - name: home_team_name
        description: Home team name
        data_tests:
          - not_null
      - name: away_team_name
        description: Away team name
        data_tests:
          - not_null
      - name: match_date
        description: Date the match was played
        data_tests:
          - not_null
      - name: home_score
        description: Final home team score
      - name: away_score
        description: Final away team score
      - name: home_manager
        description: Home team manager name
      - name: away_manager
        description: Away team manager name
      - name: referee_name
        description: Match referee name
      - name: stadium_name
        description: Stadium where the match was played
      - name: match_status
        description: Match status (available, collecting, etc.)
      - name: match_week
        description: Match week number within the competition
      - name: competition_stage
        description: Competition stage (Group Stage, Round of 16, Final, etc.)
      - name: data_version
        description: StatsBomb data version identifier

  - name: stg_statsbomb__lineups
    description: >
      Flattened lineup data from StatsBomb. Explodes the nested lineup JSON
      array so each row represents one player in one match.
      One row per player per match.
    columns:
      - name: lineup_id
        description: Surrogate key (match_id + team_id + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Foreign key to stg_statsbomb__matches
        data_tests:
          - not_null
      - name: team_name
        description: Team name (no team_id in StatsBomb lineups bronze table)
        data_tests:
          - not_null
      - name: player_id
        description: Player identifier
        data_tests:
          - not_null
      - name: player_name
        description: Player display name
        data_tests:
          - not_null
      - name: jersey_number
        description: Player jersey number for this match
      - name: position_id
        description: Starting position ID (can be mapped via position_mapping seed)
      - name: position_name
        description: Starting position name
      - name: competition_id
        description: Competition identifier (from match metadata)
      - name: season_id
        description: Season identifier (from match metadata)
      - name: player_nickname
        description: Player nickname or short name
      - name: yellow_cards
        description: Number of yellow cards received in the match
      - name: red_cards
        description: Number of red cards received in the match (including second yellow)
