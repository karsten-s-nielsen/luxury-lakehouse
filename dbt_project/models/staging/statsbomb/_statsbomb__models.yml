  - name: stg_statsbomb__lineups
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Flattened lineup data from StatsBomb. Explodes the nested lineup JSON
      array so each row represents one player in one match.
      One row per player per match.
    columns:
      - name: lineup_id
        description: Surrogate key (match_id + team_name + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Foreign key to stg_statsbomb__matches
        data_tests:
          - not_null
      - name: team_name
        description: Team name (no team_id in StatsBomb lineups bronze table)
        data_tests:
          - not_null
      - name: player_id
        description: Player identifier
        data_tests:
          - not_null
      - name: player_name
        description: Player display name
        data_tests:
          - not_null
      - name: jersey_number
        description: Player jersey number for this match
      - name: position_id
        description: Starting position ID (can be mapped via position_mapping seed)
      - name: position_name
        description: Starting position name
      - name: competition_id
        description: Competition identifier (from match metadata)
      - name: season_id
        description: Season identifier (from match metadata)
      - name: player_nickname
        description: Player nickname or short name
      - name: yellow_cards
        description: Number of yellow cards received in the match
      - name: red_cards
        description: Number of red cards received in the match (including second yellow)

      # --- Bronze pass-through cols (PR 2 — Kimball migration, ADR-011) ---
      # Mirror the bronze schema 1:1 for provenance + ad hoc exploration. The
      # typed cols above remain the preferred consumption path. See
      # src/tests/test_staging_coverage.py INITIAL_BRONZE_STAGING_GAPS.
      - name: _ingested_at
        description: Bronze passthrough — UTC timestamp when the row was written to bronze (audit col).
      - name: cards
        description: Bronze passthrough — raw cards JSON array from statsbomb_lineups (also surfaced as counts `yellow_cards` / `red_cards`).
      - name: country
        description: Bronze passthrough — player country-of-birth display-name string from statsbomb_lineups.
      - name: positions
        description: Bronze passthrough — raw positions JSON array from statsbomb_lineups (also surfaced as `position_id` / `position_name`).

  - name: stg_statsbomb__360
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cleaned 360 freeze-frame data from StatsBomb. Bronze data is already
      one row per player per event (statsbombpy returns pre-exploded data).
      This model deduplicates, parses JSON location, and renames to project
      conventions. Only available for 360-enabled matches (11 competition-
      seasons including World Cup 2022, Euro 2024, La Liga 2020/21, etc.).
    columns:
      - name: freeze_frame_id
        description: Surrogate key (event UUID + location + teammate/actor/keeper flags)
        data_tests:
          - unique
          - not_null
      - name: event_uuid
        description: Foreign key to stg_statsbomb__events.event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statsbomb__events')
                field: event_id
              config:
                severity: warn
      - name: match_id
        description: Foreign key to stg_statsbomb__matches
        data_tests:
          - not_null
      - name: is_teammate
        description: Whether this player is on the same team as the event actor
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_actor
        description: Whether this player is the one performing the event
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_keeper
        description: Whether this player is the goalkeeper
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: location_x
        description: >
          Player X coordinate (StatsBomb 120x80 system). May exceed 0-120
          for players visible to the camera but off the pitch.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
                row_condition: "location_x is not null"
              config:
                severity: warn
      - name: location_y
        description: >
          Player Y coordinate (StatsBomb 120x80 system). May exceed 0-80
          for players visible to the camera but off the pitch.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -40
                max_value: 120
                row_condition: "location_y is not null"
              config:
                severity: warn
      - name: competition_id
        description: Competition identifier (from match metadata)
      - name: season_id
        description: Season identifier (from match metadata)
      - name: visible_area_vertices
        description: Number of vertices in the visible area polygon (typically 4-12)

      # --- Bronze pass-through cols (PR 2 — Kimball migration, ADR-011) ---
      # Mirror the bronze schema 1:1 for provenance + ad hoc exploration. The
      # parsed cols above remain the preferred consumption path. See
      # src/tests/test_staging_coverage.py INITIAL_BRONZE_STAGING_GAPS.
      - name: _ingested_at
        description: Bronze passthrough — UTC timestamp when the row was written to bronze (audit col).
      - name: actor
        description: Bronze passthrough — raw `actor` boolean from statsbomb_360 (also surfaced as renamed `is_actor`).
      - name: keeper
        description: Bronze passthrough — raw `keeper` boolean from statsbomb_360 (also surfaced as renamed `is_keeper`).
      - name: location
        description: Bronze passthrough — raw JSON [x,y] array from statsbomb_360 (also surfaced parsed as `location_x` / `location_y`).
      - name: teammate
        description: Bronze passthrough — raw `teammate` boolean from statsbomb_360 (also surfaced as renamed `is_teammate`).
      - name: visible_area
        description: Bronze passthrough — raw visible_area JSON polygon from statsbomb_360 (also surfaced as parsed `visible_area_polygon` / `visible_area_vertices`).
