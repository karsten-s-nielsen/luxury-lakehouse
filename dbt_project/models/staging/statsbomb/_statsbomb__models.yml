version: 2

models:
  - name: stg_statsbomb__events
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Flattened and cleaned StatsBomb event data. Extracts key fields from
      nested JSON structures, converts location arrays to separate x/y
      columns, and standardizes timestamps. One row per event.
    columns:
      - name: event_id
        description: Unique event identifier (UUID from StatsBomb)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Foreign key to stg_statsbomb__matches
        data_tests:
          - not_null
      - name: competition_id
        description: StatsBomb competition identifier
        data_tests:
          - not_null
      - name: season_id
        description: StatsBomb season identifier
        data_tests:
          - not_null
      - name: event_type
        description: Event type name (Shot, Pass, Carry, Duel, etc.)
        data_tests:
          - not_null
      - name: team_id
        description: Team performing the event
      - name: player_id
        description: Player performing the event
      - name: location_x
        description: X coordinate on pitch (0-120). May exceed bounds for off-pitch events (throw-ins, GK).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "location_x is not null"
              config:
                severity: warn
      - name: location_y
        description: Y coordinate on pitch (0-80). May exceed bounds for off-pitch events.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "location_y is not null"
              config:
                severity: warn
      - name: minute
        description: Match minute
      - name: second
        description: Match second
      - name: period
        description: Match period (1=first half, 2=second half, etc.)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
                row_condition: "period is not null"
      - name: timestamp
        description: Precise event timestamp within the match
      - name: possession
        description: Possession sequence number
      - name: possession_team_id
        description: Team ID that has possession
      - name: play_pattern
        description: Play pattern name (Regular Play, From Corner, etc.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['Regular Play', 'From Corner', 'From Free Kick', 'From Goal Kick', 'From Keeper', 'From Kick Off', 'From Throw In', 'Other']
              config:
                severity: warn
      - name: duration
        description: Duration in seconds that the event lasted
      - name: index
        description: Ordering index within a possession sequence
      - name: team_name
        description: Name of the team performing the event
      - name: player_name
        description: Name of the player performing the event
      - name: shot_end_location
        description: Raw JSON array of shot end location coordinates (pass-through for stg_statsbomb__shots)
      - name: shot_freeze_frame
        description: Raw JSON array of freeze frame data (pass-through for stg_statsbomb__shots)
      - name: shot_outcome
        description: Shot outcome string (pass-through for stg_statsbomb__shots)
      - name: shot_technique
        description: Shot technique string (pass-through for stg_statsbomb__shots)
      - name: shot_body_part
        description: Shot body part string (pass-through for stg_statsbomb__shots)
      - name: shot_type
        description: Shot type string (pass-through for stg_statsbomb__shots)
      - name: shot_statsbomb_xg
        description: StatsBomb xG value (pass-through for stg_statsbomb__shots)
      - name: shot_first_time
        description: Whether shot was taken first-time (pass-through for stg_statsbomb__shots)
      - name: shot_one_on_one
        description: Whether shot was a one-on-one (pass-through for stg_statsbomb__shots)
      - name: pass_end_location
        description: Raw JSON array of pass end location coordinates (pass-through for int_unified_passes)
      - name: pass_type
        description: Pass type classification (pass-through for int_unified_passes)
      - name: pass_height
        description: Pass height classification (pass-through for int_unified_passes)
      - name: pass_body_part
        description: Body part used for the pass (pass-through for int_unified_passes)
      - name: pass_length
        description: Pass length in yards (pass-through for int_unified_passes)
      - name: pass_angle
        description: Pass angle in radians (pass-through for int_unified_passes)
      - name: pass_outcome
        description: Pass outcome classification (pass-through for int_unified_passes)
      - name: pass_cross
        description: Whether the pass was a cross (pass-through for int_unified_passes)
      - name: pass_switch
        description: Whether the pass was a switch of play (pass-through for int_unified_passes)
      - name: pass_through_ball
        description: Whether the pass was a through ball (pass-through for int_unified_passes)
      - name: pass_recipient_id
        description: Player ID of the intended pass recipient (NULL for non-pass events)
      - name: pass_recipient_name
        description: Name of the intended pass recipient (NULL for non-pass events)
      - name: substitution_replacement_id
        description: Player ID of the substitution replacement (pass-through for int_minutes_played)
      - name: card_name
        description: >
          Card issued on this event, extracted from `_raw_extra_json` (which
          statsbombpy does NOT flatten). NULL unless `event_type` is
          'Bad Behaviour' or 'Foul Committed' AND a card was shown.
          Observed values: 'Yellow Card', 'Red Card', 'Second Yellow'.
          Downstream mart `fct_discipline_events` filters on this column.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Yellow Card', 'Red Card', 'Second Yellow']

