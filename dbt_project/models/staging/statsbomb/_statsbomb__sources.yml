version: 2

sources:
  - name: statsbomb
    description: >
      StatsBomb open data ingested into the bronze layer via statsbombpy.
      Contains detailed event-level soccer data including shots, passes, carries,
      pressures, and 360 freeze-frame data with player positions at the moment
      of each event. Column documentation auto-generated from
      `DESCRIBE TABLE soccer_analytics.bronze.statsbomb_*` (see
      src/tests/fixtures/statsbomb_bronze_schema_snapshot.json — refresh when
      statsbombpy surfaces new fields or the ingestion code adds derived cols).
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: statsbomb_360
        description: >
          StatsBomb 360 freeze-frame data. statsbombpy returns already-exploded rows — one row per player per event in 360-enabled matches. Enables pitch control and spatial analysis.
        columns:
          - name: id
            description: Event UUID linking this row to the parent event in statsbomb_events
          - name: visible_area
            description: >
              JSON string — flat array of alternating x, y coordinates forming a polygon that represents the camera's visible area on the pitch
          - name: match_id
            description: Foreign key to statsbomb_matches
          - name: teammate
            description: Whether this player is on the same team as the event actor
          - name: actor
            description: Whether this player is the one performing the event
          - name: keeper
            description: Whether this player is the goalkeeper
          - name: location
            description: >
              JSON string — [x, y] coordinate array for this player's position on the pitch (StatsBomb 120x80 coordinate system)
          - name: competition_id
            description: Competition identifier (partition key)
          - name: season_id
            description: Season identifier (partition key)
          - name: _ingested_at
            description: UTC timestamp when the row was written to bronze (audit col).

      - name: statsbomb_competitions
        description: >
          Competition + season catalog. Lists every competition/season with 360 availability flags.
        columns:
          - name: competition_id
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: season_id
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: country_name
            description: >
