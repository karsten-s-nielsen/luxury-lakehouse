      - name: statsbomb_events
        description: >
          Raw event stream for each match. Each row is a single on-ball or off-ball event (pass, shot, carry, duel, etc.). statsbombpy already flattens most nested fields into scalar columns; the remaining JSON strings (location, shot_freeze_frame, tactics, 50_50) are parsed by downstream staging models.
        columns:
          - name: "50_50"
            description: >
              string — JSON blob for 50/50 duel events. Parsed in
              stg_statsbomb__events into fifty_fifty_outcome + fifty_fifty_counterpress.
              Col name is YAML-quoted because unquoted "50_50" parses as integer 5050.
