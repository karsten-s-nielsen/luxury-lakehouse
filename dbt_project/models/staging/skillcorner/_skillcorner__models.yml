version: 2

models:
  - name: stg_skillcorner__tracking
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Normalized SkillCorner broadcast tracking data. Transforms center-origin
      meter coordinates to the shared 120×80 pitch system. 10fps frame rate
      results in sparser velocity data than 25fps optical sources.
      One row per player per frame.
    columns:
      - name: tracking_id
        description: Surrogate key (match_id + period + frame + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Match identifier (prefixed with 'skillcorner_')
        data_tests:
          - not_null
      - name: period
        description: Match half (1 or 2)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: frame
        description: Frame number within the half
        data_tests:
          - not_null
      - name: timestamp_seconds
        description: Timestamp in seconds from period start
      - name: frame_rate
        description: Frame rate in fps (always 10 for SkillCorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10]
      - name: player_id
        description: Player identifier from SkillCorner
        data_tests:
          - not_null
      - name: team
        description: Team affiliation (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: source_provider
        description: Data source identifier (always 'skillcorner')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['skillcorner']
      - name: x
        description: X coordinate scaled to 120-yard pitch
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
      - name: y
        description: Y coordinate scaled to 80-yard pitch
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90
      - name: ball_x
        description: Ball X coordinate scaled to 120-yard pitch
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
                row_condition: "ball_x is not null"
      - name: ball_y
        description: Ball Y coordinate scaled to 80-yard pitch
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90
                row_condition: "ball_y is not null"
