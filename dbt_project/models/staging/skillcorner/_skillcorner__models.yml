version: 2

models:
  - name: stg_skillcorner__tracking
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Normalized SkillCorner broadcast tracking data. Transforms center-origin
      meter coordinates to the shared 120×80 pitch system. 10fps frame rate
      results in sparser velocity data than 25fps optical sources.
      One row per player per frame. Team affiliation resolved via JOIN to
      stg_skillcorner__matches roster.
    columns:
      - name: tracking_id
        description: Surrogate key (match_id + period + frame + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Raw native SkillCorner match ID (numeric string)
        data_tests:
          - not_null
      - name: period
        description: Match half (1 or 2)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: frame
        description: Frame number within the half
        data_tests:
          - not_null
      - name: timestamp_seconds
        description: Timestamp in seconds from period start
      - name: frame_rate
        description: Frame rate in fps (always 10 for SkillCorner)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10]
      - name: player_id
        description: Player identifier from SkillCorner
        data_tests:
          - not_null
      - name: team
        description: Team affiliation (home or away), derived from match roster JOIN
        data_tests:
          - accepted_values:
              arguments:
                values: ['home', 'away']
              config:
                where: "team is not null"
      - name: team_id
        description: Team identifier resolved from stg_skillcorner__matches
      - name: source_provider
        description: Data source identifier (always 'skillcorner')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['skillcorner']
      - name: is_goalkeeper
        description: Whether the player is a goalkeeper (from match roster position)
      - name: x
        description: >
          X coordinate scaled to 120-yard pitch. Broadcast tracking (SkillCorner)
          produces outlier positions beyond the pitch boundary — players stepping
          off-pitch, ball rolling past the line. Bounds are wider than the
          [0, 120] pitch to accommodate these real-world observations.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -15
                max_value: 135
      - name: y
        description: >
          Y coordinate scaled to 80-yard pitch. See x column description for
          rationale on wider-than-pitch bounds for broadcast tracking.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -15
                max_value: 95
      - name: ball_x
        description: Ball X coordinate scaled to 120-yard pitch (wider bounds for broadcast tracking outliers)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -15
                max_value: 135
                row_condition: "ball_x is not null"
      - name: ball_y
        description: Ball Y coordinate scaled to 80-yard pitch (wider bounds for broadcast tracking outliers)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -15
                max_value: 95
                row_condition: "ball_y is not null"
      - name: home_team_id
        description: Home team identifier from match roster
      - name: away_team_id
        description: Away team identifier from match roster
      - name: ball_z
        description: Bronze passthrough — ball height in meters
      - name: is_visible
        description: Bronze passthrough — player visibility in broadcast frame
      - name: ball_is_detected
        description: Bronze passthrough — ball detection flag
      - name: _ingested_at
        description: Bronze passthrough — UTC audit timestamp from ingestion
      - name: access_tier
        description: >
          Per-match HF redistribution tier ('public'/'restricted'), ADR-064. Bronze passthrough — stamped at ingest by the classifier; any non-'public' value, including NULL, fail-safes to 'restricted'.

  - name: stg_skillcorner__events
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      SkillCorner dynamic events passthrough. Preserves all ~294 source columns
      from the events CSV per bronze-completeness principle. Used by SPADL
      conversion (applyInPandas UDF) and downstream event analytics.
    columns:
      - name: match_id
        description: Raw native SkillCorner match ID (numeric string)
        data_tests:
          - not_null
      - name: event_id
        description: Unique event identifier within a match
        data_tests:
          - not_null
      - name: event_type
        description: Event type classification
        data_tests:
          - not_null

  - name: stg_skillcorner__matches
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      SkillCorner match metadata in roster format (one row per player-match).
      Contains player names, team names, competition info, and pitch dimensions.
      Authoritative source for SkillCorner identity resolution in dimension models.
    columns:
      - name: match_id
        description: Raw native SkillCorner match ID (numeric string)
        data_tests:
          - not_null
      - name: player_id
        description: Player identifier (numeric)
        data_tests:
          - not_null
      - name: team_id
        description: Team identifier for this player
        data_tests:
          - not_null
      - name: player_name
        description: Player short/display name
      - name: position_name
        description: Player position role (e.g. 'Midfielder', 'Goalkeeper')
      - name: team_name
        description: Full team name
      - name: competition_id
        description: Competition identifier (numeric)
      - name: season_id
        description: Season identifier (numeric)
      - name: match_date
        description: Match date-time in ISO 8601 format
