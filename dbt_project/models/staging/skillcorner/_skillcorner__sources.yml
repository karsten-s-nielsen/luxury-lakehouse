version: 2

sources:
  - name: skillcorner
    description: >
      SkillCorner broadcast tracking + events + match metadata ingested into the
      bronze layer via the pining-for-the-data REST API. Contains A-League 2024/25
      matches at 10 fps. Coordinates are center-origin meters on a 105×68m pitch
      (POSSESSION_PERSPECTIVE convention).
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: skillcorner_tracking
        description: >
          Broadcast tracking data at 10 fps in narrow format (one row per
          player per frame). Coordinates use center-origin meters:
          x ∈ (-52.5, 52.5), y ∈ (-34, 34). Lower frame rate than optical
          tracking due to broadcast video source. Staging transforms to 120×80.
        columns:
          - name: match_id
            description: Raw native SkillCorner match ID (numeric string, e.g. '1886347')
          - name: period
            description: Match half (1 or 2)
          - name: frame
            description: Frame number (10 fps)
          - name: timestamp
            description: Timestamp in seconds from period start
          - name: player_id
            description: Player identifier from SkillCorner (numeric)
          - name: x
            description: Player x-coordinate in center-origin meters (-52.5 to 52.5)
          - name: y
            description: Player y-coordinate in center-origin meters (-34 to 34)
          - name: is_visible
            description: >
              True when the player is visible in the broadcast frame (renamed
              from is_detected in raw API output by the tracking parser).
          - name: ball_x
            description: Ball x-coordinate in center-origin meters
          - name: ball_y
            description: Ball y-coordinate in center-origin meters
          - name: ball_z
            description: >
              Ball height in meters. NULL for broadcast-source SkillCorner
              data (most frames); carried in schema for parity with optical
              providers that emit 3D ball coordinates.
          - name: ball_is_detected
            description: Whether the ball position was detected in this frame
          - name: frame_rate
            description: Frame rate in fps (always 10 for SkillCorner)
          - name: _ingested_at
            description: UTC timestamp when the row was ingested

      - name: skillcorner_events
        description: >
          Dynamic events CSV from pining-for-the-data API. One row per event.
          Contains ~294 columns (all preserved per bronze-completeness principle).
          Key columns: event_id, event_type, event_subtype, player_id, team_id,
          period, time_start, time_end, x_start, y_start, x_end, y_end.
        columns:
          - name: match_id
            description: Raw native SkillCorner match ID (numeric string)
          - name: event_id
            description: Unique event identifier within a match (e.g. '1_0')
          - name: event_type
            description: Event type (pass, shot, dribble, player_possession, etc.)
          - name: player_id
            description: Player identifier (numeric)
          - name: team_id
            description: Team identifier (numeric)
          - name: period
            description: Match half (1 or 2)
          - name: _ingested_at
            description: UTC timestamp when the row was ingested

      - name: skillcorner_matches
        description: >
          Match metadata from pining-for-the-data API match.json artifact.
          Roster format: one row per player-match with match-level metadata
          denormalized. Contains player names, team names, competition info,
          and pitch dimensions.
        columns:
          - name: match_id
            description: Raw native SkillCorner match ID (numeric string)
          - name: player_id
            description: Player identifier (numeric)
          - name: team_id
            description: Team identifier for this player
          - name: player_name
            description: Player short name (e.g. 'A. Player')
          - name: first_name
            description: Player first name
          - name: last_name
            description: Player last name
          - name: jersey_number
            description: Player jersey/shirt number
          - name: position_name
            description: Player position role (e.g. 'Midfielder', 'Goalkeeper')
          - name: position_acronym
            description: Position acronym (e.g. 'MF', 'GK', 'FW')
          - name: team_name
            description: Full team name
          - name: team_short_name
            description: Team short name / abbreviation
          - name: home_team_id
            description: SkillCorner team_id for the home team
          - name: away_team_id
            description: SkillCorner team_id for the away team
          - name: competition_id
            description: Competition identifier (numeric)
          - name: competition_name
            description: Competition name (e.g. 'A-League Men')
          - name: season_id
            description: Season identifier (numeric)
          - name: season_name
            description: Season name (e.g. '2024/2025')
          - name: match_date
            description: Match date-time in ISO 8601 format
          - name: stadium_name
            description: Stadium/venue name
          - name: pitch_length
            description: Pitch length in meters (typically 105)
          - name: pitch_width
            description: Pitch width in meters (typically 68)
          - name: period_boundaries
            description: JSON-serialized array of period start/end times
          - name: start_time
            description: Player start time within the match (e.g. '00:00:00')
          - name: end_time
            description: Player end time within the match
          - name: minutes_played
            description: Total minutes played by this player in the match
          - name: start_frame
            description: Frame number when the player entered the pitch
          - name: end_frame
            description: Frame number when the player left the pitch
          - name: minutes_tip
            description: Minutes the player was tracked in play (time in play)
          - name: minutes_otip
            description: Minutes the player was tracked out of play (time out of play)
          - name: yellow_card
            description: Number of yellow cards received (0 or 1)
          - name: red_card
            description: Number of red cards received (0 or 1)
          - name: injured
            description: Whether the player was injured during the match
          - name: goal
            description: Number of goals scored
          - name: own_goal
            description: Number of own goals scored
          - name: trackable_object
            description: SkillCorner internal trackable object identifier
          - name: birthday
            description: Player date of birth (ISO date string)
          - name: gender
            description: Player gender
          - name: team_player_id
            description: SkillCorner team-player mapping identifier
          - name: _ingested_at
            description: UTC timestamp when the row was ingested
