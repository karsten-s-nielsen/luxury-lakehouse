version: 2

models:
  - name: stg_idsse__tracking
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Normalized IDSSE Bundesliga tracking data. Transforms center-origin meter
      coordinates to the shared 120×80 pitch system. One row per player per frame.
    columns:
      - name: tracking_id
        description: Surrogate key (match_id + period + frame + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Match identifier (prefixed with 'idsse_')
        data_tests:
          - not_null
      - name: period
        description: Match half (1 or 2)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: frame
        description: Frame number within the half
        data_tests:
          - not_null
      - name: timestamp_seconds
        description: Timestamp in seconds from period start
      - name: timestamp
        description: >
          Bronze passthrough — `timestamp` from idsse_tracking (period-relative
          seconds since the first frame of the current period). Kept alongside
          the renamed `timestamp_seconds` so the bronze-completeness coverage
          test sees every source col surfaced under its bronze name.
      - name: frame_rate
        description: Frame rate in fps (always 25 for IDSSE)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [25]
      - name: player_id
        description: Player identifier from DFL teamsheet
        data_tests:
          - not_null
      - name: team
        description: Team affiliation (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: team_id
        description: >
          Real DFL TeamId (e.g., 'DFL-CLU-XXXXXX') from the enclosing FrameSet
          TeamId attribute. Surfaced in staging from PR 5a (ADR-011); feeds
          stg_idsse__home_away_teams bridge.
        data_tests:
          - not_null
      - name: source_provider
        description: Data source identifier (always 'idsse')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse']
      - name: x
        description: X coordinate scaled to 120-yard pitch
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
      - name: y
        description: Y coordinate scaled to 80-yard pitch
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90
      - name: ball_x
        description: Ball X coordinate scaled to 120-yard pitch
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
                row_condition: "ball_x is not null"
      - name: ball_y
        description: Ball Y coordinate scaled to 80-yard pitch
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90
                row_condition: "ball_y is not null"

      # ------------------------------------------------------------------
      # Bronze passthrough — PR 5a bronze-completeness sweep (2026-04-24).
      # These 14 bronze cols (is_goalkeeper + 13 tracking/ball attrs) were
      # present in bronze.idsse_tracking since PR 1.8 but not previously
      # documented in _idsse__sources.yml nor surfaced in stg_idsse__tracking.
      # PR 5a closes both gaps — staging SQL carries them through verbatim,
      # and this yml documents them so the bronze-completeness coverage
      # test sees every source col accounted for. Rich per-col descriptions
      # live in _idsse__sources.yml; staging yml uses a consistent template
      # referring callers back there (mirrors the stg_idsse__events pattern).
      # ------------------------------------------------------------------
      - name: is_goalkeeper
