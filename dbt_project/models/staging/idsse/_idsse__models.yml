  - name: stg_idsse__elastic_sync
    config:
      enabled: "{{ var('pausa_enabled', false) }}"
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      ELASTIC event-tracking synchronization results joined with event metadata.
      Maps each IDSSE event to its best-matching tracking frame using ball
      acceleration and player-ball proximity features. Reference: Kim et al.
      (2025), ECML-PKDD MLSA 2025, arXiv:2508.09238. Enabled by pausa_enabled.
    columns:
      - name: sync_id
        description: Surrogate key (match_id + event_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Match identifier (prefixed with 'idsse_')
        data_tests:
          - not_null
      - name: event_id
        description: Event identifier linked to stg_idsse__events
        data_tests:
          - not_null
      - name: frame_id
        description: Best-matching tracking frame number
        data_tests:
          - not_null
      - name: alignment_confidence
        description: >
          Confidence score (0 to 1) of the event-frame alignment.
          Higher values indicate stronger ball acceleration / player proximity match.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.0
                max_value: 1.0
      - name: alignment_error_seconds
        description: >
          Absolute time difference in seconds between the event timestamp
          and the aligned tracking frame timestamp.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.0
                max_value: 5.0
      - name: event_type
        description: DFL event type from the event source
      - name: period
        description: Match half (1 or 2)
      - name: player_id
        description: DFL PersonId of the acting player
      - name: team
        description: Team affiliation (home, away, or unknown)
      - name: event_timestamp_seconds
        description: Original event timestamp in seconds from period start
      - name: frame_timestamp_seconds
        description: Aligned frame timestamp (frame_id / 25.0)
      - name: source_provider
        description: Data source identifier (always 'idsse')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse']

  - name: stg_idsse__matches
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      One row per IDSSE Bundesliga match. Match count is data-driven —
      whatever distinct match_ids exist in bronze.idsse_tracking ship through.
      Per-match metadata (competition, season, home/away team DFL CLU ids) is
      sourced directly from bronze (carried by every tracking row from
      <General> in the matchinformation XML) since session 69 — the prior
      hardcoded SQL CTE mirroring src/ingestion/idsse.py:_MATCH_COMPETITION
      was eliminated. Used as a conformance feed into `dim_matches`
      (provider='idsse').
    columns:
      - name: native_match_id
        description: >
          Bare DFL MatchId (e.g. 'J03WMX'). Single source of truth in
          shared/identifiers.py:idsse_native_match_id; live boundary test in
          src/tests/test_idsse_bronze_match_id_format.py.
        data_tests:
          - unique
          - not_null
      - name: provider
        description: Constant 'idsse' for rows from this staging model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse']
      # The 4 not_null tests below are var-gated under the ADR-018 two-tier
      # pattern: skipped on the daily-job's vanilla `dbt build` (no var
      # passed), fired on the post-deploy regression run via
      # `dbt build --vars '{include_post_deploy_tests: true}'`.
      #
      # Reason: between PR-A merge and the operator-run migration + DELETE +
      # re-ingest, the bronze rows that existed at merge time still have
      # NULL `competition_native_id` / `season_native_id` /
      # `home_team_id_native` / `away_team_id_native` (added by this PR).
      # Vanilla dbt_build would fail not_null until the operator finishes
      # the post-deploy sequence; var-gating eliminates the chicken-and-egg
      # without losing the integrity check (operator runs the gated build
      # explicitly after re-ingest).
      - name: competition_id
        description: >
          DFL CompetitionId (e.g. 'DFL-COM-000001'). Sourced from
          bronze.idsse_tracking.competition_native_id (originally parsed
          from <General> in the matchinformation XML by
          ingestion.idsse._parse_match_metadata).
        data_tests:
          - not_null:
              config:
                enabled: "{{ var('include_post_deploy_tests', false) }}"
                tags: ['post_deploy_only']
      - name: season_id
        description: >
          DFL SeasonId (e.g. 'DFL-SEA-0001K6'). Sourced from
          bronze.idsse_tracking.season_native_id; parity with
          stg_metrica__matches.season_id.
        data_tests:
          - not_null:
              config:
                enabled: "{{ var('include_post_deploy_tests', false) }}"
                tags: ['post_deploy_only']
      - name: home_team_id
        description: >
          DFL HomeTeamId (CLU-format) for the match. Sourced from
          bronze.idsse_tracking.home_team_id_native.
        data_tests:
          - not_null:
              config:
                enabled: "{{ var('include_post_deploy_tests', false) }}"
                tags: ['post_deploy_only']
      - name: away_team_id
        description: >
          DFL GuestTeamId (CLU-format) for the match. Sourced from
          bronze.idsse_tracking.away_team_id_native.
        data_tests:
          - not_null:
              config:
                enabled: "{{ var('include_post_deploy_tests', false) }}"
                tags: ['post_deploy_only']
      - name: home_team_name
        description: Home team display name from stg_tracking__player_metadata.
      - name: away_team_name
        description: Away team display name from stg_tracking__player_metadata.
      - name: bronze_match_id
        description: >
          Lineage passthrough of bronze.idsse_tracking.match_id. Equal to
          native_match_id since session 69 cleanup (bronze migrated to BARE
          DFL MatchId per shared/identifiers.py — 'idsse_' prefix no longer
          surfaced). Kept as a stable column name for downstream consumers.

  - name: stg_idsse__passes
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      IDSSE Bundesliga pass events in SPADL-like shape, ready to union
      into `int_unified_passes`. Filters `bronze.idsse_events` on
      `event_type='Play'` (the DFL XML container for passing actions)
      and derives `pass_outcome` from `play_evaluation`. Coordinates are
      scaled from DFL pitch-origin metres to the shared 120x80 system.
      End coordinates, team_id, player_id, and pass_recipient_id are
      NULL for IDSSE — the DFL <Play> row carries a start location only
      and DFL team/player IDs are strings (fct_passes contract types
      these as INT). Cross-provider reconciliation is deferred to a
      later PR (dim_teams / dim_players surrogate keys).
    columns:
      - name: event_id
        description: IDSSE event_id (unique within match).
        data_tests:
          - not_null
      - name: match_id
        description: Native DFL MatchId with the 'idsse_' prefix stripped.
        data_tests:
          - not_null
      - name: pass_outcome
        description: "'Complete' when play_evaluation in ['successfullyCompleted','successful']; 'Incomplete' when 'unsuccessful'; 'Unknown' otherwise."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Complete', 'Incomplete', 'Unknown']
      - name: data_source
        description: Constant 'idsse' for rows from this model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse']
