  - name: stg_idsse__events
    config:
      enabled: "{{ var('pausa_enabled', false) }}"
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Normalized IDSSE Bundesliga event data. Transforms center-origin meter
      coordinates to the shared 120×80 pitch system. One row per event with
      position data. Enabled by pausa_enabled toggle.
    columns:
      - name: event_sk
        description: Surrogate key (match_id + event_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Match identifier (prefixed with 'idsse_')
        data_tests:
          - not_null
      - name: event_id
        description: Unique event identifier within match
        data_tests:
          - not_null
      - name: event_type
        description: DFL event type (e.g. pass, shot, tackle)
        data_tests:
          - not_null
      - name: timestamp_seconds
        description: Timestamp in seconds from period start
      - name: period
        description: Match half (1 or 2)
        data_tests:
          - not_null
      - name: player_id
        description: DFL PersonId of the acting player
      - name: team
        description: Team affiliation (home, away, or unknown)
      - name: source_provider
        description: Data source identifier (always 'idsse')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['idsse']
      - name: x
        description: Event X coordinate scaled to 120-yard pitch
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
      - name: y
        description: Event Y coordinate scaled to 80-yard pitch
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90

