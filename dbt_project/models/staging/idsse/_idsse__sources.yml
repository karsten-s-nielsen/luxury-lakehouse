version: 2

sources:
  - name: idsse
    description: >
      IDSSE Bundesliga tracking and event data ingested into the bronze layer.
      Contains DFL position data at 25 fps and event data for 7 Bundesliga
      matches. Coordinates are center-origin meters on a 105×68m pitch.
      Data source: Bassek et al. (2025), Scientific Data, Nature. CC-BY 4.0.
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: idsse_tracking
        description: >
          DFL positional tracking data at 25 fps in narrow format (one row per
          player per frame). Coordinates use center-origin meters:
          x ∈ (-52.5, 52.5), y ∈ (-34, 34). Staging transforms to 120×80.
        columns:
          - name: period
            description: Match half (1 or 2)
          - name: frame
            description: Frame number within the half (25 fps)
          - name: timestamp
            description: Timestamp in seconds from period start
          - name: player_id
            description: Player identifier from DFL teamsheet
          - name: team
            description: Team affiliation (home or away)
          - name: x
            description: Player x-coordinate in center-origin meters (-52.5 to 52.5)
          - name: y
            description: Player y-coordinate in center-origin meters (-34 to 34)
          - name: ball_x
            description: Ball x-coordinate in center-origin meters
          - name: ball_y
            description: Ball y-coordinate in center-origin meters
          - name: match_id
            description: Match identifier prefixed with 'idsse_'
          - name: frame_rate
            description: Frame rate in fps (always 25 for IDSSE)

      - name: idsse_events
        description: >
          DFL event data (DFL_03_02 series) with position information.
          One row per event. Coordinates use center-origin meters:
          x ∈ (-52.5, 52.5), y ∈ (-34, 34). Staging transforms to 120×80.
        columns:
          - name: match_id
            description: Match identifier prefixed with 'idsse_'
          - name: event_id
            description: Unique event identifier within match
          - name: event_type
            description: DFL event type taxonomy (e.g. pass, shot, tackle)
          - name: timestamp_seconds
            description: Timestamp in seconds from period start
          - name: period
            description: Match half (1 or 2)
          - name: player_id
            description: DFL PersonId of the acting player
          - name: team
            description: Team affiliation (home or away)
          - name: x
            description: Event x-coordinate in center-origin meters (-52.5 to 52.5)
          - name: y
            description: Event y-coordinate in center-origin meters (-34 to 34)

      - name: elastic_sync_results
        description: >
          ELASTIC event-tracking synchronization results. Maps each event
          to its best-matching tracking frame via ball acceleration and
          player-ball proximity features. Reference: Kim et al. (2025),
          ECML-PKDD MLSA 2025, arXiv:2508.09238.
        columns:
          - name: match_id
            description: Match identifier prefixed with 'idsse_'
          - name: event_id
            description: Event identifier linked to idsse_events
          - name: frame_id
            description: Best-matching tracking frame number
          - name: alignment_confidence
            description: Confidence score of the alignment (0 to 1)
          - name: alignment_error_seconds
            description: Time difference between event timestamp and aligned frame
