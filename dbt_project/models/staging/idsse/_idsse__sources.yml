version: 2

sources:
  - name: idsse
    description: >
      IDSSE Bundesliga tracking and event data ingested into the bronze layer.
      Contains DFL position data at 25 fps and event data for 7 Bundesliga
      matches. Coordinates are center-origin meters on a 105×68m pitch.
      Data source: Bassek et al. (2025), Scientific Data, Nature. CC-BY 4.0.
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: idsse_tracking
        description: >
          DFL positional tracking data at 25 fps in narrow format (one row per
          player per frame). Coordinates use center-origin meters:
          x ∈ (-52.5, 52.5), y ∈ (-34, 34). Staging transforms to 120×80.
        columns:
          - name: period
            description: Match half (1 or 2)
          - name: frame
            description: Frame number within the half (25 fps)
          - name: timestamp
            description: Timestamp in seconds from period start
          - name: player_id
            description: Player identifier from DFL teamsheet
          - name: team
            description: Team affiliation (home or away)
          - name: x
            description: Player x-coordinate in center-origin meters (-52.5 to 52.5)
          - name: y
            description: Player y-coordinate in center-origin meters (-34 to 34)
          - name: ball_x
            description: Ball x-coordinate in center-origin meters
          - name: ball_y
            description: Ball y-coordinate in center-origin meters
          - name: match_id
            description: Match identifier prefixed with 'idsse_'
          - name: frame_rate
            description: Frame rate in fps (always 25 for IDSSE)
          - name: team_id
            description: >
              Real DFL TeamId (e.g., 'DFL-CLU-XXXXXX') extracted from the
              enclosing FrameSet TeamId attribute in positions.xml. Present
              in bronze since PR 1.8 (src/ingestion/idsse.py:580) but first
              surfaced in staging by PR 5a — feeds stg_idsse__home_away_teams
              bridge → dim_teams IDSSE CTE.
          - name: is_goalkeeper
            description: >
              Boolean flag derived from DFL MatchInformation PlayingPosition='TW'.
              PR 1.8-era bronze column documented in source YAML by PR 5a.
          - name: t
            description: Tracking-frame t-value (DFL per-row timestamp).
          - name: s
            description: Player speed (m/s) from DFL position.xml.
          - name: a
            description: Player acceleration (m/s²).
          - name: d
            description: Player direction (radians).
          - name: m
            description: Movement flag boolean.
          - name: ball_z
            description: Ball z-coordinate (height in meters).
          - name: ball_s
            description: Ball speed (m/s).
          - name: ball_a
            description: Ball acceleration (m/s²).
          - name: ball_d
            description: Ball direction.
          - name: ball_m
            description: Ball movement flag.
          - name: ball_t
            description: Ball tracking-frame t-value.
          - name: ball_possession
            description: Ball possession state label (home/away/neutral).
          - name: ball_status
            description: Ball status (alive/dead).

      - name: idsse_events
        description: >
          DFL event data (DFL_03_02 series) in wide flat bronze schema —
          every XML attribute on <Event> + first-child + nested-child
          elements lands as a typed column (bronze-completeness, 2026-04-20
          rewrite). 32 distinct first-child tags; exactly one per row.
          Coordinates are DFL pitch-origin meters: x ∈ (0, 105),
          y ∈ (0, 68). Staging transforms to the shared 120×80 system.
          Column prefix convention: ``{event_type_short}_{snake_attr}`` for
          first-child attrs (e.g. ``play_play_angle``, ``shot_x_g``);
          ``{nested_short}_{snake_attr}`` for nested-child attrs (e.g.
          ``pass_direction``, ``shot_outcome_type``). Event-type prefix
          map lives in ``ingestion.idsse._EVENT_TYPE_PREFIX``. See
          ``src/tests/test_idsse_bronze_coverage.py`` for the enforced
          source→bronze contract.
        columns:
          - name: match_id
            description: Match identifier prefixed with 'idsse_' — derived from ingestion context (distinct from match_id_raw which carries the DFL-MAT-* XML attr).
          - name: event_type
            description: First-child XML tag name — one of 32 DFL event types (Play, ShotAtGoal, TacklingGame, Caution, etc.). Determines which {prefix}_* columns are populated on a given row.
          - name: period
            description: Match half (1 or 2). Tracked across events; updated when a <KickOff GameSection='firstHalf|secondHalf'> element is encountered.
          - name: timestamp_seconds
            description: Period-relative seconds from the first event of the current period.
          - name: player_id
            description: Primary actor — DFL PersonId. Resolved via _PLAYER_ATTR_ORDER (e.g. Winner for TacklingGame, Player otherwise). Empty string for events with no primary-actor attr.
          - name: team
            description: home / away / unknown — resolved via player_team_map based on player_id.
          - name: calculated_frame
            description: CalculatedFrame attribute — the canonical frame for the event (usually mid-event).
          - name: calculated_timestamp
            description: CalculatedTimestamp attribute — ISO 8601 timestamp for CalculatedFrame.
          - name: end_frame
            description: EndFrame attribute — tracking frame number when the event ended.
          - name: event_id
            description: DFL EventId attribute — unique event identifier within the match.
          - name: event_time
            description: Raw EventTime attribute — ISO 8601 timestamp with timezone.
          - name: match_id_raw
            description: Raw DFL-MAT-* MatchId attribute from <Event> element. Distinct from match_id (idsse_*) — both carried for bronze-completeness.
          - name: start_frame
            description: StartFrame attribute — tracking frame number when the event began.
          - name: x
            description: X-Position attribute cast to float — DFL pitch-origin meters (0-105), rounded to 4 decimals. NULL when not present on the XML element.
          - name: x_position_from_tracking
            description: X-PositionFromTracking attribute — position re-projected from tracking data.
          - name: x_source_position
            description: X-Source-Position attribute — pre-correction x coordinate (before any normalization).
          - name: y
            description: Y-Position attribute cast to float — DFL pitch-origin meters (0-68). NULL when absent.
          - name: y_position_from_tracking
            description: Y-PositionFromTracking attribute — y-coordinate re-projected from tracking data.
          - name: y_source_position
            description: Y-Source-Position attribute — pre-correction y coordinate.
          - name: claim_ball_possession_phase
            description: Raw 'BallPossessionPhase' attribute from <BallClaiming> first-child element. Populated on rows with event_type='BallClaiming'; NULL on other rows.
          - name: claim_player
            description: Raw 'Player' attribute from <BallClaiming> first-child element. Populated on rows with event_type='BallClaiming'; NULL on other rows.
          - name: claim_team
            description: Raw 'Team' attribute from <BallClaiming> first-child element. Populated on rows with event_type='BallClaiming'; NULL on other rows.
          - name: claim_type
