version: 2

sources:
  - name: off_ball_xt
    description: >
      Off-Ball Expected Threat results produced by the pitch control × xT
      batch computation pipeline. Contains per-player per-match aggregated
      off-ball positional value.
    database: soccer_analytics
    schema: bronze
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: off_ball_xt_results
        description: >
          Per-player per-match Off-Ball xT aggregation. Each row is one player
          in one match with their total and average off-ball xT contribution
          computed from sampled tracking frames.
        columns:
          - name: player_id
            description: Player identifier
          - name: match_id
            description: Match identifier
          - name: total_off_ball_xt
            description: Sum of per-frame off-ball xT contributions
          - name: avg_off_ball_xt
            description: Average per-frame off-ball xT contribution
          - name: frames_sampled
            description: Number of frames sampled for this match
