version: 2

sources:
  - name: xg
    description: >
      v2 xG model predictions (Deep Sets set encoder + MC dropout CIs).
      Post-XG1-RETIRE: v1 logistic + gradient-boosted predictions retired
      (SK3-MIG-B PR-alpha, 2026-05-03).
    database: soccer_analytics
    schema: bronze
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: xg_predictions
        description: >
          [RETIRED 2026-05-03 SK3-MIG-B PR-alpha per ADR-023] Custom v1 xG model
          predictions. Source declaration retained for dbt state:modified+
          compatibility — main's manifest still references this source from
          stg_xg__predictions, which dbt's saved-state validation cross-checks
          against the current manifest. Removed entirely once main's manifest
          no longer references it (operator follow-up after PR-alpha merge).
        columns:
          - name: shot_id
            description: FK to fct_shots (surrogate key).
          - name: _ingested_at
            description: UTC timestamp when the row was written.

      - name: xg_predictions_v2
        description: >
          v2 xG predictions (Deep Sets set encoder + MC dropout CIs) written by
          compute_xg_model_v2. Post-PR 3 (ADR-013), this bronze emits only native
          identifiers + predictions; Kimball keys are resolved at the mart layer
          via fct_xg_predictions_v2's INNER JOIN to fct_shots on shot_id.
          match_id was historically emitted by the v2 writer; Phase 5.0 of PR 3
          drops it via `ALTER TABLE ... DROP COLUMN match_id` post-merge deploy.
        columns:
          - name: shot_id
            description: FK to fct_shots (surrogate key).
          - name: competition_id
            description: Native INT competition identifier (replaceWhere partition key).
          - name: xg_set_encoder
            description: v2 Deep Sets + MC dropout mean xG prediction.
          - name: xg_ci_lower
            description: v2 xG 95% CI lower bound.
          - name: xg_ci_upper
            description: v2 xG 95% CI upper bound.
          - name: _ingested_at
            description: UTC timestamp when the row was written.

      - name: xg_shot_predictions
        description: >
          Canonical-SPADL pre-shot xG v3 predictions (xg_model_v3; two-mode
          selection≠certification gate + OOF calibrator) written by
          compute_xg_shot_scores. Per ADR-013 this bronze emits only the native
          shot key (match_id_native + Kimball match_key, action_id) + predictions;
          Kimball surrogates (competition_key / team_key / player_key) are resolved
          at the mart layer via fct_shot_xg's INNER JOIN to fct_action_values on
          (match_key, action_id). Written with replaceWhere per match_key.
        columns:
          - name: match_id_native
            description: Native provider match identifier (e.g. `idsse_J03WMX`).
          - name: match_key
            description: Kimball surrogate FK to dim_matches. Shot key part 1.
          - name: action_id
            description: SPADL per-match action id of the shot. Shot key part 2 (NOT global).
          - name: data_source
            description: Provider (statsbomb / wyscout / idsse / metrica / gradientsports / skillcorner).
          - name: xg
            description: Calibrated pre-shot xG mean (0-1).
          - name: xg_ci_low
            description: Pre-shot xG confidence-interval lower bound.
          - name: xg_ci_high
            description: Pre-shot xG confidence-interval upper bound.
          - name: scoring_mode
            description: "'context_aware' or 'tabular_only' (two-mode gate selection)."
          - name: ood_flag
            description: True when the selected mode is uncertified / out-of-distribution.
          - name: _ingested_at
            description: UTC timestamp when the row was written.
