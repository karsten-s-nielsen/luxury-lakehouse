version: 2

sources:
  - name: xg
    description: >
      Custom xG model predictions produced by the compute_xg_model scoring
      pipeline. Contains logistic regression baseline and calibrated XGBoost
      expected goals values for every shot.
    database: soccer_analytics
    schema: bronze
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: xg_predictions
        description: >
          Custom v1 xG model predictions for all shots. Each row is one shot
          with logistic regression baseline and calibrated XGBoost xG values.
          Written by the compute_xg_model pipeline.
        columns:
          - name: shot_id
            description: FK to fct_shots (surrogate key)
          - name: match_id
            description: FK to fct_match_summary (legacy; kept for bronze back-compat)
          - name: competition_id
            description: FK to dim_competitions
          - name: xg_logistic
            description: Logistic regression baseline xG (distance + angle only)
          - name: xg_gradient_boosted
            description: Calibrated XGBoost xG (all 13 features)
          - name: _ingested_at
            description: UTC timestamp when the row was written

      - name: xg_predictions_v2
        description: >
          v2 xG predictions (Deep Sets set encoder + MC dropout CIs) written by
          compute_xg_model_v2. Post-PR 3 (ADR-013), this bronze emits only native
          identifiers + predictions; Kimball keys are resolved at the mart layer
          via fct_xg_predictions_v2's INNER JOIN to fct_shots on shot_id.
          match_id was historically emitted by the v2 writer; Phase 5.0 of PR 3
          drops it via `ALTER TABLE ... DROP COLUMN match_id` post-merge deploy.
        columns:
          - name: shot_id
            description: FK to fct_shots (surrogate key).
          - name: competition_id
            description: Native INT competition identifier (replaceWhere partition key).
          - name: xg_set_encoder
            description: v2 Deep Sets + MC dropout mean xG prediction.
          - name: xg_ci_lower
            description: v2 xG 95% CI lower bound.
          - name: xg_ci_upper
            description: v2 xG 95% CI upper bound.
          - name: _ingested_at
            description: UTC timestamp when the row was written.
