version: 2

sources:
  - name: metrica
    description: >
      Metrica Sports sample tracking and event data ingested into the bronze
      layer. Contains high-frequency (25 fps) positional tracking data for
      all players and the ball, plus synchronized event data.
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: metrica_tracking
        description: >
          Raw positional tracking data at 25 frames per second. Each row
          represents one frame containing x/y coordinates for every tracked
          player on both teams plus the ball. Coordinates are normalized
          to [0, 1] range (pitch proportion) — must be scaled to
          StatsBomb-compatible 120x80 for cross-source analysis.
        columns:
          - name: match_id
            description: >
              Metrica sample-data match identifier — string like
              'Sample_Game_1', 'Sample_Game_2', 'Sample_Game_3'. Set at
              ingestion in src/ingestion/metrica_tracking.py.
          - name: period
            description: Match half (1 or 2)
          - name: frame
            description: Frame number within the period (25 fps)
          - name: timestamp
            description: Timestamp in seconds from period start
          - name: ball_x
            description: Ball x-coordinate (0-1 normalized)
          - name: ball_y
            description: Ball y-coordinate (0-1 normalized)
          - name: home_players
            description: >
              JSON object with player tracking data for home team.
              Keys are player IDs, values are {x, y} coordinate objects.
          - name: away_players
            description: >
              JSON object with player tracking data for away team.
              Keys are player IDs, values are {x, y} coordinate objects.
          - name: frame_rate
            description: Frame rate in fps (always 25 for Metrica)
          - name: gk_jersey_numbers
            description: >
              JSON-stringified list of goalkeeper shirt numbers observed in
              this match. Identification: EPTS PlayingPosition in ('GK','TW')
              takes precedence; falls back to shirt-number-1 heuristic when
              position is missing. CSV-path games use the jersey-1
              heuristic only.
          - name: pitch_length_m
            description: >
              Pitch length in meters, read from the EPTS <FieldSize> element
              (Game 3). NaN for CSV-source games (Games 1-2) — CSV header
              does not carry pitch dimensions. Denormalized onto every
              tracking row so consumers can scale [0,1] normalized
              coordinates to real-world distance without a metadata join.
          - name: pitch_width_m
            description: >
              Pitch width in meters, read from the EPTS <FieldSize> element
              (Game 3). NaN for CSV-source games (Games 1-2). See
              pitch_length_m for rationale.
          - name: is_anonymized
            description: >
              PR 5a forward-compat flag. True for sample-CSV ingestion from
              the Metrica open-data GitHub repo (3 anonymised matches).
              False for future subscription-API ingestion with real player
              and team identity. Set at bronze-write time by
              ingestion.metrica_tracking; propagates to
              stg_metrica__team_players and drives synthesis branch
              selection in dim_teams + dim_players.
              See docs/superpowers/specs/2026-04-24-kimball-pr5-design.md §4.

      - name: metrica_events
        description: >
          Metrica event data synchronized with tracking frames. Each row
          is a match event (pass, shot, etc.) with start/end frames
          that link to the tracking data.
        columns:
          - name: match_id
            description: >
              Metrica sample-data match identifier — string like
              'Sample_Game_1', 'Sample_Game_2', 'Sample_Game_3'. Set at
              ingestion in src/ingestion/metrica_events.py.
          - name: event_id
            description: Unique event identifier
          - name: type
            description: Event type (PASS, SHOT, BALL LOST, etc.)
          - name: subtype
            description: >
              Event subtype (HEAD-Loss, GOAL-Loss, etc.). For multi-subtype
              events this is the first listed name — the full list is in
              subtypes_all_json.
          - name: subtypes_all_json
            description: >
              JSON-stringified list of all subtype names for multi-subtype
              events (e.g. INTERCEPTION+GOAL). NULL when the event has at
              most one subtype. Always NULL in CSV-source games
              (Games 1-2) — only the EPTS JSON (Game 3) exposes
              multi-subtype arrays.
          - name: period
            description: Match half
          - name: start_frame
            description: Frame number when event started
          - name: end_frame
            description: Frame number when event ended
          - name: start_time_s
            description: Event start time in seconds from period start.
          - name: end_time_s
            description: Event end time in seconds from period start.
          - name: start_x
            description: Starting x-coordinate (0-1 normalized)
          - name: start_y
            description: Starting y-coordinate (0-1 normalized)
          - name: end_x
            description: Ending x-coordinate (0-1 normalized)
          - name: end_y
            description: Ending y-coordinate (0-1 normalized)
          - name: team
            description: Team performing the event (Home or Away)
          - name: player
            description: >
              Player identifier of the primary actor (e.g. Player1,
              Player11). Derived from the 'From' column (CSV) or
              event.from.name (EPTS).
          - name: to
            description: >
              Recipient player identifier for applicable event types
              (passes, carries, etc.). Derived from the 'To' column (CSV)
              or event.to.name (EPTS). NULL for non-applicable events.
              CSV-path 'To' column maps to 'to' via column-name sanitize;
              EPTS path was fixed 2026-04-20 (previously always NULL).
          - name: pitch_length_m
            description: >
              Pitch length in meters, read from the EPTS <FieldSize>
              element (Game 3). NaN for CSV-source games (Games 1-2) —
              CSV header does not carry pitch dimensions. Denormalized
              onto every event row.
          - name: pitch_width_m
            description: >
              Pitch width in meters, read from the EPTS <FieldSize>
              element (Game 3). NaN for CSV-source games. See
              pitch_length_m for rationale.
