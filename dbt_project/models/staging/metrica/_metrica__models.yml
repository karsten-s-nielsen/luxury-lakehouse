version: 2

models:
  - name: stg_metrica__tracking
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Parsed and normalized Metrica Sports tracking data. Explodes the
      per-frame JSON into individual player rows, scales coordinates
      from [0,1] normalized to 120x80 pitch coordinates for compatibility
      with StatsBomb data. One row per player per frame.
    columns:
      - name: tracking_id
        description: Surrogate key (match_id + period + frame + player_id)
        data_tests:
          - unique
          - not_null
      - name: match_id
        description: Match identifier (derived from file/batch metadata)
        data_tests:
          - not_null
      - name: period
        description: Match half (1 or 2)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: frame
        description: Frame number within the period
        data_tests:
          - not_null
      - name: timestamp_seconds
        description: Timestamp in seconds from period start
      - name: frame_rate
        description: Frame rate in fps (always 25 for Metrica)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [25]
      - name: player_id
        description: Player identifier
        data_tests:
          - not_null
      - name: team
        description: Team affiliation (home or away)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: source_provider
        description: Data source identifier (always 'metrica')
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica']
      - name: x
        description: X coordinate scaled to 120-yard pitch. May slightly exceed pitch bounds for off-pitch tracking positions.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
      - name: y
        description: Y coordinate scaled to 80-yard pitch. May slightly exceed pitch bounds for off-pitch tracking positions.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90
      - name: ball_x
        description: Ball X coordinate scaled to 120-yard pitch. May slightly exceed pitch bounds when out of play.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 130
                row_condition: "ball_x is not null"
      - name: ball_y
        description: Ball Y coordinate scaled to 80-yard pitch. May slightly exceed pitch bounds when out of play.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -10
                max_value: 90
                row_condition: "ball_y is not null"
      - name: timestamp
        description: Bronze passthrough — timestamp from metrica_tracking (seconds from period start).
      - name: home_players
        description: Bronze passthrough — home_players from metrica_tracking (per-frame JSON of player tracking data).
      - name: away_players
        description: Bronze passthrough — away_players from metrica_tracking (per-frame JSON of player tracking data).
      - name: gk_jersey_numbers
        description: Bronze passthrough — gk_jersey_numbers from metrica_tracking (JSON array of goalkeeper shirt numbers).
      - name: pitch_length_m
        description: Bronze passthrough — pitch_length_m from metrica_tracking (meters, NaN for CSV-path games).
      - name: pitch_width_m
        description: Bronze passthrough — pitch_width_m from metrica_tracking (meters, NaN for CSV-path games).
      - name: is_anonymized
        description: >
          Bronze passthrough — sample-vs-subscription flag added in PR 5a (ADR-011).
          True for anonymised Metrica sample CSV matches (current data); False when
          future Metrica subscription-API ingestion lands with real identities.
          Downstream dim_teams / dim_players branch on this flag to select
          synthesised-identity vs real-identity paths. See
          docs/superpowers/specs/2026-04-24-kimball-pr5-design.md §4.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: stg_metrica__events
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cleaned Metrica Sports event data with coordinates scaled to the
      120x80 coordinate system. Linked to tracking frames for spatial
      context. One row per event.
    columns:
      - name: event_sk
        description: Surrogate key (match_id + event_id) — event_id repeats across matches
        data_tests:
          - unique
          - not_null
      - name: event_id
        description: Event identifier (unique within a match only)
        data_tests:
          - not_null
      - name: match_id
        description: Match identifier
        data_tests:
          - not_null
      - name: event_type
        description: Event type (PASS, SHOT, BALL LOST, etc.)
        data_tests:
          - not_null
      - name: event_subtype
        description: Event subtype for more granular classification
      - name: period
        description: Match half
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: start_frame
        description: Tracking frame when event started
      - name: end_frame
        description: Tracking frame when event ended
      - name: start_x
        description: Starting X coordinate (120-yard scale). May slightly exceed bounds in raw data.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        description: Starting Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        description: Ending X coordinate (120-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "end_x is not null"
              config:
                severity: warn
      - name: end_y
        description: Ending Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "end_y is not null"
              config:
                severity: warn
      - name: team
        description: Team performing the event
      - name: player_id
        description: Player identifier
      - name: type
        description: Bronze passthrough — type from metrica_events (raw event type, pre-normalization).
      - name: subtype
        description: Bronze passthrough — subtype from metrica_events (raw event subtype, pre-normalization).
      - name: subtypes_all_json
        description: Bronze passthrough — subtypes_all_json from metrica_events (JSON list of all subtypes for multi-subtype events; NULL otherwise).
      - name: start_time_s
        description: Bronze passthrough — start_time_s from metrica_events (event start in seconds from period start).
      - name: end_time_s
        description: Bronze passthrough — end_time_s from metrica_events (event end in seconds from period start).
      - name: player
        description: Bronze passthrough — player from metrica_events (raw actor identifier, e.g. 'Player1').
      - name: to
        description: Bronze passthrough — to from metrica_events (recipient player identifier for passes/carries; NULL for non-applicable events).
      - name: pitch_length_m
        description: Bronze passthrough — pitch_length_m from metrica_events (meters, NaN for CSV-path games).
      - name: pitch_width_m
        description: Bronze passthrough — pitch_width_m from metrica_events (meters, NaN for CSV-path games).

  - name: stg_metrica__matches
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      One row per Metrica sample-data match (3 matches: Sample_Game_1,
      Sample_Game_2, Sample_Game_3). Match metadata is intentionally sparse —
      Metrica open-data is anonymized with no competition_id, no match_date,
      and generic 'Home'/'Away' team labels. Used as a conformance feed into
      `dim_matches` (provider='metrica').
    columns:
      - name: native_match_id
        description: Metrica match identifier (e.g., 'Sample_Game_1').
        data_tests:
          - unique
          - not_null
      - name: provider
        description: Constant 'metrica' for rows from this staging model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica']
      - name: competition_id
        description: >
          Constant 'metrica-sample' sentinel (PR 5a, TODO #32). Matching
          dim_competitions pseudo-row carries provider='metrica',
          native_competition_id='metrica-sample'. This surfaces Metrica
          passes in the Pass Map competition cascade (previously NULL →
          hidden).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica-sample']
      - name: home_team_name
        description: Constant 'Home' — Metrica open-data is anonymized.
      - name: away_team_name
        description: Constant 'Away' — Metrica open-data is anonymized.

  - name: stg_metrica__team_players
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Per-match team + player identity for Metrica. Synthesises IDs for
      anonymised sample data; real-identity branch ready for future
      subscription data (driven by bronze is_anonymized flag per PR 5a).
    columns:
      - name: match_id
        data_type: string
        data_tests:
          - not_null
      - name: side
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: is_anonymized
        data_type: boolean
      - name: player_key_in_map
        data_type: string
        data_tests:
          - not_null
      - name: native_team_id
        data_type: string
      - name: native_player_id
        data_type: string
      - name: is_synthesized
        data_type: boolean
      - name: synthesis_reason
        data_type: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, side, player_key_in_map]

  - name: stg_metrica__passes
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Metrica sample-data pass events in SPADL-like shape, ready to union
      into `int_unified_passes`. Filters `bronze.metrica_events` for
      `type='PASS'`. Metrica open-data is anonymised — team, player, and
      recipient identifiers are string labels so fct_passes.{team_id,
      player_id, pass_recipient_id} stay NULL. Coordinates are scaled
      from [0,1] normalised to the shared 120x80 via the `metrica`
      normalisation (y-axis flipped). Pass completion is heuristic —
      events subtyped with 'loss' or 'intercep' are Incomplete; the
      rest are Complete.
    columns:
      - name: event_id
        description: Metrica event_id stringified (unique within a match).
        data_tests:
          - not_null
      - name: match_id
        description: Metrica native match_id (e.g. 'Sample_Game_1').
        data_tests:
          - not_null
      - name: pass_outcome
        description: "'Complete' (subtype NULL or non-loss/intercep) or 'Incomplete'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Complete', 'Incomplete']
      - name: data_source
        description: Constant 'metrica' for rows from this model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['metrica']
