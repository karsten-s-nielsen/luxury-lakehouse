version: 2

sources:
  - name: off_ball_runs
    description: >
      Off-ball run detections + valuations (spec §7.5, Task 17e). Written by the
      ingestion.off_ball_runs_writer ADR-013 writer: per tracking work unit it reconstructs the oriented
      (actions, frames, xt) the AC drain builds, runs silly-kicks 4.87.0 detect_off_ball_runs +
      value_off_ball_runs, and lands one row per (action, runner). Feeds fct_off_ball_runs. The table is
      CREATE-IF-NOT-EXISTS'd by scripts/migrations/2026-08-20-add-marts1-defensive-offball-bronze.sql so
      the staging view resolves (empty) before the Part-B scoring run (Task 22b) populates it.
    database: soccer_analytics
    schema: bronze
    loader: python_wheel
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 168, period: hour}
        error_after: {count: 336, period: hour}

    tables:
      - name: off_ball_runs
        description: >
          One row per qualifying (action, runner). Keyed (data_source, match_id, action_id, player_id).
          value_off_ball_runs values only completed passes/crosses with a resolved receiver, so most rows
          carry NaN run_value / <NA> role by design (ADR-033).
