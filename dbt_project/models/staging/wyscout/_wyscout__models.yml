version: 2

models:
  - name: stg_wyscout__players
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cleaned Wyscout player metadata. Extracts role, nationality, and
      physical attributes from serialized JSON columns. One row per player.
    columns:
      - name: player_id
        description: Wyscout player identifier (wyId)
        data_tests:
          - unique
          - not_null
      - name: player_name
        description: Full name (firstName + lastName)
        data_tests:
          - not_null
      - name: first_name
        description: Player first name
      - name: last_name
        description: Player last name
      - name: short_name
        description: Abbreviated display name (e.g. "H. Kane")
      - name: birth_date
        description: Date of birth (YYYY-MM-DD)
      - name: position_name
        description: Position from role JSON (Goalkeeper, Defender, Midfielder, Forward)
      - name: position_code
        description: Position code from role JSON (GK, DF, MF, FW)
      - name: current_team_id
        description: Current team identifier at time of data collection
      - name: foot
        description: Preferred foot (left, right, both)
      - name: height_cm
        description: Player height in centimeters
      - name: weight_kg
        description: Player weight in kilograms
      - name: nationality
        description: Country name from passportArea
      - name: nationality_code
        description: ISO 3166-1 alpha-3 country code
      - name: data_source
        description: Data provider identifier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wyscout']
      - name: wyId
        description: Bronze passthrough — wyId from wyscout_players (original Figshare player identifier, same value as player_id).
      - name: firstName
        description: Bronze passthrough — firstName from wyscout_players (camelCase lineage for cross-reference with Figshare CSV).
      - name: lastName
        description: Bronze passthrough — lastName from wyscout_players.
      - name: middleName
        description: Bronze passthrough — middleName from wyscout_players.
      - name: shortName
        description: Bronze passthrough — shortName from wyscout_players.
      - name: birthDate
        description: Bronze passthrough — birthDate from wyscout_players (ISO YYYY-MM-DD).
      - name: height
        description: Bronze passthrough — height from wyscout_players (bigint cm).
      - name: weight
        description: Bronze passthrough — weight from wyscout_players (bigint kg).
      - name: currentTeamId
        description: Bronze passthrough — currentTeamId from wyscout_players (double, nullable).
      - name: currentNationalTeamId
        description: Bronze passthrough — currentNationalTeamId from wyscout_players (double, nullable).
      - name: role
        description: Bronze passthrough — raw `role` JSON string from wyscout_players (used upstream of position_name/position_code extraction).
      - name: passportArea
        description: Bronze passthrough — raw `passportArea` JSON string from wyscout_players (used upstream of nationality/nationality_code extraction).
      - name: birthArea
        description: Bronze passthrough — raw `birthArea` JSON string from wyscout_players (country-of-birth area struct; distinct from passportArea).
      - name: _ingested_at
        description: Bronze passthrough — _ingested_at UTC audit timestamp from wyscout_players.

  - name: stg_wyscout__events
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cleaned and normalized Wyscout event data. Extracts start/end
      positions from the nested positions array, scales coordinates
      from percentage (0-100) to 120x80 pitch system, and decodes
      tag IDs into meaningful boolean flags. One row per event.
    columns:
      - name: event_sk
        description: Surrogate key — Wyscout eventId is a type code, not a unique ID
        data_tests:
          - unique
          - not_null
      - name: event_id
        description: Wyscout event type code (NOT unique — duplicates across matches)
        data_tests:
          - not_null
      - name: match_id
        description: Foreign key to match data
        data_tests:
          - not_null
      - name: event_type
        description: Event type name (Pass, Shot, Duel, Free Kick, etc.)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Duel', 'Foul', 'Free Kick', 'Goalkeeper leaving line', 'Interruption', 'Offside', 'Others on the ball', 'Pass', 'Shot', 'Save attempt']
              config:
                severity: warn
      - name: sub_event_type
        description: Sub-event classification (Simple pass, Head shot, etc.)
      - name: player_id
        description: Player performing the event
        data_tests:
          - not_null
      - name: team_id
        description: Team performing the event
        data_tests:
          - not_null
      - name: period
        description: Match period (1, 2, extra time, penalties)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: event_sec
        description: Event timestamp in seconds from period start
      - name: start_x
        description: Starting X coordinate (120-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        description: Starting Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        description: Ending X coordinate (120-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "end_x is not null"
              config:
                severity: warn
      - name: end_y
        description: Ending Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "end_y is not null"
              config:
                severity: warn
      - name: is_accurate
        description: Whether the event was successful (from tag 1801)
      - name: is_goal
        description: Whether the event resulted in a goal (from tag 101)
      - name: data_source
        description: Data provider identifier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wyscout']
      - name: is_own_goal
        description: Whether the event resulted in an own goal (from tag 102)
      - name: is_assist
        description: Whether the event was an assist (from tag 301)
      - name: is_key_pass
        description: Whether the event was a key pass (from tag 401)
      - name: sub_event_id
        description: Bronze passthrough — subEventId from wyscout_events (numeric sub-event code).
      - name: is_not_accurate
        description: Whether the event was unsuccessful (from tag 1802).
      - name: is_head
        description: Whether the event used the head (from tag 702).
      - name: is_right_foot
        description: Whether the event used the right foot (from tag 703).
      - name: is_left_foot
        description: Whether the event used the left foot (from tag 704).
      - name: is_counter_attack
        description: Whether the event occurred during a counter-attack (from tag 1601).
      - name: under_pressure
        description: Whether the player was under pressure during the event (from tag 503).
      - name: is_blocked
        description: Whether the shot was blocked (from tag 1702).
      - name: is_red_card
        description: Whether the event produced a red card (from tag 1401).
      - name: is_yellow_card
        description: Whether the event produced a yellow card (from tag 1402).
      - name: is_sliding_tackle
        description: Whether the event was a sliding tackle (from tag 601).
      - name: is_opportunity
        description: Whether the event created a scoring opportunity (from tag 201).
      - name: is_dangerous_ball_lost
        description: Whether the event was a dangerous ball loss (from tag 1701).
      - name: is_free_space_right
        description: Whether the event occurred in free space on the right (from tag 501).
      - name: is_free_space_left
        description: Whether the event occurred in free space on the left (from tag 502).
      - name: is_high
        description: Whether the pass/shot trajectory was high (from tag 801).
      - name: is_low
        description: Whether the pass/shot trajectory was low (from tag 802).
      - name: tags_parsed
        description: >
          Bronze passthrough — parsed array<struct<id:int>> of the raw `tags` JSON
          from wyscout_events. Use when a downstream consumer needs a tag ID not
          covered by the boolean decoder columns above.
      - name: positions_raw
        description: Bronze passthrough — raw `positions` JSON string from wyscout_events (pre-parse lineage).
      - name: tags_raw
        description: Bronze passthrough — raw `tags` JSON string from wyscout_events (pre-parse lineage).
      - name: competition_name
        description: Bronze passthrough — competition_name from wyscout_events.
      - name: _ingested_at
        description: Bronze passthrough — _ingested_at UTC audit timestamp from wyscout_events.

  - name: stg_wyscout__home_away_teams
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Bridge: one row per (match_id, side) for Wyscout matches, with the real
      team_id when teams_data_parsed explodes cleanly, and a deterministic
      synth fallback (is_synthesized=true, synthesis_reason='wyscout_unresolved_teamsdata')
      when the source MAP is NULL/empty. Feeds fct_match_summary +
      fct_funnel_stages_agg (opponent_team_id warn-flip) and dim_teams Wyscout CTE.
    columns:
      - name: match_id
        data_type: bigint
        data_tests:
          - not_null
      - name: side
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: native_team_id
        data_type: string
        description: Real team_id stringified, or 'wyscout_unresolved_<match_id>_<side>' for synth rows.
        data_tests:
          - not_null
      - name: team_id
        data_type: int
        description: NULL for synth-fallback rows; populated for real parsed rows.
      - name: is_synthesized
        data_type: boolean
        data_tests:
          - not_null
      - name: synthesis_reason
        data_type: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, side]

  - name: stg_wyscout__teams
    config:
      meta:
        data_sensitivity: public
        contains_pii: false
    description: >
      Cleaned Wyscout team roster (Figshare teams.json, Pappalardo et al. 2019).
      Feeds dim_teams Wyscout CTE with team names — closes the pre-existing
      team-name coverage gap for Wyscout real rows in dim_teams. ~142 teams
      across 7 competitions.
    columns:
      - name: team_id
        description: Wyscout team identifier (from wyId).
        data_tests:
          - unique
          - not_null
      - name: official_name
        description: Official team name (e.g. "Real Club Celta de Vigo").
      - name: team_name
        description: Display / short team name (e.g. "Celta de Vigo").
      - name: city
        description: Home city.
      - name: area_name
        description: Country / area display name (parsed from area JSON).
      - name: area_alpha3
        description: ISO 3166-1 alpha-3 area code (parsed from area JSON).
      - name: area_alpha2
        description: ISO 3166-1 alpha-2 area code (parsed from area JSON).
      - name: team_type
        description: Team type classification (club / national).
      - name: data_source
        description: Data provider identifier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wyscout']
      - name: wyId
        description: Bronze passthrough — wyId from wyscout_teams.
      - name: officialName
        description: Bronze passthrough — officialName from wyscout_teams.
      - name: city_raw
        description: Bronze passthrough — original city column.
      - name: area
        description: >
          Bronze passthrough — raw area JSON string {name, id, alpha2code, alpha3code}.
          Used upstream of area_name / area_alpha3 extraction.
      - name: type
        description: Bronze passthrough — raw type column (club / national).
      - name: _ingested_at
        description: Bronze passthrough — _ingested_at UTC audit timestamp.
