version: 2

models:
  - name: stg_wyscout__players
    description: >
      Cleaned Wyscout player metadata. Extracts role, nationality, and
      physical attributes from serialized JSON columns. One row per player.
    columns:
      - name: player_id
        description: Wyscout player identifier (wyId)
        data_tests:
          - unique
          - not_null
      - name: player_name
        description: Full name (firstName + lastName)
        data_tests:
          - not_null
      - name: first_name
        description: Player first name
      - name: last_name
        description: Player last name
      - name: short_name
        description: Abbreviated display name (e.g. "H. Kane")
      - name: birth_date
        description: Date of birth (YYYY-MM-DD)
      - name: position_name
        description: Position from role JSON (Goalkeeper, Defender, Midfielder, Forward)
      - name: position_code
        description: Position code from role JSON (GK, DF, MF, FW)
      - name: current_team_id
        description: Current team identifier at time of data collection
      - name: foot
        description: Preferred foot (left, right, both)
      - name: height_cm
        description: Player height in centimeters
      - name: weight_kg
        description: Player weight in kilograms
      - name: nationality
        description: Country name from passportArea
      - name: nationality_code
        description: ISO 3166-1 alpha-3 country code
      - name: data_source
        description: Data provider identifier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wyscout']

  - name: stg_wyscout__events
    description: >
      Cleaned and normalized Wyscout event data. Extracts start/end
      positions from the nested positions array, scales coordinates
      from percentage (0-100) to 120x80 pitch system, and decodes
      tag IDs into meaningful boolean flags. One row per event.
    columns:
      - name: event_sk
        description: Surrogate key — Wyscout eventId is a type code, not a unique ID
        data_tests:
          - unique
          - not_null
      - name: event_id
        description: Wyscout event type code (NOT unique — duplicates across matches)
        data_tests:
          - not_null
      - name: match_id
        description: Foreign key to match data
        data_tests:
          - not_null
      - name: event_type
        description: Event type name (Pass, Shot, Duel, Free Kick, etc.)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Duel', 'Foul', 'Free Kick', 'Goalkeeper leaving line', 'Interruption', 'Offside', 'Others on the ball', 'Pass', 'Shot', 'Save attempt']
              config:
                severity: warn
      - name: sub_event_type
        description: Sub-event classification (Simple pass, Head shot, etc.)
      - name: player_id
        description: Player performing the event
        data_tests:
          - not_null
      - name: team_id
        description: Team performing the event
        data_tests:
          - not_null
      - name: period
        description: Match period (1, 2, extra time, penalties)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: event_sec
        description: Event timestamp in seconds from period start
      - name: start_x
        description: Starting X coordinate (120-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "start_x is not null"
              config:
                severity: warn
      - name: start_y
        description: Starting Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "start_y is not null"
              config:
                severity: warn
      - name: end_x
        description: Ending X coordinate (120-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 120
                row_condition: "end_x is not null"
              config:
                severity: warn
      - name: end_y
        description: Ending Y coordinate (80-yard scale)
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 80
                row_condition: "end_y is not null"
              config:
                severity: warn
      - name: is_accurate
        description: Whether the event was successful (from tag 1801)
      - name: is_goal
        description: Whether the event resulted in a goal (from tag 101)
      - name: data_source
        description: Data provider identifier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['wyscout']
      - name: is_own_goal
        description: Whether the event resulted in an own goal (from tag 102)
      - name: is_assist
        description: Whether the event was an assist (from tag 301)
      - name: is_key_pass
        description: Whether the event was a key pass (from tag 401)
