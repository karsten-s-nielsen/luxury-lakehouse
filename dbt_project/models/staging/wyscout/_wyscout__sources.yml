version: 2

sources:
  - name: wyscout
    description: >
      Wyscout v3 open data ingested into the bronze layer. Contains event-level
      soccer data, match metadata, and player/team reference data. Most event
      semantics are encoded in the `tags` JSON array (numeric tag IDs requiring
      lookup); downstream staging decodes common tag IDs into boolean columns.
      Column documentation auto-generated from
      `DESCRIBE TABLE soccer_analytics.bronze.wyscout_*` (see
      src/tests/fixtures/wyscout_bronze_schema_snapshot.json).
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}

    tables:
      - name: wyscout_events
        description: >
          Raw event stream from Wyscout v3 open data. Each row is a single event; most attributes live in the `tags` JSON array (numeric IDs) or the `positions` array (start/end coords).
        columns:
          - name: eventId
            description: Unique event identifier
          - name: subEventName
            description: Sub-event type (Simple pass, Head shot, etc.)
          - name: tags
            description: >
              JSON array of tag objects with id field. Tag IDs encode event outcomes (e.g. 101=Goal, 1801=Accurate).
          - name: playerId
            description: Player performing the event
          - name: positions
            description: >
              JSON array with start and end positions. Each position has x (0-100) and y (0-100) as percentages.
          - name: matchId
            description: Foreign key to wyscout_matches
          - name: eventName
            description: Event type name (Pass, Shot, Duel, Free Kick, etc.)
          - name: teamId
            description: Team performing the event
          - name: matchPeriod
            description: Match period (1H, 2H, E1, E2, P)
          - name: eventSec
            description: Event timestamp in seconds from period start
          - name: subEventId
            description: >
              double — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: id
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: competition_name
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: _ingested_at
            description: UTC timestamp when the row was written to bronze (audit col).

      - name: wyscout_matches
        description: >
          Match metadata from Wyscout v3. Nested `teamsData` JSON contains team-level formation + score + lineup per match.
        columns:
          - name: status
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: roundId
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: gameweek
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: teamsData
            description: >
              JSON object with home/away team data including formation, score, and team identifiers.
          - name: seasonId
            description: Season identifier
          - name: dateutc
            description: Match date in UTC
          - name: winner
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: venue
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: wyId
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: label
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: date
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: referees
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: duration
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: competitionId
            description: Competition identifier
          - name: competition_name
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: groupName
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: _ingested_at
            description: UTC timestamp when the row was written to bronze (audit col).

      - name: wyscout_players
        description: >
          Player reference data from Wyscout v3 open data. One row per player.
        columns:
          - name: passportArea
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: weight
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: firstName
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: middleName
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: lastName
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: currentTeamId
            description: >
              double — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: birthDate
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: height
            description: >
              bigint — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: role
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: birthArea
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: wyId
            description: Wyscout player identifier
          - name: foot
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: shortName
            description: >
              string — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: currentNationalTeamId
            description: >
              double — auto-documented from DESCRIBE TABLE; refine description when staging model first reads this col.
          - name: _ingested_at
            description: UTC timestamp when the row was written to bronze (audit col).

      - name: wyscout_teams
        description: >
          Wyscout team roster from Figshare teams.json (Pappalardo et al. 2019,
          article 7765310). 142 teams across 7 competitions, 2017/18 season.
          Ingested by ingestion.wyscout.ingest_teams (PR 5a addition) — closes
          the pre-existing team-name gap for dim_teams Wyscout rows.
        columns:
          - name: wyId
            description: Wyscout team identifier (integer surrogate key).
          - name: officialName
            description: Official team name (e.g., "Real Club Celta de Vigo").
          - name: name
            description: Display / short team name (e.g., "Celta de Vigo").
          - name: city
            description: Home city.
          - name: area
            description: >
              Nested JSON struct {name, id, alpha2code, alpha3code} — serialized
              to JSON string for Delta compat. Staging parses via get_json_object.
          - name: type
            description: Team type (club / national).
          - name: _ingested_at
            description: UTC timestamp when the row was written to bronze (audit col).

