version: 2

sources:
  - name: gradientsports
    description: >
      Gradient Sports (PFF) WC2022 open dataset via pining-for-the-data API.
      Center-origin meters coordinate system. 64 matches, all 4 artifact types.
    database: soccer_analytics
    schema: bronze
    loader: aws_lambda
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 30, period: day}

    tables:
      - name: gradientsports_metadata
        description: >
          Match metadata (one row per match). Contains team identities,
          competition, season, date, stadium, direction flags, fps, period
          timestamps. json_normalize flattened from API response.
        columns:
          - name: match_id
            description: Native match ID (numeric string, e.g. '10502')
          - name: homeTeam.id
            description: Home team numeric ID
          - name: homeTeam.name
            description: Home team name
          - name: homeTeam.shortName
            description: Home team short name (3-letter code)
          - name: awayTeam.id
            description: Away team numeric ID
          - name: awayTeam.name
            description: Away team name
          - name: awayTeam.shortName
            description: Away team short name (3-letter code)
          - name: competition.id
            description: Competition numeric ID (38 = FIFA WC)
          - name: competition.name
            description: Competition name
          - name: season
            description: Season identifier (e.g. '2022')
          - name: date
            description: ISO 8601 UTC match timestamp
          - name: stadium.id
            description: Stadium numeric ID
          - name: stadium.name
            description: Stadium name
          - name: homeTeamStartLeft
            description: Whether home team started on the left side
          - name: homeTeamStartLeftExtraTime
            description: Direction flag for extra time (nullable)
          - name: fps
            description: Frame rate (29.97)
          - name: week
            description: Matchweek number
          - name: _ingested_at
            description: UTC timestamp when the row was ingested

          - name: endPeriod1
            description: >
              Raw feed clock marker: first-half end.
          - name: endPeriod2
            description: >
              Raw feed clock marker: second-half end.
          - name: halfPeriod
            description: >
              Raw feed half-period descriptor as supplied by the pining feed.
          - name: id
            description: >
              Provider's own metadata row id. NOT a join key — `match_id` is (ADR-030).
          - name: period1
            description: >
              Raw feed period-1 descriptor as supplied by the pining feed.
          - name: period2
            description: >
              Raw feed period-2 descriptor as supplied by the pining feed.
          - name: startPeriod1
            description: >
              Raw feed clock marker: first-half kickoff.
          - name: startPeriod2
            description: >
              Raw feed clock marker: second-half kickoff.
          - name: videoUrl
            description: >
              Broadcast video location for the match. Presentation metadata; not redistributable.
          - name: awayTeamKit.name
            description: >
              Broadcast away-team kit name. Presentation metadata, no analytical consumer.
          - name: awayTeamKit.primaryColor
            description: >
              Broadcast away-team primary kit colour. Presentation metadata, no analytical consumer.
          - name: awayTeamKit.primaryTextColor
            description: >
              Broadcast away-team primary kit text colour. Presentation metadata, no analytical consumer.
          - name: awayTeamKit.secondaryColor
            description: >
              Broadcast away-team secondary kit colour. Presentation metadata, no analytical consumer.
          - name: awayTeamKit.secondaryTextColor
            description: >
              Broadcast away-team secondary kit text colour. Presentation metadata, no analytical consumer.
          - name: homeTeamKit.name
            description: >
              Broadcast home-team kit name. Presentation metadata, no analytical consumer.
          - name: homeTeamKit.primaryColor
            description: >
              Broadcast home-team primary kit colour. Presentation metadata, no analytical consumer.
          - name: homeTeamKit.primaryTextColor
            description: >
              Broadcast home-team primary kit text colour. Presentation metadata, no analytical consumer.
          - name: homeTeamKit.secondaryColor
            description: >
              Broadcast home-team secondary kit colour. Presentation metadata, no analytical consumer.
          - name: homeTeamKit.secondaryTextColor
            description: >
              Broadcast home-team secondary kit text colour. Presentation metadata, no analytical consumer.
          - name: stadium.pitches
            description: >
              Nested pitch-dimension array. Analytics uses canonical SPADL 105x68, never this raw field.
          - name: visibility
            description: >
              RAW per-match redistribution signal from the pining feed (ADR-064). Stamped on bronze at ingest via MatchInfo.visibility, which is required-no-default. Rows written before the column existed hold NULL and are repaired by the PR-2a _backfill_artifacts run, not by a re-ingest (the guard is incremental).
          - name: access_tier
            description: >
              Derived HF redistribution tier ('public'/'restricted'), classified from `visibility` by shared.access_tier.classify_access_tier (ADR-064). Gradient Sports is NOT in PUBLIC_BY_LICENSE_PROVIDERS, so a NULL/unknown visibility fail-safes to 'restricted'.
      - name: gradientsports_roster
        description: >
          Match roster (one row per player per match, ~51 rows/match).
          Contains player identity, team, position, shirt number, starter flag.
          json_normalize flattened from API response.
        columns:
          - name: match_id
            description: Native match ID (numeric string, e.g. '10502')
          - name: player.id
            description: Player numeric ID (e.g. '3861')
          - name: player.nickname
            description: Player display name
          - name: team.id
            description: Team numeric ID
          - name: team.name
            description: Team name
          - name: positionGroupType
            description: Position group code (GK, CB, AM, CF, etc.)
          - name: shirtNumber
            description: Shirt number (string)
          - name: started
            description: Whether player was in the starting lineup
          - name: _ingested_at
            description: UTC timestamp when the row was ingested
      - name: gradientsports_events
        description: >
          Raw pining/PFF event feed (one row per possession event). 262 json_normalize-flattened columns whose names contain literal dots. NO staging model — consumed directly by the SPADL converter's backtick-quoted projection (_gs_needed_bronze_columns), so it is absent from test_staging_coverage's PROVIDER_COVERAGE and documenting it costs sources.yml only.
