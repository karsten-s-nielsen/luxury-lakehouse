version: 2
models:
- name: stg_gradientsports__metadata
  config:
    meta:
      data_sensitivity: public
      contains_pii: false
  description: 'Staging view over bronze.gradientsports_metadata. One row per match. Typed columns from json_normalize
    output. Feeds dim_matches, dim_teams, dim_competitions.

    '
  columns:
  - name: match_id
    description: Native match ID (numeric string)
    data_tests:
    - not_null
  - name: home_team_id
    description: Home team ID (cast to string)
    data_tests:
    - not_null
  - name: home_team_name
    description: Home team name
    data_tests:
    - not_null
  - name: home_team_short_name
    description: Home team short name (3-letter code)
  - name: away_team_id
    description: Away team ID (cast to string)
    data_tests:
    - not_null
  - name: away_team_name
    description: Away team name
    data_tests:
    - not_null
  - name: away_team_short_name
    description: Away team short name (3-letter code)
  - name: competition_id
    description: Competition ID (cast to string)
    data_tests:
    - not_null
  - name: competition_name
    description: Competition name
    data_tests:
    - not_null
  - name: season_id
    description: Season identifier
  - name: match_date
    description: ISO 8601 UTC match timestamp
  - name: stadium_id
    description: Stadium ID (cast to string)
  - name: stadium_name
    description: Stadium name
  - name: home_team_start_left
    description: Home team direction flag
  - name: home_team_start_left_extra_time
    description: Extra-time direction flag (nullable)
  - name: fps
    description: Frame rate
  - name: matchweek
    description: Matchweek number
  - name: _ingested_at
    description: UTC ingestion timestamp
  - name: visibility
    description: 'RAW per-match redistribution signal from the pining feed (ADR-064), stamped on bronze at ingest.
      NULL on rows written before the column existed; repaired by the PR-2a _backfill_artifacts run.

      '
  - name: access_tier
    description: 'Derived HF redistribution tier (''public''/''restricted'') from `visibility` via shared.access_tier.classify_access_tier
      (ADR-064). Gradient Sports is not in PUBLIC_BY_LICENSE_PROVIDERS, so NULL/unknown fail-safes to ''restricted''.

      '
  - name: gs_metadata_row_id
    description: Provider's own metadata row id (bronze `id`). NOT a join key — `match_id` is (ADR-030).
  - name: video_url
    description: Broadcast video location. Presentation metadata; not redistributable.
  - name: start_period_1
    description: 'Raw feed clock marker: first-half kickoff.'
  - name: end_period_1
    description: 'Raw feed clock marker: first-half end.'
  - name: start_period_2
    description: 'Raw feed clock marker: second-half kickoff.'
  - name: end_period_2
    description: 'Raw feed clock marker: second-half end.'
  - name: period_1
    description: Raw feed period-1 descriptor.
  - name: period_2
    description: Raw feed period-2 descriptor.
  - name: half_period
    description: Raw feed half-period descriptor.
  - name: stadium_pitches
    description: Nested pitch-dimension array. Analytics uses canonical SPADL 105x68, never this.
  - name: home_team_kit_name
    description: Broadcast home-team kit name. Presentation metadata, no analytical consumer.
  - name: home_team_kit_primary_color
    description: Broadcast home-team primary kit colour. Presentation metadata, no analytical consumer.
  - name: home_team_kit_primary_text_color
    description: Broadcast home-team primary kit text colour. Presentation metadata, no analytical consumer.
  - name: home_team_kit_secondary_color
    description: Broadcast home-team secondary kit colour. Presentation metadata, no analytical consumer.
  - name: home_team_kit_secondary_text_color
    description: Broadcast home-team secondary kit text colour. Presentation metadata, no analytical consumer.
  - name: away_team_kit_name
    description: Broadcast away-team kit name. Presentation metadata, no analytical consumer.
  - name: away_team_kit_primary_color
    description: Broadcast away-team primary kit colour. Presentation metadata, no analytical consumer.
  - name: away_team_kit_primary_text_color
    description: Broadcast away-team primary kit text colour. Presentation metadata, no analytical consumer.
  - name: away_team_kit_secondary_color
    description: Broadcast away-team secondary kit colour. Presentation metadata, no analytical consumer.
  - name: away_team_kit_secondary_text_color
    description: Broadcast away-team secondary kit text colour. Presentation metadata, no analytical consumer.
- name: stg_gradientsports__roster
  config:
    meta:
      data_sensitivity: public
      contains_pii: false
  description: 'Staging view over bronze.gradientsports_roster. One row per player per match (~51 rows/match). Feeds
    dim_players.

    '
  columns:
  - name: match_id
    description: Native match ID (numeric string)
    data_tests:
    - not_null
  - name: player_id
    description: Player ID (cast to string)
    data_tests:
    - not_null
  - name: player_nickname
    description: Player display name
    data_tests:
    - not_null
  - name: team_id
    description: Team ID (cast to string)
    data_tests:
    - not_null
  - name: team_name
    description: Team name
    data_tests:
    - not_null
  - name: position_group
    description: Position group code (GK, CB, AM, CF, etc.)
  - name: shirt_number
    description: Shirt number (string)
  - name: started
    description: Whether player was in starting lineup
  - name: _ingested_at
    description: UTC ingestion timestamp
