[project]
name = "luxury-lakehouse"
version = "0.3.3"
description = "Serverless soccer analytics platform built on Databricks Lakebase"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Core ingestion dependencies (must work on Databricks serverless Python 3.10)
    # NOTE: pandas and numpy are pre-installed on Databricks serverless runtime.
    # Do NOT pin them here — version conflicts break the Python kernel.
    "requests>=2.33.0",
    "requests-cache>=1.2.0",
    # Workflow framework (card parsing + validation)
    "pydantic>=2.0",
    "PyYAML>=6.0",
    # HF Hub (cost tracking, dataset publishing, model weight sync)
    "huggingface_hub>=1.5.0",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "mplsoccer>=1.1.3",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "silly-kicks>=1.0.0,<2.0",
    "xgboost==3.2.0",
    "rapidfuzz>=3.6.0",
    "unidecode>=1.3.0",
    "sparse-dot-topn>=1.1.0",
]
dbt = [
    "dbt-core>=1.10.0",
    "dbt-databricks>=1.10.0",
]
sdk = [
    "databricks-sdk>=0.102.0",
]
embeddings = [
    "gensim>=4.3.0",
]
jax = [
    "jax[cpu]>=0.4.35",
]
mlflow = [
    "mlflow>=2.17.0",
]
training = ["torch>=2.0", "pyarrow>=14.0"]
evolve = ["openevolve>=0.2.0"]
taipy-app = [
    "taipy==4.1.1",
    "psycopg2-binary==2.9.11",
    "mplsoccer==1.6.1",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.0",
    "requests>=2.33.0",
    "databricks-sdk>=0.102.0",
    "huggingface-hub>=1.5.0",
    "scipy>=1.15.0",
    "plotly>=6.7.0,<7",
]
# NOTE: kloppy (SkillCorner tracking) is NOT listed here — it runs in a separate
# Databricks task environment defined in terraform/modules/workflows/main.tf.
# IDSSE tracking uses stdlib xml.etree.ElementTree and needs no extra dependencies.
[project.scripts]
ingest_statsbomb = "ingestion.statsbomb:main"
ingest_metrica = "ingestion.metrica:main"
ingest_wyscout = "ingestion.wyscout:main"
backfill_statsbomb_360 = "ingestion.statsbomb_backfill_360:main"
backfill_statsbomb_extra = "ingestion.statsbomb_backfill_extra:main"
compute_spadl_vaep = "ingestion.spadl_vaep:main"
ingest_idsse = "ingestion.idsse:main"
ingest_skillcorner = "ingestion.skillcorner:main"
compute_line_breaking = "ingestion.line_breaking:main"
compute_off_ball_xt = "ingestion.off_ball_xt:main"
compute_defcon_lite = "ingestion.defcon_lite:main"
resolve_players = "ingestion.entity_resolution:main"
compute_embeddings = "ingestion.player_embeddings_v2:main"
compute_embeddings_v2 = "ingestion.player_embeddings_v2:main_v2"
compute_embeddings_v1 = "ingestion.player_embeddings_v1:main_v1"
compute_embeddings_360 = "ingestion.player_embeddings_v2:main_360"
compute_expected_threat = "ingestion.expected_threat:main"
compute_formations = "ingestion.formations_efpi:main"
compute_formations_efpi = "ingestion.formations_efpi:main_efpi"
compute_formations_shape_graph = "ingestion.formations_shape_graph:main_shape_graph"
compute_xg_model = "ingestion.xg_model:main"
compute_xg_model_v2 = "ingestion.xg_model_v2:main"
compute_pitch_control = "ingestion.pitch_control_batch:main"
ingest_idsse_events = "ingestion.idsse_events:main"
compute_elastic_sync = "ingestion.elastic_sync:main"
compute_pausa = "ingestion.pausa:main"
run_model_validation = "ingestion.model_validation:main"
sync_hf_costs = "ingestion.sync_hf_costs:main"
export_embeddings_training_data = "ingestion.export_embeddings_training_data:main"
validate_workflow_cards = "workflows.loader:validate_cli"
import_space_creation = "ingestion.import_space_creation:main"
export_shots_on_target = "ingestion.export_shots_on_target:main"
import_psxg_predictions = "ingestion.import_psxg_predictions:main"
import_obso_results = "ingestion.import_obso_results:main"
extract_tracking_metadata = "ingestion.tracking_metadata:main"
prepare_360_training_data = "ingestion.prepare_360_training_data:main"
export_scoutgpt_training_data = "ingestion.export_scoutgpt_training_data:main"
evolve = "evolve.runner:main"
hf_sync = "ingestion.hf_sync:main"
refresh_synced_tables = "ingestion.refresh_synced_tables:main"
dbt_build = "ingestion.dbt_runner:main"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["demo_space", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except (silent-swallow anti-pattern)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S101", "BLE001"]  # assert is standard in pytest; tests may catch broadly to assert error flow
"hf_taipy_app/**" = ["E501", "S104", "F405", "RUF022", "RUF005"]  # Taipy app: long help text, 0.0.0.0, star imports, unsorted __all__, list concat
"hf_taipy_app/src/test_*.py" = ["E501", "S101", "S105", "S106"]  # Taipy app tests: long lines, asserts, fake tokens in test fixtures
"src/evolve/targets/*/seed_programs/**" = ["F821"]  # Seed programs are exec'd with torch/math injected in globals
# BLE001 per-file ignores below: each is a deliberate, justified catch of broad
# Exception. Per-line `# noqa: BLE001` comments (with explanation) are preferred
# when only a single call site needs the exemption inside a file; use these
# file-level entries only when multiple sites in one module all share the same
# architectural reason.
"src/ingestion/hf_jobs_cost.py" = ["BLE001"]  # retry loop + best-effort cost history pruning
"src/ingestion/refresh_synced_tables.py" = ["BLE001"]  # CLI error accumulator
"src/ingestion/sync_hf_costs.py" = ["BLE001"]  # per-item HF parse loop (best-effort)
"src/ingestion/statsbomb.py" = ["BLE001"]  # per-match fetch best-effort (logs with traceback, records failure)
"src/ingestion/wyscout.py" = ["BLE001"]  # downloader best-effort + _raw_extra_json building (logs with traceback)
"src/ingestion/tracking_metadata.py" = ["BLE001"]  # per-match XML/kloppy parse best-effort
"src/ingestion/dbt_runner.py" = ["BLE001"]  # SDK token resolution (prints + re-raises)
"src/evolve/**" = ["BLE001"]  # Typed error-return paths in evolve backends
# Taipy UI app — event handlers, background daemons, filter init, and DB
# pool teardown all use broad catches to prevent UI crashes. Each caught
# exception is logged via `logger.exception()` so visibility is preserved.
"hf_taipy_app/src/state/**" = ["BLE001"]  # Taipy state event handlers + page refreshers
"hf_taipy_app/src/db.py" = ["BLE001"]  # connection pool teardown (best-effort close)
"hf_taipy_app/src/filters.py" = ["BLE001"]  # filter init defensive fallbacks
"hf_taipy_app/src/health_check.py" = ["BLE001"]  # background daemon — must not crash app
"hf_taipy_app/src/admin_api.py" = ["BLE001"]  # background refresh thread — logs via logger.exception
# Operational scripts — CLI tools, HF Jobs batch scripts, and defensive
# bootstrap utilities where broad catches are architecturally acceptable
# (each catch logs with traceback and either continues to the next item
# or returns a typed fallback).
"scripts/bootstrap_artifact_hashes.py" = ["BLE001"]  # MLflow @Champion / UC Volume bootstrap fallbacks
"scripts/benchmark_hf_jobs.py" = ["BLE001"]  # per-flavor HF Jobs retry loop (logs + continues)
"scripts/create_indexes.py" = ["BLE001"]  # index creation after specific psycopg2.OperationalError catches
"scripts/delete_synced_table.py" = ["BLE001"]  # CLI cleanup tool (best-effort per-table delete)
"scripts/fix_event_log_ownership.py" = ["BLE001"]  # SDK permission grant fallbacks
"scripts/grant_synced_table_permissions.py" = ["BLE001"]  # SDK grant fallbacks
"scripts/manage_space.py" = ["BLE001"]  # HF Space lifecycle CLI (poll + retry loops)
"scripts/setup_lakebase_roles.py" = ["BLE001"]  # role creation best-effort
"scripts/train_*.py" = ["BLE001"]  # HF Jobs training scripts (cost hook wrappers)
"scripts/compute_*_hf.py" = ["BLE001"]  # HF Jobs compute scripts (per-file loops)
"scripts/compute_epv_transition_hf_helpers.py" = ["BLE001"]
"scripts/compute_space_creation_hf_helpers.py" = ["BLE001"]
"scripts/train_xg_v2_hf_helpers.py" = ["BLE001"]
"scripts/train_football2vec_360_helpers.py" = ["BLE001"]
"scripts/publish_*_hf.py" = ["BLE001"]  # HF Hub publish scripts (per-artifact loops)

[tool.ruff.lint.isort]
known-first-party = ["analytics", "evolve", "ingestion", "shared", "workflows"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"  # pyspark only available in Databricks runtime
exclude = [
    "demo_space",
    "notebooks",
    # PEP 723 HF Jobs scripts (have `# /// script` headers; run on HF Jobs
    # infrastructure with their own inline dependency resolution; pandas/numpy
    # stub noise dominates and is not actionable here). Plus their *_helpers.py
    # modules, which are bundled with the parent script at run time.
    # Operational scripts (deploy_wheel.py, maintain_synced_tables.py,
    # manage_space.py, setup_*, etc.) ARE type-checked.
    # See TODO On Deck D60 for the 9 residual non-HF errors that this exposed.
    "scripts/compute_epv_transition_hf.py",
    "scripts/compute_epv_transition_hf_helpers.py",
    "scripts/compute_obso_hf.py",
    "scripts/compute_space_creation_hf.py",
    "scripts/compute_space_creation_hf_helpers.py",
    "scripts/compute_xt_grid_hf.py",
    "scripts/export_embedding_atlas_data.py",
    "scripts/publish_freeze_frame_hf.py",
    "scripts/publish_spadl_vaep_hf.py",
    "scripts/publish_xg_shots_hf.py",
    "scripts/train_football2vec_360.py",
    "scripts/train_football2vec_360_helpers.py",
    "scripts/train_football2vec_v2.py",
    "scripts/train_psxg_hf.py",
    "scripts/train_scoutgpt_hf.py",
    "scripts/train_vaep_model_hf.py",
    "scripts/train_xg_model_hf.py",
    "scripts/train_xg_v2_hf.py",
    "scripts/train_xg_v2_hf_helpers.py",
    "src/evolve/targets/*/seed_programs",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--tb=short -q"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/analytics", "src/shared", "src/workflows", "src/evolve"]

# D59: bundle dbt_project into the wheel so the daily-job dbt_build task can
# resolve it via importlib.resources("luxury_lakehouse_dbt_project").
# Each subdirectory is mapped explicitly to avoid pulling transient artifacts
# (target/, logs/) and local cache (.user.yml) that aren't needed at runtime.
# dbt_packages/ IS needed at runtime for macro resolution and is bundled.
[tool.hatch.build.targets.wheel.force-include]
"dbt_project/dbt_project.yml" = "luxury_lakehouse_dbt_project/dbt_project.yml"
"dbt_project/profiles.yml" = "luxury_lakehouse_dbt_project/profiles.yml"
"dbt_project/packages.yml" = "luxury_lakehouse_dbt_project/packages.yml"
"dbt_project/package-lock.yml" = "luxury_lakehouse_dbt_project/package-lock.yml"
"dbt_project/models" = "luxury_lakehouse_dbt_project/models"
"dbt_project/macros" = "luxury_lakehouse_dbt_project/macros"
"dbt_project/seeds" = "luxury_lakehouse_dbt_project/seeds"
"dbt_project/tests" = "luxury_lakehouse_dbt_project/tests"
"dbt_project/dbt_packages" = "luxury_lakehouse_dbt_project/dbt_packages"

# D59: force ``dbt_project/dbt_packages/`` into the sdist even though it is
# gitignored. ``uv build`` (no flag) builds sdist then extracts it into a temp
# dir and builds the wheel from that extracted tree. Without this entry the
# sdist omits dbt_packages (gitignored → VCS-aware exclusion), the wheel's
# force-include then fails with FileNotFoundError: Forced include not found,
# and every caller of ``uv build`` breaks (CI, manage_space.py, deploy.sh).
# Mapping path-to-path (same on both sides) preserves the layout so the
# wheel's force-include finds it at the expected location during extraction.
# Requires developers / CI to run ``dbt deps`` at least once before ``uv build``
# so the directory exists locally; ``uv build --wheel`` on its own already
# reads the source tree in place, but we keep this parallel config so plain
# ``uv build`` also works.
[tool.hatch.build.targets.sdist.force-include]
"dbt_project/dbt_packages" = "dbt_project/dbt_packages"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- uv configuration ---
[tool.uv]
# taipy requires sqlalchemy>=2.0; dbt-databricks requires sqlalchemy<2.0.
# These extras are separate deployment targets that never coexist in a single env.
conflicts = [
    [
        { extra = "taipy-app" },
        { extra = "dbt" },
    ],
    [
        { extra = "dbt" },
        { extra = "sdk" },
    ],
]

# RTX 5070 Ti (Blackwell) requires CUDA 12.8+ wheels.
# explicit = true ensures only torch resolves from this index, not other packages.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=5.2.3",
    "pre-commit>=3.6.0",
    "sqlfluff>=3.0.0",
    "pip-audit>=2.7.0",
    "import-linter>=2.0",
    "numba>=0.60.0",
    "matplotlib>=3.10.8",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "luxury-lakehouse[analytics,embeddings,training,evolve]",
]
