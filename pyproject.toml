[project]
name = "luxury-lakehouse"
version = "0.5.81"
description = "Serverless soccer analytics platform built on Databricks Lakebase"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Core ingestion dependencies (must work on Databricks serverless Python 3.10)
    # NOTE: pandas and numpy are pre-installed on Databricks serverless runtime.
    # Do NOT pin them here — version conflicts break the Python kernel.
    "requests>=2.33.0",
    "requests-cache>=1.2.0",
    # Transitive dep (requests, httpx, anyio). Pinned to >=3.15 to resolve
    # CVE-2026-45409 (idna 3.11 vulnerability).
    "idna>=3.15",
    # Transitive dep (mlflow + fsspec[http] via huggingface-hub/datasets/torch). Pinned to
    # >=3.14.1 to resolve CVE-2026-34993 + CVE-2026-47265 (aiohttp < 3.14.0) and the
    # CVE-2026-54273..54280 batch (aiohttp 3.14.0, fixed in 3.14.1).
    "aiohttp>=3.14.1",
    # Transitive dep (mlflow-skinny → fastapi). Floored to >=1.3.1 to resolve
    # CVE-2026-48818 + CVE-2026-48817 + CVE-2026-54283 + CVE-2026-54282 (starlette < 1.x
    # web-server vulnerabilities). fastapi (>=0.46.0, no ceiling) accepts the starlette 1.x
    # major; the lakehouse uses mlflow as a tracking client only (no server/gateway), so the
    # starlette web-server paths are never exercised. uv kept 0.52.1 only because the 1.x line
    # released after the last lock; the floor forces the upgrade.
    "starlette>=1.3.1",
    # Transitive dep (pyjwt / databricks-sql-connector). Floored to >=48.0.1 to resolve
    # GHSA-537c-gmf6-5ccf (cryptography < 48.0.1).
    "cryptography>=48.0.1",
    # Transitive dep (optuna → alembic; dbt-core). Floored to >=1.3.12 to resolve
    # CVE-2026-41205 (mako < 1.3.11) and CVE-2026-44307 (mako < 1.3.12) in one bump.
    "mako>=1.3.12",
    # Transitive dep (mlflow / databricks-sdk / distributed). Floored to >=1.2.1 to resolve
    # GHSA-6v7p-g79w-8964 (msgpack < 1.2.1).
    "msgpack>=1.2.1",
    # Transitive dep (dbt-core, flask/taipy, typer). Floored to >=8.3.3 to resolve
    # PYSEC-2026-2132 (click < 8.3.3). No parent caps click, so the floor is satisfiable.
    "click>=8.3.3",
    # Transitive dep (matplotlib / taipy). Floored to >=12.3.0 to resolve the PYSEC-2026-2253,
    # -2254, -2255, -2256, -2257 batch (pillow < 12.3.0) in one bump. No parent caps pillow.
    "pillow>=12.3.0",
    # Workflow framework (card parsing + validation)
    "pydantic>=2.0",
    "PyYAML>=6.0",
    # HF Hub (cost tracking, dataset publishing, model weight sync)
    "huggingface_hub>=1.5.0",
    # Floored to >=3.1.51 to resolve GHSA-2f96-g7mh-g2hx / -v396-v7q4-x2qj /
    # -956x-8gvw-wg5v (gitpython < 3.1.51).
    "gitpython>=3.1.51",
]

[project.optional-dependencies]
spadl = [
    "silly-kicks[das,ghost-gk,parse-dfl]>=4.43.0,<5",
]
analytics = [
    "luxury-lakehouse[spadl]",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "mplsoccer>=1.1.3",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # xgboost-cpu: drop-in for xgboost (same `import xgboost`, same API) without
    # the 300 MB nvidia-nccl-cu12 GPU dep. Matches the Databricks analytics env
    # spec so CI exercises the same package prod installs. Serverless is CPU-only.
    "xgboost-cpu==3.2.0",
    "rapidfuzz>=3.6.0",
    "unidecode>=1.3.0",
    "sparse-dot-topn>=1.1.0",
    # Optuna powers the ExT v2 reproduction harness (src/analytics/ext_v2/).
    # Phase 0 uses a single-trial study with no axes active; Phases 1-4
    # progressively activate KDE/KNN/contextual-feature suggests via TPE.
    "optuna>=4.0",
    # PR-1.5 (SK3-MIG-B): Live Kimball contract tests require direct SQL
    # queries to dev_gold marts. The databricks-sql-connector provides the
    # `databricks.sql` module used by tests/data_quality/ live tests and
    # tests/smoke_gates/sk3_mig_b/ ext_v2 harnesses.
    "databricks-sql-connector>=4.0.0",
    # Transitive dep (databricks-sql-connector). Pinned to >=2.13.0 to resolve
    # PYSEC-2026-175/177/178/179 (pyjwt < 2.13.0 JWT-verification vulnerabilities).
    "pyjwt>=2.13.0",
]
dbt = [
    "dbt-core>=1.10.0",
    "dbt-databricks>=1.12.2",
]
sdk = [
    "databricks-sdk==0.121.0",
    # psycopg2 lives here so the grants automation (GitHub Actions
    # lakebase-grants.yml + scripts/run_lakebase_grants.py) can install a
    # minimal dependency set without pulling the full taipy-app extra.
    # Lakebase is a Databricks service — a PG client belongs with SDK
    # clients thematically.
    "psycopg2-binary==2.9.12",
]
embeddings = [
    "gensim>=4.3.0",
]
jax = [
    "jax[cpu]>=0.6.2",
]
mlflow = [
    # >=2.19.0 is the first mlflow line that natively allows protobuf 6,
    # matching the Databricks Serverless runtime's protobuf 6.33.6. The
    # earlier `>=2.17.0` floor allowed pip to resolve mlflow 2.17.x, which
    # pins protobuf<5 and produces the dependency-conflict warning observed
    # on PR #208's live-build CI run (mlflow-skinny 2.11.4 vs protobuf
    # 6.33.6). Bumping the floor to 2.19 closes the warning and aligns our
    # wheel's resolved version (currently mlflow 3.13.0 per uv.lock; bumped from 3.11.1
    # by the cryptography>=48.0.1 CVE floor above) with
    # the runtime baseline. Training scripts (xg, vaep, psxg, football2vec,
    # scoutgpt) continue to use the same mlflow tracking client API.
    "mlflow>=2.19.0",
    # ExT v2 Phase 1 harness wires Optuna's MLflowCallback for per-trial
    # logging. Optuna 4.x removed integrations from core into a separate
    # package; the [mlflow] extra here pulls the mlflow-flavoured callback.
    "optuna-integration[mlflow]>=4.0",
]
training = ["torch>=2.0", "pyarrow>=14.0", "datasets>=3.0", "safetensors>=0.4.0"]
evolve = ["openevolve>=0.2.0"]
taipy-app = [
    "taipy==4.1.1",
    "psycopg2-binary==2.9.12",
    "mplsoccer==1.6.1",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pydantic>=2.0",
    # Floored to >=2.14.2 to resolve GHSA-4xgf-cpjx-pc3j (pydantic-settings < 2.14.2).
    "pydantic-settings>=2.14.2",
    "requests>=2.33.0",
    "databricks-sdk==0.121.0",
    "huggingface-hub>=1.5.0",
    "scipy>=1.15.0",
    "plotly>=6.7.0,<7",
    "cachetools>=6.0.0",
]
# NOTE: kloppy (SkillCorner tracking) is NOT listed here — it runs in a separate
# Databricks task environment defined in terraform/modules/workflows/main.tf.
# IDSSE/Sportec DFL parsing is delegated to the silly-kicks parse port (ADR-055,
# delete-and-depend): the `silly-kicks[das,ghost-gk,parse-dfl]` dep above carries it
# (the `[parse-dfl]` extra). The lakehouse no longer parses DFL XML directly.
[project.scripts]
ingest_statsbomb = "ingestion.statsbomb:main"
ingest_metrica = "ingestion.metrica:main"
ingest_wyscout = "ingestion.wyscout:main"
backfill_statsbomb_360 = "ingestion.statsbomb_backfill_360:main"
backfill_statsbomb_extra = "ingestion.statsbomb_backfill_extra:main"
compute_spadl_vaep = "ingestion.spadl_vaep:main"
preflight_spadl_vaep = "ingestion.spadl_vaep:main_preflight"
ingest_idsse = "ingestion.idsse:main"
preflight_idsse = "ingestion.idsse:main_preflight"
ingest_skillcorner = "ingestion.skillcorner:main"
ingest_gradientsports = "ingestion.gradientsports:main"
preflight_gradientsports = "ingestion.gradientsports:main_preflight"
compute_line_breaking = "ingestion.line_breaking:main"
compute_off_ball_xt = "ingestion.off_ball_xt:main"
compute_defcon_lite = "ingestion.defcon_lite:main"
compute_psxg_tracking = "ingestion.compute_psxg_tracking:main"
compute_shot_freeze_frames = "ingestion.shot_freeze_frames:main"
resolve_players = "ingestion.entity_resolution:main"
compute_embeddings_v2 = "ingestion.player_embeddings_v2:main_v2"
compute_embeddings_360 = "ingestion.player_embeddings_v2:main_360"
compute_expected_threat = "ingestion.expected_threat:main"
compute_formations_efpi = "ingestion.formations_efpi:main_efpi"
compute_formations_shape_graph = "ingestion.formations_shape_graph:main_shape_graph"
compute_xg_shot_scores = "ingestion.xg_shot_scorer:main"
compute_pitch_control = "ingestion.pitch_control_batch:main"
compute_action_context = "ingestion.action_context:main"
compute_action_context_drain_worker = "ingestion.action_context:main_drain_worker"
compute_action_context_statsbomb = "ingestion.action_context:main_statsbomb"
preflight_action_context = "ingestion.action_context:main_preflight"
verify_action_context_drain = "ingestion.action_context_gate:main"
profile_action_context = "ingestion.action_context:profile_action_context"
ingest_idsse_events = "ingestion.idsse_events:main"
compute_elastic_sync = "ingestion.elastic_sync:main"
compute_pausa = "ingestion.pausa:main"
run_model_validation = "ingestion.model_validation:main"
run_staleness_monitor = "ingestion.staleness_monitor:main"
sync_hf_costs = "ingestion.sync_hf_costs:main"
export_embeddings_training_data = "ingestion.export_embeddings_training_data:main"
validate_workflow_cards = "workflows.loader:validate_cli"
export_shots_on_target = "ingestion.export_shots_on_target:main"
import_psxg_predictions = "ingestion.import_psxg_predictions:main"
import_obso_results = "ingestion.import_obso_results:main"
extract_tracking_metadata = "ingestion.tracking_metadata:main"
prepare_360_training_data = "ingestion.prepare_360_training_data:main"
export_scoutgpt_training_data = "ingestion.export_scoutgpt_training_data:main"
publish_spadl_vaep_hf = "ingestion.publish_spadl_vaep_hf:main"
publish_xg_shots_hf = "ingestion.publish_xg_shots_hf:main"
publish_freeze_frame_hf = "ingestion.publish_freeze_frame_hf:main"
evolve = "evolve.runner:main"
hf_sync = "ingestion.hf_sync:main"
refresh_synced_tables = "ingestion.refresh_synced_tables:main"
heal_synced_tables = "ingestion.heal_synced_tables:main"
dbt_build = "ingestion.dbt_runner:main"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except (silent-swallow anti-pattern)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S101", "BLE001"]  # assert is standard in pytest; tests may catch broadly to assert error flow
"tests/**" = ["S101", "BLE001"]  # data-quality + smoke-gate tests: same pytest exemptions as src/tests
"hf_taipy_app/**" = ["E501", "S104", "F405", "RUF022", "RUF005"]  # Taipy app: long help text, 0.0.0.0, star imports, unsorted __all__, list concat
"hf_taipy_app/src/test_*.py" = ["E501", "S101", "S105", "S106"]  # Taipy app tests: long lines, asserts, fake tokens in test fixtures
"src/evolve/targets/*/seed_programs/**" = ["F821"]  # Seed programs are exec'd with torch/math injected in globals
"src/evolve/targets/*/seed_programs_stage2/**" = ["F821"]  # EV2 stage-2 adversary seeds — same exec'd-with-globals pattern as Phase 1 seed_programs
# BLE001 per-file ignores below: each is a deliberate, justified catch of broad
# Exception. Per-line `# noqa: BLE001` comments (with explanation) are preferred
# when only a single call site needs the exemption inside a file; use these
# file-level entries only when multiple sites in one module all share the same
# architectural reason.
"src/tests/test_synced_table_heal_e2e.py" = ["S608"]  # gated e2e DDL over internal/env-config names (no user input)
"src/ingestion/hf_jobs_cost.py" = ["BLE001"]  # retry loop + best-effort cost history pruning
"src/ingestion/refresh_synced_tables.py" = ["BLE001"]  # CLI error accumulator
"src/ingestion/sync_hf_costs.py" = ["BLE001"]  # per-item HF parse loop (best-effort)
"src/ingestion/statsbomb.py" = ["BLE001"]  # per-match fetch best-effort (logs with traceback, records failure)
"src/ingestion/wyscout.py" = ["BLE001"]  # downloader best-effort + _raw_extra_json building (logs with traceback)
"src/ingestion/tracking_metadata.py" = ["BLE001"]  # per-match XML/kloppy parse best-effort
"src/ingestion/dbt_runner.py" = ["BLE001"]  # SDK token resolution (prints + re-raises)
"scripts/sk3_mig_*.py" = ["S608"]  # SK3-MIG orchestrator + verifier — module-controlled internal table names interpolated into SQL strings, no user input path
"src/evolve/**" = ["BLE001"]  # Typed error-return paths in evolve backends
# Taipy UI app — event handlers, background daemons, filter init, and DB
# pool teardown all use broad catches to prevent UI crashes. Each caught
# exception is logged via `logger.exception()` so visibility is preserved.
"hf_taipy_app/src/state/**" = ["BLE001"]  # Taipy state event handlers + page refreshers
"hf_taipy_app/src/db.py" = ["BLE001"]  # connection pool teardown (best-effort close)
"hf_taipy_app/src/filters.py" = ["BLE001"]  # filter init defensive fallbacks
"hf_taipy_app/src/health_check.py" = ["BLE001"]  # background daemon — must not crash app
"hf_taipy_app/src/admin_api.py" = ["BLE001"]  # background refresh thread — logs via logger.exception
# Operational scripts — CLI tools, HF Jobs batch scripts, and defensive
# bootstrap utilities where broad catches are architecturally acceptable
# (each catch logs with traceback and either continues to the next item
# or returns a typed fallback).
"scripts/bootstrap_artifact_hashes.py" = ["BLE001"]  # MLflow @Champion / UC Volume bootstrap fallbacks
"scripts/benchmark_hf_jobs.py" = ["BLE001"]  # per-flavor HF Jobs retry loop (logs + continues)
"scripts/create_indexes.py" = ["BLE001"]  # index creation after specific psycopg2.OperationalError catches
"scripts/delete_synced_table.py" = ["BLE001"]  # CLI cleanup tool (best-effort per-table delete)
"scripts/fix_event_log_ownership.py" = ["BLE001"]  # SDK permission grant fallbacks
"scripts/grant_synced_table_permissions.py" = ["BLE001"]  # SDK grant fallbacks
"scripts/manage_space.py" = ["BLE001"]  # HF Space lifecycle CLI (poll + retry loops)
"scripts/setup_lakebase_roles.py" = ["BLE001"]  # role creation best-effort
"scripts/train_*.py" = ["BLE001"]  # HF Jobs training scripts (cost hook wrappers)
"scripts/compute_*_hf.py" = ["BLE001"]  # HF Jobs compute scripts (per-file loops)
"scripts/compute_epv_transition_hf_helpers.py" = ["BLE001"]
"scripts/compute_space_creation_hf_helpers.py" = ["BLE001"]
"scripts/train_xg_v2_hf_helpers.py" = ["BLE001"]
"scripts/publish_*_hf.py" = ["BLE001"]  # HF Hub publish scripts (per-artifact loops)

[tool.ruff.lint.isort]
known-first-party = ["analytics", "evolve", "ingestion", "shared", "workflows"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"  # pyspark only available in Databricks runtime
# PyTorch re-exports public API (randint, zeros, allclose, etc.) from C
# extensions via __init__.py; pyright stubs can't model this correctly and
# flag torch.randint as "not exported from module torch". Disable globally
# rather than adding 284 inline suppressions across torch test files.
reportPrivateImportUsage = "none"
# Test files under src/tests/ insert scripts/ and hf_taipy_app/src/ onto
# sys.path at runtime to import scripts + Taipy modules that are NOT part
# of any installed Python package. Declaring those directories as extraPaths
# lets pyright resolve the same imports statically; without this, every
# such test file generates reportMissingImports warnings (160 warnings
# across 10 test files pre-fix, empirically measured 2026-04-17). Session-45
# memory flagged this as a deferred warning on `test_grant_synced_table_permissions.py`;
# the fix generalises to every sys.path-insert test file at once.
extraPaths = [
    "scripts",
    "hf_taipy_app/src",
    # src/tests is a pytest package (has __init__.py); intra-test helper
    # imports use the short name (``from coverage_utils import ...``) which
    # pytest resolves because the package root is inserted onto sys.path
    # automatically at collection time. Listing it here lets pyright
    # resolve the same imports statically; otherwise every test that uses
    # a shared helper under src/tests/ emits reportMissingImports.
    "src/tests",
]
exclude = [
    "notebooks",
    # PEP 723 HF Jobs scripts (have `# /// script` headers; run on HF Jobs
    # infrastructure with their own inline dependency resolution; pandas/numpy
    # stub noise dominates and is not actionable here). Plus their *_helpers.py
    # modules, which are bundled with the parent script at run time.
    # Operational scripts (deploy_wheel.py, maintain_synced_tables.py,
    # manage_space.py, setup_*, etc.) ARE type-checked.
    # See TODO On Deck D60 for the 9 residual non-HF errors that this exposed.
    "scripts/compute_epv_transition_hf.py",
    "scripts/compute_epv_transition_hf_helpers.py",
    "scripts/compute_obso_hf.py",
    "scripts/compute_space_creation_hf.py",
    "scripts/compute_space_creation_hf_helpers.py",
    "scripts/compute_xt_grid_hf.py",
    "scripts/export_embedding_atlas_data.py",
    # ExT v2 Phase 0 + Phase 1 runners — depend on `databricks-sql-connector`
    # which is installed ad-hoc via `uv run --with` (not a project dep).
    "scripts/run_ext_v2_phase0.py",
    "scripts/run_ext_v2_phase1.py",
    "scripts/publish_freeze_frame_hf.py",
    "scripts/publish_spadl_vaep_hf.py",
    "scripts/publish_xg_shots_hf.py",
    "scripts/train_football2vec_360.py",
    "scripts/train_football2vec_v2.py",
    "scripts/train_psxg_hf.py",
    "scripts/train_scoutgpt_hf.py",
    "scripts/train_vaep_model_hf.py",
    "scripts/train_xg_model_hf.py",
    "scripts/train_xg_v2_hf.py",
    "scripts/train_xg_v2_hf_helpers.py",
    "scripts/train_xg_v3_hf.py",
    "src/evolve/targets/*/seed_programs",
    "src/evolve/targets/*/seed_programs_stage2",
]

[tool.pytest.ini_options]
testpaths = ["src/tests", "hf_taipy_app/src"]
addopts = "--tb=short -q"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/analytics", "src/shared", "src/workflows", "src/evolve"]

# D59: bundle dbt_project into the wheel so the daily-job dbt_build task can
# resolve it via importlib.resources("luxury_lakehouse_dbt_project").
# Each subdirectory is mapped explicitly to avoid pulling transient artifacts
# (target/, logs/) and local cache (.user.yml) that aren't needed at runtime.
# dbt_packages/ IS needed at runtime for macro resolution and is bundled.
[tool.hatch.build.targets.wheel.force-include]
"dbt_project/dbt_project.yml" = "luxury_lakehouse_dbt_project/dbt_project.yml"
"dbt_project/profiles.yml" = "luxury_lakehouse_dbt_project/profiles.yml"
"dbt_project/packages.yml" = "luxury_lakehouse_dbt_project/packages.yml"
"dbt_project/package-lock.yml" = "luxury_lakehouse_dbt_project/package-lock.yml"
"dbt_project/models" = "luxury_lakehouse_dbt_project/models"
"dbt_project/macros" = "luxury_lakehouse_dbt_project/macros"
"dbt_project/seeds" = "luxury_lakehouse_dbt_project/seeds"
"dbt_project/tests" = "luxury_lakehouse_dbt_project/tests"
"dbt_project/dbt_packages" = "luxury_lakehouse_dbt_project/dbt_packages"
# PR 4c: HuggingFace card markdown so ``ingestion.hf_publish.get_hf_card_path``
# resolves to a wheel-install-tree sibling of the ``ingestion`` package when
# called from a Databricks workflow task. Path is preserved (``docs/huggingface/...``)
# to match the dev-tree layout so the resolver uses the same path shape in
# both environments.
"docs/huggingface/dataset-cards" = "docs/huggingface/dataset-cards"
"docs/huggingface/model-cards" = "docs/huggingface/model-cards"
"docs/huggingface/org-card.md" = "docs/huggingface/org-card.md"
# Workflow card YAML manifests so ``ingestion.guards.resolve_upstream_tables_from_card``
# resolves from the wheel install tree at runtime. Eliminates the runtime
# dependency on ``/Workspace/Repos/luxury-lakehouse/workflow-cards``.
# Hyphen-to-underscore rename follows Python packaging convention.
"workflow-cards" = "workflow_cards"

# D59: force ``dbt_project/dbt_packages/`` into the sdist even though it is
# gitignored. ``uv build`` (no flag) builds sdist then extracts it into a temp
# dir and builds the wheel from that extracted tree. Without this entry the
# sdist omits dbt_packages (gitignored → VCS-aware exclusion), the wheel's
# force-include then fails with FileNotFoundError: Forced include not found,
# and every caller of ``uv build`` breaks (CI, manage_space.py, deploy.sh).
# Mapping path-to-path (same on both sides) preserves the layout so the
# wheel's force-include finds it at the expected location during extraction.
# Requires developers / CI to run ``dbt deps`` at least once before ``uv build``
# so the directory exists locally; ``uv build --wheel`` on its own already
# reads the source tree in place, but we keep this parallel config so plain
# ``uv build`` also works.
[tool.hatch.build.targets.sdist.force-include]
"dbt_project/dbt_packages" = "dbt_project/dbt_packages"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- uv configuration ---
[tool.uv]
# Security floors on TRANSITIVE dependencies live here — NOT in
# [project.dependencies] — so the project's declared deps stay limited to what we
# actually import. constraint-dependencies apply a floor across the whole
# resolution without creating a phantom direct dependency. This is the canonical
# home for "vulnerable transitive package, fix version exists" (per the CVE-floor
# convention). Direct-dep CVEs are floored inline in [project.dependencies].
constraint-dependencies = [
    # CVE-2026-59885 + CVE-2026-59886 (pyasn1 < 0.6.4). Transitive via the
    # cryptography / pyOpenSSL / databricks-sdk auth chain — no direct import.
    "pyasn1>=0.6.4",
]

# taipy requires sqlalchemy>=2.0; dbt-databricks requires sqlalchemy<2.0.
# These extras are separate deployment targets that never coexist in a single env.
conflicts = [
    [
        { extra = "taipy-app" },
        { extra = "dbt" },
    ],
    [
        { extra = "dbt" },
        { extra = "sdk" },
    ],
]

# RTX 5070 Ti (Blackwell) requires CUDA 12.8+ wheels.
# explicit = true ensures only torch resolves from this index, not other packages.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=5.2.3",
