[project]
name = "luxury-lakehouse"
version = "0.1.0"
description = "Serverless soccer analytics platform built on Databricks Lakebase"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # Data ingestion
    "statsbombpy>=1.13.0",
    "requests>=2.31.0",

    # Analytics and visualization
    "mplsoccer>=1.1.3",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Streamlit app
    "streamlit>=1.30.0",
    "psycopg2-binary>=2.9.9",

    # Databricks SDK
    "databricks-sdk>=0.20.0",

    # dbt
    "dbt-core>=1.7.0",
    "dbt-databricks>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "sqlfluff>=3.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["luxury_lakehouse"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--tb=short -q"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/streamlit_app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
