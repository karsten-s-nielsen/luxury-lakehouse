[project]
name = "luxury-lakehouse"
version = "0.1.0"
description = "Serverless soccer analytics platform built on Databricks Lakebase"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Core ingestion dependencies (must work on Databricks serverless Python 3.10)
    # NOTE: pandas and numpy are pre-installed on Databricks serverless runtime.
    # Do NOT pin them here — version conflicts break the Python kernel.
    "statsbombpy>=1.13.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "mplsoccer>=1.1.3",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]
app = [
    "streamlit>=1.36.0",
    "psycopg2-binary>=2.9.9",
    "databricks-sdk>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
dbt = [
    "dbt-core>=1.7.0",
    "dbt-databricks>=1.7.0",
]
sdk = [
    "databricks-sdk>=0.20.0",
]
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "sqlfluff>=3.0.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
ingest_statsbomb = "ingestion.statsbomb:main"
ingest_metrica = "ingestion.metrica:main"
ingest_wyscout = "ingestion.wyscout:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S101"]  # assert is standard in pytest

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "streamlit_app"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"  # pyspark only available in Databricks runtime

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--tb=short -q"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/streamlit_app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
