[project]
name = "luxury-lakehouse"
version = "0.1.0"
description = "Serverless soccer analytics platform built on Databricks Lakebase"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # Core ingestion dependencies (must work on Databricks serverless Python 3.10)
    # NOTE: pandas and numpy are pre-installed on Databricks serverless runtime.
    # Do NOT pin them here — version conflicts break the Python kernel.
    "requests>=2.31.0",
    "requests-cache>=1.2.0",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "mplsoccer>=1.1.3",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # DEPENDENCY CHAIN: socceraction -> pandera 0.17.2 -> multimethod <2.0
    # multimethod 2.0 removed the 'overload' API that pandera uses.
    # Safe to relax when pandera >= 0.18 drops multimethod dependency.
    "socceraction==1.5.3",
    "xgboost==3.2.0",
    "multimethod==1.12",
    "rapidfuzz>=3.6.0",
    "unidecode>=1.3.0",
    "sparse-dot-topn>=1.1.0",
]
app = [
    "streamlit>=1.36.0",
    "psycopg2-binary>=2.9.9",
    "databricks-sdk>=0.20.0",
    "plotly>=5.18.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]
dbt = [
    "dbt-core>=1.7.0",
    "dbt-databricks>=1.7.0",
]
sdk = [
    "databricks-sdk>=0.20.0",
]
embeddings = [
    "gensim>=4.3.0",
    "huggingface_hub>=0.25.0",
]
jax = [
    "jax[cpu]>=0.4.35",
]
mlflow = [
    "mlflow>=2.17.0",
]
# NOTE: kloppy (SkillCorner tracking) is NOT listed here — it runs in a separate
# Databricks task environment defined in terraform/modules/workflows/main.tf.
# IDSSE tracking uses stdlib xml.etree.ElementTree and needs no extra dependencies.
dev = [
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "sqlfluff>=3.0.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
ingest_statsbomb = "ingestion.statsbomb:main"
ingest_metrica = "ingestion.metrica:main"
ingest_wyscout = "ingestion.wyscout:main"
backfill_statsbomb_360 = "ingestion.statsbomb:backfill_360_main"
backfill_statsbomb_extra = "ingestion.statsbomb:backfill_extra_json_main"
compute_spadl_vaep = "ingestion.spadl_vaep:main"
ingest_idsse = "ingestion.idsse:main"
ingest_skillcorner = "ingestion.skillcorner:main"
compute_line_breaking = "ingestion.line_breaking:main"
compute_off_ball_xt = "ingestion.off_ball_xt:main"
compute_defcon_lite = "ingestion.defcon_lite:main"
resolve_players = "ingestion.entity_resolution:main"
compute_embeddings = "ingestion.player_embeddings:main"
compute_expected_threat = "ingestion.expected_threat:main"
compute_xg_model = "ingestion.xg_model:main"
compute_pitch_control = "ingestion.pitch_control_batch:main"
ingest_idsse_events = "ingestion.idsse:main_events"
compute_elastic_sync = "ingestion.elastic_sync:main"
compute_pausa = "ingestion.pausa:main"
run_model_validation = "ingestion.model_validation:main"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["demo_space", "notebooks", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["S101"]  # assert is standard in pytest

[tool.ruff.lint.isort]
known-first-party = ["analytics", "ingestion", "streamlit_app"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"  # pyspark only available in Databricks runtime
exclude = ["demo_space", "notebooks", "scripts"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--tb=short -q"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/streamlit_app", "src/analytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-benchmark>=5.2.3",
]
