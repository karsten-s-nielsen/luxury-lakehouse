[[ignore]]
id = "PYSEC-2026-89"
package = "markdown 3.6"
fix_in = "3.8.1"
blocked_by = "taipy-gui 4.1.1 requires markdown>=3.4.4,<=3.6"
justification = "CVE-2025-69534: malformed HTML-like Markdown crashes the parser. Taipy parses Markdown only for page definitions in v2's own source (Task 28 builds every page from code); data values are bound to controls as properties and are never parsed as Markdown."
review_trigger = "a taipy-gui release that relaxes the markdown <=3.6 cap"

[[ignore]]
id = "PYSEC-2026-160"
package = "twisted 24.7.0"
fix_in = "26.4.0"
blocked_by = "taipy-gui 4.1.1 requires twisted>=24.7.0,<24.8.0"
justification = "CVE-2026-42304: DoS in twisted.names DNS decompression. taipy-gui imports twisted only in taipy/gui/utils/proxy.py for its Jupyter NotebookProxy; v2 never runs in a notebook and starts no twisted server or DNS resolver."
review_trigger = "a taipy-gui release that relaxes the twisted <24.8.0 cap"

[[ignore]]
id = "CVE-2026-83813"
package = "twisted 24.7.0"
fix_in = "26.10.0rc1"
blocked_by = "taipy-gui 4.1.1 requires twisted>=24.7.0,<24.8.0"
justification = "GHSA-jj36-9pvh-vj5r: the twisted.names DNS client accepts a UDP answer by transaction id alone (off-path spoofing). v2 starts no twisted resolver: it resolves names through the standard library (requests, boto3, huggingface_hub, DuckDB); twisted is present only for taipy-gui's NotebookProxy, which v2 never starts (see PYSEC-2026-160)."
review_trigger = "a taipy-gui release that relaxes the twisted <24.8.0 cap"

