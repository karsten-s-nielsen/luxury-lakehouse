# pip-audit ignores for v2 (spec §23.4: no unexplained ignores).
#
# Every entry carries all six fields. `blocked_by` is the upstream cap that stops the fix version from installing;
# `review_trigger` names the event that retires the entry. `scripts/pip_audit.py` fails on any reported advisory
# without an entry here, and on any entry whose advisory is no longer reported (a stale ignore).
#
# All entries below trace to one blocker: taipy-gui 4.1.1 and taipy-common 4.1.1 pin their own dependency tree.
# Measured 2026-10-26 with uv 0.9.28 against v2/uv.lock.

[[ignore]]
id = "PYSEC-2026-327"
package = "deepdiff 7.0.1"
fix_in = "8.6.1"
blocked_by = "taipy-common 4.1.1 requires deepdiff>=6.7.0,<=7.0.1 (dbt-common allows deepdiff<9.0, so it is not the binding cap)"
justification = "CVE-2025-58367: class pollution through a crafted deepdiff Delta. v2 never builds a Delta from untrusted input; taipy-common and dbt-common use DeepDiff only on their own config objects."
review_trigger = "a taipy-common release that relaxes the deepdiff <=7.0.1 cap"

[[ignore]]
id = "PYSEC-2026-2445"
package = "deepdiff 7.0.1"
fix_in = "8.6.2"
blocked_by = "taipy-common 4.1.1 requires deepdiff>=6.7.0,<=7.0.1"
justification = "CVE-2026-33155: memory exhaustion through deepdiff's restricted unpickler. v2 never unpickles anything (spec §20 forbids pickle.loads), and no dependency feeds untrusted pickles to deepdiff."
review_trigger = "a taipy-common release that relaxes the deepdiff <=7.0.1 cap"

[[ignore]]
id = "PYSEC-2026-1383"
package = "flask-cors 5.0.1"
fix_in = "6.0.0"
blocked_by = "taipy-gui 4.1.1 requires flask-cors>=5.0.0,<5.1"
justification = "CVE-2024-6866: case-insensitive CORS path matching. v2 runs Taipy with the server option cors=False (Task 27, with a test), so flask-cors is never configured and no CORS policy is served."
review_trigger = "a taipy-gui release that relaxes the flask-cors <5.1 cap"

