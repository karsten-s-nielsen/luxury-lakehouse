      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: idsse_tracking_players
    description: One row per player frame of the positions file, from the silly-kicks parse (spec §11.5, §12.7). Coordinates
      are centre-origin; the file registry holds the audit values (spec §11.2).
    columns:
    - name: match_key
      description: Surrogate match key (spec §14).
    - name: period
      description: The period of the FrameSet's GameSection (1 firstHalf, 2 secondHalf, 3 and 4 extra time, 5 penalties).
    - name: frame
      description: The frame number `N`.
    - name: player_key
      description: Surrogate person key of the FrameSet's `PersonId` (spec §14).
    - name: x_mm
      description: Source attribute `Frame@X` (metres), as exact int32 millimetres (spec §10.2).
    - name: y_mm
      description: Source attribute `Frame@Y` (metres), as exact int32 millimetres (spec §10.2).
    - name: is_visible
      description: 'Always null: IDSSE has no detection flag, and v2 never guesses one (spec §11.5).'
    - name: speed
      description: 'Source attribute `Frame@S`: speed in km/h, as float64.'
    - name: acceleration
      description: 'Source attribute `Frame@A`: acceleration in m/s2, as float64.'
    - name: distance
      description: 'Source attribute `Frame@D`: distance covered since the preceding frame in cm, as float64.'
  - name: idsse_tracking_frames
    description: One row per frame (period, N) of any FrameSet of the positions file, with the ball's values where the ball
      has that frame (spec §10.2, §11.5).
    columns:
    - name: match_key
      description: Surrogate match key (spec §14).
    - name: period
      description: The period of the GameSection.
    - name: frame
      description: The frame number `N`.
    - name: timestamp
      description: 'Time since the first frame of the period: (N - first N) x 40 ms (25 frames per second).'
    - name: ball_x_mm
      description: The ball's `Frame@X` (metres), as exact int32 millimetres; null without a ball frame.
    - name: ball_y_mm
      description: The ball's `Frame@Y` (metres), as exact int32 millimetres; null without a ball frame.
    - name: ball_z_mm
      description: The ball's `Frame@Z` (height, metres), as exact int32 millimetres.
    - name: ball_detected
      description: 'Always null: IDSSE has no ball detection flag.'
    - name: wall_clock
      description: Source attribute `Frame@T` as the UTC instant; every FrameSet agrees on it (spec §10.2).
    - name: wall_clock_utc_offset_min
      description: The UTC offset in minutes that `Frame@T` was written with.
    - name: minute
      description: 'Source attribute `Frame@M`: the minute of play; every FrameSet agrees on it.'
    - name: ball_speed
      description: 'The ball''s `Frame@S`: speed in km/h, as float64.'
    - name: ball_acceleration
      description: 'The ball''s `Frame@A`: acceleration in m/s2, as float64.'
    - name: ball_distance
      description: 'The ball''s `Frame@D`: distance since the preceding frame in cm, as float64.'
    - name: ball_possession
      description: 'The ball''s `Frame@BallPossession`: 1 home team, 2 away team.'
    - name: ball_status
      description: 'The ball''s `Frame@BallStatus`: 0 ball inactive, 1 ball active.'
  - name: idsse_tracking_roster
    description: 'One row per FrameSet of the positions file: the native person (or ball object) id behind each player_key,
      per game section (spec §11.2).'
    columns:
    - name: game_section
      description: Source attribute `PutDataRequest/Positions/FrameSet@GameSection`, as string.
    - name: period
      description: The period of the GameSection.
    - name: team_id
      description: 'Source attribute `PutDataRequest/Positions/FrameSet@TeamId`: a DFL team id, or `BALL`.'
    - name: person_id
      description: 'Source attribute `PutDataRequest/Positions/FrameSet@PersonId`: the person or the ball object.'
    - name: player_key
      description: Surrogate person key of `person_id` (spec §14).
    - name: team_key
      description: Surrogate team key of `team_id`; null for the ball.
    - name: provider
      description: The provider name (`idsse`).
    - name: native_match_id
      description: The canonical native match id, the bare DFL MatchId such as `J03WPY` (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `idsse|native_match_id`, seed 42, signed (spec §14).'
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
