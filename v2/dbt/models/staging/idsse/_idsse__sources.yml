version: 2
sources:
- name: bronze_idsse
  description: Bronze tables of idsse, written by the v2 parser. Generated by scripts/document_bronze.py from the parser's
    field declarations; do not edit by hand.
  database: lake
  schema: main
  tables:
  - name: idsse_files
    description: 'One row per delivered file: the header attributes of the matchinformation, events or positions file.'
    columns:
    - name: artifact
      description: 'The delivered file: `metadata`, `events` or `positions`.'
    - name: data_status
      description: Source attribute `PutDataRequest@DataStatus`, as string.
    - name: message_time
      description: Source attribute `PutDataRequest@MessageTime`, an ISO 8601 time with a UTC offset; stored as the UTC instant
        in milliseconds.
    - name: message_time_utc_offset_min
      description: The UTC offset in minutes that `PutDataRequest@MessageTime` was written with.
    - name: request_id
      description: Source attribute `PutDataRequest@RequestId`, as string.
    - name: transmission_complete
      description: Source attribute `PutDataRequest@TransmissionComplete`, as bool (the source text is `true` or `false`).
    - name: transmission_suspended
      description: Source attribute `PutDataRequest@TransmissionSuspended`, as bool (the source text is `true` or `false`).
    - name: positions_meta_data_pitch_size_x_mm
      description: Source attribute `PutDataRequest/Positions/MetaData/PitchSize@X`, in metres in the source; stored as exact
        int32 millimetres (spec §10.2).
    - name: positions_meta_data_pitch_size_y_mm
      description: Source attribute `PutDataRequest/Positions/MetaData/PitchSize@Y`, in metres in the source; stored as exact
        int32 millimetres (spec §10.2).
    - name: positions_meta_data_match_id
      description: Source attribute `PutDataRequest/Positions/MetaData@MatchId`, as string.
    - name: positions_meta_data_type
      description: Source attribute `PutDataRequest/Positions/MetaData@Type`, as string.
    - name: positions_event_time
      description: Source attribute `PutDataRequest/Positions@EventTime`, an ISO 8601 time with a UTC offset; stored as the
        UTC instant in milliseconds.
    - name: positions_event_time_utc_offset_min
      description: The UTC offset in minutes that `PutDataRequest/Positions@EventTime` was written with.
    - name: provider
      description: The provider name (`idsse`).
    - name: native_match_id
      description: The canonical native match id, the bare DFL MatchId such as `J03WPY` (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `idsse|native_match_id`, seed 42, signed (spec §14).'
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: idsse_match_information
    description: 'One row per match: General, Environment and OtherGameInformation of the matchinformation file.'
    columns:
    - name: environment_air_humidity
      description: Source attribute `PutDataRequest/MatchInformation/Environment@AirHumidity`, as int64.
    - name: environment_air_pressure
      description: Source attribute `PutDataRequest/MatchInformation/Environment@AirPressure`, as int64.
    - name: environment_country
      description: Source attribute `PutDataRequest/MatchInformation/Environment@Country`, as string.
    - name: environment_floodlight
      description: Source attribute `PutDataRequest/MatchInformation/Environment@Floodlight`, as string.
    - name: environment_neutral_venue
      description: Source attribute `PutDataRequest/MatchInformation/Environment@NeutralVenue`, as bool (the source text is
        `true` or `false`).
    - name: environment_number_of_spectators
      description: Source attribute `PutDataRequest/MatchInformation/Environment@NumberOfSpectators`, as int64.
    - name: environment_pitch_erosion
      description: Source attribute `PutDataRequest/MatchInformation/Environment@PitchErosion`, as string.
    - name: environment_pitch_x_mm
      description: Source attribute `PutDataRequest/MatchInformation/Environment@PitchX`, in metres in the source; stored
        as exact int32 millimetres (spec §10.2).
    - name: environment_pitch_y_mm
      description: Source attribute `PutDataRequest/MatchInformation/Environment@PitchY`, in metres in the source; stored
        as exact int32 millimetres (spec §10.2).
    - name: environment_precipitation
      description: Source attribute `PutDataRequest/MatchInformation/Environment@Precipitation`, as string.
    - name: environment_roof
      description: Source attribute `PutDataRequest/MatchInformation/Environment@Roof`, as string.
    - name: environment_sold_out
      description: Source attribute `PutDataRequest/MatchInformation/Environment@SoldOut`, as bool (the source text is `true`
        or `false`).
    - name: environment_stadium_address
      description: Source attribute `PutDataRequest/MatchInformation/Environment@StadiumAddress`, as string.
    - name: environment_stadium_capacity
      description: Source attribute `PutDataRequest/MatchInformation/Environment@StadiumCapacity`, as int64.
    - name: environment_stadium_id
      description: Source attribute `PutDataRequest/MatchInformation/Environment@StadiumId`, as string.
    - name: environment_stadium_name
      description: Source attribute `PutDataRequest/MatchInformation/Environment@StadiumName`, as string.
    - name: environment_temperature
      description: Source attribute `PutDataRequest/MatchInformation/Environment@Temperature`, as int64.
    - name: general_competition_id
      description: Source attribute `PutDataRequest/MatchInformation/General@CompetitionId`, as string.
    - name: general_competition_name
      description: Source attribute `PutDataRequest/MatchInformation/General@CompetitionName`, as string.
    - name: general_dl_provider_id
      description: Source attribute `PutDataRequest/MatchInformation/General@DlProviderId`, as int64.
    - name: general_guest_team_id
      description: Source attribute `PutDataRequest/MatchInformation/General@GuestTeamId`, as string.
    - name: general_guest_team_name
      description: Source attribute `PutDataRequest/MatchInformation/General@GuestTeamName`, as string.
    - name: general_home_team_id
      description: Source attribute `PutDataRequest/MatchInformation/General@HomeTeamId`, as string.
    - name: general_home_team_name
      description: Source attribute `PutDataRequest/MatchInformation/General@HomeTeamName`, as string.
    - name: general_host
      description: Source attribute `PutDataRequest/MatchInformation/General@Host`, as string.
    - name: general_kickoff_time
      description: Source attribute `PutDataRequest/MatchInformation/General@KickoffTime`, an ISO 8601 time with a UTC offset;
        stored as the UTC instant in milliseconds.
    - name: general_kickoff_time_utc_offset_min
      description: The UTC offset in minutes that `PutDataRequest/MatchInformation/General@KickoffTime` was written with.
    - name: general_match_day
      description: Source attribute `PutDataRequest/MatchInformation/General@MatchDay`, as int64.
    - name: general_match_id
      description: Source attribute `PutDataRequest/MatchInformation/General@MatchId`, as string.
    - name: general_match_title
      description: Source attribute `PutDataRequest/MatchInformation/General@MatchTitle`, as string.
    - name: general_planned_kickoff_time
      description: Source attribute `PutDataRequest/MatchInformation/General@PlannedKickoffTime`, an ISO 8601 time with a
        UTC offset; stored as the UTC instant in milliseconds.
    - name: general_planned_kickoff_time_utc_offset_min
      description: The UTC offset in minutes that `PutDataRequest/MatchInformation/General@PlannedKickoffTime` was written
        with.
    - name: general_result
      description: Source attribute `PutDataRequest/MatchInformation/General@Result`, as string.
    - name: general_season
      description: Source attribute `PutDataRequest/MatchInformation/General@Season`, as string.
    - name: general_season_id
      description: Source attribute `PutDataRequest/MatchInformation/General@SeasonId`, as string.
    - name: general_type
      description: Source attribute `PutDataRequest/MatchInformation/General@Type`, as string.
    - name: general_type_of_sport
      description: Source attribute `PutDataRequest/MatchInformation/General@TypeOfSport`, as string.
    - name: other_game_information_playing_time_first_half
      description: Source attribute `PutDataRequest/MatchInformation/OtherGameInformation@PlayingTimeFirstHalf`, as int64.
    - name: other_game_information_playing_time_second_half
      description: Source attribute `PutDataRequest/MatchInformation/OtherGameInformation@PlayingTimeSecondHalf`, as int64.
    - name: other_game_information_total_time_first_half
      description: Source attribute `PutDataRequest/MatchInformation/OtherGameInformation@TotalTimeFirstHalf`, as int64.
    - name: other_game_information_total_time_second_half
      description: Source attribute `PutDataRequest/MatchInformation/OtherGameInformation@TotalTimeSecondHalf`, as int64.
    - name: provider
      description: The provider name (`idsse`).
    - name: native_match_id
      description: The canonical native match id, the bare DFL MatchId such as `J03WPY` (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `idsse|native_match_id`, seed 42, signed (spec §14).'
    - name: competition_key
      description: Surrogate competition key of `general_competition_id` (spec §14).
    - name: season_key
      description: Surrogate season key of `general_competition_id:general_season_id` (spec §14).
    - name: home_team_key
      description: Surrogate team key of `general_home_team_id` (spec §14).
    - name: guest_team_key
      description: Surrogate team key of `general_guest_team_id` (spec §14).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: idsse_teams
    description: One row per team of the matchinformation file.
    columns:
    - name: line_up
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@LineUp`, as string.
    - name: player_shirt_main_color
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@PlayerShirtMainColor`, as string.
    - name: player_shirt_number_color
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@PlayerShirtNumberColor`, as string.
    - name: player_shirt_secondary_color
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@PlayerShirtSecondaryColor`, as string.
    - name: player_shirt_type
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@PlayerShirtType`, as string.
    - name: role
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@Role`, as string.
    - name: team_id
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@TeamId`, as string.
    - name: team_name
      description: Source attribute `PutDataRequest/MatchInformation/Teams/Team@TeamName`, as string.
    - name: provider
      description: The provider name (`idsse`).
    - name: native_match_id
      description: The canonical native match id, the bare DFL MatchId such as `J03WPY` (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `idsse|native_match_id`, seed 42, signed (spec §14).'
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: idsse_persons
    description: 'One row per person of the matchinformation file: players, trainers, officials and referees. Names come from
      here (spec §12.7).'
    columns:
    - name: person_kind
      description: 'The element of the person: `player`, `trainer`, `official` or `referee`.'
    - name: team_id
      description: The `TeamId` of the enclosing `Team` element; null for a referee.
    - name: first_name
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@FirstName`, as string.
    - name: last_name
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@LastName`, as string.
    - name: person_id
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@PersonId`, as string.
    - name: playing_position
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@PlayingPosition`, as
        string.
    - name: role
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@Role`, as string.
    - name: shirt_number
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@ShirtNumber`, as int64.
    - name: shortname
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@Shortname`, as string.
    - name: starting
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@Starting`, as bool
        (the source text is `true` or `false`).
    - name: team_leader
      description: Source attribute `PutDataRequest/MatchInformation/<Player|Trainer|Official|Referee>@TeamLeader`, as bool
        (the source text is `true` or `false`).
    - name: provider
      description: The provider name (`idsse`).
    - name: native_match_id
      description: The canonical native match id, the bare DFL MatchId such as `J03WPY` (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `idsse|native_match_id`, seed 42, signed (spec §14).'
    - name: player_key
      description: Surrogate person key of `person_id` (spec §14).
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14); null for a referee.
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: idsse_events
    description: One row per Event element of the events file, in file order. Event positions are pitch-origin metres (spec
      §11.4).
    columns:
    - name: event_index
      description: The 0-based position of the Event element in the file.
    - name: event_type
      description: The tag of the Event's one child element, for example `Play` or `ShotAtGoal`.
    - name: calculated_frame
      description: Source attribute `PutDataRequest/Event@CalculatedFrame`, as int64.
    - name: calculated_timestamp
      description: Source attribute `PutDataRequest/Event@CalculatedTimestamp`, an ISO 8601 time with a UTC offset; stored
        as the UTC instant in milliseconds.
    - name: calculated_timestamp_utc_offset_min
      description: The UTC offset in minutes that `PutDataRequest/Event@CalculatedTimestamp` was written with.
    - name: end_frame
      description: Source attribute `PutDataRequest/Event@EndFrame`, as int64.
    - name: event_id
      description: Source attribute `PutDataRequest/Event@EventId`, as int64.
    - name: event_time
      description: Source attribute `PutDataRequest/Event@EventTime`, an ISO 8601 time with a UTC offset; stored as the UTC
        instant in milliseconds.
    - name: event_time_utc_offset_min
      description: The UTC offset in minutes that `PutDataRequest/Event@EventTime` was written with.
    - name: match_id
      description: Source attribute `PutDataRequest/Event@MatchId`, as string.
    - name: start_frame
      description: Source attribute `PutDataRequest/Event@StartFrame`, as int64.
    - name: x_position_mm
      description: Source attribute `PutDataRequest/Event@X-Position`, in metres in the source; stored as exact int32 millimetres
        (spec §10.2).
    - name: x_position_from_tracking_mm
      description: Source attribute `PutDataRequest/Event@X-PositionFromTracking`, in metres in the source; stored as exact
        int32 millimetres (spec §10.2).
    - name: x_source_position_mm
      description: Source attribute `PutDataRequest/Event@X-Source-Position`, in metres in the source; stored as exact int32
        millimetres (spec §10.2).
    - name: y_position_mm
      description: Source attribute `PutDataRequest/Event@Y-Position`, in metres in the source; stored as exact int32 millimetres
        (spec §10.2).
    - name: y_position_from_tracking_mm
      description: Source attribute `PutDataRequest/Event@Y-PositionFromTracking`, in metres in the source; stored as exact
        int32 millimetres (spec §10.2).
    - name: y_source_position_mm
