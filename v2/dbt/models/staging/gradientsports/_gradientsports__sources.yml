      description: Source field `week`, as int64.
    - name: provider
      description: The provider name (`gradientsports`).
    - name: native_match_id
      description: The canonical native match id, the GS game id as text (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `gradientsports|native_match_id`, seed 42, signed (spec §14).'
    - name: home_team_key
      description: Surrogate team key of `home_team_id` (spec §14).
    - name: away_team_key
      description: Surrogate team key of `away_team_id` (spec §14).
    - name: competition_key
      description: Surrogate competition key of `competition_id` (spec §14).
    - name: season_key
      description: Surrogate season key of `competition_id:season` (GS has no season id, spec §14.1).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: gradientsports_rosters
    description: One row per roster entry (`Rosters/<match>.json`); it maps a team's jersey to the player (tracking).
