    - name: competition_name
      description: Source field `competition.name`, as string.
    - name: date
      description: Source field `date`, as timestamp[us]. Converted from text (timestamp) with a round-trip check (spec §12.4).
    - name: end_period1
      description: Source field `endPeriod1`, as double.
    - name: end_period2
      description: Source field `endPeriod2`, as double.
    - name: fps
