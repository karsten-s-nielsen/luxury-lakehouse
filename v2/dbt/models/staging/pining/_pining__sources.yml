  - name: gradientsports_pining_matches
    description: One row per entry of `GET /v1/gradientsports/matches` (the pining match list, spec §10.5).
    columns:
    - name: channel_match_id
      description: Source field `id`, as string.
    - name: date
      description: Source field `date`, as date32[day]. Converted from text (date) with a round-trip check (spec §12.4).
    - name: home
      description: Source field `home`, as string.
    - name: away
      description: Source field `away`, as string.
    - name: visibility
      description: Source field `visibility`, as string. A missing flag is `public` (API reference); never null.
    - name: updated_at
      description: Source field `updated_at`, as timestamp[us, tz=UTC]. Converted from text (timestamp_utc) with a round-trip
        check (spec §12.4).
    - name: provenance
      description: Source field `provenance`, as string.
    - name: source_name
      description: Source field `source.name`, as string.
    - name: source_url
      description: Source field `source.url`, as string.
    - name: source_licence
      description: Source field `source.licence`, as string.
    - name: source_revision
      description: Source field `source.revision`, as string.
    - name: format_version
      description: Source field `format_version`, as int64.
    - name: competition_id
      description: Source field `competition_id`, as string.
    - name: competition_name
      description: Source field `competition_name`, as string.
    - name: season_id
      description: Source field `season_id`, as string.
    - name: season_name
      description: Source field `season_name`, as string.
    - name: artifacts
      description: Source field `artifacts` (artifact key -> file name), as a list of {key, filename}.
    - name: artifact_meta
      description: Source field `artifact_meta` (artifact key -> SHA-256 and size of the bytes as stored and served), as a
        list of {key, sha256, size}.
    - name: provider
      description: The provider name (`gradientsports`).
    - name: native_match_id
      description: The canonical native match id of `channel_match_id` (spec §7.3).
    - name: match_key
      description: Surrogate match key of `native_match_id` (spec §14).
    - name: _ingested_at
      description: When the run parsed the listing (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the listing as delivered (spec §13.1).
