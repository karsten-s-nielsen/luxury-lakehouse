version: 2
sources:
- name: bronze_wyscout
  description: Bronze tables of wyscout, written by the v2 parser. Generated by scripts/document_bronze.py from the parser's
    field declarations; do not edit by hand.
  database: lake
  schema: main
  tables:
  - name: wyscout_matches
    description: One row per match of a competition's matches file (`matches_<competition>.json` in matches.zip); `teamsData`
      goes to the match-team, formation and substitution tables.
    columns:
    - name: match_id
      description: Source field `wyId`, as int64.
    - name: label
      description: Source field `label`, as string. The source escapes non-ASCII letters twice, so the text holds literal
        `\uXXXX`; kept as delivered.
    - name: date
      description: Source field `date`, as string.
    - name: dateutc
      description: Source field `dateutc`, as timestamp[us, tz=UTC]. Converted from text (timestamp_utc_space) with a round-trip
        check (spec §12.4).
    - name: status
      description: Source field `status`, as string.
    - name: duration
      description: Source field `duration`, as string.
    - name: winner
      description: Source field `winner`, as int64.
    - name: venue
      description: Source field `venue`, as string. The source escapes non-ASCII letters twice, so the text holds literal
        `\uXXXX`; kept as delivered.
    - name: gameweek
      description: Source field `gameweek`, as int64.
    - name: group_name
      description: Source field `groupName`, as string.
    - name: round_id
      description: Source field `roundId`, as int64.
    - name: season_id
      description: Source field `seasonId`, as int64.
    - name: competition_id
      description: Source field `competitionId`, as int64.
    - name: referees
      description: 'Source field `referees`, as list<struct<refereeId: int64, role: string>>. The referee ids and roles of
        the match; the referees file is out of cycle 1 (spec §29.15).'
    - name: provider
      description: The provider name (`wyscout`).
    - name: native_match_id
      description: The canonical native match id, the Wyscout `wyId` as text (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `wyscout|native_match_id`, seed 42, signed (spec §14).'
    - name: competition_key
      description: Surrogate competition key of `competition_id` (spec §14).
    - name: season_key
      description: Surrogate season key of `competition_id:season_id` (spec §14, Task 2).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_match_teams
    description: One row per team of a match (`teamsData`, a map keyed by team id; the key equals `teamId`).
    columns:
    - name: match_id
      description: Source field `wyId` of the match, as int64.
    - name: team_id
      description: Source field `teamsData.<id>.teamId`, as int64.
    - name: side
      description: Source field `teamsData.<id>.side` (home or away).
    - name: score
      description: Source field `teamsData.<id>.score`, as int64.
    - name: score_ht
      description: Source field `teamsData.<id>.scoreHT`, as int64 (the half-time score).
    - name: score_et
      description: Source field `teamsData.<id>.scoreET`, as int64 (the extra-time score).
    - name: score_p
      description: Source field `teamsData.<id>.scoreP`, as int64 (the penalty-shootout score).
    - name: coach_id
      description: Source field `teamsData.<id>.coachId`, as int64.
    - name: has_formation
      description: Source field `teamsData.<id>.hasFormation`, as int64 (0 or 1, as delivered).
    - name: substitutions_text
      description: Source field `teamsData.<id>.formation.substitutions` where the source writes it as text (the text `null`)
        instead of a list; null where it is a list.
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14).
    - name: provider
      description: The provider name (`wyscout`).
    - name: native_match_id
      description: The canonical native match id, the Wyscout `wyId` as text (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `wyscout|native_match_id`, seed 42, signed (spec §14).'
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_match_formations
    description: One row per lineup and bench entry of a team of a match (`teamsData.<id>.formation`).
    columns:
    - name: match_id
      description: Source field `wyId` of the match, as int64.
    - name: team_id
      description: The `teamsData` key, as int64.
    - name: role
      description: '`lineup` or `bench`: the list the entry comes from.'
    - name: list_index
      description: The 0-based position in that list.
    - name: player_id
      description: Source field `playerId`, as int64.
    - name: goals
      description: Source field `goals`, a count written as text, as exact int64; null where the source writes the text `null`
        (it never omits the field or writes a JSON null).
    - name: own_goals
      description: Source field `ownGoals`, a count written as text ("0"), as exact int64; null when missing.
    - name: assists
      description: Source field `assists`, a count written as text ("0"), as exact int64; null when missing.
    - name: red_cards
      description: Source field `redCards`, a count written as text ("0"), as exact int64; null when missing.
    - name: yellow_cards
      description: Source field `yellowCards`, a count written as text ("0"), as exact int64; null when missing.
    - name: player_key
      description: Surrogate player key of `player_id` (spec §14).
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14).
    - name: provider
      description: The provider name (`wyscout`).
    - name: native_match_id
      description: The canonical native match id, the Wyscout `wyId` as text (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `wyscout|native_match_id`, seed 42, signed (spec §14).'
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_match_substitutions
    description: One row per substitution of a team of a match (`teamsData.<id>.formation.substitutions[]`).
    columns:
    - name: match_id
      description: Source field `wyId` of the match, as int64.
    - name: team_id
      description: The `teamsData` key, as int64.
    - name: list_index
      description: The 0-based position in the substitution list.
    - name: player_in
      description: Source field `playerIn`, as int64.
    - name: player_out
      description: Source field `playerOut`, as int64.
    - name: minute
      description: Source field `minute`, as int64.
    - name: assists
      description: Source field `assists`, a count written as text ("0"), as exact int64; null when missing.
    - name: player_in_key
      description: Surrogate player key of `player_in` (spec §14).
    - name: player_out_key
      description: Surrogate player key of `player_out` (spec §14).
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14).
    - name: provider
      description: The provider name (`wyscout`).
    - name: native_match_id
      description: The canonical native match id, the Wyscout `wyId` as text (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `wyscout|native_match_id`, seed 42, signed (spec §14).'
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_events
    description: One row per event of a match, in file order (`events_<competition>.json` in events.zip).
    columns:
    - name: id
      description: Source field `id`, as int64.
    - name: event_id
      description: Source field `eventId`, as int64.
    - name: event_name
      description: Source field `eventName`, as string.
    - name: sub_event_id
      description: Source field `subEventId`, as string. Converted from text (text) with a round-trip check (spec §12.4).
        An integer, or the text "" for an event without a subtype; kept as text.
    - name: sub_event_name
      description: Source field `subEventName`, as string.
    - name: event_sec
      description: Source field `eventSec`, as double.
    - name: match_id
      description: Source field `matchId`, as int64.
    - name: match_period
      description: Source field `matchPeriod`, as string.
    - name: player_id
      description: Source field `playerId`, as int64.
    - name: team_id
      description: Source field `teamId`, as int64.
    - name: positions
      description: 'Source field `positions`, as list<struct<x: int64, y: int64>>. Percentages of the pitch (0 to 100) from
        the acting team''s view, as delivered (spec §11.4).'
    - name: tags
      description: 'Source field `tags`, as list<struct<id: int64>>.'
    - name: player_key
      description: Surrogate player key of `player_id` (spec §14).
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14).
    - name: provider
      description: The provider name (`wyscout`).
    - name: native_match_id
      description: The canonical native match id, the Wyscout `wyId` as text (Task 2).
    - name: match_key
      description: 'Surrogate match key: xxhash64 of `wyscout|native_match_id`, seed 42, signed (spec §14).'
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_competitions
    description: One row per competition (`competitions.json`, a source-level listing, spec §10.5).
    columns:
    - name: competition_id
      description: Source field `wyId`, as int64.
    - name: name
      description: Source field `name`, as string.
    - name: format
      description: Source field `format`, as string.
    - name: type
      description: Source field `type`, as string.
    - name: area_id
      description: Source field `area.id`, as string. Converted from text (text) with a round-trip check (spec §12.4).
    - name: area_name
      description: Source field `area.name`, as string.
    - name: area_alpha2code
      description: Source field `area.alpha2code`, as string.
    - name: area_alpha3code
      description: Source field `area.alpha3code`, as string.
    - name: provider
      description: The provider name (`wyscout`).
    - name: competition_key
      description: Surrogate competition key of `competition_id` (spec §14).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_teams
    description: One row per team (`teams.json`, a source-level listing, spec §10.5).
    columns:
    - name: team_id
      description: Source field `wyId`, as int64.
    - name: name
      description: Source field `name`, as string. The source escapes non-ASCII letters twice, so the text holds literal `\uXXXX`;
        kept as delivered.
    - name: official_name
      description: Source field `officialName`, as string. The source escapes non-ASCII letters twice, so the text holds literal
        `\uXXXX`; kept as delivered.
    - name: city
      description: Source field `city`, as string. The source escapes non-ASCII letters twice, so the text holds literal `\uXXXX`;
        kept as delivered.
    - name: type
      description: Source field `type`, as string.
    - name: area_id
      description: Source field `area.id`, as string. Converted from text (text) with a round-trip check (spec §12.4).
    - name: area_name
      description: Source field `area.name`, as string.
    - name: area_alpha2code
      description: Source field `area.alpha2code`, as string.
    - name: area_alpha3code
      description: Source field `area.alpha3code`, as string.
    - name: provider
      description: The provider name (`wyscout`).
    - name: team_key
      description: Surrogate team key of `team_id` (spec §14).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_players
    description: One row per player (`players.json`, a source-level listing, spec §10.5).
    columns:
    - name: player_id
      description: Source field `wyId`, as int64.
    - name: short_name
      description: Source field `shortName`, as string. The source escapes non-ASCII letters twice, so the text holds literal
        `\uXXXX`; kept as delivered.
    - name: first_name
      description: Source field `firstName`, as string. The source escapes non-ASCII letters twice, so the text holds literal
        `\uXXXX`; kept as delivered.
    - name: middle_name
      description: Source field `middleName`, as string.
    - name: last_name
      description: Source field `lastName`, as string. The source escapes non-ASCII letters twice, so the text holds literal
        `\uXXXX`; kept as delivered.
    - name: birth_date
      description: Source field `birthDate`, as date32[day]. Converted from text (date) with a round-trip check (spec §12.4).
    - name: height
      description: Source field `height`, as int64.
    - name: weight
      description: Source field `weight`, as int64.
    - name: foot
      description: Source field `foot`, as string.
    - name: current_team_id
      description: Source field `currentTeamId`, as string. Converted from text (text) with a round-trip check (spec §12.4).
        An integer or text in the source; kept as text.
    - name: current_national_team_id
      description: Source field `currentNationalTeamId`, as string. Converted from text (text) with a round-trip check (spec
        §12.4). An integer or the text "null" in the source; kept as text.
    - name: role_name
      description: Source field `role.name`, as string.
    - name: role_code2
      description: Source field `role.code2`, as string.
    - name: role_code3
      description: Source field `role.code3`, as string.
    - name: birth_area_id
      description: Source field `birthArea.id`, as string. Converted from text (text) with a round-trip check (spec §12.4).
    - name: birth_area_name
      description: Source field `birthArea.name`, as string. The source escapes non-ASCII letters twice, so the text holds
        literal `\uXXXX`; kept as delivered.
    - name: birth_area_alpha2code
      description: Source field `birthArea.alpha2code`, as string.
    - name: birth_area_alpha3code
      description: Source field `birthArea.alpha3code`, as string.
    - name: passport_area_id
      description: Source field `passportArea.id`, as string. Converted from text (text) with a round-trip check (spec §12.4).
    - name: passport_area_name
      description: Source field `passportArea.name`, as string. The source escapes non-ASCII letters twice, so the text holds
        literal `\uXXXX`; kept as delivered.
    - name: passport_area_alpha2code
      description: Source field `passportArea.alpha2code`, as string.
    - name: passport_area_alpha3code
      description: Source field `passportArea.alpha3code`, as string.
    - name: provider
      description: The provider name (`wyscout`).
    - name: player_key
      description: Surrogate player key of `player_id` (spec §14).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_coaches
    description: One row per coach (`coaches.json`, a source-level listing, spec §29.15); coaches have no surrogate key.
    columns:
    - name: coach_id
      description: Source field `wyId`, as int64.
    - name: short_name
      description: Source field `shortName`, as string.
    - name: first_name
      description: Source field `firstName`, as string.
    - name: middle_name
      description: Source field `middleName`, as string.
    - name: last_name
      description: Source field `lastName`, as string.
    - name: birth_date
      description: Source field `birthDate`, as date32[day]. Converted from text (date) with a round-trip check (spec §12.4).
    - name: current_team_id
      description: Source field `currentTeamId`, as int64.
    - name: birth_area_id
      description: Source field `birthArea.id`, as string. Converted from text (text) with a round-trip check (spec §12.4).
    - name: birth_area_name
      description: Source field `birthArea.name`, as string.
    - name: birth_area_alpha2code
      description: Source field `birthArea.alpha2code`, as string.
    - name: birth_area_alpha3code
      description: Source field `birthArea.alpha3code`, as string.
    - name: passport_area_id
      description: Source field `passportArea.id`, as string. Converted from text (text) with a round-trip check (spec §12.4).
    - name: passport_area_name
      description: Source field `passportArea.name`, as string.
    - name: passport_area_alpha2code
      description: Source field `passportArea.alpha2code`, as string.
    - name: passport_area_alpha3code
      description: Source field `passportArea.alpha3code`, as string.
    - name: provider
      description: The provider name (`wyscout`).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_event_names
    description: One row per event and subevent id with its labels (`eventid2name.csv`, spec §29.15).
    columns:
    - name: event
      description: Source column `event`, as int64.
    - name: subevent
      description: Source column `subevent`, as int64.
    - name: event_label
      description: Source column `event_label`, as string.
    - name: subevent_label
      description: Source column `subevent_label`, as string.
    - name: provider
      description: The provider name (`wyscout`).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
      description: The content_sha256 of the delivered file that the row comes from (spec §13.1).
  - name: wyscout_tag_names
    description: One row per event tag id with its label and description (`tags2name.csv`, spec §29.15).
    columns:
    - name: tag
      description: Source column `Tag`, as int64.
    - name: label
      description: Source column `Label`, as string.
    - name: description
      description: Source column `Description`, as string.
    - name: provider
      description: The provider name (`wyscout`).
    - name: _ingested_at
      description: When the run parsed the delivery (UTC).
    - name: _run_id
      description: The run that wrote the row.
    - name: _source_hash
