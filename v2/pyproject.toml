[project]
name = "lakehouse"
version = "0.1.0"
description = "Lakehouse v2: ingestion of open soccer data into a DuckLake catalog with typed bronze and conformed dimensions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "authlib==1.9.1",
    "boto3==1.43.119",
    "cryptography==50.0.2",  # raw AEAD (raw/encryption.py); a direct import, pinned not transitive (audit S1-IMPL-06)
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "defusedxml==0.7.1",
    "duckdb==2.0.0",
    "filelock==4.2.4",
    "flask==3.1.3",
    "huggingface-hub==2.3.0",
    "numpy==2.5.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pyarrow==26.0.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "silly-kicks[parse-dfl]==4.139.1",
    "sparse-dot-topn==1.2.0",
    "taipy-gui==4.1.1",
    "unidecode==1.4.0",
    "xxhash==4.0.2",
    "zstandard==0.25.0",
]

[project.scripts]
lakehouse = "lakehouse.cli:main"

[dependency-groups]
dev = [
    "import-linter==2.15",
    "pip-audit==2.10.1",
    "psutil==7.2.2",
    "pyarrow-stubs==20.0.0.20260819",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-benchmark==5.3.0",
    "ruff==0.17.3",
    "types-boto3[s3]==1.43.119",
    "types-requests==2.33.0.20261006",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

# The dbt project travels in the wheel for the HF images (plan Task 23; lakehouse.runs.dbt.project_dir).
[tool.hatch.build.targets.wheel.force-include]
"dbt" = "lakehouse/_dbt"

[tool.uv]
# v1 ADR-083: taipy 4.1.1 pins flask-socketio below 5.5.1; the override lifts it.
# taipy-gui 4.1.x pins python-dotenv<=1.0.1, while dbt-core 1.12.6 needs python-dotenv>=1.2; taipy-gui uses only
# the stable load_dotenv/dotenv_values API, so the override lifts it. Task 28 re-checks both overrides.
override-dependencies = ["flask-socketio>=5.5.1", "python-dotenv>=1.2"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["lakehouse"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["reference", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# test helpers shared by the unit and e2e tests (`import lakekit`); pytest gets the same path below
extraPaths = ["src", "tests/support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
addopts = "-ra --strict-markers"
norecursedirs = ["reference", ".venv", "*.egg-info"]
markers = [
    "live: reads public network sources",
    "heavy: downloads or parses a full tracking file (Mac Mini only, always with live or bench)",
    "hf: uses real Hugging Face resources (Gate G-B); always with hf_job or hf_space",
    "hf_job: runs inside an owner-launched HF Job with the Job secrets",
    "hf_space: runs inside an owner-launched HF Job that holds only the Space token",
    "bench: production-scale benchmark (Mac Mini)",
    "integration: exercises the web/socket.io stack end to end (spec §11)",
    "windows: needs a Windows host",
    "macos: needs a macOS host",
    "linux: needs a Linux host",
]

[tool.importlinter]
root_package = "lakehouse"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "UI and web reach the lake only through the services layer"
type = "forbidden"
source_modules = ["lakehouse.ui", "lakehouse.web"]
# Direct imports only: the services layer legitimately re-exports lake access (SettingsService -> storage,
# RunService -> runs, ...), so the chain web -> services -> lake is exactly "through the services layer" and is
# allowed; a UI or web module reaching a lake package WITHOUT going through services is the break this catches.
allow_indirect_imports = "true"
forbidden_modules = [
    "lakehouse.bronze",
    "lakehouse.catalog",
    "lakehouse.ids",
    "lakehouse.lineage",
    "lakehouse.net",
    "lakehouse.parsers",
    "lakehouse.raw",
    "lakehouse.resolve",
    "lakehouse.runs",
    "lakehouse.schedule",
    "lakehouse.sources",
    "lakehouse.storage",
]

[[tool.importlinter.contracts]]
name = "Only the UI and web packages import Taipy and Flask"
type = "forbidden"
source_modules = ["lakehouse"]
forbidden_modules = ["taipy", "flask"]
ignore_imports = [
    "lakehouse.ui -> taipy",
    "lakehouse.ui.** -> taipy",
    "lakehouse.ui -> flask",
    "lakehouse.ui.** -> flask",
    "lakehouse.web -> flask",
    "lakehouse.web.** -> flask",
    "lakehouse.web -> taipy",
    "lakehouse.web.** -> taipy",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only the storage package imports boto3"
type = "forbidden"
source_modules = ["lakehouse"]
forbidden_modules = ["boto3"]
ignore_imports = ["lakehouse.storage.** -> boto3"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only storage and the HF Jobs scheduler import huggingface_hub"
type = "forbidden"
source_modules = ["lakehouse"]
forbidden_modules = ["huggingface_hub"]
ignore_imports = ["lakehouse.storage.** -> huggingface_hub", "lakehouse.schedule.hf_jobs -> huggingface_hub"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Channel adapters and provider parsers are independent (spec section 6)"
type = "independence"
modules = ["lakehouse.sources", "lakehouse.parsers"]

[[tool.importlinter.contracts]]
# M1 (run engine extraction): the collaborators never import run.py, and match_files is a leaf under _common.
# `visibility | match_writer` are independent siblings. exhaustive=false leaves the other lakehouse.runs modules
# (dbt, history, list_fields, progress, ...) unconstrained.
name = "The run engine is layered: run above the collaborators above match_files above _common (M1)"
type = "layers"
containers = ["lakehouse.runs"]
exhaustive = false
layers = [
    "run",
    "visibility | match_writer",
    "match_files",
    "_common",
]
